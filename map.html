sta s křížem a stavebními jeřáby.",width:4032,height:3024,sizeMB:2.65,aspectRatio:"landscape-4-3",placeholder:"blurs/IMG_0460.png",placeholderColor:"rgb(56,56,56)",analysis:{aestheticScore:50.914204173510164,sharpness:69,qualityBucket:"good",phash:"1187d1d153d2d0e8"},exif:{date:"2026-09-24T22:00:11",releaseDate:"2026-09-24T22:00:58",author:"Cebreus",location:"La Pedrera - Casa Milà",sublocation:"La Pedrera - Casa Milà",city:"Barcelona",latitude:41.395406,longitude:2.161914,orientation:1,country:"Španělsko",countryCode:"ESP",state:"Katalánsko"},author:"Cebreus",authorSlug:"cebreus",location:"La Pedrera - Casa Milà",city:"Barcelona",googleMapsUrl:"https://www.google.com/maps/search/?api=1&query=41.395406,2.161914",date:"2026-09-24T22:00:11",sources:[{variant:"default",type:"image/webp",path:"/images/previews-webp/IMG_0460.webp",width:370},{variant:"default",type:"image/jpeg",path:"/images/previews/IMG_0460.jpeg",width:370},{variant:"default",type:"image/avif",path:"/images/previews-avif/IMG_0460.avif",width:370},{variant:"xl",type:"image/webp",path:"/images/previews-xl-webp/IMG_0460.webp",width:534},{variant:"xl",type:"image/jpeg",path:"/images/previews-xl/IMG_0460.jpeg",width:534},{variant:"xl",type:"image/avif",path:"/images/previews-xl-avif/IMG_0460.avif",width:534},{variant:"detail",type:"image/jpeg",path:"/images/details/IMG_0460.jpeg",width:1707,height:1280},{variant:"fallback",type:"image/jpeg",path:"/images/previews-xxs/IMG_0460.jpeg",width:190,height:127},{variant:"admin_thumb",type:"image/jpeg",path:"/images/previews-admin/IMG_0460.jpeg",width:534,height:401}],people:[]}],id:"day-2026-09-24"},{date:"2026-09-25",cities:["Barcelona"],locations:["Torre Bellesguard","Sagrat Cor"],items:[{id:"loc-torre-bellesguard-main-2026-09-25t105344",type:"separator",location:"Torre Bellesguard",city:"Barcelona",hasPhotos:true,startDate:"2026-09-25T10:53:44",endDate:"2026-09-25T11:48:00",storyTitle:"Torre Bellesguard (Casa Figueras)",story:"\u003Cp class=\"lead\" data-section-id=\"lead\">Vila Torre Bellesguard, úředně zapsaná jako Casa Figueras, stojí na úpatí pohoří Collserola v barcelonské čtvrti Sarrià-Sant Gervasi. Antoni Gaudí navrhl stavbu v letech 1900–1909 jako poctu středověké katalánské historii a gotickému stavitelství. Rezidence vyrůstá přímo ze zřícenin letního paláce aragonského krále Martina I. Souhra šedé břidlice, neomítnutých cihel a štíhlé věže s křížem vytváří monumentální siluetu spojující hradní charakter s moderní rezidenční architekturou.\u003C/p>\u003Cdetails data-section-id=\"history-royal-seat\" data-section-kind=\"narrative\">\n\u003Csummary>Historie a&nbsp;královské sídlo\u003C/summary>\n\u003Cdiv>\u003Cp>Pozemek na svahu Collseroly zakoupila 12. června 1900 Maria Sagués i Molins, vdova po barcelonském obchodníkovi Jaumu Figuerasovi. Jaume Figueras obdivoval Gaudího tvorbu a přál si vybudovat rodinné sídlo, zemřel však ještě před zahájením stavby. Gaudí přijal zakázku od vdovy a pojal ji jako obnovu historické paměti tohoto významného místa.\u003C/p>\n\u003Cp>V letech 1408–1410 zde stával opevněný hrad a letní rezidence aragonského krále a barcelonského hraběte Martina I., zvaného Martin Soucitný nebo Lidský (katalánsky Martí l&#39;Humà).  Panovník místo pojmenoval Bellesguard pro nádherný výhled na barcelonskou pláň i Středozemní moře.\u003C/p>\n\u003Cp>Králův osobní život provázela dynastická tragédie. První manželka Marie de Luna zemřela 28. prosince 1406 a z jejich čtyř dětí přežil dospělost pouze syn Martin Sicilský. Když mladý následník v červenci 1409 náhle podlehl na Sardinii malárii bez legitimního potomka, hrozilo vymření rodové linie.\u003C/p>\n\u003Cp>Stárnoucí král Martin I. se proto 17. září 1409 v kapli Bellesguardu narychlo oženil s mladičkou Markétou z Prades. Král však skonal bez potomků 31. května 1410 přímo v Bellesguardu, čímž po pěti staletích vymřela barcelonská panovnická dynastie.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"history-modern-parcels\" data-section-kind=\"narrative\">\n\u003Csummary>Proměny panství a&nbsp;okolní zástavba\u003C/summary>\n\u003Cdiv>\u003Cp>Původní obrovské panství Bellesguard prošlo v moderní době postupným dělením. Již v roce 1897 oddělili majitelé parcelu o výměře 29 376 m² pro kongregaci sester oblátek Nejsvětějšího Vykupitele, která zde zřídila dívčí azyl. V historickém areálu dnes sídlí univerzita Abat Oliba CEU. \u003C/p>\n\u003Cp>Název sester oblátek vychází z latinského výrazu \u003Cem>oblata\u003C/em>, označujícího ženu zcela odevzdanou a zasvěcenou Bohu i službě bližním. Španělskou kongregaci sester oblátek Nejsvětějšího Vykupitele založili roku 1864 biskup José María Benito Serra a šlechtična Antonia María de Oviedo y Schönthal. Řeholní společenství se zaměřovalo na pomoc ženám z prostředí prostituce a jejich dětem. V novogotickém azylu Patronato de Nuestra Señora del Carmen sestry poskytovaly zázemí svobodným matkám, opuštěným dívkám a dcerám z chudinských poměrů, kterým zajišťovaly vzdělání a profesní výuku.\u003C/p>\n\u003Cp>V letech 1913–1922 vyrostl na sousedních pozemcích ženský klášter Santa Maria de Valldonzella podle projektu architekta Bernardího Martorella. Roku 1962 pak došlo k dalšímu zmenšení zahrady pro novou vilovou zástavbu.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"construction-slates-tower\" data-section-kind=\"narrative\">\n\u003Csummary>Konstrukční řešení, statika věže a&nbsp;břidlicové zdivo\u003C/summary>\n\u003Cdiv>\u003Cp>Gaudí navrhl budovu na čtvercovém půdorysu o rozměrech 15 × 15 metrů, jehož vrcholy pootočil přesně k hlavním světovým stranám.  Tato orientace zajišťuje optimální oslunění všech fasád a přirozeně reaguje na sklon horského terénu.\u003C/p>\n\u003Cp>Obvodové zdivo tvoří místní břidlice těžená přímo při výkopových pracích na parcele. Různé odstíny šedého, okrového a rezavého kamene spojuje vápenná malta do nepravidelného reliéfu. Fasáda díky tomu navazuje na původní středověké zdivo a splývá s okolním svahem.\u003C/p>\n\u003Cp>Nosnou strukturu doplňuje vnitřní skelet z pálených cihel. Architekt vybral ohnivzdorné a pevnostní cihly z vyhlášené továrny rodiny Cucurny v Montmeló. \u003C/p>\n\u003Cp>Vodorovné konstrukce a stropy využívají tradiční techniku katalánské klenby (katalánsky \u003Cem>volta de maó de pla\u003C/em> neboli \u003Cem>volta catalana\u003C/em>).  Tenké cihly kladené naplocho do sádry umožnily vytvořit lehké, staticky odolné klenuté stropy přímo s minimální potřebou dřevěného bednění.\u003C/p>\n\u003Cp>Váhu vysoké štíhlé věže s křížem přenášejí čtyři mohutné vnitřní pilíře a soustava klenutých oblouků, které centrují svislé zatížení přímo do vnitřního jádra stavby.  Obvodové kamenné zdivo tak tvoří odlehčený vnější plášť.\u003C/p>\n\u003Cp>Během ražby tunelů Vallvidrera a budování dálničního obchvatu Ronda de Dalt před olympiádou v Barceloně způsobovaly zemní práce v okolí otřesy. V roce 1986 vedl architekt Joan Bassegoda zpevnění a restaurování věžního jehlanu.\u003C/p>\n\u003Cp>Vážnější trhliny u paty kříže vedly na přelomu let 2007 a 2008 k nouzovému statickému podepření. Odborný tým architekta Davida Garcii a statika Roberta Brufaua kříž rozebral, zrestauroval keramiku a konstrukci trvale zpevnil.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"entrance-portal-benches\" data-section-kind=\"narrative\">\n\u003Csummary>Vstupní portál, kovaná mříž a&nbsp;mozaikové lavičky u&nbsp;domu\u003C/summary>\n\u003Cdiv>\u003Cp>Hlavní vstupní portál rámuje kovaná železná mříž nesoucí plastický nápis mariánského pozdravu „Ave Maria Puríssima sens pecat concebuda“. \u003C/p>\n\u003Cp>Po stranách mříže vykovali řemeslníci postavy dvou mořských ryb se čtyřmi pruhy královského znaku. Tento motiv odkazuje na výrok středověkého kronikáře Bernata Desclota, že ani ryba ve Středozemním moři neplave bez znaku aragonského krále.\u003C/p>\n\u003Cp>Přímo u vstupu do domu stojí dvě keramické lavičky, které roku 1916 vytvořil Domènec Sugrañes.\u003C/p>\n\u003Cp>Pravá lavička obrácená k východu nese letopočet 1916, motiv vycházejícího slunce a plachetnici symbolizující námořní slávu království.\u003C/p>\n\u003Cp>Levá lavička orientovaná k západu zobrazuje zapadající slunce, anděly nesoucí znak Barcelony a korunu, což vyjadřuje soumrak a vymření dynastie. Mozaiky doplňují iniciály panovnického páru Martina I. a Markéty z Prades.\u003C/p>\n\u003Cp>Při návrhu zadního vchodu do hospodářského traktu a stájí Gaudí uplatnil kované železné klepadlo ve tvaru lidské stehenní kosti. Tento detail odkazuje na lidovou pověst o slavném katalánském zbojníkovi 17. století Joanu Salovi i Ferrerovi, zvaném Serrallonga. Zříceniny královského hradu sloužily banditovi jako bezpečný úkryt a místní obyvatelé místu po staletí říkali Serrallongův hrad. Podle tradice byla zbojníkova stehenní kost po popravě zazděna přímo do původních hradních zdí.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"interior-layout-chandelier\" data-section-kind=\"narrative\">\n\u003Csummary>Dispozice podlaží, vnitřní balkónek a&nbsp;korunový lustr\u003C/summary>\n\u003Cdiv>\u003Cp>Objekt sestává ze šesti funkčních úrovní.\u003C/p>\n\u003Cul>\n\u003Cli>Polosuterén s robustními válcovými sloupy původně sloužil pro stáje a hospodářské zázemí domu.\u003C/li>\n\u003Cli>Zvýšené přízemí tvořilo hlavní vstupní trakt s recepcí a společenskými místnostmi.\u003C/li>\n\u003Cli>První patro zahrnovalo reprezentační salony a rodinné pokoje majitelů.\u003C/li>\n\u003Cli>Ve druhém patře se nacházely soukromé ložnice a pokoje pro hosty.\u003C/li>\n\u003Cli>Podkroví tvoří monumentální Cihlový sál určený pro hudbu a společenská setkání. \u003C/li>\n\u003Cli>Z horní pochozí střešní terasy se otevíral výhled na město i moře.\u003C/li>\n\u003C/ul>\n\u003Cp>Vysoký vstupní vestibul prochází přes několik podlaží. V mezipatře nad vstupem vybudoval Gaudí vnitřní vyhlídkový balkónek obložený bílou mozaikou.\u003C/p>\n\u003Cp>Tento prvek fungoval jako důmyslný domácí telefon a kontrolní kukátko. Obyvatelé domu z něj mohli nepozorovaně sledovat příchozí u dveří a hovořit s nimi přímo z pohodlí horního podlaží.\u003C/p>\n\u003Cp>Centrální prostor osvětluje rozměrný lustr z tepaného železa a barevného skla. Tvar svítidla vědomě napodobuje středověkou královskou korunu a vzdává poctu králi Martinu I.\u003C/p>\n\u003Cp>Reprezentační salony prvního patra doplňuje kuřácký pokoj s bílými vápennými omítkami. Do okenních špalet vložil Gaudí kamenná sedátka proti sobě (katalánsky festejadors), což představuje typický prvek středověkých katalánských sídel.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"brick-hall\" data-section-kind=\"narrative\">\n\u003Csummary>Cihlový sál v&nbsp;podkroví\u003C/summary>\n\u003Cdiv>\u003Cp>Podkroví tvoří monumentální prostor zvaný Cihlový sál (katalánsky Sala dels Maons) neboli Hudební sál.  Gaudí jej vystavěl ze soustavy štíhlých parabolických oblouků a katalánských kleneb z režných cihel továrny Cucurny. \u003C/p>\n\u003Cp>Místnost vznikla pro hudební produkce a rodinné slavnosti s vynikající přirozenou akustikou.  Ve vyvýšeném patře pod klenbami vytvořil Gaudí tribunu s prolamovanou cihlovou mříží, která sloužila pro usazení hudebníků. Hudba z kruchty díky klenuté geometrii a pórovitému povrchu cihel volně zněla dolů do celého prostoru. \u003C/p>\n\u003Cp>Původní projekt počítal se zakrytím stěn bílou vápennou omítkou se zaoblenými hranami po vzoru obytných pater. Když Gaudí roku 1909 po vyčerpání stavebního rozpočtu stavbu opustil, zůstal sál v surovém stavu. \u003C/p>\n\u003Cp>Architekt Domènec Sugrañes ponechal režné zdivo trvale odhalené. Odkrytá struktura přiznává čisté statické řešení, odkazuje na maurské cihlářství a zajišťuje suchou a zřetelnou akustiku. Na povrchu cihel zůstávají patrné původní Gaudího tužkové a křídové vyměřovací značky. \u003C/p>\n\u003Cp>Oblouková konstrukce vynáší váhu střešní terasy a zároveň vytváří vzduchový izolační polštář chránící obytná patra před letním horkem.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"roof-vitrage-tower\" data-section-kind=\"narrative\">\n\u003Csummary>Dračí střecha, vitráž a&nbsp;věž\u003C/summary>\n\u003Cdiv>\u003Cp>Vnější tvarování střechy a podkroví vytváří plastickou podobu ležícího draka. Čtyři okenní otvory ve dvou úrovních vytvářejí obličejové partie draka. Horní okna představují jeho oči a spodní průduchy nozdry. Břidlicové zdivo pokrývá tělo a hřbet jako kamenné šupiny, zatímco klesající linie hřebene střechy tvoří dračí ocas. Vysoká věž s křížem symbolizuje kopí svatého Jiří zabodnuté do draka. Celá střešní kompozice přitom zachovává přísnou osovou a středovou symetrii čtvercového půdorysu stavby. \u003C/p>\n\u003Cp>Gotizující lomená okna mají stupňovité špalety a parapety s keramickým obkladem, které hlouběji usměrňují denní světlo do interiérů.\u003C/p>\n\u003Cp>Hlavní okno průčelí tvoří pevná neotevíratelná trojrozměrná vitráž ve tvaru osmicípé Betlémské hvězdy v liturgických barvách víry, naděje a pokání. \u003C/p>\n\u003Cp>Základnu vitráže tvoří tři stupně, které podle Gaudího životopisce Joana Bergóse sloužily pro postavení figurek tří králů a jesliček. Kvůli nepřístupnosti pevného okna se votivní dary a figurky na vysoké stupně usazovaly pomocí dlouhých tyčí.\u003C/p>\n\u003Cp>Gaudí navrhl orientaci okna podle přesných zákonů gnomoniky. Přesně 25. prosince mezi šestnáctou a sedmnáctou hodinou proniká zimní slunce vitráží a promítá osmicípou hvězdu přímo na kruhový okul ve sloupu vstupního vestibulu. \u003C/p>\n\u003Cp>Z nároží vystupuje štíhlá osmiboká věž s celkovou výškou 33 metrů.  Špici korunuje čtyřramenný kříž (katalánsky creu de quatre braços) s mozaikou trencadís v červené a žluté barvě katalánské vlajky. \u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"gardens-viaduct-reservoir\" data-section-kind=\"narrative\">\n\u003Csummary>Zahrada, viadukt a&nbsp;vodojem krále Martina\u003C/summary>\n\u003Cdiv>\u003Cp>V zahradě vybudoval Domènec Sugrañes kamenné lavice obložené trencadísem.  Dvě lavice lemující kašnu mají při pohledu shora z věžní terasy půdorysný tvar lidského oka.\u003C/p>\n\u003Cp>Zakřivená opěradla laviček fungují díky akustické geometrii jako šeptací zrcadla. Dvě osoby sedící na opačných koncích lavičky se navzájem zřetelně slyší i při tichém šepotu.\u003C/p>\n\u003Cp>Kolem areálu navrhl Gaudí kamenný viadukt s šikmými pilíři překlenující potok Torrent de Pomaret. Stavba vznikala souběžně s Parkem Güell a posloužila architektovi jako praktická zkušební laboratoř obdobných viaduktů. \u003C/p>\n\u003Cp>V zadní části zahrady stávala bohatě zdobená keramická kašna, kterou kolem roku 1916 vytvořil Domènec Sugrañes. Kašna byla v padesátých letech 20. století zbořena a dnes na jejím místě rostou vzrostlé stromy.\u003C/p>\n\u003Cp>V bezprostředním sousedství zahrady leží monumentální podzemní rezervoár zvaný Vodojem krále Martina (katalánsky Dipòsit del Rei Martí). Cihlová síň o ploše 600 m² s desítkami pilířů shromažďovala vodu z horských pramenů Collseroly pro potřeby čtvrti Bonanova. Po vyřazení z provozu roku 1968 zůstala cisterna zcela zapomenuta pod borovým lesem. Znovuobjevení přinesl rok 2001, kdy se do klenby propadl projíždějící nákladní automobil. Architektonické studio Archikubik prostor citlivě zrestaurovalo pro kulturní účely.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"clinic-guilera-history\" data-section-kind=\"narrative\">\n\u003Csummary>Klinika doktora Guilery a rodinné vlastnictví\u003C/summary>\n\u003Cdiv>\nBěhem španělské občanské války v letech 1936–1939 sloužila zkonfiskovaná vila jako sirotčinec a útočiště pro uprchlické děti. V mrazivých zimních měsících personál i chovanci rozštípali v krbech veškerý původní dřevěný nábytek navržený přímo Gaudím. Kamenný plášť budovy navíc dodnes nese stopy po šrapnelech z leteckého bombardování Barcelony.\u003Cp>Po úmrtí Marie Sagués prodali její synové zadlužené sídlo v dražbě. V květnu 1944 koupil vilu významný katalánský onkolog a patolog Lluís Guilera i Molas za 450 000 peset.\u003C/p>\n\u003Cp>Doktor Guilera zřídil v budově soukromou onkologickou kliniku a histologickou laboratoř, přičemž v horních patrech s rodinou trvale bydlel. Po jeho smrti v roce 1969 převzal vedení syn, gynekolog Lluís Guilera Soler, který zařízení přeměnil na porodnickou kliniku. Provoz nemocnice skončil v roce 1974 přesunem na moderní kliniku Delfos a dům se vrátil k čistě rodinnému bydlení.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"history-public-opening\" data-section-kind=\"narrative\">\n\u003Csummary>Historické otevření pro veřejnost v&nbsp;roce 2013\u003C/summary>\n\u003Cdiv>\u003Cp>V&nbsp;září 2013 se rodina Guilerových rozhodla po téměř sedmdesáti letech výhradně soukromého užívání otevřít areál Torre Bellesguard poprvé v&nbsp;historii široké veřejnosti. Hlavním motivem tohoto kroku bylo zajistit stabilní finanční prostředky na mimořádně náročnou památkovou údržbu, statické zajištění břidlicového zdiva a&nbsp;postupnou obnovu původních architektonických prvků. Do té doby představovala vila pro milovníky modernismu tajemný, nepřístupný klenot ukrytý za vysokými zdmi v&nbsp;horní části barcelonské čtvrti Sarrià-Sant Gervasi.\u003C/p>\n\u003Cp>Nově vytvořený návštěvnický okruh umožnil individuální i&nbsp;komentované prohlídky s&nbsp;audioprůvodcem. Trasa propojila vnější zahradu s&nbsp;restaurovanými zbytky královského paláce Martina I., kamenný viadukt s&nbsp;lomenými oblouky a&nbsp;hlavní obytné prostory vily včetně kuřáckého salonu, nedokončeného hudebního sálu a&nbsp;vyhlídkové dračí střechy. Zpřístupnění památky se stalo zásadní událostí barcelonského kulturního života a&nbsp;významně prohloubilo povědomí o&nbsp;Gaudího neogotickém období.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"visit-context-2026\" data-section-kind=\"narrative\">\n\u003Csummary>Dopolední návštěva a&nbsp;provoz v&nbsp;roce 2026\u003C/summary>\n\u003Cdiv>\u003Cp>Dopolední návštěva dne 25.&nbsp;září&nbsp;2026 v&nbsp;čase od 10.53 do 11.48 zachytila areál pod správou pojišťovací skupiny Catalana Occidente (dnes GCO), která památku odkoupila v&nbsp;roce 2018 a&nbsp;provedla její celkovou památkovou konsolidaci. V&nbsp;roce 2026 získal areál novou kulturní dynamiku díky dohodě o&nbsp;spolupráci podepsané v&nbsp;květnu se správou chrámu Sagrada Família, která propojila návštěvnické okruhy obou Gaudího děl.\u003C/p>\n\u003Cp>Za proměnlivého podzimního počasí vystoupala skupina po monumentálním cihlovém točitém schodišti přes kuřácký salon s&nbsp;lustrem až do proslulého hudebního sálu a&nbsp;břidlicového podkroví, jehož lomené oblouky evokují tělo draka. Z&nbsp;vyhlídkového cimbuří kolem čtyřramenného kříže se otevřel daleký pohled na severní svahy Collseroly i&nbsp;městskou zástavbu čtvrti Sarrià-Sant Gervasi, přičemž zrekonstruované zahrady a&nbsp;vodní nádrž nabídly tiché zázemí pro detailní studium Gaudího neogotických kamenných detailů.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"facts\" data-section-kind=\"facts\">\n\u003Csummary>Základní údaje\u003C/summary>\n\u003Cdiv>\u003Ctable>\n\u003Cthead>\n\u003Ctr>\n\u003Cth align=\"left\">Parametr\u003C/th>\n\u003Cth align=\"left\">Údaj\u003C/th>\n\u003C/tr>\n\u003C/thead>\n\u003Ctbody>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Oficiální název\u003C/th>\n\u003Ctd align=\"left\">Torre Bellesguard (dobový název Casa Figueras) \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Hlavní architekt\u003C/th>\n\u003Ctd align=\"left\">Antoni Gaudí i&nbsp;Cornet (1852–1926)\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Klíčoví spolupracovníci\u003C/th>\n\u003Ctd align=\"left\">Joan Rubió i&nbsp;Bellver (viadukt) a&nbsp;Domènec Sugrañes i&nbsp;Gras (mozaiky a&nbsp;lavice) \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Původní stavebník\u003C/th>\n\u003Ctd align=\"left\">Maria Sagués i&nbsp;Molins, vdova po Jaumu Figuerasovi; původní hrad v&nbsp;letech 1408–1410 užíval král Martin I. Aragonský \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Doba výstavby\u003C/th>\n\u003Ctd align=\"left\">1900–1909 (hlavní budova); dokončovací práce do roku 1917 \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Architektonický styl\u003C/th>\n\u003Ctd align=\"left\">katalánský modernismus s prvky novogotiky \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Lokalita a&nbsp;adresa\u003C/th>\n\u003Ctd align=\"left\">Carrer de Bellesguard 16–20, 08022 Barcelona (Sarrià-Sant Gervasi)\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Rozměry\u003C/th>\n\u003Ctd align=\"left\">půdorys hlavní budovy přibližně 15&nbsp;×&nbsp;15&nbsp;m; věž vysoká 33&nbsp;m; zastavěná plocha přibližně 900&nbsp;m²; šest funkčních úrovní \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Současné využití\u003C/th>\n\u003Ctd align=\"left\">soukromý historický dům a kulturní památka přístupná veřejnosti od roku 2013\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Památková ochrana\u003C/th>\n\u003Ctd align=\"left\">národní historicko-umělecká památka Španělska od roku 1969 (dekret 1794/1969), kulturní památka národního zájmu Katalánska (BCIN, kód 39-MH-EN) a&nbsp;záznamy IPAC IPA-43 a&nbsp;IPA-36889 \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Oficiální web\u003C/th>\n\u003Ctd align=\"left\">\u003Ca href=\"https://bellesguardgaudi.com/\">bellesguardgaudi.com\u003C/a>\u003C/td>\n\u003C/tr>\n\u003C/tbody>\n\u003C/table>\n\u003C/div>\n\u003C/details>",locationId:"torre-bellesguard",locationLeadHtml:"\u003Cp class=\"lead\" data-section-id=\"lead\">Vila Torre Bellesguard, úředně zapsaná jako Casa Figueras, stojí na úpatí pohoří Collserola v barcelonské čtvrti Sarrià-Sant Gervasi. Antoni Gaudí navrhl stavbu v letech 1900–1909 jako poctu středověké katalánské historii a gotickému stavitelství. Rezidence vyrůstá přímo ze zřícenin letního paláce aragonského krále Martina I. Souhra šedé břidlice, neomítnutých cihel a štíhlé věže s křížem vytváří monumentální siluetu spojující hradní charakter s moderní rezidenční architekturou.\u003C/p>",locationHtml:"\u003Cdetails data-section-id=\"history-royal-seat\" data-section-kind=\"narrative\">\n\u003Csummary>Historie a&nbsp;královské sídlo\u003C/summary>\n\u003Cdiv>\u003Cp>Pozemek na svahu Collseroly zakoupila 12.&nbsp;června&nbsp;1900 Maria Sagués i&nbsp;Molins, vdova po barcelonském obchodníkovi Jaumu Figuerasovi. Jaume Figueras obdivoval Gaudího tvorbu a&nbsp;přál si vybudovat rodinné sídlo, zemřel však ještě před zahájením stavby. Gaudí přijal zakázku od vdovy a&nbsp;pojal ji jako obnovu historické paměti tohoto významného místa.\u003C/p>\n\u003Cp>V&nbsp;letech 1408–1410 zde stával opevněný hrad a&nbsp;letní rezidence aragonského krále a&nbsp;barcelonského hraběte Martina I., zvaného Martin Soucitný nebo Lidský (katalánsky Martí l'Humà).  Panovník místo pojmenoval Bellesguard pro nádherný výhled na barcelonskou pláň i&nbsp;Středozemní moře.\u003C/p>\n\u003Cp>Králův osobní život provázela dynastická tragédie. První manželka Marie de Luna zemřela 28.&nbsp;prosince&nbsp;1406 a&nbsp;z&nbsp;jejich čtyř dětí přežil dospělost pouze syn Martin Sicilský. Když mladý následník v&nbsp;červenci 1409 náhle podlehl na Sardinii malárii bez legitimního potomka, hrozilo vymření rodové linie.\u003C/p>\n\u003Cp>Stárnoucí král Martin I. se proto 17.&nbsp;září&nbsp;1409 v&nbsp;kapli Bellesguardu narychlo oženil s&nbsp;mladičkou Markétou z&nbsp;Prades. Král však skonal bez potomků 31.&nbsp;května&nbsp;1410 přímo v&nbsp;Bellesguardu, čímž po pěti staletích vymřela barcelonská panovnická dynastie.\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"history-modern-parcels\" data-section-kind=\"narrative\">\n\u003Csummary>Proměny panství a&nbsp;okolní zástavba\u003C/summary>\n\u003Cdiv>\u003Cp>Původní obrovské panství Bellesguard prošlo v&nbsp;moderní době postupným dělením. Již v&nbsp;roce 1897 oddělili majitelé parcelu o&nbsp;výměře 29&nbsp;376&nbsp;m² pro kongregaci sester oblátek Nejsvětějšího Vykupitele, která zde zřídila dívčí azyl. V&nbsp;historickém areálu dnes sídlí univerzita Abat Oliba CEU. \u003C/p>\n\u003Cp>Název sester oblátek vychází z&nbsp;latinského výrazu \u003Cem>oblata\u003C/em>, označujícího ženu zcela odevzdanou a&nbsp;zasvěcenou Bohu i&nbsp;službě bližním. Španělskou kongregaci sester oblátek Nejsvětějšího Vykupitele založili roku 1864 biskup José María Benito Serra a&nbsp;šlechtična Antonia María de Oviedo y Schönthal. Řeholní společenství se zaměřovalo na pomoc ženám z&nbsp;prostředí prostituce a&nbsp;jejich dětem. V&nbsp;novogotickém azylu Patronato de Nuestra Señora del Carmen sestry poskytovaly zázemí svobodným matkám, opuštěným dívkám a&nbsp;dcerám z&nbsp;chudinských poměrů, kterým zajišťovaly vzdělání a&nbsp;profesní výuku.\u003C/p>\n\u003Cp>V&nbsp;letech 1913–1922 vyrostl na sousedních pozemcích ženský klášter Santa Maria de Valldonzella podle projektu architekta Bernardího Martorella. Roku 1962 pak došlo k&nbsp;dalšímu zmenšení zahrady pro novou vilovou zástavbu.\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"construction-slates-tower\" data-section-kind=\"narrative\">\n\u003Csummary>Konstrukční řešení, statika věže a&nbsp;břidlicové zdivo\u003C/summary>\n\u003Cdiv>\u003Cp>Gaudí navrhl budovu na čtvercovém půdorysu o&nbsp;rozměrech 15&nbsp;×&nbsp;15&nbsp;metrů, jehož vrcholy pootočil přesně k&nbsp;hlavním světovým stranám.  Tato orientace zajišťuje optimální oslunění všech fasád a&nbsp;přirozeně reaguje na sklon horského terénu.\u003C/p>\n\u003Cp>Obvodové zdivo tvoří místní břidlice těžená přímo při výkopových pracích na parcele. Různé odstíny šedého, okrového a&nbsp;rezavého kamene spojuje vápenná malta do nepravidelného reliéfu. Fasáda díky tomu navazuje na původní středověké zdivo a&nbsp;splývá s&nbsp;okolním svahem.\u003C/p>\n\u003Cp>Nosnou strukturu doplňuje vnitřní skelet z&nbsp;pálených cihel. Architekt vybral ohnivzdorné a&nbsp;pevnostní cihly z&nbsp;vyhlášené továrny rodiny Cucurny v&nbsp;Montmeló. \u003C/p>\n\u003Cp>Vodorovné konstrukce a&nbsp;stropy využívají tradiční techniku katalánské klenby (katalánsky \u003Cem>volta de maó de pla\u003C/em> neboli \u003Cem>volta catalana\u003C/em>).  Tenké cihly kladené naplocho do sádry umožnily vytvořit lehké, staticky odolné klenuté stropy přímo s&nbsp;minimální potřebou dřevěného bednění.\u003C/p>\n\u003Cp>Váhu vysoké štíhlé věže s&nbsp;křížem přenášejí čtyři mohutné vnitřní pilíře a&nbsp;soustava klenutých oblouků, které centrují svislé zatížení přímo do vnitřního jádra stavby.  Obvodové kamenné zdivo tak tvoří odlehčený vnější plášť.\u003C/p>\n\u003Cp>Během ražby tunelů Vallvidrera a&nbsp;budování dálničního obchvatu Ronda de Dalt před olympiádou v&nbsp;Barceloně způsobovaly zemní práce v&nbsp;okolí otřesy. V&nbsp;roce 1986 vedl architekt Joan Bassegoda zpevnění a&nbsp;restaurování věžního jehlanu.\u003C/p>\n\u003Cp>Vážnější trhliny u&nbsp;paty kříže vedly na přelomu let 2007 a&nbsp;2008 k&nbsp;nouzovému statickému podepření. Odborný tým architekta Davida Garcii a&nbsp;statika Roberta Brufaua kříž rozebral, zrestauroval keramiku a&nbsp;konstrukci trvale zpevnil.\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"entrance-portal-benches\" data-section-kind=\"narrative\">\n\u003Csummary>Vstupní portál, kovaná mříž a&nbsp;mozaikové lavičky u&nbsp;domu\u003C/summary>\n\u003Cdiv>\u003Cp>Hlavní vstupní portál rámuje kovaná železná mříž nesoucí plastický nápis mariánského pozdravu „Ave Maria Puríssima sens pecat concebuda“. \u003C/p>\n\u003Cp>Po stranách mříže vykovali řemeslníci postavy dvou mořských ryb se čtyřmi pruhy královského znaku. Tento motiv odkazuje na výrok středověkého kronikáře Bernata Desclota, že ani ryba ve Středozemním moři neplave bez znaku aragonského krále.\u003C/p>\n\u003Cp>Přímo u&nbsp;vstupu do domu stojí dvě keramické lavičky, které roku 1916 vytvořil Domènec Sugrañes.\u003C/p>\n\u003Cp>Pravá lavička obrácená k&nbsp;východu nese letopočet 1916, motiv vycházejícího slunce a&nbsp;plachetnici symbolizující námořní slávu království.\u003C/p>\n\u003Cp>Levá lavička orientovaná k&nbsp;západu zobrazuje zapadající slunce, anděly nesoucí znak Barcelony a&nbsp;korunu, což vyjadřuje soumrak a&nbsp;vymření dynastie. Mozaiky doplňují iniciály panovnického páru Martina I. a&nbsp;Markéty z&nbsp;Prades.\u003C/p>\n\u003Cp>Při návrhu zadního vchodu do hospodářského traktu a&nbsp;stájí Gaudí uplatnil kované železné klepadlo ve tvaru lidské stehenní kosti. Tento detail odkazuje na lidovou pověst o&nbsp;slavném katalánském zbojníkovi 17.&nbsp;století Joanu Salovi i&nbsp;Ferrerovi, zvaném Serrallonga. Zříceniny královského hradu sloužily banditovi jako bezpečný úkryt a&nbsp;místní obyvatelé místu po staletí říkali Serrallongův hrad. Podle tradice byla zbojníkova stehenní kost po popravě zazděna přímo do původních hradních zdí.\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"interior-layout-chandelier\" data-section-kind=\"narrative\">\n\u003Csummary>Dispozice podlaží, vnitřní balkónek a&nbsp;korunový lustr\u003C/summary>\n\u003Cdiv>\u003Cp>Objekt sestává ze šesti funkčních úrovní.\u003C/p>\n\u003Cul>\n\u003Cli>Polosuterén s&nbsp;robustními válcovými sloupy původně sloužil pro stáje a&nbsp;hospodářské zázemí domu.\u003C/li>\n\u003Cli>Zvýšené přízemí tvořilo hlavní vstupní trakt s&nbsp;recepcí a&nbsp;společenskými místnostmi.\u003C/li>\n\u003Cli>První patro zahrnovalo reprezentační salony a&nbsp;rodinné pokoje majitelů.\u003C/li>\n\u003Cli>Ve druhém patře se nacházely soukromé ložnice a&nbsp;pokoje pro hosty.\u003C/li>\n\u003Cli>Podkroví tvoří monumentální Cihlový sál určený pro hudbu a&nbsp;společenská setkání. \u003C/li>\n\u003Cli>Z&nbsp;horní pochozí střešní terasy se otevíral výhled na město i&nbsp;moře.\u003C/li>\n\u003C/ul>\n\u003Cp>Vysoký vstupní vestibul prochází přes několik podlaží. V&nbsp;mezipatře nad vstupem vybudoval Gaudí vnitřní vyhlídkový balkónek obložený bílou mozaikou.\u003C/p>\n\u003Cp>Tento prvek fungoval jako důmyslný domácí telefon a&nbsp;kontrolní kukátko. Obyvatelé domu z&nbsp;něj mohli nepozorovaně sledovat příchozí u&nbsp;dveří a&nbsp;hovořit s&nbsp;nimi přímo z&nbsp;pohodlí horního podlaží.\u003C/p>\n\u003Cp>Centrální prostor osvětluje rozměrný lustr z&nbsp;tepaného železa a&nbsp;barevného skla. Tvar svítidla vědomě napodobuje středověkou královskou korunu a&nbsp;vzdává poctu králi Martinu I.\u003C/p>\n\u003Cp>Reprezentační salony prvního patra doplňuje kuřácký pokoj s&nbsp;bílými vápennými omítkami. Do okenních špalet vložil Gaudí kamenná sedátka proti sobě (katalánsky festejadors), což představuje typický prvek středověkých katalánských sídel.\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"brick-hall\" data-section-kind=\"narrative\">\n\u003Csummary>Cihlový sál v&nbsp;podkroví\u003C/summary>\n\u003Cdiv>\u003Cp>Podkroví tvoří monumentální prostor zvaný Cihlový sál (katalánsky Sala dels Maons) neboli Hudební sál.  Gaudí jej vystavěl ze soustavy štíhlých parabolických oblouků a&nbsp;katalánských kleneb z&nbsp;režných cihel továrny Cucurny. \u003C/p>\n\u003Cp>Místnost vznikla pro hudební produkce a&nbsp;rodinné slavnosti s&nbsp;vynikající přirozenou akustikou.  Ve vyvýšeném patře pod klenbami vytvořil Gaudí tribunu s&nbsp;prolamovanou cihlovou mříží, která sloužila pro usazení hudebníků. Hudba z&nbsp;kruchty díky klenuté geometrii a&nbsp;pórovitému povrchu cihel volně zněla dolů do celého prostoru. \u003C/p>\n\u003Cp>Původní projekt počítal se zakrytím stěn bílou vápennou omítkou se zaoblenými hranami po vzoru obytných pater. Když Gaudí roku 1909 po vyčerpání stavebního rozpočtu stavbu opustil, zůstal sál v&nbsp;surovém stavu. \u003C/p>\n\u003Cp>Architekt Domènec Sugrañes ponechal režné zdivo trvale odhalené. Odkrytá struktura přiznává čisté statické řešení, odkazuje na maurské cihlářství a&nbsp;zajišťuje suchou a&nbsp;zřetelnou akustiku. Na povrchu cihel zůstávají patrné původní Gaudího tužkové a&nbsp;křídové vyměřovací značky. \u003C/p>\n\u003Cp>Oblouková konstrukce vynáší váhu střešní terasy a&nbsp;zároveň vytváří vzduchový izolační polštář chránící obytná patra před letním horkem.\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"roof-vitrage-tower\" data-section-kind=\"narrative\">\n\u003Csummary>Dračí střecha, vitráž a&nbsp;věž\u003C/summary>\n\u003Cdiv>\u003Cp>Vnější tvarování střechy a&nbsp;podkroví vytváří plastickou podobu ležícího draka. Čtyři okenní otvory ve dvou úrovních vytvářejí obličejové partie draka. Horní okna představují jeho oči a&nbsp;spodní průduchy nozdry. Břidlicové zdivo pokrývá tělo a&nbsp;hřbet jako kamenné šupiny, zatímco klesající linie hřebene střechy tvoří dračí ocas. Vysoká věž s&nbsp;křížem symbolizuje kopí svatého Jiří zabodnuté do draka. Celá střešní kompozice přitom zachovává přísnou osovou a&nbsp;středovou symetrii čtvercového půdorysu stavby. \u003C/p>\n\u003Cp>Gotizující lomená okna mají stupňovité špalety a&nbsp;parapety s&nbsp;keramickým obkladem, které hlouběji usměrňují denní světlo do interiérů.\u003C/p>\n\u003Cp>Hlavní okno průčelí tvoří pevná neotevíratelná trojrozměrná vitráž ve tvaru osmicípé Betlémské hvězdy v&nbsp;liturgických barvách víry, naděje a&nbsp;pokání. \u003C/p>\n\u003Cp>Základnu vitráže tvoří tři stupně, které podle Gaudího životopisce Joana Bergóse sloužily pro postavení figurek tří králů a&nbsp;jesliček. Kvůli nepřístupnosti pevného okna se votivní dary a&nbsp;figurky na vysoké stupně usazovaly pomocí dlouhých tyčí.\u003C/p>\n\u003Cp>Gaudí navrhl orientaci okna podle přesných zákonů gnomoniky. Přesně 25.&nbsp;prosince mezi šestnáctou a&nbsp;sedmnáctou hodinou proniká zimní slunce vitráží a&nbsp;promítá osmicípou hvězdu přímo na kruhový okul ve sloupu vstupního vestibulu. \u003C/p>\n\u003Cp>Z&nbsp;nároží vystupuje štíhlá osmiboká věž s&nbsp;celkovou výškou 33&nbsp;metrů.  Špici korunuje čtyřramenný kříž (katalánsky creu de quatre braços) s&nbsp;mozaikou trencadís v&nbsp;červené a&nbsp;žluté barvě katalánské vlajky. \u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"gardens-viaduct-reservoir\" data-section-kind=\"narrative\">\n\u003Csummary>Zahrada, viadukt a&nbsp;vodojem krále Martina\u003C/summary>\n\u003Cdiv>\u003Cp>V&nbsp;zahradě vybudoval Domènec Sugrañes kamenné lavice obložené trencadísem.  Dvě lavice lemující kašnu mají při pohledu shora z&nbsp;věžní terasy půdorysný tvar lidského oka.\u003C/p>\n\u003Cp>Zakřivená opěradla laviček fungují díky akustické geometrii jako šeptací zrcadla. Dvě osoby sedící na opačných koncích lavičky se navzájem zřetelně slyší i&nbsp;při tichém šepotu.\u003C/p>\n\u003Cp>Kolem areálu navrhl Gaudí kamenný viadukt s&nbsp;šikmými pilíři překlenující potok Torrent de Pomaret. Stavba vznikala souběžně s&nbsp;Parkem Güell a&nbsp;posloužila architektovi jako praktická zkušební laboratoř obdobných viaduktů. \u003C/p>\n\u003Cp>V&nbsp;zadní části zahrady stávala bohatě zdobená keramická kašna, kterou kolem roku 1916 vytvořil Domènec Sugrañes. Kašna byla v&nbsp;padesátých letech 20.&nbsp;století zbořena a&nbsp;dnes na jejím místě rostou vzrostlé stromy.\u003C/p>\n\u003Cp>V&nbsp;bezprostředním sousedství zahrady leží monumentální podzemní rezervoár zvaný Vodojem krále Martina (katalánsky Dipòsit del Rei Martí). Cihlová síň o&nbsp;ploše 600&nbsp;m² s&nbsp;desítkami pilířů shromažďovala vodu z&nbsp;horských pramenů Collseroly pro potřeby čtvrti Bonanova. Po vyřazení z&nbsp;provozu roku 1968 zůstala cisterna zcela zapomenuta pod borovým lesem. Znovuobjevení přinesl rok 2001, kdy se do klenby propadl projíždějící nákladní automobil. Architektonické studio Archikubik prostor citlivě zrestaurovalo pro kulturní účely.\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"clinic-guilera-history\" data-section-kind=\"narrative\">\n\u003Csummary>Klinika doktora Guilery a rodinné vlastnictví\u003C/summary>\n\u003Cdiv>\nBěhem španělské občanské války v&nbsp;letech 1936–1939 sloužila zkonfiskovaná vila jako sirotčinec a&nbsp;útočiště pro uprchlické děti. V&nbsp;mrazivých zimních měsících personál i&nbsp;chovanci rozštípali v&nbsp;krbech veškerý původní dřevěný nábytek navržený přímo Gaudím. Kamenný plášť budovy navíc dodnes nese stopy po šrapnelech z&nbsp;leteckého bombardování Barcelony.\u003Cp>Po úmrtí Marie Sagués prodali její synové zadlužené sídlo v&nbsp;dražbě. V&nbsp;květnu 1944 koupil vilu významný katalánský onkolog a&nbsp;patolog Lluís Guilera i&nbsp;Molas za 450&nbsp;000&nbsp;peset.\u003C/p>\n\u003Cp>Doktor Guilera zřídil v&nbsp;budově soukromou onkologickou kliniku a&nbsp;histologickou laboratoř, přičemž v&nbsp;horních patrech s&nbsp;rodinou trvale bydlel. Po jeho smrti v&nbsp;roce 1969 převzal vedení syn, gynekolog Lluís Guilera Soler, který zařízení přeměnil na porodnickou kliniku. Provoz nemocnice skončil v&nbsp;roce 1974 přesunem na moderní kliniku Delfos a&nbsp;dům se vrátil k&nbsp;čistě rodinnému bydlení.\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"history-public-opening\" data-section-kind=\"narrative\">\n\u003Csummary>Historické otevření pro veřejnost v&nbsp;roce 2013\u003C/summary>\n\u003Cdiv>\u003Cp>V&nbsp;září 2013 se rodina Guilerových rozhodla po téměř sedmdesáti letech výhradně soukromého užívání otevřít areál Torre Bellesguard poprvé v&nbsp;historii široké veřejnosti. Hlavním motivem tohoto kroku bylo zajistit stabilní finanční prostředky na mimořádně náročnou památkovou údržbu, statické zajištění břidlicového zdiva a&nbsp;postupnou obnovu původních architektonických prvků. Do té doby představovala vila pro milovníky modernismu tajemný, nepřístupný klenot ukrytý za vysokými zdmi v&nbsp;horní části barcelonské čtvrti Sarrià-Sant Gervasi.\u003C/p>\n\u003Cp>Nově vytvořený návštěvnický okruh umožnil individuální i&nbsp;komentované prohlídky s&nbsp;audioprůvodcem. Trasa propojila vnější zahradu s&nbsp;restaurovanými zbytky královského paláce Martina I., kamenný viadukt s&nbsp;lomenými oblouky a&nbsp;hlavní obytné prostory vily včetně kuřáckého salonu, nedokončeného hudebního sálu a&nbsp;vyhlídkové dračí střechy. Zpřístupnění památky se stalo zásadní událostí barcelonského kulturního života a&nbsp;významně prohloubilo povědomí o&nbsp;Gaudího neogotickém období.\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"visit-context-2026\" data-section-kind=\"narrative\">\n\u003Csummary>Dopolední návštěva a&nbsp;provoz v&nbsp;roce 2026\u003C/summary>\n\u003Cdiv>\u003Cp>Dopolední návštěva dne 25.&nbsp;září&nbsp;2026 v&nbsp;čase od 10.53 do 11.48 zachytila areál pod správou pojišťovací skupiny Catalana Occidente (dnes GCO), která památku odkoupila v&nbsp;roce 2018 a&nbsp;provedla její celkovou památkovou konsolidaci. V&nbsp;roce 2026 získal areál novou kulturní dynamiku díky dohodě o&nbsp;spolupráci podepsané v&nbsp;květnu se správou chrámu Sagrada Família, která propojila návštěvnické okruhy obou Gaudího děl.\u003C/p>\n\u003Cp>Za proměnlivého podzimního počasí vystoupala skupina po monumentálním cihlovém točitém schodišti přes kuřácký salon s&nbsp;lustrem až do proslulého hudebního sálu a&nbsp;břidlicového podkroví, jehož lomené oblouky evokují tělo draka. Z&nbsp;vyhlídkového cimbuří kolem čtyřramenného kříže se otevřel daleký pohled na severní svahy Collseroly i&nbsp;městskou zástavbu čtvrti Sarrià-Sant Gervasi, přičemž zrekonstruované zahrady a&nbsp;vodní nádrž nabídly tiché zázemí pro detailní studium Gaudího neogotických kamenných detailů.\u003C/p>\n\u003C/div>\n\u003C/details>",locationOfficialHtml:"\u003Ctable>\n\u003Cthead>\n\u003Ctr>\n\u003Cth align=\"left\">Parametr\u003C/th>\n\u003Cth align=\"left\">Údaj\u003C/th>\n\u003C/tr>\n\u003C/thead>\n\u003Ctbody>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Oficiální název\u003C/th>\n\u003Ctd align=\"left\">Torre Bellesguard (dobový název Casa Figueras) \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Hlavní architekt\u003C/th>\n\u003Ctd align=\"left\">Antoni Gaudí i&nbsp;Cornet (1852–1926)\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Klíčoví spolupracovníci\u003C/th>\n\u003Ctd align=\"left\">Joan Rubió i&nbsp;Bellver (viadukt) a&nbsp;Domènec Sugrañes i&nbsp;Gras (mozaiky a&nbsp;lavice) \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Původní stavebník\u003C/th>\n\u003Ctd align=\"left\">Maria Sagués i&nbsp;Molins, vdova po Jaumu Figuerasovi; původní hrad v&nbsp;letech 1408–1410 užíval král Martin I. Aragonský \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Doba výstavby\u003C/th>\n\u003Ctd align=\"left\">1900–1909 (hlavní budova); dokončovací práce do roku 1917 \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Architektonický styl\u003C/th>\n\u003Ctd align=\"left\">katalánský modernismus s prvky novogotiky \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Lokalita a&nbsp;adresa\u003C/th>\n\u003Ctd align=\"left\">Carrer de Bellesguard 16–20, 08022 Barcelona (Sarrià-Sant Gervasi)\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Rozměry\u003C/th>\n\u003Ctd align=\"left\">půdorys hlavní budovy přibližně 15&nbsp;×&nbsp;15&nbsp;m; věž vysoká 33&nbsp;m; zastavěná plocha přibližně 900&nbsp;m²; šest funkčních úrovní \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Současné využití\u003C/th>\n\u003Ctd align=\"left\">soukromý historický dům a kulturní památka přístupná veřejnosti od roku 2013\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Památková ochrana\u003C/th>\n\u003Ctd align=\"left\">národní historicko-umělecká památka Španělska od roku 1969 (dekret 1794/1969), kulturní památka národního zájmu Katalánska (BCIN, kód 39-MH-EN) a&nbsp;záznamy IPAC IPA-43 a&nbsp;IPA-36889 \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Oficiální web\u003C/th>\n\u003Ctd align=\"left\">\u003Ca href=\"https://bellesguardgaudi.com/\">bellesguardgaudi.com\u003C/a>\u003C/td>\n\u003C/tr>\n\u003C/tbody>\n\u003C/table>\n",aliases:["Casa Figueras","Bellesguard","Bellesguard Tower","Figueras Tower"],heroImage:{src:"/travel-guide/teasers/torre-bellesguard/hero.jpg",alt:"Torre Bellesguard mezi zahradami pod oblačnou oblohou"},audio:[{section:"lead",label:"Úvod",identity:"69ed73090986eab18faeae6b594649e8b8914fbb8ca730a3e527bced30295aea",src:"/travel-guide/audio/torre-bellesguard/69ed73090986eab18faeae6b594649e8b8914fbb8ca730a3e527bced30295aea.m4a"},{section:"history-royal-seat",label:"Historie a královské sídlo",identity:"7ed0289508ec027d293c41f22132cc88960752661bfc72d4c8e473380ab01196",src:"/travel-guide/audio/torre-bellesguard/7ed0289508ec027d293c41f22132cc88960752661bfc72d4c8e473380ab01196.m4a"},{section:"history-modern-parcels",label:"Proměny panství a okolní zástavba",identity:"547e43ab75a1c7c8e92ca3d3e3dbb8a7393ee03a790637189c3aff0210d10774",src:"/travel-guide/audio/torre-bellesguard/547e43ab75a1c7c8e92ca3d3e3dbb8a7393ee03a790637189c3aff0210d10774.m4a"},{section:"construction-slates-tower",label:"Konstrukční řešení, statika věže a břidlicové zdivo",identity:"2b621f436578690a70d9e432c0c72175f95e785ae8819934c56b12b920e9dd39",src:"/travel-guide/audio/torre-bellesguard/2b621f436578690a70d9e432c0c72175f95e785ae8819934c56b12b920e9dd39.m4a"},{section:"entrance-portal-benches",label:"Vstupní portál, kovaná mříž a mozaikové lavičky u domu",identity:"de99096e8cfea4dd4f3d14f7053a97a76d4e15149c7bf781d89962385ef70a4b",src:"/travel-guide/audio/torre-bellesguard/de99096e8cfea4dd4f3d14f7053a97a76d4e15149c7bf781d89962385ef70a4b.m4a"},{section:"interior-layout-chandelier",label:"Dispozice podlaží, vnitřní balkónek a korunový lustr",identity:"6a83609d0a1f8e3edc2e70dcd589a78262c34c6887332347726bef74ede7f282",src:"/travel-guide/audio/torre-bellesguard/6a83609d0a1f8e3edc2e70dcd589a78262c34c6887332347726bef74ede7f282.m4a"},{section:"brick-hall",label:"Cihlový sál v podkroví",identity:"5c978cc540cdabdc3b66ebeee51b75d215d589033d27d0ec796e00f6e66cc58d",src:"/travel-guide/audio/torre-bellesguard/5c978cc540cdabdc3b66ebeee51b75d215d589033d27d0ec796e00f6e66cc58d.m4a"},{section:"roof-vitrage-tower",label:"Dračí střecha, vitráž a věž",identity:"56ba34a99900b04a3b8e7e2953edea1aeae87a63c6dfae7c0632d766314b1504",src:"/travel-guide/audio/torre-bellesguard/56ba34a99900b04a3b8e7e2953edea1aeae87a63c6dfae7c0632d766314b1504.m4a"},{section:"gardens-viaduct-reservoir",label:"Zahrada, viadukt a vodojem krále Martina",identity:"f3abcbca6edb88fb083e07eda2367278e8f53a621d098c8f2919751c796295a0",src:"/travel-guide/audio/torre-bellesguard/f3abcbca6edb88fb083e07eda2367278e8f53a621d098c8f2919751c796295a0.m4a"},{section:"clinic-guilera-history",label:"Klinika doktora Guilery a rodinné vlastnictví",identity:"58bdab8925e1771ff03c5266fc34bc2d3425121fea98546f02508dddad63d250",src:"/travel-guide/audio/torre-bellesguard/58bdab8925e1771ff03c5266fc34bc2d3425121fea98546f02508dddad63d250.m4a"},{section:"history-public-opening",label:"Historické otevření pro veřejnost v roce 2013",identity:"221604e84c6c99f3eac713dec75c5f059ab6b7b3413f6e7641d71d674c7bb0ce",src:"/travel-guide/audio/torre-bellesguard/221604e84c6c99f3eac713dec75c5f059ab6b7b3413f6e7641d71d674c7bb0ce.m4a"},{section:"visit-context-2026",label:"Dopolední návštěva a provoz v roce 2026",identity:"cbd51faee3ea1567b61e4a696beaa4c07c519816097638055cb7cb5cb3d608af",src:"/travel-guide/audio/torre-bellesguard/cbd51faee3ea1567b61e4a696beaa4c07c519816097638055cb7cb5cb3d608af.m4a"}],source:"main"},{id:"img0469",type:"image",src:"IMG_0469.JPEG",alt:"Torre Bellesguard, Barcelona",title:"",width:4032,height:3024,sizeMB:4.25,aspectRatio:"landscape-4-3",placeholder:"blurs/IMG_0469.png",placeholderColor:"rgb(8,8,8)",analysis:{aestheticScore:66.08304182526545,sharpness:100,qualityBu í v údolí Collseroly a později sídlila ve čtvrti El Raval. Po zničení konventu během nepokojů Tragického týdne v roce 1909 řád vybudoval nové útočiště na úpatí Tibidaba.",width:4032,height:3024,sizeMB:3.03,aspectRatio:"landscape-4-3",placeholder:"blurs/IMG_0485.png",placeholderColor:"rgb(8,8,8)",analysis:{aestheticScore:61.4085082871795,sharpness:82,qualityBucket:"good",phash:"87c7217117364827"},exif:{date:"2026-09-25T11:47:44",releaseDate:"2026-09-25T11:47:44",author:"Cebreus",location:"Torre Bellesguard",sublocation:"Torre Bellesguard",city:"Barcelona",latitude:41.409578,longitude:2.127008,orientation:1,country:"Španělsko",countryCode:"ESP",state:"Katalánsko"},author:"Cebreus",authorSlug:"cebreus",location:"Torre Bellesguard",city:"Barcelona",googleMapsUrl:"https://www.google.com/maps/search/?api=1&query=41.409578,2.127008",date:"2026-09-25T11:47:44",sources:[{variant:"default",type:"image/webp",path:"/images/previews-webp/IMG_0485.webp",width:370},{variant:"default",type:"image/jpeg",path:"/images/previews/IMG_0485.jpeg",width:370},{variant:"default",type:"image/avif",path:"/images/previews-avif/IMG_0485.avif",width:370},{variant:"xl",type:"image/webp",path:"/images/previews-xl-webp/IMG_0485.webp",width:534},{variant:"xl",type:"image/jpeg",path:"/images/previews-xl/IMG_0485.jpeg",width:534},{variant:"xl",type:"image/avif",path:"/images/previews-xl-avif/IMG_0485.avif",width:534},{variant:"detail",type:"image/jpeg",path:"/images/details/IMG_0485.jpeg",width:1707,height:1280},{variant:"fallback",type:"image/jpeg",path:"/images/previews-xxs/IMG_0485.jpeg",width:190,height:127},{variant:"admin_thumb",type:"image/jpeg",path:"/images/previews-admin/IMG_0485.jpeg",width:534,height:401}],people:[]},{id:"loc-sagrat-cor-main-2026-09-25t141831",type:"separator",location:"Sagrat Cor",city:"Barcelona",hasPhotos:true,startDate:"2026-09-25T14:18:31",endDate:"2026-09-25T15:04:25",storyTitle:"Temple del Sagrat Cor (Tibidabo)",story:"\u003Cp class=\"lead\" data-section-id=\"lead\">Chrám Nejsvětějšího Srdce Ježíšova (\u003Cem>Temple Expiatori del Sagrat Cor\u003C/em>) tvoří dominantu pohoří Collserola přímo na nejvyšším bodě Barcelony v&nbsp;nadmořské výšce 512&nbsp;m&nbsp;n.&nbsp;m. Vrchol Tibidabo vděčí za jméno biblickému pokušení: \u003Cem>Tibi dabo\u003C/em> – „Všecko toto ti dám“. Architekt Enric Sagnier rozvrhl komplex jako vědomý kontrast temné novorománské krypty z&nbsp;montjuïckého pískovce a&nbsp;štíhlého novogotického chrámu, který na kupoli vrcholí monumentální bronzovou sochou Krista. \u003C/p>\u003Cdetails data-section-id=\"history-origin-hermitage\" data-section-kind=\"narrative\">\n\u003Csummary>Záchrana vrcholu, dar Donu Boskovi a&nbsp;poustevna z&nbsp;roku 1886\u003C/summary>\n\u003Cdiv>\u003Cp>V&nbsp;osmdesátých letech 19.&nbsp;století hrozilo, že nejvyšší vrchol barcelonského panoramatu obsadí velký hotel s&nbsp;kasinem a&nbsp;protestantská modlitebna. Proti developerskému záměru se postavila skupina katolických dam vedená filantropkou Doroteou de Chopitea, která strategický pozemek odkoupila pro stavbu smírného chrámu.\u003C/p>\n\u003Cp>Příležitost přinesla návštěva zakladatele salesiánů Dona Boska (sv.&nbsp;Jana Boska) v&nbsp;Barceloně v&nbsp;květnu 1886. Don Bosco pozemek přijal a&nbsp;svěřil jej do správy kongregace. Ještě téhož roku vyrostla na vrcholu kamenná novogotická poustevna o&nbsp;půdorysu pouhých 2&nbsp;×&nbsp;2&nbsp;metry. Drobná stavba z&nbsp;hrubého kamene zůstala zachována a&nbsp;stojí včleněna v&nbsp;pravém křídle horního nádvoří.\u003C/p>\n\u003Cp>Při Světové výstavě roku 1888 byla na Tibidabo vybudována první silnice a&nbsp;vyhlídkový pavilon. Na přelomu století spolek získal prostředky na stavbu monumentálního chrámu, jehož návrh zadal Enricu Sagnierovi.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"crypt-facade-portal\" data-section-kind=\"narrative\">\n\u003Csummary>Krypta Enrica Sagniera, portál patronů a&nbsp;mozaika\u003C/summary>\n\u003Cdiv>\u003Cp>Stavba komplexu začala položením základního kamene 28.&nbsp;prosince 1902 za přítomnosti biskupa Salvadora Casañase. Enric Sagnier navrhl kryptu jako mohutnou opevněnou terasu, která vyrovnává horský svah a&nbsp;vytváří pevný sokl pro horní chrám. Hrubá stavba probíhala v&nbsp;letech 1902–1911 a&nbsp;byla vysvěcena 18.&nbsp;června 1911 biskupem Joanem Bautistou Benllochem.\u003C/p>\n\u003Cp>Sagnier použil pro kryptu kámen z&nbsp;Montjuïcu, který splývá se skalním masivem. Průčelí dominuje portál s&nbsp;trojúhelníkovým štítem a&nbsp;sochařskou výzdobou Eusebiho Arnaua. Kompozice zobrazuje Nejsvětější Srdce Ježíšovo uctívané trojicí zemských ochránců: Pannou Marií Milosrdnou, svatým Jiřím a&nbsp;svatým Jakubem.\u003C/p>\n\u003Cp>Půlkruhový oblouk nad portálem vyplňuje výzdoba z&nbsp;roku 1955 od barcelonské dílny Tallers Bru.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"crypt-interior-alabaster\" data-section-kind=\"narrative\">\n\u003Csummary>Pětilodí krypty, románsko-byzantské klenby a&nbsp;alabastr\u003C/summary>\n\u003Cdiv>\u003Cp>Za masivními vstupními dveřmi se otevírá rozlehlé nízko klenuté pětilodí, které navozuje atmosféru raně křesťanských katakomb i&nbsp;pevného románského hradu. Nízký strop nesou robustní sloupy s&nbsp;hlavicemi inspirovanými byzantskou ornamentikou.\u003C/p>\n\u003Cp>Stěny a&nbsp;apsidy pokrývá bohatá umělecká výzdoba z&nbsp;leštěného polychromovaného alabastru a&nbsp;skleněných mozaik. Reliéfy zachycují klíčové momenty z&nbsp;evangelií, postavy apoštolů i&nbsp;výjevy ze španělských církevních dějin. Do bočních stěn jsou vloženy půlkruhové kaple zasvěcené Panně Marii a&nbsp;svatému Josefu.\u003C/p>\n\u003Cp>Tlumené světlo pronikající úzkými okny v&nbsp;kombinaci se zlatavými odlesky mozaik vytváří kontemplativní prostor, který záměrně kontrastuje se vzdušným a&nbsp;jasně osvětleným horním chrámem.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"upper-church-neo-gothic\" data-section-kind=\"narrative\">\n\u003Csummary>Horní chrám, gironský kámen a&nbsp;dokončení Josepem Mariou Sagnierem\u003C/summary>\n\u003Cdiv>\u003Cp>Na terase krypty začala v&nbsp;roce 1915 vyrůstat vertikála samotného horního chrámu. Enric Sagnier postavil proti hrubému kameni spodní stavby novogotický chrám z&nbsp;modrošedého gironského kamene. Tento materiálový kontrast symbolizuje přechod od pozemského pokání k&nbsp;nebeské oslavě.\u003C/p>\n\u003Cp>Stavbu přerušila občanská válka v&nbsp;letech 1936–1939, kdy byl areál zkonfiskován a&nbsp;sloužil jako vojenská rozhlasová stanice. Po smrti Enrica Sagniera roku 1931 převzal vedení prací jeho syn Josep Maria Sagnier i&nbsp;Vidal (1890–1978), který věrně rozvinul otcovy plány až do dokončení v&nbsp;roce 1951.\u003C/p>\n\u003Cp>Půdorys tvoří centrální čtverec se třemi polygonálními apsidami a&nbsp;ústřední kupolí na osmibokém tamburu. Dokončený chrám byl slavnostně otevřen a&nbsp;posvěcen v&nbsp;květnu 1952 během XXXV.&nbsp;mezinárodního eucharistického kongresu v&nbsp;Barceloně.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"terrace-twelve-apostles\" data-section-kind=\"narrative\">\n\u003Csummary>Vyhlídkové terasy a&nbsp;dvanáct apoštolů Josepa Mireta\u003C/summary>\n\u003Cdiv>\u003Cp>Čtyři nárožní polygonální věže horního chrámu nesou celkem dvanáct monumentálních kamenných soch apoštolů, které vytesal sochař Josep Miret.  Věže jsou propojeny kamennými ochozy, po nichž mohou návštěvníci obcházet celý obvod stavby.\u003C/p>\n\u003Cp>Z&nbsp;teras pod věžemi se otevírá kruhové panorama pokrývající celou barcelonskou pláň, přístav i&nbsp;středozemní pobřeží. Za jasného počasí vystupují na severozápadním obzoru rozeklané vápencové věže posvátného pohoří Montserrat, zatímco směrem na jihovýchod leží celá šachovnice čtvrti Eixample.\u003C/p>\n\u003Cp>Prosklenými lucernami věží proniká do interiéru chrámu denní světlo a&nbsp;v&nbsp;jejich vitrážích je vetknut latinský nápis \u003Cem>TIBI DABO\u003C/em> připomínající biblické jméno hory.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"christ-statue-history\" data-section-kind=\"narrative\">\n\u003Csummary>Monumentální socha Krista, osud z&nbsp;roku 1936 a&nbsp;titul baziliky\u003C/summary>\n\u003Cdiv>\u003Cp>Vrchol centrální kopule korunuje monumentální bronzová socha Nejsvětějšího Srdce Ježíšova s&nbsp;rozpjatýma rukama. Její historie zrcadlí pohnuté španělské dějiny 20.&nbsp;století:\nPůvodní plastiku navrhl sochař Frederic Marès i&nbsp;Deulofeu v&nbsp;roce 1935. Následujícího roku byla během občanské války zničena.\u003C/p>\n\u003Cp>Současnou sochu vytvořil v&nbsp;roce 1950 Josep Miret.\u003C/p>\n\u003Cp>Význam chrámu jako celonárodního poutního místa potvrdil papež Jan XXIII., který jej 29.&nbsp;října 1961 apoštolským breve \u003Cem>Tibidabensis montis\u003C/em> povýšil na baziliku minor. Objekt požívá ochrany jako kulturní památka místního významu (BCIL) v&nbsp;katalogu města pod číslem 2471.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"visit-access-2026\" data-section-kind=\"narrative\">\n\u003Csummary>Návštěva a&nbsp;doprava v&nbsp;roce 2026\u003C/summary>\n\u003Cdiv>\u003Cp>Odpolední návštěva chrámu dne 25.&nbsp;září&nbsp;2026 v&nbsp;čase od 14.18 do 15.04 nabídla působivý zážitek z&nbsp;nejvyššího bodu pohoří Serra de Collserola ve výšce 512&nbsp;metrů nad mořem. Hlavní přístup na vrchol zajišťovala modernizovaná panoramatická pozemní lanovka Cuca de Llum, uvedená do provozu v&nbsp;červnu 2021 podle návrhu studia MIAS Arquitectes, která propojila dolní stanici s&nbsp;vrcholem za necelé tři minuty jízdy prosklenými vozy.\u003C/p>\n\u003Cp>Samotný chrám fungoval v&nbsp;roce 2026 v&nbsp;kombinovaném režimu: monumentální románsko-byzantská krypta z&nbsp;montjuïckého kamene i&nbsp;světlý neogotický horní kostel byly celoročně volně přístupné k&nbsp;tiché modlitbě. Zpoplatněný vnitřní výtah vyvezl návštěvníky na venkovní terasu s&nbsp;dvanácti bronzovými sochami apoštolů, odkud točité schodiště umožnilo výstup až k&nbsp;patě monumentální sedmimetrové sochy Nejsvětějšího Srdce Ježíšova s&nbsp;kruhovým výhledem na celou Barcelonu i&nbsp;středozemní pobřeží.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"facts\" data-section-kind=\"facts\">\n\u003Csummary>Základní údaje\u003C/summary>\n\u003Cdiv>\u003Ctable>\n\u003Cthead>\n\u003Ctr>\n\u003Cth align=\"left\">Parametr\u003C/th>\n\u003Cth align=\"left\">Údaj\u003C/th>\n\u003C/tr>\n\u003C/thead>\n\u003Ctbody>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Oficiální název\u003C/th>\n\u003Ctd align=\"left\">Temple Expiatori del Sagrat Cor de Jesús (od r. 1961 bazilika minor) \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Hlavní architekti\u003C/th>\n\u003Ctd align=\"left\">Enric Sagnier i&nbsp;Villavecchia (1858–1931); dokončil jeho syn Josep Maria Sagnier i&nbsp;Vidal (1890–1978) \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Významní sochaři\u003C/th>\n\u003Ctd align=\"left\">Eusebi Arnau i&nbsp;Mascort (výzdoba portálu krypty); Frederic Marès i&nbsp;Deulofeu (původní socha Krista 1935); Josep Miret (sochy apoštolů a&nbsp;socha Krista 1950) \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Autoři mozaik\u003C/th>\n\u003Ctd align=\"left\">Tallers Bru (Lluís Bru i&nbsp;Salelles a&nbsp;Josep Bru – fasádní mozaika 1955)\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Původní donátoři\u003C/th>\n\u003Ctd align=\"left\">Dorotea de Chopitea a&nbsp;sdružení katolických dam (darování pozemku sv.&nbsp;Janu Boskovi roku 1886)\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Doba výstavby\u003C/th>\n\u003Ctd align=\"left\">1902–1961 (krypta: 1902–1911; horní chrám: 1915–1951; vysvěcení: 1952; bazilika minor: 1961) \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Architektonický styl\u003C/th>\n\u003Ctd align=\"left\">krypta: monumentální novorománský a&nbsp;novobyzantský eklektismus; horní chrám: novogotika \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Stavební materiál\u003C/th>\n\u003Ctd align=\"left\">kámen z&nbsp;Montjuïcu (krypta); modrošedý gironský kámen (horní chrám); alabastr a&nbsp;mozaika v&nbsp;kryptě \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Lokalita a&nbsp;adresa\u003C/th>\n\u003Ctd align=\"left\">Cumbre del Tibidabo, 08035 Barcelona (městský obvod Sarrià-Sant Gervasi)\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Nadmořská výška\u003C/th>\n\u003Ctd align=\"left\">vrchol Tibidaba: 512&nbsp;m&nbsp;n.&nbsp;m.\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Památková ochrana\u003C/th>\n\u003Ctd align=\"left\">kulturní památka místního významu (BCIL), katalogové číslo 2471; inventární záznam IPAC IPA-46063 \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Oficiální správa\u003C/th>\n\u003Ctd align=\"left\">Salesiáni Dona Boska (Comunitat Salesiana del Tibidabo)\u003C/td>\n\u003C/tr>\n\u003C/tbody>\n\u003C/table>\n\u003C/div>\n\u003C/details>",locationId:"sagrat-cor",locationLeadHtml:"\u003Cp class=\"lead\" data-section-id=\"lead\">Chrám Nejsvětějšího Srdce Ježíšova (\u003Cem>Temple Expiatori del Sagrat Cor\u003C/em>) tvoří dominantu pohoří Collserola přímo na nejvyšším bodě Barcelony v&nbsp;nadmořské výšce 512&nbsp;m&nbsp;n.&nbsp;m. Vrchol Tibidabo vděčí za jméno biblickému pokušení: \u003Cem>Tibi dabo\u003C/em> – „Všecko toto ti dám“. Architekt Enric Sagnier rozvrhl komplex jako vědomý kontrast temné novorománské krypty z&nbsp;montjuïckého pískovce a&nbsp;štíhlého novogotického chrámu, který na kupoli vrcholí monumentální bronzovou sochou Krista. \u003C/p>",locationHtml:"\u003Cdetails data-section-id=\"history-origin-hermitage\" data-section-kind=\"narrative\">\n\u003Csummary>Záchrana vrcholu, dar Donu Boskovi a&nbsp;poustevna z&nbsp;roku 1886\u003C/summary>\n\u003Cdiv>\u003Cp>V&nbsp;osmdesátých letech 19.&nbsp;století hrozilo, že nejvyšší vrchol barcelonského panoramatu obsadí velký hotel s&nbsp;kasinem a&nbsp;protestantská modlitebna. Proti developerskému záměru se postavila skupina katolických dam vedená filantropkou Doroteou de Chopitea, která strategický pozemek odkoupila pro stavbu smírného chrámu.\u003C/p>\n\u003Cp>Příležitost přinesla návštěva zakladatele salesiánů Dona Boska (sv.&nbsp;Jana Boska) v&nbsp;Barceloně v&nbsp;květnu 1886. Don Bosco pozemek přijal a&nbsp;svěřil jej do správy kongregace. Ještě téhož roku vyrostla na vrcholu kamenná novogotická poustevna o&nbsp;půdorysu pouhých 2&nbsp;×&nbsp;2&nbsp;metry. Drobná stavba z&nbsp;hrubého kamene zůstala zachována a&nbsp;stojí včleněna v&nbsp;pravém křídle horního nádvoří.\u003C/p>\n\u003Cp>Při Světové výstavě roku 1888 byla na Tibidabo vybudována první silnice a&nbsp;vyhlídkový pavilon. Na přelomu století spolek získal prostředky na stavbu monumentálního chrámu, jehož návrh zadal Enricu Sagnierovi.\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"crypt-facade-portal\" data-section-kind=\"narrative\">\n\u003Csummary>Krypta Enrica Sagniera, portál patronů a&nbsp;mozaika\u003C/summary>\n\u003Cdiv>\u003Cp>Stavba komplexu začala položením základního kamene 28.&nbsp;prosince 1902 za přítomnosti biskupa Salvadora Casañase. Enric Sagnier navrhl kryptu jako mohutnou opevněnou terasu, která vyrovnává horský svah a&nbsp;vytváří pevný sokl pro horní chrám. Hrubá stavba probíhala v&nbsp;letech 1902–1911 a&nbsp;byla vysvěcena 18.&nbsp;června 1911 biskupem Joanem Bautistou Benllochem.\u003C/p>\n\u003Cp>Sagnier použil pro kryptu kámen z&nbsp;Montjuïcu, který splývá se skalním masivem. Průčelí dominuje portál s&nbsp;trojúhelníkovým štítem a&nbsp;sochařskou výzdobou Eusebiho Arnaua. Kompozice zobrazuje Nejsvětější Srdce Ježíšovo uctívané trojicí zemských ochránců: Pannou Marií Milosrdnou, svatým Jiřím a&nbsp;svatým Jakubem.\u003C/p>\n\u003Cp>Půlkruhový oblouk nad portálem vyplňuje výzdoba z&nbsp;roku 1955 od barcelonské dílny Tallers Bru.\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"crypt-interior-alabaster\" data-section-kind=\"narrative\">\n\u003Csummary>Pětilodí krypty, románsko-byzantské klenby a&nbsp;alabastr\u003C/summary>\n\u003Cdiv>\u003Cp>Za masivními vstupními dveřmi se otevírá rozlehlé nízko klenuté pětilodí, které navozuje atmosféru raně křesťanských katakomb i&nbsp;pevného románského hradu. Nízký strop nesou robustní sloupy s&nbsp;hlavicemi inspirovanými byzantskou ornamentikou.\u003C/p>\n\u003Cp>Stěny a&nbsp;apsidy pokrývá bohatá umělecká výzdoba z&nbsp;leštěného polychromovaného alabastru a&nbsp;skleněných mozaik. Reliéfy zachycují klíčové momenty z&nbsp;evangelií, postavy apoštolů i&nbsp;výjevy ze španělských církevních dějin. Do bočních stěn jsou vloženy půlkruhové kaple zasvěcené Panně Marii a&nbsp;svatému Josefu.\u003C/p>\n\u003Cp>Tlumené světlo pronikající úzkými okny v&nbsp;kombinaci se zlatavými odlesky mozaik vytváří kontemplativní prostor, který záměrně kontrastuje se vzdušným a&nbsp;jasně osvětleným horním chrámem.\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"upper-church-neo-gothic\" data-section-kind=\"narrative\">\n\u003Csummary>Horní chrám, gironský kámen a&nbsp;dokončení Josepem Mariou Sagnierem\u003C/summary>\n\u003Cdiv>\u003Cp>Na terase krypty začala v&nbsp;roce 1915 vyrůstat vertikála samotného horního chrámu. Enric Sagnier postavil proti hrubému kameni spodní stavby novogotický chrám z&nbsp;modrošedého gironského kamene. Tento materiálový kontrast symbolizuje přechod od pozemského pokání k&nbsp;nebeské oslavě.\u003C/p>\n\u003Cp>Stavbu přerušila občanská válka v&nbsp;letech 1936–1939, kdy byl areál zkonfiskován a&nbsp;sloužil jako vojenská rozhlasová stanice. Po smrti Enrica Sagniera roku 1931 převzal vedení prací jeho syn Josep Maria Sagnier i&nbsp;Vidal (1890–1978), který věrně rozvinul otcovy plány až do dokončení v&nbsp;roce 1951.\u003C/p>\n\u003Cp>Půdorys tvoří centrální čtverec se třemi polygonálními apsidami a&nbsp;ústřední kupolí na osmibokém tamburu. Dokončený chrám byl slavnostně otevřen a&nbsp;posvěcen v&nbsp;květnu 1952 během XXXV.&nbsp;mezinárodního eucharistického kongresu v&nbsp;Barceloně.\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"terrace-twelve-apostles\" data-section-kind=\"narrative\">\n\u003Csummary>Vyhlídkové terasy a&nbsp;dvanáct apoštolů Josepa Mireta\u003C/summary>\n\u003Cdiv>\u003Cp>Čtyři nárožní polygonální věže horního chrámu nesou celkem dvanáct monumentálních kamenných soch apoštolů, které vytesal sochař Josep Miret.  Věže jsou propojeny kamennými ochozy, po nichž mohou návštěvníci obcházet celý obvod stavby.\u003C/p>\n\u003Cp>Z&nbsp;teras pod věžemi se otevírá kruhové panorama pokrývající celou barcelonskou pláň, přístav i&nbsp;středozemní pobřeží. Za jasného počasí vystupují na severozápadním obzoru rozeklané vápencové věže posvátného pohoří Montserrat, zatímco směrem na jihovýchod leží celá šachovnice čtvrti Eixample.\u003C/p>\n\u003Cp>Prosklenými lucernami věží proniká do interiéru chrámu denní světlo a&nbsp;v&nbsp;jejich vitrážích je vetknut latinský nápis \u003Cem>TIBI DABO\u003C/em> připomínající biblické jméno hory.\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"christ-statue-history\" data-section-kind=\"narrative\">\n\u003Csummary>Monumentální socha Krista, osud z&nbsp;roku 1936 a&nbsp;titul baziliky\u003C/summary>\n\u003Cdiv>\u003Cp>Vrchol centrální kopule korunuje monumentální bronzová socha Nejsvětějšího Srdce Ježíšova s&nbsp;rozpjatýma rukama. Její historie zrcadlí pohnuté španělské dějiny 20.&nbsp;století:\nPůvodní plastiku navrhl sochař Frederic Marès i&nbsp;Deulofeu v&nbsp;roce 1935. Následujícího roku byla během občanské války zničena.\u003C/p>\n\u003Cp>Současnou sochu vytvořil v&nbsp;roce 1950 Josep Miret.\u003C/p>\n\u003Cp>Význam chrámu jako celonárodního poutního místa potvrdil papež Jan XXIII., který jej 29.&nbsp;října 1961 apoštolským breve \u003Cem>Tibidabensis montis\u003C/em> povýšil na baziliku minor. Objekt požívá ochrany jako kulturní památka místního významu (BCIL) v&nbsp;katalogu města pod číslem 2471.\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"visit-access-2026\" data-section-kind=\"narrative\">\n\u003Csummary>Návštěva a&nbsp;doprava v&nbsp;roce 2026\u003C/summary>\n\u003Cdiv>\u003Cp>Odpolední návštěva chrámu dne 25.&nbsp;září&nbsp;2026 v&nbsp;čase od 14.18 do 15.04 nabídla působivý zážitek z&nbsp;nejvyššího bodu pohoří Serra de Collserola ve výšce 512&nbsp;metrů nad mořem. Hlavní přístup na vrchol zajišťovala modernizovaná panoramatická pozemní lanovka Cuca de Llum, uvedená do provozu v&nbsp;červnu 2021 podle návrhu studia MIAS Arquitectes, která propojila dolní stanici s&nbsp;vrcholem za necelé tři minuty jízdy prosklenými vozy.\u003C/p>\n\u003Cp>Samotný chrám fungoval v&nbsp;roce 2026 v&nbsp;kombinovaném režimu: monumentální románsko-byzantská krypta z&nbsp;montjuïckého kamene i&nbsp;světlý neogotický horní kostel byly celoročně volně přístupné k&nbsp;tiché modlitbě. Zpoplatněný vnitřní výtah vyvezl návštěvníky na venkovní terasu s&nbsp;dvanácti bronzovými sochami apoštolů, odkud točité schodiště umožnilo výstup až k&nbsp;patě monumentální sedmimetrové sochy Nejsvětějšího Srdce Ježíšova s&nbsp;kruhovým výhledem na celou Barcelonu i&nbsp;středozemní pobřeží.\u003C/p>\n\u003C/div>\n\u003C/details>",locationOfficialHtml:"\u003Ctable>\n\u003Cthead>\n\u003Ctr>\n\u003Cth align=\"left\">Parametr\u003C/th>\n\u003Cth align=\"left\">Údaj\u003C/th>\n\u003C/tr>\n\u003C/thead>\n\u003Ctbody>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Oficiální název\u003C/th>\n\u003Ctd align=\"left\">Temple Expiatori del Sagrat Cor de Jesús (od r. 1961 bazilika minor) \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Hlavní architekti\u003C/th>\n\u003Ctd align=\"left\">Enric Sagnier i&nbsp;Villavecchia (1858–1931); dokončil jeho syn inventární záznam IPAC IPA-46063 \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Oficiální správa\u003C/th>\n\u003Ctd align=\"left\">Salesiáni Dona Boska (Comunitat Salesiana del Tibidabo)\u003C/td>\n\u003C/tr>\n\u003C/tbody>\n\u003C/table>\n",aliases:["Temple Expiatori del Sagrat Cor","Tibidabo","Sagrat Cor de Jesús","Temple Sacred Heart Jesus","Chrám Nejsvětějšího Srdce Ježíšova"],heroImage:{src:"/travel-guide/teasers/sagrat-cor/hero.jpg",alt:"Chrám Sagrat Cor na vrcholu hory Tibidabo se sochou Krista"},audio:[{section:"lead",label:"Úvod",identity:"7d86eec9471a877330a140304c7fffe095169b74a81037d51f91526931ce7a18",src:"/travel-guide/audio/sagrat-cor/7d86eec9471a877330a140304c7fffe095169b74a81037d51f91526931ce7a18.m4a"},{section:"history-origin-hermitage",label:"Záchrana vrcholu, dar Donu Boskovi a poustevna z roku 1886",identity:"c27a88fc99298021292d4d3b2bbecd65394556fe0c60463edbd21d4d5b26a206",src:"/travel-guide/audio/sagrat-cor/c27a88fc99298021292d4d3b2bbecd65394556fe0c60463edbd21d4d5b26a206.m4a"},{section:"crypt-facade-portal",label:"Krypta Enrica Sagniera, portál patronů a mozaika",identity:"139d93f4264b8706546a48679b302dd663f14ca950a33da7cdbe475af7e4353b",src:"/travel-guide/audio/sagrat-cor/139d93f4264b8706546a48679b302dd663f14ca950a33da7cdbe475af7e4353b.m4a"},{section:"crypt-interior-alabaster",label:"Pětilodí krypty, románsko-byzantské klenby a alabastr",identity:"898408969b816c59aa7f9f626ea05abab5603f3273e53c9576ab4da58a853fc0",src:"/travel-guide/audio/sagrat-cor/898408969b816c59aa7f9f626ea05abab5603f3273e53c9576ab4da58a853fc0.m4a"},{section:"upper-church-neo-gothic",label:"Horní chrám, gironský kámen a dokončení Josepem Mariou Sagnierem",identity:"c766853274063369f2684b8478b6808c2a436d63d92681e656164270f6e9b584",src:"/travel-guide/audio/sagrat-cor/c766853274063369f2684b8478b6808c2a436d63d92681e656164270f6e9b584.m4a"},{section:"terrace-twelve-apostles",label:"Vyhlídkové terasy a dvanáct apoštolů Josepa Mireta",identity:"44eb5c97edf9
