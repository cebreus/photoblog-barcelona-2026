ada Familia - Gaudí, Barcelona",title:"",width:3275,height:2456,sizeMB:2.31,aspectRatio:"landscape-4-3",placeholder:"blurs/IMG_0419.png",placeholderColor:"rgb(24,24,40)",analysis:{aestheticScore:46.08645728122124,sharpness:100,qualityBucket:"good",phash:"26060008c8cbc9cb"},exif:{date:"2026-09-23T19:49:41",releaseDate:"2026-09-23T19:49:41",author:"Cebreus",location:"AB Sagrada Familia - Gaudí",sublocation:"AB Sagrada Familia - Gaudí",city:"Barcelona",latitude:41.407181,longitude:2.176342,orientation:1,country:"Španělsko",countryCode:"ESP",state:"Katalánsko"},author:"Cebreus",authorSlug:"cebreus",location:"AB Sagrada Familia - Gaudí",city:"Barcelona",googleMapsUrl:"https://www.google.com/maps/search/?api=1&query=41.407181,2.176342",date:"2026-09-23T19:49:41",sources:[{variant:"default",type:"image/webp",path:"/images/previews-webp/IMG_0419.webp",width:370},{variant:"default",type:"image/jpeg",path:"/images/previews/IMG_0419.jpeg",width:370},{variant:"default",type:"image/avif",path:"/images/previews-avif/IMG_0419.avif",width:370},{variant:"xl",type:"image/webp",path:"/images/previews-xl-webp/IMG_0419.webp",width:534},{variant:"xl",type:"image/jpeg",path:"/images/previews-xl/IMG_0419.jpeg",width:534},{variant:"xl",type:"image/avif",path:"/images/previews-xl-avif/IMG_0419.avif",width:534},{variant:"detail",type:"image/jpeg",path:"/images/details/IMG_0419.jpeg",width:1707,height:1280},{variant:"fallback",type:"image/jpeg",path:"/images/previews-xxs/IMG_0419.jpeg",width:190,height:127},{variant:"admin_thumb",type:"image/jpeg",path:"/images/previews-admin/IMG_0419.jpeg",width:534,height:401}],flags:["snapshot-author"],people:["person-8fcf0021a7ada1e7d3f84580ef3ca26a2e0e4ef99b9adf6b438fac8a9257157e","person-67e7b790752ec4058cbdeefbcd229a848e2b4f981b789f39b6d982a02577b35c"]}],id:"day-2026-09-23"},{date:"2026-09-24",cities:["Barcelona"],locations:["Sagrada Família","AB Sagrada Familia - Gaudí","La Pedrera - Casa Milà"],items:[{id:"loc-sagrada-familia-main-2026-09-24t101848",type:"separator",location:"Sagrada Família",city:"Barcelona",hasPhotos:true,startDate:"2026-09-24T10:18:48",endDate:"2026-09-24T23:59:59",storyTitle:"Sagrada Família (Basílica i Temple Expiatori de la Sagrada Família)",story:"\u003Cp class=\"lead\" data-section-id=\"lead\">Chrám Sagrada Família v&nbsp;barcelonské čtvrti Eixample představuje životní dílo katalánského architekta Antoniho Gaudího. Výstavba odstartovala v&nbsp;roce 1882 podle původního novogotického projektu Francisca de Paula del Villara, jehož o&nbsp;rok později vystřídal Gaudí a&nbsp;zcela změnil architektonickou koncepci.  Monumentální bazilika propojuje přírodní organické formy s&nbsp;pokročilou geometrií přímkových ploch, symbolickým sochařským programem tří fasád a&nbsp;promyšlenou prací se světlem v&nbsp;pětilodním interiéru. \u003C/p>\u003Cdetails data-section-id=\"history-construction\" data-section-kind=\"narrative\">\n\u003Csummary>Historické souvislosti, vznik a&nbsp;výstavba\u003C/summary>\n\u003Cdiv>\u003Cp>Základní podnět k&nbsp;výstavbě chrámu vzešel od knihkupce Josepa Marii Bocabelly, zakladatele Duchovního sdružení ctitelů svatého Josefa, který chtěl po návštěvě Loreta vytvořit expiační chrám financovaný výhradně z&nbsp;milodarů. Sdružení zakoupilo pozemek o&nbsp;rozloze 12&nbsp;800&nbsp;m² v&nbsp;tehdy nezastavěné čtvrti Sant Martí de Provençals a&nbsp;základní kámen byl položen 19.&nbsp;března&nbsp;1882.\u003C/p>\n\u003Cp>Původní diecézní architekt Francisco de Paula del Villar navrhl novogotickou trojlodní baziliku. Po sporech ohledně nákladů však v&nbsp;roce 1883 odstoupil a&nbsp;vedení stavby převzal jednatřicetiletý Antoni Gaudí, který rozpracoval radikálně novou vizi monumentálního chrámu. V&nbsp;roce 1909 postavil na staveništi provizorní farní školu ze tří vrstev cihel s&nbsp;vlnitými konoidními skořepinami, kterou později ocenil i&nbsp;Le Corbusier.\u003C/p>\n\u003Cp>Od roku 1914 se Gaudí věnoval výhradně chrámu a&nbsp;poslední měsíce života bydlel přímo ve své dílně. Po jeho tragické smrti v&nbsp;červnu 1926 byl pohřben v&nbsp;kryptě. V&nbsp;červenci 1936 radikálové vypálili kryptu a&nbsp;zničili původní sádrové modely, které jeho spolupracovníci v&nbsp;čele s&nbsp;Domènecem Sugrañesem a&nbsp;Lluísem Bonetem po válce pracně zrekonstruovali z&nbsp;úlomků.\u003C/p>\n\u003Cp>Roku 2010 papež Benedikt XVI. interiér vysvětil a&nbsp;povýšil chrám na baziliku minor. V&nbsp;roce 2019 získala stavba po 137&nbsp;letech oficiální městskou licenci a&nbsp;od roku 2012 řídí práce hlavní architekt Jordi Faulí.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"structure-geometry-materials\" data-section-kind=\"narrative\">\n\u003Csummary>Konstrukční principy, geometrie a&nbsp;materiály sloupů\u003C/summary>\n\u003Cdiv>\u003Cp>Gaudí klenby, okna i&nbsp;věže sestavil z&nbsp;přímkových ploch — hyperboloidů, paraboloidů, helikoidů a&nbsp;konoidů. Tyto geometrické tvary převzal ze struktur živé přírody a&nbsp;využil jejich vysokou tuhost při minimální spotřebě materiálu, čímž nahradil tradiční gotický systém vnějších opěrných oblouků.\u003C/p>\n\u003Cp>Dříky sloupů využívají princip dvojitého šroubovitého kroucení se dvěma protiběžnými závity. Průřez sloupu se při stoupání plynule proměňuje z&nbsp;polygonální základny přes hvězdicový tvar až po kruhový profil pod hlavicí, kde se sloup větví jako koruna stromu a&nbsp;vynáší klenby.\u003C/p>\n\u003Cp>Nosné sloupy jsou odstupňovány podle přísné hierarchie zatížení a&nbsp;tvrdosti kamene. Čtyři hlavní sloupy v&nbsp;křížení transeptu nesou váhu centrálních věží a&nbsp;tvoří je červený porfyr dovezený z&nbsp;Íránu, nejtvrdší hornina na stavbě. Sloupy hlavní lodi tvoří tmavý čedič a&nbsp;šedá žula, zatímco sloupy bočních lodí vznikly ze sedimentárního pískovce z&nbsp;hory Montjuïc.\u003C/p>\n\u003Cp>Protože Gaudího prostorové přímkové plochy nebylo možné zakreslit běžnými metodami, zavedla stavební huť koncem osmdesátých let 20.&nbsp;století pokročilý letecký parametrický software pro 3D modelování. Věže evangelistů a&nbsp;Ježíše Krista tak vznikají z&nbsp;předpjatých kamenných panelů stahovaných vnitřními nerezovými táhly.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"facades-sculptures\" data-section-kind=\"narrative\">\n\u003Csummary>Průčelí Narození Páně, Umučení a&nbsp;Slávy\u003C/summary>\n\u003Cdiv>\u003Cp>Trojice monumentálních fasád představuje tři zásadní etapy pozemského a&nbsp;nebeského života Ježíše Krista — Narození, Umučení a&nbsp;Zmrtvýchvstání se Slávou.\u003C/p>\n\u003Cp>Fasáda Narození Páně (\u003Cem>Façana del Naixement\u003C/em>) vznikala v&nbsp;letech 1893–1936 z&nbsp;velké části pod osobním Gaudího dohledem. Vyniká naturalistickou výzdobou plnou rostlinných motivů a&nbsp;výjevů z&nbsp;Kristova dětství pod třemi portály Víry, Naděje a&nbsp;Lásky. K&nbsp;dosažení maximální věrnosti soch vyvinul Gaudí se sochaři Llorençem Matamalou a&nbsp;Carlesem Manim metodu přímého snímání sádrových forem ze živých modelů, dělníků i&nbsp;zvířat. Štít korunuje zelený cypřiš ze skleněné mozaiky jako symbol věčného Stromu života.\u003C/p>\n\u003Cp>Fasáda Umučení (\u003Cem>Façana de la Passió\u003C/em>) na protilehlé jihozápadní straně začala vznikat roku 1954 jako strohý a&nbsp;dramatický protiklad s&nbsp;kostrou z&nbsp;lomených sloupů. V&nbsp;letech 1987–2009 vytvořil sochař Josep Maria Subirachs expresivní sochařský soubor s&nbsp;hranatými liniemi včetně magického čtverce se stálým součtem 33.\u003C/p>\n\u003Cp>Monumentální vstupy doplňují bronzová vrata: na fasádě Narození s&nbsp;listovím a&nbsp;hmyzem od Etsura Sotaa, na fasádě Umučení s&nbsp;katalánským textem pašijí a&nbsp;na fasádě Slávy s&nbsp;modlitbou Otčenáš v&nbsp;padesáti světových jazycích včetně češtiny od Subirachse.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"interior-towers-light\" data-section-kind=\"narrative\">\n\u003Csummary>Vnitřní prostor, věže a&nbsp;světelná kompozice\u003C/summary>\n\u003Cdiv>\u003Cp>Půdorys baziliky tvoří latinský kříž s&nbsp;pěti podélnými loděmi, trojlodním transeptem a&nbsp;apsidou se sedmi kaplemi. Vnitřní prostor měří na délku 90&nbsp;metrů, klenba centrální lodi stoupá do výšky 45&nbsp;metrů a&nbsp;křížení se tyčí do 60&nbsp;metrů.\u003C/p>\n\u003Cp>Celkový komplex korunuje 18 plánovaných věží: dvanáct apoštolských na fasádách (98–120&nbsp;m), čtyři věže evangelistů (135&nbsp;m), věž Panny Marie (138&nbsp;m) se svítící dvanácticípou hvězdou a&nbsp;ústřední věž Ježíše Krista (172,5&nbsp;m) s&nbsp;křížem. Výšku 172,5&nbsp;metru určil Gaudí záměrně, aby stavba nepřevýšila kopec Montjuïc, neboť dílo člověka nemá předčit dílo stvořené Bohem. Do svislých otvorů věží vložil kamenné lamely \u003Cem>abat-sons\u003C/em>, které chrání vnitřek před deštěm a&nbsp;usměrňují zvuk zvonů do ulic města.\u003C/p>\n\u003Cp>Světelné pojetí navrhl sklářský mistr Joan Vila-Grau v&nbsp;letech 1999–2022 v&nbsp;souladu s&nbsp;Gaudího teologií světla. Východní okna na fasádě Narození rozehrávají studené tóny modré a&nbsp;zelené barvy ranního jitra, zatímco západní okna na fasádě Umučení zaplavují chrám v&nbsp;odpoledním slunci hřejivou září žlutých, oranžových a&nbsp;rubínových tónů.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"crypt-tombs\" data-section-kind=\"narrative\">\n\u003Csummary>Neogotická krypta a&nbsp;hrobka Antoniho Gaudího\u003C/summary>\n\u003Cdiv>\u003Cp>Podzemní neogotická krypta představuje nejstarší stavební část chrámu, vybudovanou v&nbsp;letech 1882–1889. Stavbu zahájil diecézní architekt Francisco de Paula del Villar s&nbsp;věncem sedmi polygonálních kaplí, po němž převzal projekt v&nbsp;listopadu 1883 Antoni Gaudí. Gaudí zvýšil klenby o&nbsp;více než dva metry, což umožnilo prolomit rozměrná obvodová okna ústící do příkopu a&nbsp;zajistit přirozené denní světlo i&nbsp;stálé provětrávání.\u003C/p>\n\u003Cp>Ústřední polychromovaný svorník klenby přímo nad hlavním oltářem nese kamenný reliéf Zvěstování Panny Marie, který v&nbsp;roce 1892 vytesal sochař Joan Flotats. Masivní pískovcové sloupy zdobí vyřezávané hlavice s&nbsp;motivy vinných listů a&nbsp;akantu a&nbsp;podlahu kryje římská kamenná mozaika s&nbsp;geometrickými vzory.\u003C/p>\n\u003Cp>V&nbsp;kapli Panny Marie Karmelské (\u003Cem>Capella del Carme\u003C/em>) se nachází hrobka Antoniho Gaudího, kde architekt odpočívá od pohřbu v&nbsp;červnu 1926 pod leštěnou mramorovou deskou. V&nbsp;protilehlé kapli Krista a&nbsp;svatého Josefa spočívají ostatky zakladatele chrámu Josepa Marii Bocabelly. V&nbsp;roce 2005 byla krypta společně s&nbsp;fasádou Narození Páně zapsána na Seznam světového dědictví UNESCO.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"presbytery-baldachin-organ\" data-section-kind=\"narrative\">\n\u003Csummary>Presbytář, zavěšený baldachýn a&nbsp;chrámové varhany\u003C/summary>\n\u003Cdiv>\u003Cp>Vyvýšený presbytář v&nbsp;apsidě hlavní lodi tvoří liturgické centrum celé baziliky. Oltářní stůl tvoří jediný monolitický blok ušlechtilého červeného porfyru dovezeného z&nbsp;Íránu, který vyniká mimořádnou tvrdostí a&nbsp;vysokým leskem.\u003C/p>\n\u003Cp>Přímo nad oltářem se vznáší monumentální sedmiboký zavěšený baldachýn o&nbsp;průměru 5&nbsp;metrů, inspirovaný Gaudího řešením pro katedrálu v&nbsp;Palma de Mallorca. Kostra baldachýnu z&nbsp;kovu a&nbsp;pergamenového pláště nese po obvodu padesát závěsných lamp a&nbsp;plastické hrozny vína s&nbsp;obilnými klasy jako symboly eucharistie. Pod vrcholem baldachýnu visí polychromovaná socha ukřižovaného Krista od sochaře Franceska Fajuly z&nbsp;roku 2010, vytvořená podle Gaudího a&nbsp;Maniho anatomického modelu pro dům Casa Batlló.\u003C/p>\n\u003Cp>Hudební doprovod bohoslužeb zajišťují varhany instalované v&nbsp;roce 2010 za chórovými lavicemi od dílny \u003Cem>Blancafort Orgueners de Montserrat\u003C/em> s&nbsp;26&nbsp;rejstříky a&nbsp;1&nbsp;492&nbsp;píšťalami, které tvoří první etapu budoucího velkého varhanního souboru o&nbsp;8&nbsp;000&nbsp;píšťalách. Ambit neboli křížová chodba navíc obepíná baziliku po vnějším obvodu a&nbsp;funguje jako účinná akustická a&nbsp;prachová bariéra chránící interiér před hlukem města.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"visit-context-2026\" data-section-kind=\"narrative\">\n\u003Csummary>Návštěva v&nbsp;roce stého výročí Gaudího úmrtí 2026\u003C/summary>\n\u003Cdiv>\u003Cp>Celodenní návštěva dne 24.&nbsp;září&nbsp;2026 proběhla v&nbsp;mimořádně slavnostním roce stého výročí úmrtí Antoniho Gaudího (1926–2026), kdy se dokončení chrámu přiblížilo svému historickému vrcholu. Ústřední věž Ježíše Krista dosáhla své plánované výšky 172,5&nbsp;metru a&nbsp;staveniště se připravovalo na finální osazení monumentálního sedmnáctimetrového kříže.\u003C/p>\n\u003Cp>Všechny čtyři věže evangelistů (Lukáše, Marka, Matouše a&nbsp;Jana) v&nbsp;okolí hlavní věže již byly kompletně dokončeny včetně velkolepých mramorových soch tetramorfu od sochaře Xaviera Medina-Campenyho osazených v&nbsp;letech 2022–2023. Hlavní stavební ruch se v&nbsp;roce 2026 přesunul na portál Slávy (\u003Cem>Façana de la Glòria\u003C/em>) podél ulice Carrer de Mallorca, kde probíhaly práce na železobetonových pilířích i&nbsp;intenzivní veřejné debaty o&nbsp;urbanistickém monumentálním schodišti. Návštěvníci tak mohli zažít chrám v&nbsp;okamžiku, kdy jeho vnější silueta poprvé získala zamýšlené pyramidální vyznění s&nbsp;věží Krista dominující celé Barceloně.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"facts\" data-section-kind=\"facts\">\n\u003Csummary>Základní údaje\u003C/summary>\n\u003Cdiv>\u003Ctable>\n\u003Cthead>\n\u003Ctr>\n\u003Cth align=\"left\">Parametr\u003C/th>\n\u003Cth align=\"left\">Údaj\u003C/th>\n\u003C/tr>\n\u003C/thead>\n\u003Ctbody>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Oficiální název\u003C/th>\n\u003Ctd align=\"left\">Basílica i&nbsp;Temple Expiatori de la Sagrada Família\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Hlavní architekt\u003C/th>\n\u003Ctd align=\"left\">Antoni Gaudí i&nbsp;Cornet (1852–1926; vedení stavby 1883–1926); původní autor projektu Francisco de Paula del Villar y&nbsp;Lozano (1882–1883) \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Klíčoví spolupracovníci\u003C/th>\n\u003Ctd align=\"left\">Domènec Sugrañes i&nbsp;Gras, Francesc de Paula Quintana, Isidre Puig i&nbsp;Boada, Lluís Bonet i&nbsp;Garí, Jordi Bonet i&nbsp;Armengol a&nbsp;Jordi Faulí i&nbsp;Oller; sochaři Llorenç Matamala, Josep Maria Subirachs a&nbsp;Etsuro Sotoo; autor vitráží Joan Vila-Grau \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Původní stavebník\u003C/th>\n\u003Ctd align=\"left\">Josep Maria Bocabella i&nbsp;Verdaguer a&nbsp;Duchovní sdružení ctitelů svatého Josefa (\u003Cem>Associació Espiritual de Devots de Sant Josep\u003C/em>)\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Zahájení stavby\u003C/th>\n\u003Ctd align=\"left\">19.&nbsp;března&nbsp;1882\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Architektonický styl\u003C/th>\n\u003Ctd align=\"left\">katalánský modernismus (\u003Cem>Modernisme\u003C/em>), organická architektura, neogotika \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Lokalita a&nbsp;adresa\u003C/th>\n\u003Ctd align=\"left\">Carrer de Mallorca 401, 08013 Barcelona (Eixample)\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Rozměry\u003C/th>\n\u003Ctd align=\"left\">půdorys baziliky přibližně 4&nbsp;500&nbsp;m² na pozemku o&nbsp;rozloze přibližně 12&nbsp;800&nbsp;m²; hlavní loď 90&nbsp;m dlouhá, 60&nbsp;m široká a&nbsp;45&nbsp;m vysoká; plánováno 18 věží, z&nbsp;nichž věž Ježíše Krista má dosáhnout 172,5&nbsp;m, věž Panny Marie 138&nbsp;m a&nbsp;věže evangelistů 135&nbsp;m \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Současné využití\u003C/th>\n\u003Ctd align=\"left\">římskokatolický chrám, od roku 2010 bazilika minor\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Památková ochrana\u003C/th>\n\u003Ctd align=\"left\">historicko-umělecká památka Španělska (dekret 1794/1969; BIC RI-51-0003813), kulturní památka národního zájmu Katalánska (BCIN č.&nbsp;53-MH) a&nbsp;součást zápisu UNESCO „Díla Antoniho Gaudího“: fasáda Narození Páně (320bis-005) a&nbsp;krypta (320bis-006) \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Oficiální web\u003C/th>\n\u003Ctd align=\"left\">\u003Ca href=\"https://sagradafamilia.org/\">sagradafamilia.org\u003C/a>\u003C/td>\n\u003C/tr>\n\u003C/tbody>\n\u003C/table>\n\u003C/div>\n\u003C/details>",locationId:"sagrada-familia",locationLeadHtml:"\u003Cp class=\"lead\" data-section-id=\"lead\">Chrám Sagrada Família v&nbsp;barcelonské čtvrti Eixample představuje životní dílo katalánského architekta Antoniho Gaudího. Výstavba odstartovala v&nbsp;roce 1882 podle původního novogotického projektu Francisca de Paula del Villara, jehož o&nbsp;rok později vystřídal Gaudí a&nbsp;zcela změnil architektonickou koncepci.  Monumentální bazilika propojuje přírodní organické formy s&nbsp;pokročilou geometrií přímkových ploch, symbolickým sochařským programem tří fasád a&nbsp;promyšlenou prací se světlem v&nbsp;pětilodním interiéru. \u003C/p>",locationHtml:"\u003Cdetails data-section-id=\"history-construction\" data-section-kind=\"narrative\">\n\u003Csummary>Historické souvislosti, vznik a&nbsp;výstavba\u003C/summary>\n\u003Cdiv>\u003Cp>Základní podnět k&nbsp;výstavbě chrámu vzešel od knihkupce Josepa Marii Bocabelly, zakladatele Duchovního sdružení ctitelů svatého Josefa, který chtěl po návštěvě Loreta vytvořit expiační chrám financovaný výhradně z&nbsp;milodarů. Sdružení zakoupilo pozemek o&nbsp;rozloze 12&nbsp;800&nbsp;m² v&nbsp;tehdy nezastavěné čtvrti Sant Martí de Provençals a&nbsp;základní kámen byl položen 19.&nbsp;března&nbsp;1882.\u003C/p>\n\u003Cp>Původní diecézní architekt Francisco de Paula del Villar navrhl novogotickou trojlodní baziliku. Po sporech ohledně nákladů však v&nbsp;roce 1883 odstoupil a&nbsp;vedení stavby převzal jednatřicetiletý Antoni Gaudí, který rozpracoval radikálně novou vizi monumentálního chrámu. V&nbsp;roce 1909 postavil na staveništi provizorní farní školu ze tří vrstev cihel s&nbsp;vlnitými konoidními skořepinami, kterou později ocenil i&nbsp;Le Corbusier.\u003C/p>\n\u003Cp>Od roku 1914 se Gaudí věnoval výhradně chrámu a&nbsp;poslední měsíce života bydlel přímo ve své dílně. Po jeho tragické smrti v&nbsp;červnu 1926 byl pohřben v&nbsp;kryptě. V&nbsp;červenci 1936 radikálové vypálili kryptu a&nbsp;zničili původní sádrové modely, které jeho spolupracovníci v&nbsp;čele s&nbsp;Domènecem Sugrañesem a&nbsp;Lluísem Bonetem po válce pracně zrekonstruovali z&nbsp;úlomků.\u003C/p>\n\u003Cp>Roku 2010 papež Benedikt XVI. interiér vysvětil a&nbsp;povýšil chrám na baziliku minor. V&nbsp;roce 2019 získala stavba po 137&nbsp;letech oficiální městskou licenci a&nbsp;od roku 2012 řídí práce hlavní architekt Jordi Faulí.\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"structure-geometry-materials\" data-section-kind=\"narrative\">\n\u003Csummary>Konstrukční principy, geometrie a&nbsp;materiály sloupů\u003C/summary>\n\u003Cdiv>\u003Cp>Gaudí klenby, okna i&nbsp;věže sestavil z&nbsp;přímkových ploch — hyperboloidů, paraboloidů, helikoidů a&nbsp;konoidů. Tyto geometrické tvary převzal ze struktur živé přírody a&nbsp;využil jejich vysokou tuhost při minimální spotřebě materiálu, čímž nahradil tradiční gotický systém vnějších opěrných oblouků.\u003C/p>\n\u003Cp>Dříky sloupů využívají princip dvojitého šroubovitého kroucení se dvěma protiběžnými závity. Průřez sloupu se při stoupání plynule proměňuje z&nbsp;polygonální základny přes hvězdicový tvar až po kruhový profil pod hlavicí, kde se sloup větví jako koruna stromu a&nbsp;vynáší klenby.\u003C/p>\n\u003Cp>Nosné sloupy jsou odstupňovány podle přísné hierarchie zatížení a&nbsp;tvrdosti kamene. Čtyři hlavní sloupy v&nbsp;křížení transeptu nesou váhu centrálních věží a&nbsp;tvoří je červený porfyr dovezený z&nbsp;Íránu, nejtvrdší hornina na stavbě. Sloupy hlavní lodi tvoří tmavý čedič a&nbsp;šedá žula, zatímco sloupy bočních lodí vznikly ze sedimentárního pískovce z&nbsp;hory Montjuïc.\u003C/p>\n\u003Cp>Protože Gaudího prostorové přímkové plochy nebylo možné zakreslit běžnými metodami, zavedla stavební huť koncem osmdesátých let 20.&nbsp;století pokročilý letecký parametrický software pro 3D modelování. Věže evangelistů a&nbsp;Ježíše Krista tak vznikají z&nbsp;předpjatých kamenných panelů stahovaných vnitřními nerezovými táhly.\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"facades-sculptures\" data-section-kind=\"narrative\">\n\u003Csummary>Průčelí Narození Páně, Umučení a&nbsp;Slávy\u003C/summary>\n\u003Cdiv>\u003Cp>Trojice monumentálních fasád představuje tři zásadní etapy pozemského a&nbsp;nebeského života Ježíše Krista — Narození, Umučení a&nbsp;Zmrtvýchvstání se Slávou.\u003C/p>\n\u003Cp>Fasáda Narození Páně (\u003Cem>Façana del Naixement\u003C/em>) vznikala v&nbsp;letech 1893–1936 z&nbsp;velké části pod osobním Gaudího dohledem. Vyniká naturalistickou výzdobou plnou rostlinných motivů a&nbsp;výjevů z&nbsp;Kristova dětství pod třemi portály Víry, Naděje a&nbsp;Lásky. K&nbsp;dosažení maximální věrnosti soch vyvinul Gaudí se sochaři Llorençem Matamalou a&nbsp;Carlesem Manim metodu přímého snímání sádrových forem ze živých modelů, dělníků i&nbsp;zvířat. Štít korunuje zelený cypřiš ze skleněné mozaiky jako symbol věčného Stromu života.\u003C/p>\n\u003Cp>Fasáda Umučení (\u003Cem>Façana de la Passió\u003C/em>) na protilehlé jihozápadní straně začala vznikat roku 1954 jako strohý a&nbsp;dramatický protiklad s&nbsp;kostrou z&nbsp;lomených sloupů. V&nbsp;letech 1987–2009 vytvořil sochař Josep Maria Subirachs expresivní sochařský soubor s&nbsp;hranatými liniemi včetně magického čtverce se stálým součtem 33.\u003C/p>\n\u003Cp>Monumentální vstupy doplňují bronzová vrata: na fasádě Narození s&nbsp;listovím a&nbsp;hmyzem od Etsura Sotaa, na fasádě Umučení s&nbsp;katalánským textem pašijí a&nbsp;na fasádě Slávy s&nbsp;modlitbou Otčenáš v&nbsp;padesáti světových jazycích včetně češtiny od Subirachse.\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"interior-towers-light\" data-section-kind=\"narrative\">\n\u003Csummary>Vnitřní prostor, věže a&nbsp;světelná kompozice\u003C/summary>\n\u003Cdiv>\u003Cp>Půdorys baziliky tvoří latinský kříž s&nbsp;pěti podélnými loděmi, trojlodním transeptem a&nbsp;apsidou se sedmi kaplemi. Vnitřní prostor měří na délku 90&nbsp;metrů, klenba centrální lodi stoupá do výšky 45&nbsp;metrů a&nbsp;křížení se tyčí do 60&nbsp;metrů.\u003C/p>\n\u003Cp>Celkový komplex korunuje 18 plánovaných věží: dvanáct apoštolských na fasádách (98–120&nbsp;m), čtyři věže evangelistů (135&nbsp;m), věž Panny Marie (138&nbsp;m) se svítící dvanácticípou hvězdou a&nbsp;ústřední věž Ježíše Krista (172,5&nbsp;m) s&nbsp;křížem. Výšku 172,5&nbsp;metru určil Gaudí záměrně, aby stavba nepřevýšila kopec Montjuïc, neboť dílo člověka nemá předčit dílo stvořené Bohem. Do svislých otvorů věží vložil kamenné lamely \u003Cem>abat-sons\u003C/em>, které chrání vnitřek před deštěm a&nbsp;usměrňují zvuk zvonů do ulic města.\u003C/p>\n\u003Cp>Světelné pojetí navrhl sklářský mistr Joan Vila-Grau v&nbsp;letech 1999–2022 v&nbsp;souladu s&nbsp;Gaudího teologií světla. Východní okna na fasádě Narození rozehrávají studené tóny modré a&nbsp;zelené barvy ranního jitra, zatímco západní okna na fasádě Umučení zaplavují chrám v&nbsp;odpoledním slunci hřejivou září žlutých, oranžových a&nbsp;rubínových tónů.\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"crypt-tombs\" data-section-kind=\"narrative\">\n\u003Csummary>Neogotická krypta a&nbsp;hrobka Antoniho Gaudího\u003C/summary>\n\u003Cdiv>\u003Cp>Podzemní neogotická krypta představuje nejstarší stavební část chrámu, vybudovanou v&nbsp;letech 1882–1889. Stavbu zahájil diecézní architekt Francisco de Paula del Villar s&nbsp;věncem sedmi polygonálních kaplí, po němž převzal projekt v&nbsp;listopadu 1883 Antoni Gaudí. Gaudí zvýšil klenby o&nbsp;více než dva metry, což umožnilo prolomit rozměrná obvodová okna ústící do příkopu a&nbsp;zajistit přirozené denní světlo i&nbsp;stálé provětrávání.\u003C/p>\n\u003Cp>Ústřední polychromovaný svorník klenby přímo nad hlavním oltářem nese kamenný reliéf Zvěstování Panny Marie, který v&nbsp;roce 1892 vytesal sochař Joan Flotats. Masivní pískovcové sloupy zdobí vyřezávané hlavice s&nbsp;motivy vinných listů a&nbsp;akantu a&nbsp;podlahu kryje římská kamenná mozaika s&nbsp;geometrickými vzory.\u003C/p>\n\u003Cp>V&nbsp;kapli Panny Marie Karmelské (\u003Cem>Capella del Carme\u003C/em>) se nachází hrobka Antoniho Gaudího, kde architekt odpočívá od pohřbu v&nbsp;červnu 1926 pod leštěnou mramorovou deskou. V&nbsp;protilehlé kapli Krista a&nbsp;svatého Josefa spočívají ostatky zakladatele chrámu Josepa Marii Bocabelly. V&nbsp;roce 2005 byla krypta společně s&nbsp;fasádou Narození Páně zapsána na Seznam světového dědictví UNESCO.\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"presbytery-baldachin-organ\" data-section-kind=\"narrative\">\n\u003Csummary>Presbytář, zavěšený baldachýn a&nbsp;chrámové varhany\u003C/summary>\n\u003Cdiv>\u003Cp>Vyvýšený presbytář v&nbsp;apsidě hlavní lodi tvoří liturgické centrum celé baziliky. Oltářní stůl tvoří jediný monolitický blok ušlechtilého červeného porfyru dovezeného z&nbsp;Íránu, který vyniká mimořádnou tvrdostí a&nbsp;vysokým leskem.\u003C/p>\n\u003Cp>Přímo nad oltářem se vznáší monumentální sedmiboký zavěšený baldachýn o&nbsp;průměru 5&nbsp;metrů, inspirovaný Gaudího řešením pro katedrálu v&nbsp;Palma de Mallorca. Kostra baldachýnu z&nbsp;kovu a&nbsp;pergamenového pláště nese po obvodu padesát závěsných lamp a&nbsp;plastické hrozny vína s&nbsp;obilnými klasy jako symboly eucharistie. Pod vrcholem baldachýnu visí polychromovaná socha ukřižovaného Krista od sochaře Franceska Fajuly z&nbsp;roku 2010, vytvořená podle Gaudího a&nbsp;Maniho anatomického modelu pro dům Casa Batlló.\u003C/p>\n\u003Cp>Hudební doprovod bohoslužeb zajišťují varhany instalované v&nbsp;roce 2010 za chórovými lavicemi od dílny \u003Cem>Blancafort Orgueners de Montserrat\u003C/em> s&nbsp;26&nbsp;rejstříky a&nbsp;1&nbsp;492&nbsp;píšťalami, které tvoří první etapu budoucího velkého varhanního souboru o&nbsp;8&nbsp;000&nbsp;píšťalách. Ambit neboli křížová chodba navíc obepíná baziliku po vnějším obvodu a&nbsp;funguje jako účinná akustická a&nbsp;prachová bariéra chránící interiér před hlukem města.\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"visit-context-2026\" data-section-kind=\"narrative\">\n\u003Csummary>Návštěva v&nbsp;roce stého výročí Gaudího úmrtí 2026\u003C/summary>\n\u003Cdiv>\u003Cp>Celodenní návštěva dne 24.&nbsp;září&nbsp;2026 proběhla v&nbsp;mimořádně slavnostním roce stého výročí úmrtí Antoniho Gaudího (1926–2026), kdy se dokončení chrámu přiblížilo svému historickému vrcholu. Ústřední věž Ježíše Krista dosáhla své plánované výšky 172,5&nbsp;metru a&nbsp;staveniště se připravovalo na finální osazení monumentálního sedmnáctimetrového kříže.\u003C/p>\n\u003Cp>Všechny čtyři věže evangelistů (Lukáše, Marka, Matouše a&nbsp;Jana) v&nbsp;okolí hlavní věže již byly kompletně dokončeny včetně velkolepých mramorových soch tetramorfu od sochaře Xaviera Medina-Campenyho osazených v&nbsp;letech 2022–2023. Hlavní stavební ruch se v&nbsp;roce 2026 přesunul na portál Slávy (\u003Cem>Façana de la Glòria\u003C/em>) podél ulice Carrer de Mallorca, kde probíhaly práce na železobetonových pilířích i&nbsp;intenzivní veřejné debaty o&nbsp;urbanistickém monumentálním schodišti. Návštěvníci tak mohli zažít chrám v&nbsp;okamžiku, kdy jeho vnější silueta poprvé získala zamýšlené pyramidální vyznění s&nbsp;věží Krista dominující celé Barceloně.\u003C/p>\n\u003C/div>\n\u003C/details>",locationOfficialHtml:"\u003Ctable>\n\u003Cthead>\n\u003Ctr>\n\u003Cth align=\"left\">Parametr\u003C/th>\n\u003Cth align=\"left\">Údaj\u003C/th>\n\u003C/tr>\n\u003C/thead>\n\u003Ctbody>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Oficiální název\u003C/th>\n\u003Ctd align=\"left\">Basílica i&nbsp;Temple Expiatori de la Sagrada Família\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Hlavní architekt\u003C/th>\n\u003Ctd align=\"left\">Antoni Gaudí i&nbsp;Cornet (1852–1926; vedení stavby 1883–1926); původní autor projektu Francisco de Paula del Villar y&nbsp;Lozano (1882–1883) \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Klíčoví spolupracovníci\u003C/th>\n\u003Ctd align=\"left\">Domènec Sugrañes i&nbsp;Gras, Francesc de Paula Quintana, Isidre Puig i&nbsp;Boada, Lluís Bonet i&nbsp;Garí, Jordi Bonet i&nbsp;Armengol a&nbsp;Jordi Faulí i&nbsp;Oller; sochaři Llorenç Matamala, Josep Maria Subirachs a&nbsp;Etsuro Sotoo; autor vitráží Joan Vila-Grau \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Původní stavebník\u003C/th>\n\u003Ctd align=\"left\">Josep Maria Bocabella i&nbsp;Verdaguer a&nbsp;Duchovní sdružení ctitelů svatého Josefa (\u003Cem>Associació Espiritual de Devots de Sant Josep\u003C/em>)\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Zahájení stavby\u003C/th>\n\u003Ctd align=\"left\">19.&nbsp;března&nbsp;1882\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Architektonický styl\u003C/th>\n\u003Ctd align=\"left\">katalánský modernismus (\u003Cem>Modernisme\u003C/em>), organická architektura, neogotika \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Lokalita a&nbsp;adresa\u003C/th>\n\u003Ctd align=\"left\">Carrer de Mallorca 401, 08013 Barcelona (Eixample)\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Rozměry\u003C/th>\n\u003Ctd align=\"left\">půdorys baziliky přibližně 4&nbsp;500&nbsp;m² na pozemku o&nbsp;rozloze přibližně 12&nbsp;800&nbsp;m²; hlavní loď 90&nbsp;m dlouhá, 60&nbsp;m široká a&nbsp;45&nbsp;m vysoká; plánováno 18 věží, z&nbsp;nichž věž Ježíše Krista má dosáhnout 172,5&nbsp;m, věž Panny Marie 138&nbsp;m a&nbsp;věže evangelistů 135&nbsp;m \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Současné využití\u003C/th>\n\u003Ctd align=\"left\">římskokatolický chrám, od roku 2010 bazilika minor\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Památková ochrana\u003C/th>\n\u003Ctd align=\"left\">historicko-umělecká památka Španělska (dekret 1794/1969; BIC RI-51-0003813), kulturní památka národního zájmu Katalánska (BCIN č.&nbsp;53-MH) a&nbsp;součást zápisu UNESCO „Díla Antoniho Gaudího“: fasáda Narození Páně (320bis-005) a&nbsp;krypta (320bis-006) \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Oficiální web\u003C/th>\n\u003Ctd align=\"left\">\u003Ca href=\"https://sagradafamilia.org/\">sagradafamilia.org\u003C/a>\u003C/td>\n\u003C/tr>\n\u003C/tbody>\n\u003C/table>\n",aliases:["Basílica de la Sagrada Família","Temple Expiatori de la Sagrada Família","Sagrada Família","Svatá rodina"],heroImage:{src:"/travel-guide/teasers/sagrada-familia/hero.jpg",alt:"Detail kamenného průčelí baziliky Sagrada Família"},audio:[{section:"lead",label:"Úvod",identity:"ce9609cd857123b249e898b32e8e949267a64a30fff2f102e80f7d87ec36d75b",src:"/travel-guide/audio/sagrada-familia/ce9609cd857123b249e898b32e8e949267a64a30fff2f102e80f7d87ec36d75b.m4a"},{section:"history-construction",label:"Historické souvislosti, vznik a výstavba",identity:"238b9016c1bd7389b2afe4b739193307d72b2ffd7d09434064eaa04e3a2cc595",src:"/travel-guide/audio/sagrada-familia/238b9016c1bd7389b2afe4b739193307d72b2ffd7d09434064eaa04e3a2cc595.m4a"},{section:"structure-geometry-materials",label:"Konstrukční principy, geometrie a materiály sloupů",identity:"2f8648bb494b0f38f203fa5d1e66659379861e0f669ab6a81d12dad217f93411",src:"/travel-guide/audio/sagrada-familia/2f8648bb494b0f38f203fa5d1e66659379861e0f669ab6a81d12dad217f93411.m4a"},{section:"facades-sculptures",label:"Průčelí Narození Páně, Umučení a Slávy",identity:"08d0ed7312976a1610a87303e60b4a50ca522918c9cae808bcd145f0ea90965b",src:"/travel-guide/audio/sagrada-familia/08d0ed7312976a1610a87303e60b4a50ca522918c9cae808bcd145f0ea90965b.m4a"},{section:"interior-towers-light",label:"Vnitřní prostor, věže a světelná kompozice",identity:"d0f0fc8571770ec288a6f984be2be245cbf437b805ac7281819abe00f911c172",src:"/travel-guide/audio/sagrada-familia/d0f0fc8571770ec288a6f984be2be245cbf437b805ac7281819abe00f911c172.m4a"},{section:"crypt-tombs",label:"Neogotická krypta a hrobka Antoniho Gaudího",identity:"3d76f79b11a35f126ef06604abed5ec9d58a049d6e1e3d95213024dbb3b54e06",src:"/travel-guide/audio/sagrada-familia/3d76f79b11a35f126ef06604abed5ec9d58a049d6e1e3d95213024dbb3b54e06.m4a"},{section:"presbytery-baldachin-organ",label:"Presbytář, zavěšený baldachýn a chrámové varhany",identity:"607355dc3e3e8b9cfb74c918f0b930220d95806f3711fd322af11f5cf29fced2",src:"/travel-guide/audio/sagrada-familia/607355dc3e3e8b9cfb74c918f0b930220d95806f3711fd322af11f5cf29fced2.m4a"},{section:"visit-context-2026",label:"Návštěva v roce stého výročí Gaudího úmrtí 2026",identity:"be7a3857f67042982fa43cad0a94c7052eb9f65658baf933b7b682eaf5a538d9",src:"/travel-guide/audio/sagrada-familia/be7a3857f67042982fa43cad0a94c7052eb9f65658baf933b7b682eaf5a538d9.m4a"}],source:"main"},{id:"img0435",type:"image",src:"IMG_0435.JPEG",alt:"Sagrada Família, Barcelona",title:"",width:6048,height:8064,sizeMB:8.37,aspectRatio:"portrait-3-4",placeholder:"blurs/IMG_0435.png",placeholderColor:"rgb(168,152,136)",analysis:{aestheticScore:37.18585727023707,sharpness:100,qualityBucket:"poor",phash:"3c70524b49653034"},exif:{date:"2026-09-24T10:18:48",releaseDate:"2026-09-24T10:18:48",author:"Cebreus",location:"Sagrada Família",sublocation:"Sagrada Família",city:"Barcelona",latitude:41.403461,longitude:2.174583,orientat ge/avif",path:"/images/previews-avif/IMG_0439.avif",width:370},{variant:"xl",type:"image/webp",path:"/images/previews-xl-webp/IMG_0439.webp",width:534},{variant:"xl",type:"image/jpeg",path:"/images/previews-xl/IMG_0439.jpeg",width:534},{variant:"xl",type:"image/avif",path:"/images/previews-xl-avif/IMG_0439.avif",width:534},{variant:"detail",type:"image/jpeg",path:"/images/details/IMG_0439.jpeg",width:960,height:1280},{variant:"fallback",type:"image/jpeg",path:"/images/previews-xxs/IMG_0439.jpeg",width:190,height:127},{variant:"admin_thumb",type:"image/jpeg",path:"/images/previews-admin/IMG_0439.jpeg",width:401,height:534}],rating:5,people:[]},{id:"img0448",type:"image",src:"IMG_0448.JPEG",alt:"AB Sagrada Familia - Gaudí, Barcelona",title:"",width:5392,height:5392,sizeMB:4.6,aspectRatio:"square",placeholder:"blurs/IMG_0448.png",placeholderColor:"rgb(184,184,168)",analysis:{aestheticScore:81.08880531778183,sharpness:47,qualityBucket:"good",phash:"8c0701293c1e3f2f"},exif:{date:"2026-09-24T12:24:23",releaseDate:"2026-09-24T12:24:23",author:"Cebreus",location:"AB Sagrada Familia - Gaudí",sublocation:"AB Sagrada Familia - Gaudí",city:"Barcelona",latitude:41.407161,longitude:2.176344,orientation:1,country:"Španělsko",countryCode:"ESP",state:"Katalánsko"},author:"Cebreus",authorSlug:"cebreus",location:"AB Sagrada Familia - Gaudí",city:"Barcelona",googleMapsUrl:"https://www.google.com/maps/search/?api=1&query=41.407161,2.176344",date:"2026-09-24T12:24:23",sources:[{variant:"default",type:"image/webp",path:"/images/previews-webp/IMG_0448.webp",width:370},{variant:"default",type:"image/jpeg",path:"/images/previews/IMG_0448.jpeg",width:370},{variant:"default",type:"image/avif",path:"/images/previews-avif/IMG_0448.avif",width:370},{variant:"xl",type:"image/webp",path:"/images/previews-xl-webp/IMG_0448.webp",width:534},{variant:"xl",type:"image/jpeg",path:"/images/previews-xl/IMG_0448.jpeg",width:534},{variant:"xl",type:"image/avif",path:"/images/previews-xl-avif/IMG_0448.avif",width:534},{variant:"detail",type:"image/jpeg",path:"/images/details/IMG_0448.jpeg",width:1280,height:1280},{variant:"fallback",type:"image/jpeg",path:"/images/previews-xxs/IMG_0448.jpeg",width:190,height:127},{variant:"admin_thumb",type:"image/jpeg",path:"/images/previews-admin/IMG_0448.jpeg",width:534,height:534}],people:[]},{id:"loc-la-pedrera-casa-mila-main-2026-09-24t210537",type:"separator",location:"La Pedrera - Casa Milà",city:"Barcelona",hasPhotos:true,startDate:"2026-09-24T21:05:37",endDate:"2026-09-24T22:01:00",storyTitle:"Casa Milà (La Pedrera)",story:"\u003Cp class=\"lead\" data-section-id=\"lead\">Dům Casa Milà, v&nbsp;katalánském prostředí zvaný La Pedrera neboli Kamenolom, představuje poslední dokončenou světskou stavbu Antoniho Gaudího předtím, než se plně zasvětil chrámu Sagrada Família. Nárožní činžovní palác na prestižní třídě Passeig de Gràcia stírá hranici mezi stavitelstvím a&nbsp;monumentální sochařskou plastikou. Zvlněná vápencová fasáda, kované mříže ze starého železa, podkroví z&nbsp;cihelných oblouků i&nbsp;fantaskní střešní krajina tvoří jednotný organismus vrcholného modernismu.\u003C/p>\u003Cdetails data-section-id=\"history-origin\" data-section-kind=\"narrative\">\n\u003Csummary>Historie a&nbsp;spory se stavebním úřadem\u003C/summary>\n\u003Cdiv>\u003Cp>Pozemek o&nbsp;rozloze 1&nbsp;835&nbsp;m² na nároží Passeig de Gràcia a&nbsp;Carrer de Provença zakoupila v&nbsp;červnu 1905 paní Roser Segimon. Společně s&nbsp;druhým manželem, průmyslníkem a&nbsp;poslancem Perem Milà, oslovili Antoniho Gaudího s&nbsp;požadavkem na reprezentativní rodinné sídlo s&nbsp;luxusními nájemními byty.\u003C/p>\n\u003Cp>Projekt byl městskému úřadu předložen v&nbsp;únoru 1906. Během realizace však stavba opakovaně narážela na stavební regulativy čtvrti Eixample: překročila povolenou kubaturu o&nbsp;více než 4&nbsp;000&nbsp;m³, podkroví přesáhlo výškový limit a&nbsp;jeden z&nbsp;hlavních kamenných pilířů zasáhl do uliční čáry chodníku. Spor vyřešila městská komise 20.&nbsp;prosince&nbsp;1909, kdy uznala mimořádnou uměleckou hodnotu díla a&nbsp;udělila mu status monumentální stavby nepodléhající běžným vyhláškám, i&nbsp;když stavebníkům vyměřila pokutu 100&nbsp;000&nbsp;peset.\u003C/p>\n\u003Cp>Stavba vyvolala v&nbsp;dobovém tisku vlnu posměchu; satirické časopisy přirovnávaly dům k&nbsp;hangáru pro vzducholodě či jeskynnímu doupěti, odkud vzešlo posměšné označení La Pedrera neboli Kamenolom. Skutečný bílý prach vytvářeli kameníci, kteří surové vápencové bloky tesali přímo na chodníku. Kolaudaci celé budovy potvrdil Gaudí 31.&nbsp;října&nbsp;1912.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"construction-facade\" data-section-kind=\"narrative\">\n\u003Csummary>Konstrukční systém a&nbsp;materiály fasády\u003C/summary>\n\u003Cdiv>\u003Cp>Nosnou konstrukci budovy tvoří prostorový skelet z&nbsp;nýtovaných ocelových sloupů, válcovaných nosníků profilu I a&nbsp;kamenných pilířů. Gaudí tím v&nbsp;obytném stavitelství předběhl moderní princip volného půdorysu, v&nbsp;němž absence vnitřních nosných zdí umožňuje variabilní členění bytů bez jakéhokoliv zásahu do statiky domu. Vnější kamenná fasáda funguje jako samonosná zavěšená clona, ukotvená k&nbsp;vnitřní kostře pomocí ocelových táhel a&nbsp;zakřivených konzol.\u003C/p>\n\u003Cp>Fasádu tvoří dva druhy katalánského vápence: spodní nosné pilíře v&nbsp;přízemí a&nbsp;mezaninu jsou vyzděny z&nbsp;tvrdého biohermního vápence z&nbsp;pohoří Garraf u&nbsp;Sitges s&nbsp;mimořádnou pevností v&nbsp;tlaku. Vyšší podlaží, římsy a&nbsp;okenní špalety jsou naopak vytesány z&nbsp;jemnějšího nažloutlého vápence z&nbsp;lomů u&nbsp;Vilafranca del Penedès, který kameníkům umožnil plynulé sochařské tvarování přímo na lešení.\u003C/p>\n\u003Cp>Balkonová zábradlí a&nbsp;vstupní brány vytvořil architekt Josep Maria Jujol z&nbsp;recyklovaných železných pásů, plechů, obručí a&nbsp;řetězů jako rané prostorové asambláže spojované kovářskými nýty přímo na staveništi.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"interior-layout\" data-section-kind=\"narrative\">\n\u003Csummary>Dispozice bytů, dělení místností a&nbsp;provoz kuchyní\u003C/summary>\n\u003Cdiv>\u003Cp>Přirozené osvětlení a&nbsp;větrání budovy zajišťují dvě velká vnitřní nádvoří: válcové nádvoří o&nbsp;průměru dvanácti metrů se obrací k&nbsp;bulváru Passeig de Gràcia, zatímco druhé nádvoří při ulici Provença má půdorys eliptický. Jednotlivé byty byly rozvrženy v&nbsp;půlkruzích kolem obou dvorů, což jim zaručovalo oboustrannou orientaci fasád.\u003C/p>\n\u003Cp>Každé patro zahrnovalo tři až čtyři rozlehlé bytové jednotky o&nbsp;ploše 300–400&nbsp;m². Díky skeletové konstrukci neměly byty pevně určený počet místností, protože volný půdorys umožňoval variabilní uspořádání prostoru podle přání nájemců. Plocha se dělila na reprezentační zónu obrácenou do ulice (salón, jídelna, knihovna), soukromou zónu v&nbsp;klidném středním traktu (ložnice a&nbsp;kabinety) a&nbsp;servisní zázemí při vnitřních dvorech.\u003C/p>\n\u003Cp>Kuchyně fungovaly jako samostatné technologické centrum domácnosti. Umístění u&nbsp;dvorů zajišťovalo rychlý odvod tepla a&nbsp;par skrze digestoře napojené na svislé kouřovody ústící do komínů. Stěny pokrývaly omyvatelné keramické kachle a&nbsp;pracovní plochy tvořily masivní mramorové dřezy s&nbsp;přímou vazbou na větranou spíž, služební schodiště i&nbsp;nákladní výtah.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"technical-infrastructure\" data-section-kind=\"narrative\">\n\u003Csummary>Technická infrastruktura a&nbsp;hygiena\u003C/summary>\n\u003Cdiv>\u003Cp>Dům integroval pokročilé technické systémy, které představovaly v&nbsp;barcelonském rezidenčním stavitelství počátku 20.&nbsp;století mimořádný pokrok. Primární vertikální dopravu pro nájemníky zajišťovala dvojice elektrických výtahů ústících u&nbsp;vnitřních dvorů, odkud se vstupovalo přímo do předsíní bytů. Rodina Milà disponovala navíc soukromým monumentálním schodištěm vedoucím z&nbsp;vestibulu přímo do panského patra.\u003C/p>\n\u003Cp>Užitkovou vodu čerpala mechanická čerpadla do velkoobjemových nádrží skrytých ve střešních schodišťových věžích, odkud proudila samospádem do celého domu při stabilním gravitačním tlaku. Byty disponovaly moderními koupelnami se smaltovanými vanami, bidetem a&nbsp;splachovacími toaletami se zápachovými uzávěrkami.\u003C/p>\n\u003Cp>V&nbsp;suterénu byla instalována centrální teplovodní kotelna napájející litinové článkové radiátory v&nbsp;jednotlivých pokojích. Všechny obytné i&nbsp;servisní místnosti měly přímé denní světlo z&nbsp;ulic či dvorů, protože Gaudí odmítl tehdy obvyklé tmavé světlíky. K&nbsp;regulaci slunečního záření sloužily dřevěné okenice s&nbsp;naklápěcími lamelami zapuštěné do hlubokých vápencových špalet.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"craft-decor\" data-section-kind=\"narrative\">\n\u003Csummary>Umělecké řemeslo, štuky a&nbsp;dlažba\u003C/summary>\n\u003Cdiv>\u003Cp>Výtvarná výzdoba domu harmonicky propojuje surové konstrukční materiály s&nbsp;jemnou sochařskou a&nbsp;řemeslnou prací. V&nbsp;panském patře a&nbsp;vybraných bytech vytvořil Josep Maria Jujol reliéfní sádrové stropy s&nbsp;plynulými přechody mezi stěnami a&nbsp;podhledy, do nichž přímo na lešení vtlačoval abstraktní motivy i&nbsp;kaligrafické nápisy. Stěny obou vstupních vestibulů a&nbsp;dvorů pokrývají nástěnné malby a&nbsp;iluzivní motivy od malířů Iu Pascuala a&nbsp;Aleixe Clapése.\u003C/p>\n\u003Cp>Pro haly a&nbsp;chodby navrhl Gaudí slavnou šestiúhelníkovou lisovanou cementovou dlažbu (katalánsky \u003Cem>panot Gaudí\u003C/em>). Tyto dlaždice s&nbsp;reliéfy mořské chobotnice, hvězdice a&nbsp;medúzy vyrobila firma Escofet; při sesazení tří kusů vytvářejí plynulý nekonečný vzor.\u003C/p>\n\u003Cp>Veškeré interiérové dveře, obložení a&nbsp;okenní rámy byly zhotoveny z&nbsp;masivní borovice a&nbsp;dubu bez ostrých hran. Kliky dveří, madla a&nbsp;okenní kličky navrhl Gaudí z&nbsp;lité mosazi a&nbsp;bronzu, přičemž jejich anatomické tvary modeloval přímo otiskem sevřené dlaně do měkké sádry.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"roof-warriors-attic\" data-section-kind=\"narrative\">\n\u003Csummary>Půdní prostor a&nbsp;sochařská krajina střechy\u003C/summary>\n\u003Cdiv>\u003Cp>Půdní prostor nese 270&nbsp;parabolických oblouků proměnlivé výšky z&nbsp;tenkých pálených cihel kladených naplocho do sádry tradiční technikou katalánské klenby (\u003Cem>volta catalana\u003C/em>). Tvary oblouků vyměřil stavitel Josep Bayó s&nbsp;Gaudím pomocí zavěšeného řetězu přeneseného na šablony. Podkroví sloužilo jako prádelna a&nbsp;sušárna a&nbsp;současně vytvářelo izolační klimatickou vrstvu chránící byty před letním horkem.\u003C/p>\n\u003Cp>Plasticky zvlněná střešní terasa integruje funkční prvky do fantastických sochařských forem: šest schodišťových nástaveb (katalánsky \u003Cem>badalots\u003C/em>) se zásobníky vody zakončují kříže, zatímco skupiny komínů s&nbsp;helmicovými hlavicemi tvoří slavnou Zahradu válečníků.  Dvě samostatné věže zajišťují větrání vnitřních traktů a&nbsp;podkroví.\u003C/p>\n\u003Cp>Povrch střešních prvků pokrývá mozaika \u003Cem>trencadís\u003C/em> z&nbsp;úlomků keramických dlaždic, bílého mramoru a&nbsp;zeleného skla z&nbsp;vyřazených lahví od šampaňského. Gaudí navíc terasu navrhl s&nbsp;promyšlenými průhledy: jeden ze schodišťových oblouků funguje jako záměrný kamenný rám, který návštěvníkům otevírá přímý pohled na vzdálené věže chrámu Sagrada Família.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"garage-modern-era\" data-section-kind=\"narrative\">\n\u003Csummary>Podzemní garáž a&nbsp;novodobé proměny budovy\u003C/summary>\n\u003Cdiv>\u003Cp>Gaudí navrhl suterén domu jako podzemní garáž pro kočáry a&nbsp;automobily s&nbsp;točitými rampami klesajícími z&nbsp;vnitřních dvorů. Šlo o&nbsp;vůbec první podzemní parkoviště pro osobní automobily v&nbsp;barcelonském bytovém domě. Gaudí v&nbsp;manévrovacím prostoru zcela vyloučil mezilehlé sloupy, aby usnadnil pohyb vozidel.\u003C/p>\n\u003Cp>V&nbsp;roce 1946 prodala Roser Segimon nemovitost realitní společnosti Immobiliària Provença, avšak v&nbsp;panském patře si ponechala doživotní užívací právo až do své smrti v&nbsp;roce 1964. V&nbsp;letech 1953–1955 upravil architekt Francisco Juan Barba Corsini půdní prostor na třináct moderních podkrovních bytů, kde využil Gaudího cihlové oblouky jako přirozené prostorové předěly.\u003C/p>\n\u003Cp>V&nbsp;prosinci 1986 zakoupila zchátralý dům spořitelna Caixa Catalunya a&nbsp;zahájila rozsáhlou památkovou obnovu. Restaurátorský tým odstranil novodobé vestavby v&nbsp;podkroví a&nbsp;obnovil původní volný prostor oblouků pro stálou expozici Espai Gaudí. Dnes objekt spravuje Fundació Catalunya La Pedrera pro muzejní a&nbsp;kulturní účely, přičemž dva byty zůstávají trvale obývány soukromými nájemníky.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"visit-context-2026\" data-section-kind=\"narrative\">\n\u003Csummary>Večerní návštěva a&nbsp;režim provozu v&nbsp;roce 2026\u003C/summary>\n\u003Cdiv>\u003Cp>Návštěva Casa Milà dne 24.&nbsp;září&nbsp;2026 v&nbsp;čase od 21.05 do 22.01 proběhla v&nbsp;rámci nočního zážitkového okruhu La Pedrera Night Experience. Noční režim nabídl zcela odlišné vnímání stavby: po vstupu přes osvětlený kruhový vestibul s&nbsp;nástěnnými malbami a&nbsp;krátkém průchodu podkrovní expozicí Espai Gaudí vystoupala skupina přímo na střešní terasu.\u003C/p>\n\u003Cp>Vrcholem večera byla multimediální projekce promítaná přímo na vápencové a&nbsp;mozaikové plochy schodišťových věží a&nbsp;komínových hlavic Zahrady válečníků za doprovodu prostorové hudby. Návštěvníci tak mohli sledovat genezi Gaudího přírodních inspirací od mořských vln přes krystaly až po hvězdnou oblohu, orámovanou nočními světly barcelonské třídy Passeig de Gràcia.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"facts\" data-section-kind=\"facts\">\n\u003Csummary>Základní údaje\u003C/summary>\n\u003Cdiv>\u003Ctable>\n\u003Cthead>\n\u003Ctr>\n\u003Cth align=\"left\">Parametr\u003C/th>\n\u003Cth align=\"left\">Údaj\u003C/th>\n\u003C/tr>\n\u003C/thead>\n\u003Ctbody>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Oficiální název\u003C/th>\n\u003Ctd align=\"left\">Casa Milà (vžité označení La Pedrera) \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Hlavní architekt\u003C/th>\n\u003Ctd align=\"left\">Antoni Gaudí i&nbsp;Cornet (1852–1926)\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Klíčoví spolupracovníci\u003C/th>\n\u003Ctd align=\"left\">Josep Maria Jujol (kované prvky a&nbsp;štuky), Domènec Sugrañes, Josep Canaleta (asistence), Josep Bayó i&nbsp;Font (stavitel) \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Původní stavebník\u003C/th>\n\u003Ctd align=\"left\">Pere Milà i&nbsp;Camps a&nbsp;Roser Segimon i&nbsp;Artells \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Doba výstavby\u003C/th>\n\u003Ctd align=\"left\">1906–1912 (zahájení únor 1906, kolaudace 31.&nbsp;října&nbsp;1912) \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Architektonický styl\u003C/th>\n\u003Ctd align=\"left\">katalánský modernismus (\u003Cem>Modernisme\u003C/em>), organická architektura\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Lokalita a&nbsp;adresa\u003C/th>\n\u003Ctd align=\"left\">Passeig de Gràcia 92 / Carrer de Provença 261–265, 08008 Barcelona, Španělsko\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Rozměry a&nbsp;plocha\u003C/th>\n\u003Ctd align=\"left\">parcela 1&nbsp;835&nbsp;m², 9&nbsp;úrovní (suterén, přízemí, mezanin, panské patro, 4&nbsp;patra bytů, půda, střecha) \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Současné využití a&nbsp;vlastník\u003C/th>\n\u003Ctd align=\"left\">Fundació Catalunya La Pedrera (kulturní centrum a&nbsp;muzeum); 2&nbsp;trvale obývané byty\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Památková ochrana\u003C/th>\n\u003Ctd align=\"left\">BCIN (kód památky IPA-77 / BCIN 28-MH); Seznam světového dědictví UNESCO (ref. 320) \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Oficiální web\u003C/th>\n\u003Ctd align=\"left\">\u003Ca href=\"https://www.lapedrera.com/\">lapedrera.com\u003C/a>\u003C/td>\n\u003C/tr>\n\u003C/tbody>\n\u003C/table>\n\u003C/div>\n\u003C/details>",locationId:"casa-mila",locationLeadHtml:"\u003Cp class=\"lead\" data-section-id=\"lead\">Dům Casa Milà, v&nbsp;katalánském prostředí zvaný La Pedrera neboli Kamenolom, představuje poslední dokončenou světskou stavbu Antoniho Gaudího předtím, než se plně zasvětil chrámu Sagrada Família. Nárožní činžovní palác na prestižní třídě Passeig de Gràcia stírá hranici mezi stavitelstvím a&nbsp;monumentální sochařskou plastikou. Zvlněná vápencová fasáda, kované mříže ze starého železa, podkroví z&nbsp;cihelných oblouků i&nbsp;fantaskní střešní krajina tvoří jednotný organismus vrcholného modernismu.\u003C/p>",locationHtml:"\u003Cdetails data-section-id=\"history-origin\" data-section-kind=\"narrative\">\n\u003Csummary>Historie a&nbsp;spory se stavebním úřadem\u003C/summary>\n\u003Cdiv>\u003Cp>Pozemek o&nbsp;rozloze 1&nbsp;835&nbsp;m² na nároží Passeig de Gràcia a&nbsp;Carrer de Provença zakoupila v&nbsp;červnu 1905 paní Roser Segimon. Společně s&nbsp;druhým manželem, průmyslníkem a&nbsp;poslancem Perem Milà, oslovili Antoniho Gaudího s&nbsp;požadavkem na reprezentativní rodinné sídlo s&nbsp;luxusními nájemními byty.\u003C/p>\n\u003Cp>Projekt byl městskému úřadu předložen v&nbsp;únoru 1906. Během realizace však stavba opakovaně narážela na stavební regulativy čtvrti Eixample: překročila povolenou kubaturu o&nbsp;více než 4&nbsp;000&nbsp;m³, podkroví přesáhlo výškový limit a&nbsp;jeden z&nbsp;hlavních kamenných pilířů zasáhl do uliční čáry chodníku. Spor vyřešila městská komise 20.&nbsp;prosince&nbsp;1909, kdy uznala mimořádnou uměleckou hodnotu díla a&nbsp;udělila mu status monumentální stavby nepodléhající běžným vyhláškám, i&nbsp;když stavebníkům vyměřila pokutu 100&nbsp;000&nbsp;peset.\u003C/p>\n\u003Cp>Stavba vyvolala v&nbsp;dobovém tisku vlnu posměchu; satirické časopisy přirovnávaly dům k&nbsp;hangáru pro vzducholodě či jeskynnímu doupěti, odkud vzešlo posměšné označení La Pedrera neboli Kamenolom. Skutečný bílý prach vytvářeli kameníci, kteří surové vápencové bloky tesali přímo na chodníku. Kolaudaci celé budovy potvrdil Gaudí 31.&nbsp;října&nbsp;1912.\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"construction-facade\" data-section-kind=\"narrative\">\n\u003Csummary>Konstrukční systém a&nbsp;materiály fasády\u003C/summary>\n\u003Cdiv>\u003Cp>Nosnou konstrukci budovy tvoří prostorový skelet z&nbsp;nýtovaných ocelových sloupů, válcovaných nosníků profilu I a&nbsp;kamenných pilířů. Gaudí tím v&nbsp;obytném stavitelství předběhl moderní princip volného půdorysu, v&nbsp;němž absence vnitřních nosných zdí umožňuje variabilní členění bytů bez jakéhokoliv zásahu do statiky domu. Vnější kamenná fasáda funguje jako samonosná zavěšená clona, ukotvená k&nbsp;vnitřní kostře pomocí ocelových táhel a&nbsp;zakřivených konzol.\u003C/p>\n\u003Cp>Fasádu tvoří dva druhy katalánského vápence: spodní nosné pilíře v&nbsp;přízemí a&nbsp;mezaninu jsou vyzděny z&nbsp;tvrdého biohermního vápence z&nbsp;pohoří Garraf u&nbsp;Sitges s&nbsp;mimořádnou pevností v&nbsp;tlaku. Vyšší podlaží, římsy a&nbsp;okenní špalety jsou naopak vytesány z&nbsp;jemnějšího nažloutlého vápence z&nbsp;lomů u&nbsp;Vilafranca del Penedès, který kameníkům umožnil plynulé sochařské tvarování přímo na lešení.\u003C/p>\n\u003Cp>Balkonová zábradlí a&nbsp;vstupní brány vytvořil architekt Josep Maria Jujol z&nbsp;recyklovaných železných pásů, plechů, obručí a&nbsp;řetězů jako rané prostorové asambláže spojované kovářskými nýty přímo na staveništi.\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"interior-layout\" data-section-kind=\"narrative\">\n\u003Csummary>Dispozice bytů, dělení místností a&nbsp;provoz kuchyní\u003C/summary>\n\u003Cdiv>\u003Cp>Přirozené osvětlení a&nbsp;větrání budovy zajišťují dvě velká vnitřní nádvoří: válcové nádvoří o&nbsp;průměru dvanácti metrů se obrací k&nbsp;bulváru Passeig de Gràcia, zatímco druhé nádvoří při ulici Provença má půdorys eliptický. Jednotlivé byty byly rozvrženy v&nbsp;půlkruzích kolem obou dvorů, což jim zaručovalo oboustrannou orientaci fasád.\u003C/p>\n\u003Cp>Každé patro zahrnovalo tři až čtyři rozlehlé bytové jednotky o&nbsp;ploše 300–400&nbsp;m². Díky skeletové konstrukci neměly byty pevně určený počet místností, protože volný půdorys umožňoval variabilní uspořádání prostoru podle přání nájemců. Plocha se dělila na reprezentační zónu obrácenou do ulice (salón, jídelna, knihovna), soukromou zónu v&nbsp;klidném středním traktu (ložnice a&nbsp;kabinety) a&nbsp;servisní zázemí při vnitřních dvorech.\u003C/p>\n\u003Cp>Kuchyně fungovaly jako samostatné technologické centrum domácnosti. Umístění u&nbsp;dvorů zajišťovalo rychlý odvod tepla a&nbsp;par skrze digestoře napojené na svislé kouřovody ústící do komínů. Stěny pokrývaly omyvatelné keramické kachle a&nbsp;pracovní plochy tvořily masivní mramorové dřezy s&nbsp;přímou vazbou na větranou spíž, služební schodiště i&nbsp;nákladní výtah.\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"technical-infrastructure\" data-section-kind=\"narrative\">\n\u003Csummary>Technická infrastruktura a&nbsp;hygiena\u003C/summary>\n\u003Cdiv>\u003Cp>Dům integroval pokročilé technické systémy, které představovaly v&nbsp;barcelonském rezidenčním stavitelství počátku 20.&nbsp;století mimořádný pokrok. Primární vertikální dopravu pro nájemníky zajišťovala dvojice elektrických výtahů ústících u&nbsp;vnitřních dvorů, odkud se vstupovalo přímo do předsíní bytů. Rodina Milà disponovala navíc soukromým monumentálním schodištěm vedoucím z&nbsp;vestibulu přímo do panského patra.\u003C/p>\n\u003Cp>Užitkovou vodu čerpala mechanická čerpadla do velkoobjemových nádrží skrytých ve střešních schodišťových věžích, odkud proudila samospádem do celého domu při stabilním gravitačním tlaku. Byty disponovaly moderními koupelnami se smaltovanými vanami, bidetem a&nbsp;splachovacími toaletami se zápachovými uzávěrkami.\u003C/p>\n\u003Cp>V&nbsp;suterénu byla instalována centrální teplovodní kotelna napájející litinové článkové radiátory v&nbsp;jednotlivých pokojích. Všechny obytné i&nbsp;servisní místnosti měly přímé denní světlo z&nbsp;ulic či dvorů, protože Gaudí odmítl tehdy obvyklé tmavé světlíky. K&nbsp;regulaci slunečního záření sloužily dřevěné okenice s&nbsp;naklápěcími lamelami zapuštěné do hlubokých vápencových špalet.\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"craft-decor\" data-section-kind=\"narrative\">\n\u003Csummary>Umělecké řemeslo, štuky a&nbsp;dlažba\u003C/summary>\n\u003Cdiv>\u003Cp>Výtvarná výzdoba domu harmonicky propojuje surové konstrukční materiály s&nbsp;jemnou sochařskou a&nbsp;řemeslnou prací. V&nbsp;panském patře a&nbsp;vybraných bytech vytvořil Josep Maria Jujol reliéfní sádrové stropy s&nbsp;plynulými přechody mezi stěnami a&nbsp;podhledy, do nichž přímo na lešení vtlačoval abstraktní motivy i&nbsp;kaligrafické nápisy. Stěny obou vstupních vestibulů a&nbsp;dvorů pokrývají nástěnné malby a&nbsp;iluzivní motivy od malířů Iu Pascuala a&nbsp;Aleixe Clapése.\u003C/p>\n\u003Cp>Pro haly a&nbsp;chodby navrhl Gaudí slavnou šestiúhelníkovou lisovanou cementovou dlažbu (katalánsky \u003Cem>panot Gaudí\u003C/em>). Tyto dlaždice s&nbsp;reliéfy mořské chobotnice, hvězdice a&nbsp;medúzy vyrobila firma Escofet; při sesazení tří kusů vytvářejí plynulý nekonečný vzor.\u003C/p>\n\u003Cp>Veškeré interiérové dveře, obložení a&nbsp;okenní rámy byly zhotoveny z&nbsp;masivní borovice a&nbsp;dubu bez ostrých hran. Kliky dveří, madla a&nbsp;okenní kličky navrhl Gaudí z&nbsp;lité mosazi a&nbsp;bronzu, přičemž jejich anatomické tvary modeloval přímo otiskem sevřené dlaně do měkké sádry.\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"roof-warriors-attic\" data-section-kind=\"narrative\">\n\u003Csummary>Půdní prostor a&nbsp;sochařská krajina střechy\u003C/summary>\n\u003Cdiv>\u003Cp>Půdní prostor nese 270&nbsp;parabolických oblouků proměnlivé výšky z&nbsp;tenkých pálených cihel kladených naplocho do sádry tradiční technikou katalánské klenby (\u003Cem>volta catalana\u003C/em>). Tvary oblouků vyměřil stavitel Josep Bayó s&nbsp;Gaudím pomocí zavěšeného řetězu přeneseného na šablony. Podkroví sloužilo jako prádelna a&nbsp;sušárna a&nbsp;současně vytvářelo izolační klimatickou vrstvu chránící byty před letním horkem.\u003C/p>\n\u003Cp>Plasticky zvlněná střešní terasa integruje funkční prvky do fantastických sochařských forem: šest schodišťových nástaveb (katalánsky \u003Cem>badalots\u003C/em>) se zásobníky vody zakončují kříže, zatímco skupiny komínů s&nbsp;helmicovými hlavicemi tvoří slavnou Zahradu válečníků.  Dvě samostatné věže zajišťují větrání vnitřních traktů a&nbsp;podkroví.\u003C/p>\n\u003Cp>Povrch střešních prvků pokrývá mozaika \u003Cem>trencadís\u003C/em> z&nbsp;úlomků keramických dlaždic, bílého mramoru a&nbsp;zeleného skla z&nbsp;vyřazených lahví od šampaňského. Gaudí navíc terasu navrhl s&nbsp;promyšlenými průhledy: jeden ze schodišťových oblouků funguje jako záměrný kamenný rám, který návštěvníkům otevírá přímý pohled na vzdálené věže chrámu Sagrada Família.\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"garage-modern-era\" data-section-kind=\"narrative\">\n\u003Csummary>Podzemní garáž a&nbsp;novodobé proměny budovy\u003C/summary>\n\u003Cdiv>\u003Cp>Gaudí navrhl suterén domu jako podzemní garáž pro kočáry a&nbsp;automobily s&nbsp;točitými rampami klesajícími z&nbsp;vnitřních dvorů. Šlo o&nbsp;vůbec první podzemní parkoviště pro osobní automobily v&nbsp;barcelonském bytovém domě. Gaudí v&nbsp;manévrovacím prostoru zcela vyloučil mezilehlé sloupy, aby usnadnil pohyb vozidel.\u003C/p>\n\u003Cp>V&nbsp;roce 1946 prodala Roser Segimon nemovitost realitní společnosti Immobiliària Provença, avšak v&nbsp;panském patře si ponechala doživotní užívací právo až do své smrti v&nbsp;roce 1964. V&nbsp;letech 1953–1955 upravil architekt Francisco Juan Barba Corsini půdní prostor na třináct moderních podkrovních bytů, kde využil Gaudího cihlové oblouky jako přirozené prostorové předěly.\u003C/p>\n\u003Cp>V&nbsp;prosinci 1986 zakoupila zchátralý dům spořitelna Caixa Catalunya a&nbsp;zahájila rozsáhlou památkovou obnovu. Restaurátorský tým odstranil novodobé vestavby v&nbsp;podkroví a&nbsp;obnovil původní volný prostor oblouků pro stálou expozici Espai Gaudí. Dnes objekt spravuje Fundació Catalunya La Pedrera pro muzejní a&nbsp;kulturní účely, přičemž dva byty zůstávají trvale obývány soukromými nájemníky.\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"visit-context-2026\" data-section-kind=\"narrative\">\n\u003Csummary>Večerní návštěva a&nbsp;režim provozu v&nbsp;roce 2026\u003C/summary>\n\u003Cdiv>\u003Cp>Návštěva Casa Milà dne 24.&nbsp;září&nbsp;2026 v&nbsp;čase od 21.05 do 22.01 proběhla v&nbsp;rámci nočního zážitkového okruhu La Pedrera Night Experience. Noční režim nabídl zcela odlišné vnímání stavby: po vstupu přes osvětlený kruhový vestibul s&nbsp;nástěnnými malbami a&nbsp;krátkém průchodu podkrovní expozicí Espai Gaudí vystoupala skupina přímo na střešní terasu.\u003C/p>\n\u003Cp>Vrcholem večera byla multimediální projekce promítaná přímo na vápencové a&nbsp;mozaikové plochy schodišťových věží a&nbsp;komínových hlavic Zahrady válečníků za doprovodu prostorové hudby. Návštěvníci tak mohli sledovat genezi Gaudího přírodních inspirací od mořských vln přes krystaly až po hvězdnou oblohu, orámovanou nočními světly barcelonské třídy Passeig de Gràcia.\u003C/p>\n\u003C/div>\n\u003C/details>",locationOfficialHtml:"\u003Ctable>\n\u003Cthead>\n\u003Ctr>\n\u003Cth align=\"left\">Parametr\u003C/th>\n\u003Cth align=\"left\">Údaj\u003C/th>\n\u003C/tr>\n\u003C/thead>\n\u003Ctbody>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Oficiální název\u003C/th>\n\u003Ctd align=\"left\">Casa Milà (vžité označení La Pedrera) \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Hlavní architekt\u003C/th>\n\u003Ctd align=\"left\">Antoni Gaudí i&nbsp;Cornet (1852–1926)\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Klíčoví spolupracovníci\u003C/th>\n\u003Ctd align=\"left\">Josep Maria Jujol (kované prvky a&nbsp;štuky), Domènec Sugrañes, Josep Canaleta (asistence), Josep Bayó i&nbsp;Font (stavitel) \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Původní stavebník\u003C/th>\n\u003Ctd align=\"left\">Pere Milà i&nbsp;Camps a&nbsp;Roser Segimon i&nbsp;Artells \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Doba výstavby\u003C/th>\n\u003Ctd align=\"left\">1906–1912 (zahájení únor 1906, kolaudace 31.&nbsp;října&nbsp;1912) \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Architektonický styl\u003C/th>\n\u003Ctd align=\"left\">katalánský modernismus (\u003Cem>Modernisme\u003C/em>), organická architektura\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Lokalita a&nbsp;adresa\u003C/th>\n\u003Ctd align=\"left\">Passeig de Gràcia 92 / Carrer de Provença 261–265, 08008 Barcelona, Španělsko\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Rozměry a&nbsp;plocha\u003C/th>\n\u003Ctd align=\"left\">parcela 1&nbsp;835&nbsp;m², 9&nbsp;úrovní (suterén, přízemí, mezanin, panské patro, 4&nbsp;patra bytů, půda, střecha) \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Současné využití a&nbsp;vlastník\u003C/th>\n\u003Ctd align=\"left\">Fundació Catalunya La Pedrera (kulturní centrum a&nbsp;muzeum); 2&nbsp;trvale obývané byty\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Památková ochrana\u003C/th>\n\u003Ctd align=\"left\">BCIN (kód památky IPA-77 / BCIN 28-MH); Seznam světového dědictví UNESCO (ref. 320) \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Oficiální web\u003C/th>\n\u003Ctd align=\"left\">\u003Ca href=\"https://www.lapedrera.com/\">lapedrera.com\u003C/a>\u003C/td>\n\u003C/tr>\n\u003C/tbody>\n\u003C/table>\n",aliases:["La Pedrera","Kamenolom","Milà House"],heroImage:{src:"/travel-guide/teasers/casa-mila/hero.jpg",alt:"Nárožní průčelí domu Casa Milà v Barceloně"},audio:[{section:"lead",label:"Úvod",identity:"52f8b37dca3e9b5c24b325e2ccec50810276bb45fe85ea6965a76112d36e400f",src:"/travel-guide/audio/casa-mila/52f8b37dca3e9b5c24b325e2ccec50810276bb45fe85ea6965a76112d36e400f.m4a"},{section:"history-origin",label:"Historie a spory se stavebním úřadem",identity:"2ab4382d119c93a56394e2535b550bc0ce29f7398b3dc2ca9f69808376ea8914",src:"/travel-guide/audio/casa-mila/2ab4382d119c93a56394e2535b550bc0ce29f7398b3dc2ca9f69808376ea8914.m4a"},{section:"construction-facade",label:"Konstrukční systém a materiály fasády",identity:"88ebbdd842a7f91583553079649281cbfd0a298c4c5eb7e259e746cf3e628299",src:"/travel-guide/audio/casa-mila/88ebbdd842a7f91583553079649281cbfd0a298c4c5eb7e259e746cf3e628299.m4a"},{section:"interior-layout",label:"Dispozice bytů, dělení místností a provoz kuchyní",identity:"8f9516bb74efefe21ad0c9227fee498df5bf08ef8d62651a4eaea7ea66993f85",src:"/travel-guide/audio/casa-mila/8f9516bb74efefe21ad0c9227fee498df5bf08ef8d62651a4eaea7ea66993f85.m4a"},{section:"technical-infrastructure",label:"Technická infrastruktura a hygiena",identity:"7dc57de6052fdbdf594e1b6cf80955afe7005e21fd36c25468968c0a695b3569",src:"/travel-guide/audio/casa-mila/7dc57de6052fdbdf594e1b6cf80955afe7005e21fd36c25468968c0a695b3569.m4a"},{section:"craft-decor",label:"Umělecké řemeslo, štuky a dlažba",identity:"57810ac2f1c143a71b32
