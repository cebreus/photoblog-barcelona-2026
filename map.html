th:534},{variant:"xl",type:"image/avif",path:"/images/previews-xl-avif/IMG_0586.avif",width:534},{variant:"detail",type:"image/jpeg",path:"/images/details/IMG_0586.jpeg",width:1707,height:1280},{variant:"fallback",type:"image/jpeg",path:"/images/previews-xxs/IMG_0586.jpeg",width:190,height:127},{variant:"admin_thumb",type:"image/jpeg",path:"/images/previews-admin/IMG_0586.jpeg",width:534,height:401}],people:[]},{id:"loc-montserrat-main-2026-09-27t144839",type:"separator",location:"Montserrat",city:"Monistrol de Montserrat",hasPhotos:true,startDate:"2026-09-27T14:48:39",endDate:"2026-09-27T23:59:59",storyTitle:"Klášter Montserrat a masiv s poustevnami (Monestir de Montserrat)",story:"\u003Cp class=\"lead\" data-section-id=\"lead\">Benediktinské opatství Santa Maria de Montserrat se vypíná na skalních terasách stejnojmenného mohutného slepencového masivu v&nbsp;nadmořské výšce 720&nbsp;metrů. Klášterní areál představuje duchovní srdce Katalánska a&nbsp;uchovává uctívanou románskou sochu Černé Madony (\u003Cem>La Moreneta\u003C/em>) z&nbsp;konce 12.&nbsp;století. Okolní divoké skalní jehly a&nbsp;hluboké rokle přitahují poutníky i&nbsp;horolezce, kteří po staletí využívali zdejší osamocené poustevny zavěšené přímo pod skalními převisy.\u003C/p>\u003Cdetails data-section-id=\"history-origin\" data-section-kind=\"narrative\">\n\u003Csummary>Historie a&nbsp;obnova benediktinského opatství\u003C/summary>\n\u003Cdiv>\u003Cp>Počátky kláštera sahají do roku 1025, kdy opat Oliba z&nbsp;kláštera Santa Maria de Ripoll založil novou komunitu u&nbsp;starší poustevny Santa Maria. Malá komunita mnichů se postupně rozrůstala a&nbsp;roku 1409 získal Montserrat statut samostatného opatství.\u003C/p>\n\u003Cp>Během napoleonských válek v&nbsp;letech 1811 a&nbsp;1812 francouzské vojsko maršála Sucheta klášterní budovy dvakrát vypálilo a&nbsp;vyplenilo, což vedlo ke zkáze většiny archivu i&nbsp;středověkých staveb. Trvalou obnovu poutního místa zahájil v&nbsp;roce 1858 opat Miquel Muntadas, za jehož působení vystavěli mniši nové klášterní trakty a&nbsp;zrekonstruovali baziliku.\u003C/p>\n\u003Cp>Dne 23.&nbsp;října&nbsp;1940 navštívil klášter říšský vůdce SS Heinrich Himmler, ovlivněný mýtem o&nbsp;Svatém grálu, avšak mniši v&nbsp;čele s&nbsp;Andreuem Ripolem odmítli jeho požadavky na vydání archiválií. V&nbsp;období frankistického režimu se opatství stalo předním útočištěm svobodné katalánské kultury a&nbsp;jazyka.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"mountain-transport\" data-section-kind=\"narrative\">\n\u003Csummary>Horská doprava, zubačka a&nbsp;lanovky\u003C/summary>\n\u003Cdiv>\u003Cp>Montserrat disponuje unikátním systémem horské dopravy, který překonává příkré skalní stěny a&nbsp;usnadňuje přístup na hřebeny. Ozubnicová trať Cremallera de Montserrat spojuje údolní uzel Monistrol de Montserrat s&nbsp;klášterem. Na délce 5,3&nbsp;kilometru překonává převýšení 550&nbsp;metrů pomocí ozubnicového systému Abt se stoupáním až 15,6&nbsp;%. Původní parní zubačka jezdila v&nbsp;letech 1892–1957 a&nbsp;roku 2003 byla trať modernizována společností FGC.\u003C/p>\n\u003Cp>Žlutá visutá kabinová lanovka Aeri de Montserrat z&nbsp;roku 1930 od německé firmy Bleichert představuje nejstarší fungující visutou lanovku ve Španělsku, překonávající převýšení 544&nbsp;metrů za pět minut při sklonu až 45&nbsp;%.\u003C/p>\n\u003Cp>Z&nbsp;klášterní terasy stoupá na hřebenovou plošinu Pla de les Taràntules pozemní kolejová lanovka Sant Joan (\u003Cem>Funicular de Sant Joan\u003C/em>) z&nbsp;roku 1918. Se sklonem 65,2&nbsp;% je nejstrmější kolejovou tratí ve Španělsku a&nbsp;slouží jako klíčové východisko k&nbsp;výstupu na vrchol Sant Jeroni.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"squares-subirachs\" data-section-kind=\"narrative\">\n\u003Csummary>Klášterní náměstí a&nbsp;Subirachsovy plastiky\u003C/summary>\n\u003Cdiv>\u003Cp>Před vstupem do baziliky se rozkládá terasovité hlavní náměstí (Plaça de Santa Maria), které v&nbsp;letech 1929–1933 architektonicky sjednotil přední katalánský modernista Josep Puig i&nbsp;Cadafalch. Okraj prostranství lemuje kamenná balustráda s&nbsp;vyhlídkovým ochozem o&nbsp;pěti půlkruhových arkádách, odkud se otevírá rozsáhlé panorama do údolí řeky Llobregat a&nbsp;za jasného počasí až k&nbsp;hřebenům Pyrenejí.\u003C/p>\n\u003Cp>Při přístupové cestě k&nbsp;nádvoří stojí monumentální plastika svatého Jiří (Sant Jordi) z&nbsp;travertinu od sochaře Josepa Marii Subirachse z&nbsp;roku 1986. Subirachs uplatnil princip negativního reliéfu: zatímco štít a&nbsp;meč vystupují v&nbsp;kladném objemu, tvář a&nbsp;hruď rytíře jsou zahloubeny konkávně. Tato modelace vytváří výrazný optický klam, při němž tvář sochy pozorovatele zdánlivě neustále sleduje.\u003C/p>\n\u003Cp>Na vyhlídkové terase při příjezdu ke klášteru stojí další významné Subirachsovo dílo – Pomník Ramonovi Llullovi neboli Schodiště k&nbsp;porozumění z&nbsp;roku 1976, jehož osm kamenných kvádrů spirálovitě stoupá k&nbsp;nebi a&nbsp;symbolizuje stupně stvoření.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"facade-atrium\" data-section-kind=\"narrative\">\n\u003Csummary>Průčelí baziliky a&nbsp;vstupní atrium\u003C/summary>\n\u003Cdiv>\u003Cp>Současná klášterní bazilika vznikla původně v&nbsp;renesančním slohu a&nbsp;byla vysvěcena v&nbsp;roce 1592. Vstupní průčelí otočené do atria navrhl architekt Francesc de Paula del Villar i&nbsp;Carmona v&nbsp;neoplatereskním stylu na přelomu 19.&nbsp;a&nbsp;20.&nbsp;století, přičemž slavnostní otevření proběhlo roku 1901.\u003C/p>\n\u003Cp>Kamennému průčelí dominuje rozměrná rozeta a&nbsp;plastický vlys s&nbsp;monumentálními sochami Ježíše Krista a&nbsp;dvanácti apoštolů od sochaře Agapita Vallmitjany. Sochař umístil apoštoly na obrácené římské oltáře jako symbol triumfu křesťanství nad antickým pohanstvím. Reliéfní výzdobu tří vstupních tympanonů vytvořil jeho bratr Venanci Vallmitjana.\u003C/p>\n\u003Cp>Dláždění atriového nádvoří před bazilikou tvoří geometrické černobílé mramorové vzory inspirované Michelangelovou úpravou Kapitolského náměstí v&nbsp;Římě.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"basilica-choir\" data-section-kind=\"narrative\">\n\u003Csummary>Interiér baziliky a&nbsp;chlapecký sbor Escolania\u003C/summary>\n\u003Cdiv>\u003Cp>Jednolodní prostor renesanční baziliky kryje valená klenba lemovaná bočními kaplemi. Nad arkádami visí soubor více než osmdesáti umělecky tepaných votivních lamp (katalánsky \u003Cem>llànties votives\u003C/em>), věnovaných od roku 1946 katalánskými městy a&nbsp;cechy jako výraz duchovní svébytnosti.\u003C/p>\n\u003Cp>Nad hlavním kamenným oltářem se vznáší kruhový závěsný baldachýn s&nbsp;tepanými reliéfy od zlatníka Manuela Capdevily. Ze středu visí vyřezávaný slonovinový krucifix (\u003Cem>Crist d&#39;ivori\u003C/em>), který badatel Anscari M. Mundó připsal mladému Michelangelovi, ačkoliv část historiků jej klasifikuje jako italskou manýristickou práci.\u003C/p>\n\u003Cp>Klášter je proslulý chlapeckým sborem Escolania de Montserrat, doloženým již od roku 1307, což z&nbsp;něj činí jednu z&nbsp;nejstarších hudebních institucí v&nbsp;Evropě. Přibližně padesát chlapců denně doprovází liturgii zpěvem gregoriánské \u003Cem>Salve Regina\u003C/em> a&nbsp;hymnu \u003Cem>Virolai\u003C/em>. S&nbsp;klášterem je spojen také slavný hudební rukopis \u003Cem>Llibre Vermell de Montserrat\u003C/em> ze 14.&nbsp;století s&nbsp;nejstarším záznamem tance smrti.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"black-madonna-cambril\" data-section-kind=\"narrative\">\n\u003Csummary>Černá Madona a&nbsp;kaple Cambril\u003C/summary>\n\u003Cdiv>\u003Cp>Za hlavním oltářem se nachází vyvýšená kaple (Cambril de la Mare de Déu), kterou v&nbsp;letech 1876–1887 postavil Francisco de Paula del Villar za asistence mladého studenta architektury Antoniho Gaudího. Přístupové Schodiště svatých zdobí sochy Josepa Llimony a&nbsp;klenbu kaple pokrývají byzantské zlaté mozaiky podle kartonů Joana Llimony.\u003C/p>\n\u003Cp>Uctívaná socha Panny Marie s&nbsp;dítětem (katalánsky \u003Cem>Mare de Déu de Montserrat\u003C/em> neboli \u003Cem>La Moreneta\u003C/em>) vznikla na konci 12.&nbsp;století z&nbsp;polychromovaného topolového dřeva o&nbsp;výšce 95&nbsp;centimetrů. Tmavé zbarvení tváří nezpůsobil pigment, ale přirozené stárnutí laku a&nbsp;staleté působení kouře votivních svící. Papež Lev&nbsp;XIII. ji roku 1881 vyhlásil patronkou Katalánska.\u003C/p>\n\u003Cp>Před Černou Madonou prožil v&nbsp;březnu 1522 celonoční modlitební vigilii rytíř Íñigo López de Loyola (svatý Ignác z&nbsp;Loyoly), který zde odložil meč a&nbsp;zahájil duchovní dráhu vedoucí k&nbsp;založení jezuitského řádu. Z&nbsp;kaple vychází krytá Stezka Zdrávas Maria se stupňovitými policemi pro tisíce barevných svící.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"museum-collections\" data-section-kind=\"narrative\">\n\u003Csummary>Muzeum Montserrat a&nbsp;výtvarné sbírky\u003C/summary>\n\u003Cdiv>\u003Cp>V&nbsp;podzemních sálech pod terasou náměstí sídlí Muzeum Montserrat (\u003Cem>Museu de Montserrat – MDM\u003C/em>), jehož prostory v&nbsp;letech 1928–1933 adaptoval architekt Josep Puig i&nbsp;Cadafalch. Klášterní galerie uchovává mimořádně bohatý umělecký fond od starověku po moderní umění 20.&nbsp;století.\u003C/p>\n\u003Cp>Klenotem sbírky starých mistrů je plátno \u003Cem>Svatý Jeroným v&nbsp;rozjímání\u003C/em> (kolem 1605) od Caravaggia, které představuje jediné autentické dílo tohoto italského mistra ve veřejných sbírkách v&nbsp;Katalánsku. Galerii doplňují díla El Greca, Tiepola i&nbsp;francouzských impresionistů Clauda Moneta a&nbsp;Edgara Degase, spolu s&nbsp;ranými pracemi Pabla Picassa a&nbsp;Salvadora Dalího.\u003C/p>\n\u003Cp>Ucelenou expozici tvoří katalánský modernismus reprezentovaný plátny Ramona Casase a&nbsp;Santiaga Rusiñola, doplněný egyptskou a&nbsp;blízkovýchodní archeologickou sbírkou biblisty Bonaventury Ubacha.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"geology-hermitages\" data-section-kind=\"narrative\">\n\u003Csummary>Geologie masivu, skalní věže a&nbsp;poustevny\u003C/summary>\n\u003Cdiv>\u003Cp>Horský masiv Montserrat vznikl přibližně před padesáti miliony lety jako říční delta sedimentárních slepenců tmelených vápnitým tmelem. Selektivní zvětrávání a&nbsp;voda rozpouštějící tmel vymodelovaly masiv do zaoblených homolí, skalních věží a&nbsp;jehel, z&nbsp;nichž nejvyšší je vrchol Sant Jeroni s&nbsp;nadmořskou výškou 1&nbsp;236&nbsp;metrů.\u003C/p>\n\u003Cp>Přímo nad klášterním údolím se zvedá skupina věží Els Gorros v&nbsp;čele s&nbsp;Gorra Frígia (1&nbsp;153&nbsp;m&nbsp;n.&nbsp;m.), která slouží jako kolébka katalánského sportovního lezení.\u003C/p>\n\u003Cp>Vysoko ve skalách nad klášterem vznikla síť třinácti historických pousteven, kde od 11.&nbsp;století žili eremité v&nbsp;naprostém odloučení. Poustevny Sant Joan a&nbsp;Sant Onofre stály pod skalním převisem a&nbsp;roku 1599 zde poobědval král Filip&nbsp;II. Po jejich zničení francouzskými vojsky v&nbsp;roce 1812 vyrostla na skalní terase novogotická kaple Sant Joan z&nbsp;roku 1893.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"trails-routes\" data-section-kind=\"narrative\">\n\u003Csummary>Poutní stezky a&nbsp;vyhlídkové trasy\u003C/summary>\n\u003Cdiv>\u003Cp>Okolí kláštera protíná síť značených stezek spojujících duchovní místa i&nbsp;přírodní vyhlídky. Poutní cesta k&nbsp;Posvátné jeskyni (\u003Cem>Camí de la Santa Cova\u003C/em>) vytesaná do útesu vede k&nbsp;místu tradovaného nálezu sochy roku 880. Lemuje ji soubor patnácti zastavení Monumentálního růžence z&nbsp;let 1896–1916, na nichž spolupracovali Antoni Gaudí, Josep Puig i&nbsp;Cadafalch a&nbsp;Enric Sagnier.\u003C/p>\n\u003Cp>Výstupová trasa na vrchol Sant Jeroni (1&nbsp;236&nbsp;m&nbsp;n.&nbsp;m.) zabere přibližně dvě hodiny pěší chůze z&nbsp;kláštera a&nbsp;z&nbsp;temene otevírá kruhový výhled na celé vnitrozemské Katalánsko i&nbsp;Pyreneje.\u003C/p>\n\u003Cp>Horský okruh kolem pousteven (\u003Cem>Ruta de les Ermites\u003C/em>) propojuje ruiny eremitáží Sant Joan, Sant Onofre i&nbsp;Santa Magdalena pod skalními jehlami Els Gorros, zatímco nenáročná Stezka kapek (\u003Cem>Camí dels Degotalls\u003C/em>) vede pod skalními převisy zdobenými majolikovými mozaikami.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"visit-context-2026\" data-section-kind=\"narrative\">\n\u003Csummary>Odpolední návštěva a&nbsp;večerní atmosféra v&nbsp;roce 2026\u003C/summary>\n\u003Cdiv>\u003Cp>Návštěva Montserratu dne 27.&nbsp;září&nbsp;2026 proběhla v&nbsp;odpoledních a&nbsp;večerních hodinách od 14.48 do pozdního večera. Příjezd po poledni nabídl možnost zažít klášterní areál v&nbsp;okamžiku, kdy denní turistické zájezdy začaly opouštět náměstí a&nbsp;masiv zalilo teplé podvečerní slunce.\u003C/p>\n\u003Cp>Skupina zachytila Subirachsovu sochu svatého Jiří s&nbsp;jejím iluzivním dutým reliéfem i&nbsp;poklidnou atmosféru v&nbsp;atriovém dvoře baziliky. Večerní hodiny umožnily nerušené vnímání monumentality okolních slepencových věží Els Gorros a&nbsp;tichého šumu větru v&nbsp;roklinách po západu slunce, kdy se horské údolí ponořilo do tmy a&nbsp;rozsvítila se pouze světla klášterních luceren.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"facts\" data-section-kind=\"facts\">\n\u003Csummary>Základní údaje\u003C/summary>\n\u003Cdiv>\u003Ctable>\n\u003Cthead>\n\u003Ctr>\n\u003Cth align=\"left\">Parametr\u003C/th>\n\u003Cth align=\"left\">Údaj\u003C/th>\n\u003C/tr>\n\u003C/thead>\n\u003Ctbody>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Oficiální název\u003C/th>\n\u003Ctd align=\"left\">Monestir de Santa Maria de Montserrat\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Hlavní architekti\u003C/th>\n\u003Ctd align=\"left\">Francesc de Paula del Villar i&nbsp;Carmona (průčelí 1900–1901)\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Klíčoví spolupracovníci\u003C/th>\n\u003Ctd align=\"left\">Agapit a&nbsp;Venanci Vallmitjanovi (sochy fasády), Josep Maria Subirachs (moderní plastiky), Josep Puig i&nbsp;Cadafalch (náměstí a&nbsp;muzeum) \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Zakladatel kláštera\u003C/th>\n\u003Ctd align=\"left\">Opat Oliba z&nbsp;Ripollu (rok 1025)\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Doba výstavby\u003C/th>\n\u003Ctd align=\"left\">od roku 1025 (klášter); 1592 (renesanční bazilika); 1901 (neoplatereskní průčelí) \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Architektonický styl\u003C/th>\n\u003Ctd align=\"left\">románský původ, renesanční bazilika, katalánský modernismus a&nbsp;historismus\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Lokalita a&nbsp;adresa\u003C/th>\n\u003Ctd align=\"left\">08199 Monistrol de Montserrat, comarca El Bages (Katalánsko), Španělsko\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Rozměry a&nbsp;poloha\u003C/th>\n\u003Ctd align=\"left\">nadmořská výška kláštera 720&nbsp;m&nbsp;n.&nbsp;m., nejvyšší vrchol masivu Sant Jeroni 1&nbsp;236&nbsp;m&nbsp;n.&nbsp;m.\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Významná díla a&nbsp;památky\u003C/th>\n\u003Ctd align=\"left\">La Moreneta (konec 12.&nbsp;století), Llibre Vermell (konec 14.&nbsp;století), Caravaggiův Svatý Jeroným (kolem 1605)\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Současné využití a&nbsp;správa\u003C/th>\n\u003Ctd align=\"left\">Benediktinské arciopatství, poutní bazilika a&nbsp;muzeum; chlapecký sbor Escolania de Montserrat\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Památková ochrana\u003C/th>\n\u003Ctd align=\"left\">BCIL (kód záznamu IPA-16806); poustevny v&nbsp;katalogu IPAC (kódy IPA-54016 a&nbsp;IPA-54020)\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Oficiální web\u003C/th>\n\u003Ctd align=\"left\">\u003Ca href=\"https://abadiamontserrat.cat/\">abadiamontserrat.cat\u003C/a>\u003C/td>\n\u003C/tr>\n\u003C/tbody>\n\u003C/table>\n\u003C/div>\n\u003C/details>",locationId:"montserrat",locationLeadHtml:"\u003Cp class=\"lead\" data-section-id=\"lead\">Benediktinské opatství Santa Maria de Montserrat se vypíná na skalních terasách stejnojmenného mohutného slepencového masivu v&nbsp;nadmořské výšce 720&nbsp;metrů. Klášterní areál představuje duchovní srdce Katalánska a&nbsp;uchovává uctívanou románskou sochu Černé Madony (\u003Cem>La Moreneta\u003C/em>) z&nbsp;konce 12.&nbsp;století. Okolní divoké skalní jehly a&nbsp;hluboké rokle přitahují poutníky i&nbsp;horolezce, kteří po staletí využívali zdejší osamocené poustevny zavěšené přímo pod skalními převisy.\u003C/p>",locationHtml:"\u003Cdetails data-section-id=\"history-origin\" data-section-kind=\"narrative\">\n\u003Csummary>Historie a&nbsp;obnova benediktinského opatství\u003C/summary>\n\u003Cdiv>\u003Cp>Počátky kláštera sahají do roku 1025, kdy opat Oliba z&nbsp;kláštera Santa Maria de Ripoll založil novou komunitu u&nbsp;starší poustevny Santa Maria. Malá komunita mnichů se postupně rozrůstala a&nbsp;roku 1409 získal Montserrat statut samostatného opatství.\u003C/p>\n\u003Cp>Během napoleonských válek v&nbsp;letech 1811 a&nbsp;1812 francouzské vojsko maršála Sucheta klášterní budovy dvakrát vypálilo a&nbsp;vyplenilo, což vedlo ke zkáze většiny archivu i&nbsp;středověkých staveb. Trvalou obnovu poutního místa zahájil v&nbsp;roce 1858 opat Miquel Muntadas, za jehož působení vystavěli mniši nové klášterní trakty a&nbsp;zrekonstruovali baziliku.\u003C/p>\n\u003Cp>Dne 23.&nbsp;října&nbsp;1940 navštívil klášter říšský vůdce SS Heinrich Himmler, ovlivněný mýtem o&nbsp;Svatém grálu, avšak mniši v&nbsp;čele s&nbsp;Andreuem Ripolem odmítli jeho požadavky na vydání archiválií. V&nbsp;období frankistického režimu se opatství stalo předním útočištěm svobodné katalánské kultury a&nbsp;jazyka.\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"mountain-transport\" data-section-kind=\"narrative\">\n\u003Csummary>Horská doprava, zubačka a&nbsp;lanovky\u003C/summary>\n\u003Cdiv>\u003Cp>Montserrat disponuje unikátním systémem horské dopravy, který překonává příkré skalní stěny a&nbsp;usnadňuje přístup na hřebeny. Ozubnicová trať Cremallera de Montserrat spojuje údolní uzel Monistrol de Montserrat s&nbsp;klášterem. Na délce 5,3&nbsp;kilometru překonává převýšení 550&nbsp;metrů pomocí ozubnicového systému Abt se stoupáním až 15,6&nbsp;%. Původní parní zubačka jezdila v&nbsp;letech 1892–1957 a&nbsp;roku 2003 byla trať modernizována společností FGC.\u003C/p>\n\u003Cp>Žlutá visutá kabinová lanovka Aeri de Montserrat z&nbsp;roku 1930 od německé firmy Bleichert představuje nejstarší fungující visutou lanovku ve Španělsku, překonávající převýšení 544&nbsp;metrů za pět minut při sklonu až 45&nbsp;%.\u003C/p>\n\u003Cp>Z&nbsp;klášterní terasy stoupá na hřebenovou plošinu Pla de les Taràntules pozemní kolejová lanovka Sant Joan (\u003Cem>Funicular de Sant Joan\u003C/em>) z&nbsp;roku 1918. Se sklonem 65,2&nbsp;% je nejstrmější kolejovou tratí ve Španělsku a&nbsp;slouží jako klíčové východisko k&nbsp;výstupu na vrchol Sant Jeroni.\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"squares-subirachs\" data-section-kind=\"narrative\">\n\u003Csummary>Klášterní náměstí a&nbsp;Subirachsovy plastiky\u003C/summary>\n\u003Cdiv>\u003Cp>Před vstupem do baziliky se rozkládá terasovité hlavní náměstí (Plaça de Santa Maria), které v&nbsp;letech 1929–1933 architektonicky sjednotil přední katalánský modernista Josep Puig i&nbsp;Cadafalch. Okraj prostranství lemuje kamenná balustráda s&nbsp;vyhlídkovým ochozem o&nbsp;pěti půlkruhových arkádách, odkud se otevírá rozsáhlé panorama do údolí řeky Llobregat a&nbsp;za jasného počasí až k&nbsp;hřebenům Pyrenejí.\u003C/p>\n\u003Cp>Při přístupové cestě k&nbsp;nádvoří stojí monumentální plastika svatého Jiří (Sant Jordi) z&nbsp;travertinu od sochaře Josepa Marii Subirachse z&nbsp;roku 1986. Subirachs uplatnil princip negativního reliéfu: zatímco štít a&nbsp;meč vystupují v&nbsp;kladném objemu, tvář a&nbsp;hruď rytíře jsou zahloubeny konkávně. Tato modelace vytváří výrazný optický klam, při němž tvář sochy pozorovatele zdánlivě neustále sleduje.\u003C/p>\n\u003Cp>Na vyhlídkové terase při příjezdu ke klášteru stojí další významné Subirachsovo dílo – Pomník Ramonovi Llullovi neboli Schodiště k&nbsp;porozumění z&nbsp;roku 1976, jehož osm kamenných kvádrů spirálovitě stoupá k&nbsp;nebi a&nbsp;symbolizuje stupně stvoření.\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"facade-atrium\" data-section-kind=\"narrative\">\n\u003Csummary>Průčelí baziliky a&nbsp;vstupní atrium\u003C/summary>\n\u003Cdiv>\u003Cp>Současná klášterní bazilika vznikla původně v&nbsp;renesančním slohu a&nbsp;byla vysvěcena v&nbsp;roce 1592. Vstupní průčelí otočené do atria navrhl architekt Francesc de Paula del Villar i&nbsp;Carmona v&nbsp;neoplatereskním stylu na přelomu 19.&nbsp;a&nbsp;20.&nbsp;století, přičemž slavnostní otevření proběhlo roku 1901.\u003C/p>\n\u003Cp>Kamennému průčelí dominuje rozměrná rozeta a&nbsp;plastický vlys s&nbsp;monumentálními sochami Ježíše Krista a&nbsp;dvanácti apoštolů od sochaře Agapita Vallmitjany. Sochař umístil apoštoly na obrácené římské oltáře jako symbol triumfu křesťanství nad antickým pohanstvím. Reliéfní výzdobu tří vstupních tympanonů vytvořil jeho bratr Venanci Vallmitjana.\u003C/p>\n\u003Cp>Dláždění atriového nádvoří před bazilikou tvoří geometrické černobílé mramorové vzory inspirované Michelangelovou úpravou Kapitolského náměstí v&nbsp;Římě.\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"basilica-choir\" data-section-kind=\"narrative\">\n\u003Csummary>Interiér baziliky a&nbsp;chlapecký sbor Escolania\u003C/summary>\n\u003Cdiv>\u003Cp>Jednolodní prostor renesanční baziliky kryje valená klenba lemovaná bočními kaplemi. Nad arkádami visí soubor více než osmdesáti umělecky tepaných votivních lamp (katalánsky \u003Cem>llànties votives\u003C/em>), věnovaných od roku 1946 katalánskými městy a&nbsp;cechy jako výraz duchovní svébytnosti.\u003C/p>\n\u003Cp>Nad hlavním kamenným oltářem se vznáší kruhový závěsný baldachýn s&nbsp;tepanými reliéfy od zlatníka Manuela Capdevily. Ze středu visí vyřezávaný slonovinový krucifix (\u003Cem>Crist d'ivori\u003C/em>), který badatel Anscari M. Mundó připsal mladému Michelangelovi, ačkoliv část historiků jej klasifikuje jako italskou manýristickou práci.\u003C/p>\n\u003Cp>Klášter je proslulý chlapeckým sborem Escolania de Montserrat, doloženým již od roku 1307, což z&nbsp;něj činí jednu z&nbsp;nejstarších hudebních institucí v&nbsp;Evropě. Přibližně padesát chlapců denně doprovází liturgii zpěvem gregoriánské \u003Cem>Salve Regina\u003C/em> a&nbsp;hymnu \u003Cem>Virolai\u003C/em>. S&nbsp;klášterem je spojen také slavný hudební rukopis \u003Cem>Llibre Vermell de Montserrat\u003C/em> ze 14.&nbsp;století s&nbsp;nejstarším záznamem tance smrti.\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"black-madonna-cambril\" data-section-kind=\"narrative\">\n\u003Csummary>Černá Madona a&nbsp;kaple Cambril\u003C/summary>\n\u003Cdiv>\u003Cp>Za hlavním oltářem se nachází vyvýšená kaple (Cambril de la Mare de Déu), kterou v&nbsp;letech 1876–1887 postavil Francisco de Paula del Villar za asistence mladého studenta architektury Antoniho Gaudího. Přístupové Schodiště svatých zdobí sochy Josepa Llimony a&nbsp;klenbu kaple pokrývají byzantské zlaté mozaiky podle kartonů Joana Llimony.\u003C/p>\n\u003Cp>Uctívaná socha Panny Marie s&nbsp;dítětem (katalánsky \u003Cem>Mare de Déu de Montserrat\u003C/em> neboli \u003Cem>La Moreneta\u003C/em>) vznikla na konci 12.&nbsp;století z&nbsp;polychromovaného topolového dřeva o&nbsp;výšce 95&nbsp;centimetrů. Tmavé zbarvení tváří nezpůsobil pigment, ale přirozené stárnutí laku a&nbsp;staleté působení kouře votivních svící. Papež Lev&nbsp;XIII. ji roku 1881 vyhlásil patronkou Katalánska.\u003C/p>\n\u003Cp>Před Černou Madonou prožil v&nbsp;březnu 1522 celonoční modlitební vigilii rytíř Íñigo López de Loyola (svatý Ignác z&nbsp;Loyoly), který zde odložil meč a&nbsp;zahájil duchovní dráhu vedoucí k&nbsp;založení jezuitského řádu. Z&nbsp;kaple vychází krytá Stezka Zdrávas Maria se stupňovitými policemi pro tisíce barevných svící.\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"museum-collections\" data-section-kind=\"narrative\">\n\u003Csummary>Muzeum Montserrat a&nbsp;výtvarné sbírky\u003C/summary>\n\u003Cdiv>\u003Cp>V&nbsp;podzemních sálech pod terasou náměstí sídlí Muzeum Montserrat (\u003Cem>Museu de Montserrat – MDM\u003C/em>), jehož prostory v&nbsp;letech 1928–1933 adaptoval architekt Josep Puig i&nbsp;Cadafalch. Klášterní galerie uchovává mimořádně bohatý umělecký fond od starověku po moderní umění 20.&nbsp;století.\u003C/p>\n\u003Cp>Klenotem sbírky starých mistrů je plátno \u003Cem>Svatý Jeroným v&nbsp;rozjímání\u003C/em> (kolem 1605) od Caravaggia, které představuje jediné autentické dílo tohoto italského mistra ve veřejných sbírkách v&nbsp;Katalánsku. Galerii doplňují díla El Greca, Tiepola i&nbsp;francouzských impresionistů Clauda Moneta a&nbsp;Edgara Degase, spolu s&nbsp;ranými pracemi Pabla Picassa a&nbsp;Salvadora Dalího.\u003C/p>\n\u003Cp>Ucelenou expozici tvoří katalánský modernismus reprezentovaný plátny Ramona Casase a&nbsp;Santiaga Rusiñola, doplněný egyptskou a&nbsp;blízkovýchodní archeologickou sbírkou biblisty Bonaventury Ubacha.\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"geology-hermitages\" data-section-kind=\"narrative\">\n\u003Csummary>Geologie masivu, skalní věže a&nbsp;poustevny\u003C/summary>\n\u003Cdiv>\u003Cp>Horský masiv Montserrat vznikl přibližně před padesáti miliony lety jako říční delta sedimentárních slepenců tmelených vápnitým tmelem. Selektivní zvětrávání a&nbsp;voda rozpouštějící tmel vymodelovaly masiv do zaoblených homolí, skalních věží a&nbsp;jehel, z&nbsp;nichž nejvyšší je vrchol Sant Jeroni s&nbsp;nadmořskou výškou 1&nbsp;236&nbsp;metrů.\u003C/p>\n\u003Cp>Přímo nad klášterním údolím se zvedá skupina věží Els Gorros v&nbsp;čele s&nbsp;Gorra Frígia (1&nbsp;153&nbsp;m&nbsp;n.&nbsp;m.), která slouží jako kolébka katalánského sportovního lezení.\u003C/p>\n\u003Cp>Vysoko ve skalách nad klášterem vznikla síť třinácti historických pousteven, kde od 11.&nbsp;století žili eremité v&nbsp;naprostém odloučení. Poustevny Sant Joan a&nbsp;Sant Onofre stály pod skalním převisem a&nbsp;roku 1599 zde poobědval král Filip&nbsp;II. Po jejich zničení francouzskými vojsky v&nbsp;roce 1812 vyrostla na skalní terase novogotická kaple Sant Joan z&nbsp;roku 1893.\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"trails-routes\" data-section-kind=\"narrative\">\n\u003Csummary>Poutní stezky a&nbsp;vyhlídkové trasy\u003C/summary>\n\u003Cdiv>\u003Cp>Okolí kláštera protíná síť značených stezek spojujících duchovní místa i&nbsp;přírodní vyhlídky. Poutní cesta k&nbsp;Posvátné jeskyni (\u003Cem>Camí de la Santa Cova\u003C/em>) vytesaná do útesu vede k&nbsp;místu tradovaného nálezu sochy roku 880. Lemuje ji soubor patnácti zastavení Monumentálního růžence z&nbsp;let 1896–1916, na nichž spolupracovali Antoni Gaudí, Josep Puig i&nbsp;Cadafalch a&nbsp;Enric Sagnier.\u003C/p>\n\u003Cp>Výstupová trasa na vrchol Sant Jeroni (1&nbsp;236&nbsp;m&nbsp;n.&nbsp;m.) zabere přibližně dvě hodiny pěší chůze z&nbsp;kláštera a&nbsp;z&nbsp;temene otevírá kruhový výhled na celé vnitrozemské Katalánsko i&nbsp;Pyreneje.\u003C/p>\n\u003Cp>Horský okruh kolem pousteven (\u003Cem>Ruta de les Ermites\u003C/em>) propojuje ruiny eremitáží Sant Joan, Sant Onofre i&nbsp;Santa Magdalena pod skalními jehlami Els Gorros, zatímco nenáročná Stezka kapek (\u003Cem>Camí dels Degotalls\u003C/em>) vede pod skalními převisy zdobenými majolikovými mozaikami.\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"visit-context-2026\" data-section-kind=\"narrative\">\n\u003Csummary>Odpolední návštěva a&nbsp;večerní atmosféra v&nbsp;roce 2026\u003C/summary>\n\u003Cdiv>\u003Cp>Návštěva Montserratu dne 27.&nbsp;září&nbsp;2026 proběhla v&nbsp;odpoledních a&nbsp;večerních hodinách od 14.48 do pozdního večera. Příjezd po poledni nabídl možnost zažít klášterní areál v&nbsp;okamžiku, kdy denní turistické zájezdy začaly opouštět náměstí a&nbsp;masiv zalilo teplé podvečerní slunce.\u003C/p>\n\u003Cp>Skupina zachytila Subirachsovu sochu svatého Jiří s&nbsp;jejím iluzivním dutým reliéfem i&nbsp;poklidnou atmosféru v&nbsp;atriovém dvoře baziliky. Večerní hodiny umožnily nerušené vnímání monumentality okolních slepencových věží Els Gorros a&nbsp;tichého šumu větru v&nbsp;roklinách po západu slunce, kdy se horské údolí ponořilo do tmy a&nbsp;rozsvítila se pouze světla klášterních luceren.\u003C/p>\n\u003C/div>\n\u003C/details>",locationOfficialHtml:"\u003Ctable>\n\u003Cthead>\n\u003Ctr>\n\u003Cth align=\"left\">Parametr\u003C/th>\n\u003Cth align=\"left\">Údaj\u003C/th>\n\u003C/tr>\n\u003C/thead>\n\u003Ctbody>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Oficiální název\u003C/th>\n\u003Ctd align=\"left\">Monestir de Santa Maria de Montserrat\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Hlavní architekti\u003C/th>\n\u003Ctd align=\"left\">Francesc de Paula del Villar i&nbsp;Carmona (průčelí 1900–1901)\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Klíčoví spolupracovníci\u003C/th>\n\u003Ctd align=\"left\">Agapit a&nbsp;Venanci Vallmitjanovi (sochy fasády), Josep Maria Subirachs (moderní plastiky), Josep Puig i&nbsp;Cadafalch (náměstí a&nbsp;muzeum) \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Zakladatel kláštera\u003C/th>\n\u003Ctd align=\"left\">Opat Oliba z&nbsp;Ripollu (rok 1025)\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Doba výstavby\u003C/th>\n\u003Ctd align=\"left\">od roku 1025 (klášter); 1592 (renesanční bazilika); 1901 (neoplatereskní průčelí) \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Architektonický styl\u003C/th>\n\u003Ctd align=\"left\">románský původ, renesanční bazilika, katalánský modernismus a&nbsp;historismus\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Lokalita a&nbsp;adresa\u003C/th>\n\u003Ctd align=\"left\">08199 Monistrol de Montserrat, comarca El Bages (Katalánsko), Španělsko\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Rozměry a&nbsp;poloha\u003C/th>\n\u003Ctd align=\"left\">nadmořská výška kláštera 720&nbsp;m&nbsp;n.&nbsp;m., nejvyšší vrchol masivu Sant Jeroni 1&nbsp;236&nbsp;m&nbsp;n.&nbsp;m.\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Významná díla a&nbsp;památky\u003C/th>\n\u003Ctd align=\"left\">La Moreneta (konec 12.&nbsp;století), Llibre Vermell (konec 14.&nbsp;století), Caravaggiův Svatý Jeroným (kolem 1605)\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Současné využití a&nbsp;správa\u003C/th>\n\u003Ctd align=\"left\">Benediktinské arciopatství, poutní bazilika a&nbsp;muzeum; chlapecký sbor Escolania de Montserrat\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Památková ochrana\u003C/th>\n\u003Ctd align=\"left\">BCIL (kód záznamu IPA-16806); poustevny v&nbsp;katalogu IPAC (kódy IPA-54016 a&nbsp;IPA-54020)\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Oficiální web\u003C/th>\n\u003Ctd align=\"left\">\u003Ca href=\"https://abadiamontserrat.cat/\">abadiamontserrat.cat\u003C/a>\u003C/td>\n\u003C/tr>\n\u003C/tbody>\n\u003C/table>\n",aliases:["Monestir de Santa Maria de Montserrat","Santa Maria de Montserrat","Montserrat Monastery","Klášter Montserrat"],heroImage:{src:"/travel-guide/teasers/montserrat/hero thumb",type:"image/jpeg",path:"/images/previews-admin/IMG_0612.jpeg",width:534,height:300}],rating:5,people:[]},{id:"img0616",type:"image",src:"IMG_0616.JPEG",alt:"AB Sagrada Familia - Gaudí, Barcelona",title:"",width:4032,height:3024,sizeMB:1.18,aspectRatio:"landscape-4-3",placeholder:"blurs/IMG_0616.png",placeholderColor:"rgb(104,120,136)",analysis:{aestheticScore:56.927055806870435,sharpness:38,qualityBucket:"poor",phash:"b9b1f8fa74c9c0e1"},exif:{date:"2026-09-28T20:06:17",releaseDate:"2026-09-28T20:06:17",author:"Cebreus",location:"AB Sagrada Familia - Gaudí",sublocation:"AB Sagrada Familia - Gaudí",city:"Barcelona",latitude:41.407178,longitude:2.176281,orientation:1,country:"Španělsko",countryCode:"ESP",state:"Katalánsko"},author:"Cebreus",authorSlug:"cebreus",location:"AB Sagrada Familia - Gaudí",city:"Barcelona",googleMapsUrl:"https://www.google.com/maps/search/?api=1&query=41.407178,2.176281",date:"2026-09-28T20:06:17",sources:[{variant:"default",type:"image/webp",path:"/images/previews-webp/IMG_0616.webp",width:370},{variant:"default",type:"image/jpeg",path:"/images/previews/IMG_0616.jpeg",width:370},{variant:"default",type:"image/avif",path:"/images/previews-avif/IMG_0616.avif",width:370},{variant:"xl",type:"image/webp",path:"/images/previews-xl-webp/IMG_0616.webp",width:534},{variant:"xl",type:"image/jpeg",path:"/images/previews-xl/IMG_0616.jpeg",width:534},{variant:"xl",type:"image/avif",path:"/images/previews-xl-avif/IMG_0616.avif",width:534},{variant:"detail",type:"image/jpeg",path:"/images/details/IMG_0616.jpeg",width:1707,height:1280},{variant:"fallback",type:"image/jpeg",path:"/images/previews-xxs/IMG_0616.jpeg",width:190,height:127},{variant:"admin_thumb",type:"image/jpeg",path:"/images/previews-admin/IMG_0616.jpeg",width:534,height:401}],people:[]},{id:"loc-casa-batllo-main-2026-09-28t213039",type:"separator",location:"Casa Batlló",city:"Barcelona",hasPhotos:true,startDate:"2026-09-28T21:30:39",endDate:"2026-09-28T23:59:59",storyTitle:"Casa Batlló",story:"\u003Cp class=\"lead\" data-section-id=\"lead\">Dům Casa Batlló na barcelonském bulváru Passeig de Gràcia představuje jedno z&nbsp;vrcholných děl katalánského modernismu a&nbsp;autorské tvorby Antoniho Gaudího. Architekt v&nbsp;letech 1904–1906 radikálně přetvořil starší klasicistní stavbu v&nbsp;organický organismus s&nbsp;vlnící se kamennou fasádou, zářivou mozaikou \u003Cem>trencadís\u003C/em> a&nbsp;střechou připomínající dračí hřbet. Budova stírá hranice mezi architekturou a&nbsp;sochařstvím a&nbsp;propojuje přírodní formy s&nbsp;důmyslným systémem přirozeného větrání a&nbsp;denního osvětlení.\u003C/p>\u003Cdetails data-section-id=\"history-origin\" data-section-kind=\"narrative\">\n\u003Csummary>Původní stavba a&nbsp;radikální přestavba\u003C/summary>\n\u003Cdiv>\u003Cp>Původní čtyřpatrovou budovu na adrese Passeig de Gràcia 43 postavil v&nbsp;roce 1877 architekt Emili Sala Cortés, který dříve vyučoval Antoniho Gaudího na barcelonské škole architektury. Nemovitost zakoupil v&nbsp;roce 1903 významný textilní průmyslník Josep Batlló i&nbsp;Casanovas s&nbsp;manželkou Amàlií Godó Belaunzaran.\u003C/p>\n\u003Cp>Majitel původně zamýšlel dům zcela strhnout a&nbsp;vystavět konvenční novostavbu, avšak Gaudí jej přesvědčil k&nbsp;radikální rekonstrukci se zachováním nosné struktury obvodových zdí. Městská rada schválila projekt přestavby v&nbsp;roce 1904 a&nbsp;stavební práce pod vedením stavitele Josepa Bayó skončily na podzim roku 1906.\u003C/p>\n\u003Cp>Dům tvoří součást proslulého bloku zvaného Manzana de la Discordia (katalánsky Illa de la Discòrdia neboli Blok sváru). Název odkazuje na stylové soupeření předních mistrů katalánského modernismu, jejichž domy vyrostly těsně vedle sebe na společné uliční čáře. Bezprostředními sousedy se staly paláce Casa Amatller od Josepa Puiga i&nbsp;Cadafalcha a&nbsp;Casa Lleó Morera od Lluíse Domènecha i&nbsp;Montanera.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"construction-facade\" data-section-kind=\"narrative\">\n\u003Csummary>Konstrukční řešení, zvlněná fasáda a&nbsp;materiály\u003C/summary>\n\u003Cdiv>\u003Cp>Gaudí zachoval původní obvodové zdivo, avšak kompletně přepracoval spodní patra a&nbsp;přistavěl nové podkroví se střešní terasou. Celková užitná plocha po úpravách dosáhla přibližně 4&nbsp;300&nbsp;m² při výšce budovy 32&nbsp;metrů a&nbsp;šířce uličního průčelí 14,5&nbsp;metru.\u003C/p>\n\u003Cp>Přízemí a&nbsp;panské patro podpírají masivní sloupy z&nbsp;pískovce vytěženého v&nbsp;lomu na barcelonském vrchu Montjuïc. Organické modelování sloupů s&nbsp;prvky připomínajícími klouby a&nbsp;kosti vyneslo stavbě lidový název Dům z&nbsp;kostí (katalánsky \u003Cem>Casa dels ossos\u003C/em>). Vyšší patra pokrývá polychromní omítka kombinovaná se střepovou mozaikou \u003Cem>trencadís\u003C/em>, kterou navrhl architekt Josep Maria Jujol ze zlomků glazované keramiky z&nbsp;dílen Pujol i&nbsp;Bausis a&nbsp;barevných skleněných kotoučů od bratří Pelegrí.\u003C/p>\n\u003Cp>Zábradlí balkonů mají tvar karnevalových masek či lebek, přičemž každý díl tvoří jediný litinový odlitek ukotvený do kamenného zdiva pouze ve dvou bodech. Těsně pod hřebenem střechy vystupuje solitérní kruhový balkon kalichovitého tvaru, zvaný Balkon princezny. Jako hlavní stavitel a&nbsp;dodavatel stavebních prací působil Gaudího osvědčený spolupracovník Josep Bayó i&nbsp;Font.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"interior-noble-floor\" data-section-kind=\"narrative\">\n\u003Csummary>Panské patro, skříňová oratoř a&nbsp;hlavní salón\u003C/summary>\n\u003Cdiv>\u003Cp>Rodina Batlló obývala panské patro (katalánsky \u003Cem>planta noble\u003C/em>) o&nbsp;podlahové ploše přibližně 400&nbsp;m², odkud vedl přímý vstup na soukromou zahradní terasu ve vnitrobloku. Hlavní společenský salón směřuje do bulváru Passeig de Gràcia rozměrnou prosklenou tribunou s&nbsp;kruhovými vitrážemi v&nbsp;olověných páscích, které do místnosti propouštějí měkké barevné světlo.\u003C/p>\n\u003Cp>Strop ústředního salónu se spirálovitě stáčí v&nbsp;plynulých štukových křivkách a&nbsp;vytváří dojem mohutného mořského víru kolem centrálního lustru. Přímo v&nbsp;salónu navrhl Gaudí vestavěnou skříňovou oratoř, která po rozevření dřevěných křídel proměnila obytný prostor v&nbsp;domácí kapli s&nbsp;vyřezávaným retáblem Svaté rodiny od Josepa Llimony.\u003C/p>\n\u003Cp>Součástí bytu je krbový salón s&nbsp;intimním výklenkem ve tvaru houby, v&nbsp;němž stojí dvě vestavěné kožené lavice — dvoumístná pro mladý pár a&nbsp;protilehlá pro doprovázející gardedámu. Gaudí navíc odmítl sériové kování; veškeré mosazné kliky, okenní táhla i&nbsp;dubový nábytek vymodeloval stiskem vlastní dlaně z&nbsp;vosku jako raný příklad anatomické ergonomie.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"interior-lightwell\" data-section-kind=\"narrative\">\n\u003Csummary>Centrální světlík, modré kachle a&nbsp;secesní výtah\u003C/summary>\n\u003Cdiv>\u003Cp>Gaudí spojil dvě původní úzké šachty do jediného centrálního světlíku (katalánsky \u003Cem>pati de llums\u003C/em>), který tvoří vertikální světelné i&nbsp;vzdušné jádro domu. Stěny šachty pokrývá více než 15&nbsp;000 glazovaných keramických kachlů v&nbsp;pěti odstínech modré barvy. U&nbsp;střešního světlíku mají kachle sytý kobaltový tón, který směrem dolů postupně přechází přes nebeskou modř až k&nbsp;perleťově bílému odstínu na dně šachty, což kompenzuje úbytek denního světla.\u003C/p>\n\u003Cp>Tomuto záměru odpovídá i&nbsp;velikost okenních otvorů, které se směrem dolů plynule rozšiřují. Pod každým oknem zabudoval architekt ručně ovládané borovicové žaluzie umožňující přesně regulovat přirozené větrání bytů bez průvanu.\u003C/p>\n\u003Cp>Schodiště lemují tabule litého reliéfního skla, které při průhledu na modré keramické stěny lámou světlo a&nbsp;vytvářejí optickou iluzi chvějící se mořské hladiny. Uprostřed schodišťového tubusu funguje původní secesní výtah z&nbsp;roku 1906 s&nbsp;vyřezávanou dřevěnou kabinou a&nbsp;kovanou šachtou, který v&nbsp;roce 1999 citlivě zrestauroval architekt Joan Bassegoda Nonell.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"courtyard-garden\" data-section-kind=\"narrative\">\n\u003Csummary>Privátní zahradní terasa a&nbsp;zadní fasáda\u003C/summary>\n\u003Cdiv>\u003Cp>Ze zadního traktu panského bytu se přes jídelnu s&nbsp;alhambrickými sloupy vychází na soukromou zahradní terasu o&nbsp;rozloze 230&nbsp;m². Tento klidný dvůr chránil rodinu před hlukem velkoměsta. Podlahu tvoří geometrická keramická mozaika typu Nolla sestavená z&nbsp;více než 85&nbsp;000 drobných dílků s&nbsp;okrovými a&nbsp;hnědými ornamentálními pásy.\u003C/p>\n\u003Cp>Zadní dělicí zeď vnitrobloku proměnil Gaudí v&nbsp;monumentální mozaikovou stěnu zdobenou technikou \u003Cem>trencadís\u003C/em>, do níž jsou vsazeny ručně malované keramické talíře a&nbsp;vertikální trubice sloužící jako květníky pro popínavé rostliny. Plochu doplňují polygonální květináče na kovaných nožkách osázené modrým jasmínem.\u003C/p>\n\u003Cp>Střed dvora původně zastřešovala lehká parabolická pergola z&nbsp;vřesového proutí (katalánsky \u003Cem>pèrgola de bruc\u003C/em>), která v&nbsp;polovině 20.&nbsp;století zanikla. V&nbsp;letech 2024–2025 byla pergola precizně rekonstruována na základě dobových fotografií z&nbsp;rodinného archivu Batlló. Zadní fasáda domu má zvlněný profil a&nbsp;její balkony s&nbsp;litinovým zábradlím nesou ojedinělé spirálové ocelové nosníky.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"roof-dragon-chimneys\" data-section-kind=\"narrative\">\n\u003Csummary>Podkroví, dračí hřbet a&nbsp;střešní komíny\u003C/summary>\n\u003Cdiv>\u003Cp>Podkrovní prostor (katalánsky \u003Cem>desván\u003C/em>) tvoří sled šedesáti tenkých cihelných řetězovkových oblouků omítnutých bílým štukem. Konstrukce vytváří dojem hrudního koše obrovského pravěkého zvířete a&nbsp;vynáší střešní terasu bez nutnosti jediného vnitřního sloupu. Původně sloužila nájemníkům jako společné prádelny a&nbsp;sušárny s&nbsp;nepřetržitým provětráváním.\u003C/p>\n\u003Cp>Hřeben střechy má plastický tvar prohnutého dračího hřbetu krytého velkými keramickými tvarovkami připomínajícími šupiny s&nbsp;proměnlivým leskem od zelené přes tyrkysovou až po růžovou barvu. Z&nbsp;levé části střechy vyrůstá válcová věž zakončená cibulovitou bání a&nbsp;čtyřramenným křížem s&nbsp;monogramy Ježíše, Marie a&nbsp;Josefa.\u003C/p>\n\u003Cp>Podle tradičního výkladu zosobňuje střecha legendu o&nbsp;patronu Katalánska svatém Jiřím: věž představuje kopí vbodnuté do hřbetu draka a&nbsp;červená keramika pod ní symbolizuje krev obludy. Na terase stojí dvacet sedm komínů sdružených do čtyř skupin. Jejich šroubovitá těla s&nbsp;hlavicemi z&nbsp;mozaiky \u003Cem>trencadís\u003C/em> zabraňují zpětnému tahu větru a&nbsp;chrání kouřovody před deštěm.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"restoration-heritage\" data-section-kind=\"narrative\">\n\u003Csummary>Historický vývoj a&nbsp;památková obnova\u003C/summary>\n\u003Cdiv>\u003Cp>Po smrti Josepa Batlló v&nbsp;roce 1934 spravovaly dům jeho dcery, které nemovitost roku 1954 prodaly pojišťovně Seguros Iberia. Komerční využití vedlo k&nbsp;přestavbě části interiérů na kanceláře. Španělská vláda prohlásila stavbu v&nbsp;roce 1969 národní historicko-uměleckou památkou, což zastavilo další nevhodné zásahy.\u003C/p>\n\u003Cp>Zásadní obrat nastal v&nbsp;roce 1993, kdy budovu zakoupila rodina Bernatových. Noví majitelé zahájili systematické restaurování a&nbsp;v&nbsp;roce 2002 dům trvale otevřeli veřejnosti při příležitosti Mezinárodního roku Gaudího. Roku 2005 zapsal Výbor pro světové dědictví UNESCO dům Casa Batlló na prestižní Seznam světového dědictví.\u003C/p>\n\u003Cp>V&nbsp;roce 2019 proběhla generální obnova uličního průčelí a&nbsp;panského patra pod vedením architekta Xaviera Villanuevy. Restaurátoři odstranili druhotné nátěry, odhalili původní autorské štuky, vyčistili mozaiky \u003Cem>trencadís\u003C/em> a&nbsp;pomocí technologie kataforézy zakonzervovali historické litinové balkony.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"visit-context-2026\" data-section-kind=\"narrative\">\n\u003Csummary>Večerní návštěva a&nbsp;režim provozu v&nbsp;roce 2026\u003C/summary>\n\u003Cdiv>\u003Cp>Návštěva Casa Batlló dne 28.&nbsp;září&nbsp;2026 proběhla v&nbsp;pozdních večerních hodinách mezi 21.30 a&nbsp;půlnocí v&nbsp;rámci nočního prohlídkového okruhu. Uliční průčelí bylo slavnostně nasvíceno, což zvýraznilo plastické křivky litinových masek a&nbsp;třpytivý odlesk Jujolovy keramické mozaiky pod noční oblohou bulváru Passeig de Gràcia.\u003C/p>\n\u003Cp>V&nbsp;interiéru byl v&nbsp;roce 2026 standardem imerzivní zážitek kombinující rozšířenou realitu v&nbsp;chytrých tabletech s&nbsp;hudebním doprovodem a&nbsp;závěrečnou audiovizuální instalací v&nbsp;suterénu budovy. Střešní terasa nabídla tichou večerní atmosféru kolem osvětleného dračího hřbetu a&nbsp;sochařských komínů s&nbsp;pohledem na rozsvícené centrum Barcelony.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"facts\" data-section-kind=\"facts\">\n\u003Csummary>Základní údaje\u003C/summary>\n\u003Cdiv>\u003Ctable>\n\u003Cthead>\n\u003Ctr>\n\u003Cth align=\"left\">Parametr\u003C/th>\n\u003Cth align=\"left\">Údaj\u003C/th>\n\u003C/tr>\n\u003C/thead>\n\u003Ctbody>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Oficiální název\u003C/th>\n\u003Ctd align=\"left\">Casa Batlló\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Hlavní architekt\u003C/th>\n\u003Ctd align=\"left\">Antoni Gaudí i&nbsp;Cornet (1852–1926)\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Klíčoví spolupracovníci\u003C/th>\n\u003Ctd align=\"left\">Josep Maria Jujol (mozaiky), Josep Bayó i&nbsp;Font (stavitel), dílna Casas i&nbsp;Bardés (truhlářské práce), bratři Pelegrí (vitráže) \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Původní stavebník\u003C/th>\n\u003Ctd align=\"left\">Josep Batlló i&nbsp;Casanovas a&nbsp;Amàlia Godó Belaunzaran (přestavba); Emili Sala Cortés (původní dům 1877)\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Doba výstavby\u003C/th>\n\u003Ctd align=\"left\">1877 (původní dům); 1904–1906 (přestavba Antoni Gaudí) \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Architektonický styl\u003C/th>\n\u003Ctd align=\"left\">katalánský modernismus (\u003Cem>Modernisme\u003C/em>), organická architektura\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Lokalita a&nbsp;adresa\u003C/th>\n\u003Ctd align=\"left\">Passeig de Gràcia 43, 08007 Barcelona, Španělsko\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Rozměry a&nbsp;plocha\u003C/th>\n\u003Ctd align=\"left\">šířka průčelí 14,5&nbsp;m, výška 32&nbsp;m, užitná plocha cca 4&nbsp;300&nbsp;m² (8&nbsp;podlaží) \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Současné využití\u003C/th>\n\u003Ctd align=\"left\">soukromé muzeum a&nbsp;veřejně přístupná kulturní památka (rodina Bernatových)\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Památková ochrana\u003C/th>\n\u003Ctd align=\"left\">BCIN (kód 60-MH-EN, IPAC IPA-46); Seznam světového dědictví UNESCO (ref. 320bis-006) \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Oficiální web\u003C/th>\n\u003Ctd align=\"left\">\u003Ca href=\"https://www.casabatllo.es/\">casabatllo.es\u003C/a>\u003C/td>\n\u003C/tr>\n\u003C/tbody>\n\u003C/table>\n\u003C/div>\n\u003C/details>",locationId:"casa-batllo",locationLeadHtml:"\u003Cp class=\"lead\" data-section-id=\"lead\">Dům Casa Batlló na barcelonském bulváru Passeig de Gràcia představuje jedno z&nbsp;vrcholných děl katalánského modernismu a&nbsp;autorské tvorby Antoniho Gaudího. Architekt v&nbsp;letech 1904–1906 radikálně přetvořil starší klasicistní stavbu v&nbsp;organický organismus s&nbsp;vlnící se kamennou fasádou, zářivou mozaikou \u003Cem>trencadís\u003C/em> a&nbsp;střechou připomínající dračí hřbet. Budova stírá hranice mezi architekturou a&nbsp;sochařstvím a&nbsp;propojuje přírodní formy s&nbsp;důmyslným systémem přirozeného větrání a&nbsp;denního osvětlení.\u003C/p>",locationHtml:"\u003Cdetails data-section-id=\"history-origin\" data-section-kind=\"narrative\">\n\u003Csummary>Původní stavba a&nbsp;radikální přestavba\u003C/summary>\n\u003Cdiv>\u003Cp>Původní čtyřpatrovou budovu na adrese Passeig de Gràcia 43 postavil v&nbsp;roce 1877 architekt Emili Sala Cortés, který dříve vyučoval Antoniho Gaudího na barcelonské škole architektury. Nemovitost zakoupil v&nbsp;roce 1903 významný textilní průmyslník Josep Batlló i&nbsp;Casanovas s&nbsp;manželkou Amàlií Godó Belaunzaran.\u003C/p>\n\u003Cp>Majitel původně zamýšlel dům zcela strhnout a&nbsp;vystavět konvenční novostavbu, avšak Gaudí jej přesvědčil k&nbsp;radikální rekonstrukci se zachováním nosné struktury obvodových zdí. Městská rada schválila projekt přestavby v&nbsp;roce 1904 a&nbsp;stavební práce pod vedením stavitele Josepa Bayó skončily na podzim roku 1906.\u003C/p>\n\u003Cp>Dům tvoří součást proslulého bloku zvaného Manzana de la Discordia (katalánsky Illa de la Discòrdia neboli Blok sváru). Název odkazuje na stylové soupeření předních mistrů katalánského modernismu, jejichž domy vyrostly těsně vedle sebe na společné uliční čáře. Bezprostředními sousedy se staly paláce Casa Amatller od Josepa Puiga i&nbsp;Cadafalcha a&nbsp;Casa Lleó Morera od Lluíse Domènecha i&nbsp;Montanera.\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"construction-facade\" data-section-kind=\"narrative\">\n\u003Csummary>Konstrukční řešení, zvlněná fasáda a&nbsp;materiály\u003C/summary>\n\u003Cdiv>\u003Cp>Gaudí zachoval původní obvodové zdivo, avšak kompletně přepracoval spodní patra a&nbsp;přistavěl nové podkroví se střešní terasou. Celková užitná plocha po úpravách dosáhla přibližně 4&nbsp;300&nbsp;m² při výšce budovy 32&nbsp;metrů a&nbsp;šířce uličního průčelí 14,5&nbsp;metru.\u003C/p>\n\u003Cp>Přízemí a&nbsp;panské patro podpírají masivní sloupy z&nbsp;pískovce vytěženého v&nbsp;lomu na barcelonském vrchu Montjuïc. Organické modelování sloupů s&nbsp;prvky připomínajícími klouby a&nbsp;kosti vyneslo stavbě lidový název Dům z&nbsp;kostí (katalánsky \u003Cem>Casa dels ossos\u003C/em>). Vyšší patra pokrývá polychromní omítka kombinovaná se střepovou mozaikou \u003Cem>trencadís\u003C/em>, kterou navrhl architekt Josep Maria Jujol ze zlomků glazované keramiky z&nbsp;dílen Pujol i&nbsp;Bausis a&nbsp;barevných skleněných kotoučů od bratří Pelegrí.\u003C/p>\n\u003Cp>Zábradlí balkonů mají tvar karnevalových masek či lebek, přičemž každý díl tvoří jediný litinový odlitek ukotvený do kamenného zdiva pouze ve dvou bodech. Těsně pod hřebenem střechy vystupuje solitérní kruhový balkon kalichovitého tvaru, zvaný Balkon princezny. Jako hlavní stavitel a&nbsp;dodavatel stavebních prací působil Gaudího osvědčený spolupracovník Josep Bayó i&nbsp;Font.\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"interior-noble-floor\" data-section-kind=\"narrative\">\n\u003Csummary>Panské patro, skříňová oratoř a&nbsp;hlavní salón\u003C/summary>\n\u003Cdiv>\u003Cp>Rodina Batlló obývala panské patro (katalánsky \u003Cem>planta noble\u003C/em>) o&nbsp;podlahové ploše přibližně 400&nbsp;m², odkud vedl přímý vstup na soukromou zahradní terasu ve vnitrobloku. Hlavní společenský salón směřuje do bulváru Passeig de Gràcia rozměrnou prosklenou tribunou s&nbsp;kruhovými vitrážemi v&nbsp;olověných páscích, které do místnosti propouštějí měkké barevné světlo.\u003C/p>\n\u003Cp>Strop ústředního salónu se spirálovitě stáčí v&nbsp;plynulých štukových křivkách a&nbsp;vytváří dojem mohutného mořského víru kolem centrálního lustru. Přímo v&nbsp;salónu navrhl Gaudí vestavěnou skříňovou oratoř, která po rozevření dřevěných křídel proměnila obytný prostor v&nbsp;domácí kapli s&nbsp;vyřezávaným retáblem Svaté rodiny od Josepa Llimony.\u003C/p>\n\u003Cp>Součástí bytu je krbový salón s&nbsp;intimním výklenkem ve tvaru houby, v&nbsp;němž stojí dvě vestavěné kožené lavice — dvoumístná pro mladý pár a&nbsp;protilehlá pro doprovázející gardedámu. Gaudí navíc odmítl sériové kování; veškeré mosazné kliky, okenní táhla i&nbsp;dubový nábytek vymodeloval stiskem vlastní dlaně z&nbsp;vosku jako raný příklad anatomické ergonomie.\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"interior-lightwell\" data-section-kind=\"narrative\">\n\u003Csummary>Centrální světlík, modré kachle a&nbsp;secesní výtah\u003C/summary>\n\u003Cdiv>\u003Cp>Gaudí spojil dvě původní úzké šachty do jediného centrálního světlíku (katalánsky \u003Cem>pati de llums\u003C/em>), který tvoří vertikální světelné i&nbsp;vzdušné jádro domu. Stěny šachty pokrývá více než 15&nbsp;000 glazovaných keramických kachlů v&nbsp;pěti odstínech modré barvy. U&nbsp;střešního světlíku mají kachle sytý kobaltový tón, který směrem dolů postupně přechází přes nebeskou modř až k&nbsp;perleťově bílému odstínu na dně šachty, což kompenzuje úbytek denního světla.\u003C/p>\n\u003Cp>Tomuto záměru odpovídá i&nbsp;velikost okenních otvorů, které se směrem dolů plynule rozšiřují. Pod každým oknem zabudoval architekt ručně ovládané borovicové žaluzie umožňující přesně regulovat přirozené větrání bytů bez průvanu.\u003C/p>\n\u003Cp>Schodiště lemují tabule litého reliéfního skla, které při průhledu na modré keramické stěny lámou světlo a&nbsp;vytvářejí optickou iluzi chvějící se mořské hladiny. Uprostřed schodišťového tubusu funguje původní secesní výtah z&nbsp;roku 1906 s&nbsp;vyřezávanou dřevěnou kabinou a&nbsp;kovanou šachtou, který v&nbsp;roce 1999 citlivě zrestauroval architekt Joan Bassegoda Nonell.\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"courtyard-garden\" data-section-kind=\"narrative\">\n\u003Csummary>Privátní zahradní terasa a&nbsp;zadní fasáda\u003C/summary>\n\u003Cdiv>\u003Cp>Ze zadního traktu panského bytu se přes jídelnu s&nbsp;alhambrickými sloupy vychází na soukromou zahradní terasu o&nbsp;rozloze 230&nbsp;m². Tento klidný dvůr chránil rodinu před hlukem velkoměsta. Podlahu tvoří geometrická keramická mozaika typu Nolla sestavená z&nbsp;více než 85&nbsp;000 drobných dílků s&nbsp;okrovými a&nbsp;hnědými ornamentálními pásy.\u003C/p>\n\u003Cp>Zadní dělicí zeď vnitrobloku proměnil Gaudí v&nbsp;monumentální mozaikovou stěnu zdobenou technikou \u003Cem>trencadís\u003C/em>, do níž jsou vsazeny ručně malované keramické talíře a&nbsp;vertikální trubice sloužící jako květníky pro popínavé rostliny. Plochu doplňují polygonální květináče na kovaných nožkách osázené modrým jasmínem.\u003C/p>\n\u003Cp>Střed dvora původně zastřešovala lehká parabolická pergola z&nbsp;vřesového proutí (katalánsky \u003Cem>pèrgola de bruc\u003C/em>), která v&nbsp;polovině 20.&nbsp;století zanikla. V&nbsp;letech 2024–2025 byla pergola precizně rekonstruována na základě dobových fotografií z&nbsp;rodinného archivu Batlló. Zadní fasáda domu má zvlněný profil a&nbsp;její balkony s&nbsp;litinovým zábradlím nesou ojedinělé spirálové ocelové nosníky.\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"roof-dragon-chimneys\" data-section-kind=\"narrative\">\n\u003Csummary>Podkroví, dračí hřbet a&nbsp;střešní komíny\u003C/summary>\n\u003Cdiv>\u003Cp>Podkrovní prostor (katalánsky \u003Cem>desván\u003C/em>) tvoří sled šedesáti tenkých cihelných řetězovkových oblouků omítnutých bílým štukem. Konstrukce vytváří dojem hrudního koše obrovského pravěkého zvířete a&nbsp;vynáší střešní terasu bez nutnosti jediného vnitřního sloupu. Původně sloužila nájemníkům jako společné prádelny a&nbsp;sušárny s&nbsp;nepřetržitým provětráváním.\u003C/p>\n\u003Cp>Hřeben střechy má plastický tvar prohnutého dračího hřbetu krytého velkými keramickými tvarovkami připomínajícími šupiny s&nbsp;proměnlivým leskem od zelené přes tyrkysovou až po růžovou barvu. Z&nbsp;levé části střechy vyrůstá válcová věž zakončená cibulovitou bání a&nbsp;čtyřramenným křížem s&nbsp;monogramy Ježíše, Marie a&nbsp;Josefa.\u003C/p>\n\u003Cp>Podle tradičního výkladu zosobňuje střecha legendu o&nbsp;patronu Katalánska svatém Jiřím: věž představuje kopí vbodnuté do hřbetu draka a&nbsp;červená keramika pod ní symbolizuje krev obludy. Na terase stojí dvacet sedm komínů sdružených do čtyř skupin. Jejich šroubovitá těla s&nbsp;hlavicemi z&nbsp;mozaiky \u003Cem>trencadís\u003C/em> zabraňují zpětnému tahu větru a&nbsp;chrání kouřovody před deštěm.\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"restoration-heritage\" data-section-kind=\"narrative\">\n\u003Csummary>Historický vývoj a&nbsp;památková obnova\u003C/summary>\n\u003Cdiv>\u003Cp>Po smrti Josepa Batlló v&nbsp;roce 1934 spravovaly dům jeho dcery, které nemovitost roku 1954 prodaly pojišťovně Seguros Iberia. Komerční využití vedlo k&nbsp;přestavbě části interiérů na kanceláře. Španělská vláda prohlásila stavbu v&nbsp;roce 1969 národní historicko-uměleckou památkou, což zastavilo další nevhodné zásahy.\u003C/p>\n\u003Cp>Zásadní obrat nastal v&nbsp;roce 1993, kdy budovu zakoupila rodina Bernatových. Noví majitelé zahájili systematické restaurování a&nbsp;v&nbsp;roce 2002 dům trvale otevřeli veřejnosti při příležitosti Mezinárodního roku Gaudího. Roku 2005 zapsal Výbor pro světové dědictví UNESCO dům Casa Batlló na prestižní Seznam světového dědictví.\u003C/p>\n\u003Cp>V&nbsp;roce 2019 proběhla generální obnova uličního průčelí a&nbsp;panského patra pod vedením architekta Xaviera Villanuevy. Restaurátoři odstranili druhotné nátěry, odhalili původní autorské štuky, vyčistili mozaiky \u003Cem>trencadís\u003C/em> a&nbsp;pomocí technologie kataforézy zakonzervovali historické litinové balkony.\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"visit-context-2026\" data-section-kind=\"narrative\">\n\u003Csummary>Večerní návštěva a&nbsp;režim provozu v&nbsp;roce 2026\u003C/summary>\n\u003Cdiv>\u003Cp>Návštěva Casa Batlló dne 28.&nbsp;září&nbsp;2026 proběhla v&nbsp;pozdních večerních hodinách mezi 21.30 a&nbsp;půlnocí v&nbsp;rámci nočního prohlídkového okruhu. Uliční průčelí bylo slavnostně nasvíceno, což zvýraznilo plastické křivky litinových masek a&nbsp;třpytivý odlesk Jujolovy keramické mozaiky pod noční oblohou bulváru Passeig de Gràcia.\u003C/p>\n\u003Cp>V&nbsp;interiéru byl v&nbsp;roce 2026 standardem imerzivní zážitek kombinující rozšířenou realitu v&nbsp;chytrých tabletech s&nbsp;hudebním doprovodem a&nbsp;závěrečnou audiovizuální instalací v&nbsp;suterénu budovy. Střešní terasa nabídla tichou večerní atmosféru kolem osvětleného dračího hřbetu a&nbsp;sochařských komínů s&nbsp;pohledem na rozsvícené centrum Barcelony.\u003C/p>\n\u003C/div>\n\u003C/details>",locationOfficialHtml:"\u003Ctable>\n\u003Cthead>\n\u003Ctr>\n\u003Cth align=\"left\">Parametr\u003C/th>\n\u003Cth align=\"left\">Údaj\u003C/th>\n\u003C/tr>\n\u003C/thead>\n\u003Ctbody>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Oficiální název\u003C/th>\n\u003Ctd align=\"left\">Casa Batlló\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Hlavní architekt\u003C/th>\n\u003Ctd align=\"left\">Antoni Gaudí i&nbsp;Cornet (1852–1926)\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Klíčoví spolupracovníci\u003C/th>\n\u003Ctd align=\"left\">Josep Maria Jujol (mozaiky), Josep Bayó i&nbsp;Font (stavitel), dílna Casas i&nbsp;Bardés (truhlářské práce), bratři Pelegrí (vitráže) \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Původní stavebník\u003C/th>\n\u003Ctd align=\"left\">Josep Batlló i&nbsp;Casanovas a&nbsp;Amàlia Godó Belaunzaran (přestavba); Emili Sala Cortés (původní dům 1877)\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Doba výstavby\u003C/th>\n\u003Ctd align=\"left\">1877 (původní dům); 1904–1906 (přestavba Antoni Gaudí) \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Architektonický styl\u003C/th>\n\u003Ctd align=\"left\">katalánský modernismus (\u003Cem>Modernisme\u003C/em>), organická architektura\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Lokalita a&nbsp;adresa\u003C/th>\n\u003Ctd align=\"left\">Passeig de Gràcia 43, 08007 Barcelona, Španělsko\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Rozměry a&nbsp;plocha\u003C/th>\n\u003Ctd align=\"left\">šířka průčelí 14,5&nbsp;m, výška 32&nbsp;m, užitná plocha cca 4&nbsp;300&nbsp;m² (8&nbsp;podlaží) \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Současné využití\u003C/th>\n\u003Ctd align=\"left\">soukromé muzeum a&nbsp;veřejně přístupná kulturní památka (rodina Bernatových)\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Památková ochrana\u003C/th>\n\u003Ctd align=\"left\">BCIN (kód 60-MH-EN, IPAC IPA-46); Seznam světového dědictví UNESCO (ref. 320bis-006) \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Oficiální web\u003C/th>\n\u003Ctd align=\"left\">\u003Ca href=\"https://www.casabatllo.es/\">casabatllo.es\u003C/a>\u003C/td>\n\u003C/tr>\n\u003C/tbody>\n\u003C/table>\n",aliases:["Casa dels ossos","Dům z kostí","Dům masek","Batlló House"],heroImage:{src:"/travel-guide/teasers/casa-batllo/hero.jpg",alt:"Barevné průčelí Casa Batlló ve večerním světle"},audio:[{section:"lead",label:"Úvod",identity:"d878473d96a1c48a254c7d763829c551e40f770af34cb914c7d64ae6e436e688",src:"/travel-guide/audio/casa-batllo/d878473d96a1c48a254c7d763829c551e40f770af34cb914c7d64ae6e436e688.m4a"},{section:"history-origin",label:"Původní stavba a radikální přestavba",identity:"c08045339d26d0292b27e12aba31fdf144bd88ea100c8e63be57f30434de3f4f",src:"/travel-guide/audio/casa-batllo/c08045339d26d0292b27e12aba31fdf144bd88ea100c8e63be57f30434de3f4f.m4a"},{section:"construction-facade",label:"Konstrukční řešení, zvlněná fasáda a mate
