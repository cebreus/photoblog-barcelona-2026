image/jpeg",path:"/images/details/IMG_0761.jpeg",width:960,height:1280},{variant:"fallback",type:"image/jpeg",path:"/images/previews-xxs/IMG_0761.jpeg",width:190,height:127},{variant:"admin_thumb",type:"image/jpeg",path:"/images/previews-admin/IMG_0761.jpeg",width:401,height:534}],people:[]},{id:"img0763",type:"image",src:"IMG_0763.JPEG",alt:"Palau de la Música Catalana, Barcelona",title:"",width:8064,height:6048,sizeMB:15.55,aspectRatio:"landscape-4-3",placeholder:"blurs/IMG_0763.png",placeholderColor:"rgb(8,8,8)",analysis:{aestheticScore:65.19653717952313,sharpness:0,qualityBucket:"poor",phash:""},exif:{date:"2026-09-29T16:23:26",releaseDate:"2026-09-29T16:23:26",author:"Cebreus",location:"Palau de la Música Catalana",sublocation:"Palau de la Música Catalana",city:"Barcelona",latitude:41.387353,longitude:2.175136,orientation:1,country:"Španělsko",countryCode:"ESP",state:"Katalánsko"},author:"Cebreus",authorSlug:"cebreus",location:"Palau de la Música Catalana",city:"Barcelona",googleMapsUrl:"https://www.google.com/maps/search/?api=1&query=41.387353,2.175136",date:"2026-09-29T16:23:26",sources:[{variant:"default",type:"image/webp",path:"/images/previews-webp/IMG_0763.webp",width:370},{variant:"default",type:"image/jpeg",path:"/images/previews/IMG_0763.jpeg",width:370},{variant:"default",type:"image/avif",path:"/images/previews-avif/IMG_0763.avif",width:370},{variant:"xl",type:"image/webp",path:"/images/previews-xl-webp/IMG_0763.webp",width:534},{variant:"xl",type:"image/jpeg",path:"/images/previews-xl/IMG_0763.jpeg",width:534},{variant:"xl",type:"image/avif",path:"/images/previews-xl-avif/IMG_0763.avif",width:534},{variant:"detail",type:"image/jpeg",path:"/images/details/IMG_0763.jpeg",width:1707,height:1280},{variant:"fallback",type:"image/jpeg",path:"/images/previews-xxs/IMG_0763.jpeg",width:190,height:127},{variant:"admin_thumb",type:"image/jpeg",path:"/images/previews-admin/IMG_0763.jpeg",width:534,height:401}],people:[]},{id:"loc-cathedral-of-barcelona-main-2026-09-29t163828",type:"separator",location:"Cathedral of Barcelona",city:"Barcelona",hasPhotos:true,startDate:"2026-09-29T16:38:28",endDate:"2026-09-29T16:38:28",storyTitle:"Katedrála svatého Kříže a svaté Eulálie (Catedral de Barcelona)",story:"\u003Cp class=\"lead\" data-section-id=\"lead\">Katedrála svatého Kříže a&nbsp;svaté Eulálie (\u003Cem>Catedral de la Santa Creu i&nbsp;Santa Eulàlia\u003C/em>), nazývaná \u003Cem>La Seu\u003C/em>, tvoří duchovní srdce barcelonské Gotické čtvrti na návrší Mons Taber. Sídlo arcibiskupa představuje vrcholné dílo katalánské gotiky ze 14.&nbsp;a&nbsp;15.&nbsp;století s&nbsp;klidnou křížovou chodbou a&nbsp;tradičním hejnem třinácti bílých hus. Bohatě zdobené neogotické západní průčelí s&nbsp;centrální věží bylo dokončeno na přelomu 19.&nbsp;a&nbsp;20.&nbsp;století podle původních středověkých plánů.\u003C/p>\u003Cdetails data-section-id=\"history-gothic-construction\" data-section-kind=\"narrative\">\n\u003Csummary>Od románských kořenů ke gotické katedrále (1298–1448)\u003C/summary>\n\u003Cdiv>\u003Cp>Dnešní chrám stojí na posvátném místě s&nbsp;nepřerušenou duchovní tradicí od dob římské kolonie Barcino. Pod podlahou katedrály leží základy paleokřesťanské biskupské baziliky ze 4.–6.&nbsp;století s&nbsp;křestním bazénkem, prozkoumané městským muzeem MUHBA. V&nbsp;roce 1058 zde byla za vlády hraběte Ramona Berenguera&nbsp;I. a&nbsp;Almodis de la Marche vysvěcena románská katedrála, jejíž části byly postupně pohlceny velkolepou gotickou novostavbou.\u003C/p>\n\u003Cp>Stavba gotické katedrály začala slavnostním položením základního kamene 1.&nbsp;května 1298 za přítomnosti aragonského krále Jakuba&nbsp;II. a&nbsp;biskupa Bernata Pelegrí. Hlavním mistrem stavby se v&nbsp;roce 1317 stal Jaume Fabre, který přišel z&nbsp;Mallorky a&nbsp;vtiskl stavbě koncepci typickou pro středomořskou gotiku. V&nbsp;práci pokračovali další významní mistři, především Bernat Roca od roku 1358 (autor koncepce zvonic a&nbsp;křížové chodby) a&nbsp;Arnau Bargués kolem roku 1400, který dokončil gotický portál Sant Iu.\u003C/p>\n\u003Cp>Architektura chrámu ztělesňuje vrcholná pravidla katalánské gotiky: trojlodní prostor o&nbsp;délce 93&nbsp;metrů a&nbsp;šířce 40&nbsp;metrů má výrazně halový charakter, protože výška bočních lodí téměř dosahuje osmadvacetimetrové výšky lodi hlavní. Místo složitého lesa vnějších opěrných oblouků známých z&nbsp;francouzských katedrál jsou mohutné kamenné opěráky vtaženy dovnitř půdorysu, kde mezi sebou vytvářejí prostor pro souvislý věnec soukromých a&nbsp;cechovních kaplí.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"crypt-saint-eulalia\" data-section-kind=\"narrative\">\n\u003Csummary>Krypta svaté Eulálie a&nbsp;alabastrový sarkofág Lupa di Francesco\u003C/summary>\n\u003Cdiv>\u003Cp>Přímo pod hlavním oltářem se nachází monumentální krypta svaté Eulálie, přístupná širokým otevřeným schodištěm klesajícím z&nbsp;centrální chrámové lodi. Svatá Eulálie, patronka města Barcelony, byla podle tradice třináctiletá dívka, která odmítla obětovat pohanským bohům a&nbsp;roku 303 nebo 304 podstoupila mučednickou smrt během pronásledování křesťanů za vlády císaře Diokleciána.\u003C/p>\n\u003Cp>Ústředním bodem krypty je mimořádný gotický sarkofág z&nbsp;bílého alabastru, vytvořený v&nbsp;letech 1327–1339 pisánským sochařem Lupem di Francesco pod vlivem toskánské sochařské školy Giovanniho Pisana.  Tělo sarkofágu spočívá na osmi štíhlých sloupech s&nbsp;korintskými hlavicemi a&nbsp;jeho stěny pokrývají figurální reliéfy zachycující jednotlivé výjevy z&nbsp;Euláliina soudu, krutého mučení, její smrti i&nbsp;následného zázračného nalezení ostatků.\u003C/p>\n\u003Cp>Ostatky světice byly do nově vybudované katedrální krypty slavnostně přeneseny v&nbsp;červenci 1339 z&nbsp;původního hrobu v&nbsp;bazilice Santa Maria del Mar za přítomnosti aragonského krále Petra&nbsp;IV. a&nbsp;všech předních představitelů království.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"cloister-thirteen-geese\" data-section-kind=\"narrative\">\n\u003Csummary>Gotická křížová chodba a&nbsp;třináct bílých hus svaté Eulálie\u003C/summary>\n\u003Cdiv>\u003Cp>K&nbsp;jihozápadnímu boku katedrály přiléhá rozsáhlá gotická křížová chodba (katalánsky \u003Cem>claustre\u003C/em>), dokončená v&nbsp;roce 1448 mistrem stavitelem Andreuem Escuderem na základech položených již ve 14.&nbsp;století Bernatem Rocou. Čtvercový ambit s&nbsp;křížovými klenbami a&nbsp;bohatou kamenickou kružbou obepíná centrální rajský dvůr plný vzrostlých magnólií, palem a&nbsp;pomerančovníků.\u003C/p>\n\u003Cp>Nejznámějším symbolem klášterního dvora je stálé hejno třinácti bílých hus (katalánsky \u003Cem>tretze oques blanques\u003C/em>), které obývá zahradní rybníček u&nbsp;gotické kašny svatého Jiří. Tradice chovu třinácti hus připomíná věk svaté Eulálie v&nbsp;době její mučednické smrti (třináct let) i&nbsp;třináct krutých trestů, jimž byla podle legendy římskými soudci vystavena. Bílá barva peří symbolizuje čistotu a&nbsp;nevinnost mladé světice.\u003C/p>\n\u003Cp>Nádvoří je rovněž dějištěm jedné z&nbsp;nejstarších barcelonských slavností: během svátku Těla a&nbsp;Krve Páně (Corpus Christi) se na vodotrysku fontány vznáší prázdná skořápka vejce ozdobená květinami v&nbsp;oblíbeném rituálu zvaném \u003Cem>L&#39;ou com balla\u003C/em> („tančící vejce“), doloženém v&nbsp;katedrálních análech již od roku 1637.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"choir-golden-fleece\" data-section-kind=\"narrative\">\n\u003Csummary>Vyřezávaný chór a&nbsp;kapitula Řádu zlatého rouna z&nbsp;roku 1519\u003C/summary>\n\u003Cdiv>\u003Cp>Po španělském zvyku je chór katedrály (katalánsky \u003Cem>cor\u003C/em>) situován přímo doprostřed hlavní chrámové lodi, oddělen od presbytáře otevřeným prostorem pro procesí. Gotické dřevěné lavice (stally) z&nbsp;let 1390–1399 vytvořil proslulý řezbář Pere Sanglada z&nbsp;dubového dřeva dovezeného z&nbsp;Brugg.  Sangladovy vyřezávané misericordie a&nbsp;opěrky sedadel překypují realistickými, alegorickými i&nbsp;satirickými scénami ze středověkého života.\u003C/p>\n\u003Cp>Chór vstoupil do evropských dějin v&nbsp;březnu roku 1519, kdy mladý španělský král Karel&nbsp;I. (budoucí císař Svaté říše římské Karel&nbsp;V.) zvolil barcelonskou katedrálu za dějiště XIX.&nbsp;slavnostní kapituly prestižního rytířského Řádu zlatého rouna (\u003Cem>Toisón de Oro\u003C/em>). Bylo to poprvé a&nbsp;naposledy v&nbsp;historii, kdy se kapitula tohoto nejvýznamnějšího panovnického řádu sešla na Pyrenejském poloostrově.\u003C/p>\n\u003Cp>Německý renesanční malíř Joan de Borgonya tehdy namaloval na opěradla všech šestašedesáti chórových sedadel erby rytířů řádu a&nbsp;předních evropských panovníků – včetně samotného Karla&nbsp;V., anglického krále Jindřicha&nbsp;VIII., francouzského krále Františka&nbsp;I. či polského krále Zikmunda&nbsp;I. Tato kompletní heraldická galerie se dochovala v&nbsp;autentickém stavu dodnes. Vnější západní stěnu chóru uzavírá monumentální mramorový reliéf od sochaře Bartolomého Ordóñeze zachycující život svaté Eulálie.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"facade-girona-neogothic\" data-section-kind=\"narrative\">\n\u003Csummary>Neogotické průčelí, mecenát Manuela Girony a&nbsp;věž cimbori\u003C/summary>\n\u003Cdiv>\u003Cp>Ačkoli bylo gotické tělo katedrály dokončeno v&nbsp;polovině 15.&nbsp;století, hlavní západní průčelí obrácené do náměstí Pla de la Seu zůstalo po více než čtyři sta let provizorní hladkou zdí z&nbsp;hrubého kamene. V&nbsp;katedrálním archivu se však uchoval vzácný původní pergamenový nákres fasády z&nbsp;roku 1408 od francouzského mistra Carla Galtése de Ruan.\u003C/p>\n\u003Cp>Dostavbu průčelí umožnil až na sklonku 19.&nbsp;století velkorysý mecenát předního katalánského bankéře, průmyslníka a&nbsp;starosty Barcelony Manuela Girony i&nbsp;Agrafela (1817–1905). Architekt Josep Oriol Mestres vypracoval projekt, který věrně rozvinul Galtésův středověký koncept v&nbsp;duchu vrcholného neogotického tvarosloví. Samotná fasáda se třemi bohatě profilovanými portály vyrostla v&nbsp;letech 1887–1890 u&nbsp;příležitosti barcelonské Světové výstavy. Monumentální sochařskou výzdobu portálů vytesali Agapit Vallmitjana a&nbsp;Eduard Alentorn.\u003C/p>\n\u003Cp>Završení celé kompozice přinesla v&nbsp;letech 1906–1913 stavba sedmdesátimetrové centrální věže (katalánsky \u003Cem>cimbori\u003C/em>) s&nbsp;prolamovanou kamennou jehlou, navržené architektem Augustem Fontem i&nbsp;Carrerasem. Dokončení věže po otcově smrti zafinancovaly Gironovy děti. Vrchol věže korunuje bronzová socha svaté Heleny se Svatým Křížem, patronky první katedrály, vytvořená sochařem Eduardem Alentornem.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"visit-context-2026\" data-section-kind=\"narrative\">\n\u003Csummary>Návštěva a&nbsp;režim provozu v&nbsp;roce 2026\u003C/summary>\n\u003Cdiv>\u003Cp>Odpolední zastávka dne 29.&nbsp;září&nbsp;2026 v&nbsp;16.38 zachytila hlavní západní průčelí barcelonské katedrály z&nbsp;náměstí Pla de la Seu v&nbsp;hřejivém odpoledním slunci. Neogotická fasáda z&nbsp;přelomu 19.&nbsp;a&nbsp;20.&nbsp;století s&nbsp;osmibokou lucernou byla plně odkrytá bez lešení po dokončení předchozích rozsáhlých konzervačních etap tesaných kamenných prvků a&nbsp;sochařského portálu.\u003C/p>\n\u003Cp>Katedrála v&nbsp;roce 2026 uplatňovala přísně organizovaný dvoukolejný provoz: ranní a&nbsp;podvečerní hodiny patřily farním bohoslužbám a&nbsp;rozjímání, zatímco přes den fungoval turistický kulturní okruh se zpoplatněným vstupem. Návštěvníci mohli projít křížovou chodbou s&nbsp;třinácti bílými husami uctívajícími památku svaté Eulálie, prohlédnout si vyřezávané chórové lavice s&nbsp;erby Řádu zlatého rouna i&nbsp;vyjet výtahem na střešní terasy s&nbsp;výhledem na střechy gotické čtvrti Barri Gòtic.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"facts\" data-section-kind=\"facts\">\n\u003Csummary>Základní údaje\u003C/summary>\n\u003Cdiv>\u003Ctable>\n\u003Cthead>\n\u003Ctr>\n\u003Cth align=\"left\">Parametr\u003C/th>\n\u003Cth align=\"left\">Údaj\u003C/th>\n\u003C/tr>\n\u003C/thead>\n\u003Ctbody>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Oficiální název\u003C/th>\n\u003Ctd align=\"left\">Catedral de la Santa Creu i&nbsp;Santa Eulàlia (bazilika minor, známá též jako La Seu) \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Zasvěcení\u003C/th>\n\u003Ctd align=\"left\">Svatý Kříž a&nbsp;svatá Eulálie z&nbsp;Barcelony (patronka města umučená r. 303/304)\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Hlavní gotičtí architekti\u003C/th>\n\u003Ctd align=\"left\">Jaume Fabre (od r. 1317), Bernat Roca (od r. 1358), Arnau Bargués (kolem r. 1400) \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Architekti neogotické fasády\u003C/th>\n\u003Ctd align=\"left\">Josep Oriol Mestres (průčelí 1887–1890); August Font i&nbsp;Carreras (centrální věž 1906–1913)\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Donátoři neogotické dostavby\u003C/th>\n\u003Ctd align=\"left\">Manuel Girona i&nbsp;Agrafel a&nbsp;jeho rodina\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Doba výstavby\u003C/th>\n\u003Ctd align=\"left\">1298–1448 (gotické trojlodí, krypta a&nbsp;křížová chodba); 1887–1913 (neogotické průčelí a&nbsp;centrální věž)\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Architektonický styl\u003C/th>\n\u003Ctd align=\"left\">katalánská gotika (interiér a&nbsp;křížová chodba); vrcholná neogotika (západní fasáda a&nbsp;cimbori)\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Rozměry chrámu\u003C/th>\n\u003Ctd align=\"left\">celková délka: 93&nbsp;m; šířka trojlodí: 40&nbsp;m; výška hlavní lodi: 28&nbsp;m; výška centrální věže: 70&nbsp;m \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Lokalita a&nbsp;adresa\u003C/th>\n\u003Ctd align=\"left\">Pla de la Seu s/n, 08002 Barcelona (Ciutat Vella / Barri Gòtic)\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Klíčová umělecká díla\u003C/th>\n\u003Ctd align=\"left\">alabastrový sarkofág sv.&nbsp;Eulálie (Lupo di Francesco, 1327–1339); vyřezávané stally chóru (Pere Sanglada, 1390–1399); erby Řádu zlatého rouna (Joan de Borgonya, 1519); hejno 13 bílých hus v&nbsp;ambitu\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Památková ochrana\u003C/th>\n\u003Ctd align=\"left\">národní kulturní památka Španělska a&nbsp;Katalánska (BCIN, kód 29-MH-EN, královský dekret 2.&nbsp;11.&nbsp;1929); Categoria&nbsp;A v&nbsp;městském katalogu (číslo 202) \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Oficiální správa\u003C/th>\n\u003Ctd align=\"left\">Cabildo Catedralicio de Barcelona (Arcidiecéze barcelonská)\u003C/td>\n\u003C/tr>\n\u003C/tbody>\n\u003C/table>\n\u003C/div>\n\u003C/details>",locationId:"cathedral-of-barcelona",locationLeadHtml:"\u003Cp class=\"lead\" data-section-id=\"lead\">Katedrála svatého Kříže a&nbsp;svaté Eulálie (\u003Cem>Catedral de la Santa Creu i&nbsp;Santa Eulàlia\u003C/em>), nazývaná \u003Cem>La Seu\u003C/em>, tvoří duchovní srdce barcelonské Gotické čtvrti na návrší Mons Taber. Sídlo arcibiskupa představuje vrcholné dílo katalánské gotiky ze 14.&nbsp;a&nbsp;15.&nbsp;století s&nbsp;klidnou křížovou chodbou a&nbsp;tradičním hejnem třinácti bílých hus. Bohatě zdobené neogotické západní průčelí s&nbsp;centrální věží bylo dokončeno na přelomu 19.&nbsp;a&nbsp;20.&nbsp;století podle původních středověkých plánů.\u003C/p>",locationHtml:"\u003Cdetails data-section-id=\"history-gothic-construction\" data-section-kind=\"narrative\">\n\u003Csummary>Od románských kořenů ke gotické katedrále (1298–1448)\u003C/summary>\n\u003Cdiv>\u003Cp>Dnešní chrám stojí na posvátném místě s&nbsp;nepřerušenou duchovní tradicí od dob římské kolonie Barcino. Pod podlahou katedrály leží základy paleokřesťanské biskupské baziliky ze 4.–6.&nbsp;století s&nbsp;křestním bazénkem, prozkoumané městským muzeem MUHBA. V&nbsp;roce 1058 zde byla za vlády hraběte Ramona Berenguera&nbsp;I. a&nbsp;Almodis de la Marche vysvěcena románská katedrála, jejíž části byly postupně pohlceny velkolepou gotickou novostavbou.\u003C/p>\n\u003Cp>Stavba gotické katedrály začala slavnostním položením základního kamene 1.&nbsp;května 1298 za přítomnosti aragonského krále Jakuba&nbsp;II. a&nbsp;biskupa Bernata Pelegrí. Hlavním mistrem stavby se v&nbsp;roce 1317 stal Jaume Fabre, který přišel z&nbsp;Mallorky a&nbsp;vtiskl stavbě koncepci typickou pro středomořskou gotiku. V&nbsp;práci pokračovali další významní mistři, především Bernat Roca od roku 1358 (autor koncepce zvonic a&nbsp;křížové chodby) a&nbsp;Arnau Bargués kolem roku 1400, který dokončil gotický portál Sant Iu.\u003C/p>\n\u003Cp>Architektura chrámu ztělesňuje vrcholná pravidla katalánské gotiky: trojlodní prostor o&nbsp;délce 93&nbsp;metrů a&nbsp;šířce 40&nbsp;metrů má výrazně halový charakter, protože výška bočních lodí téměř dosahuje osmadvacetimetrové výšky lodi hlavní. Místo složitého lesa vnějších opěrných oblouků známých z&nbsp;francouzských katedrál jsou mohutné kamenné opěráky vtaženy dovnitř půdorysu, kde mezi sebou vytvářejí prostor pro souvislý věnec soukromých a&nbsp;cechovních kaplí.\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"crypt-saint-eulalia\" data-section-kind=\"narrative\">\n\u003Csummary>Krypta svaté Eulálie a&nbsp;alabastrový sarkofág Lupa di Francesco\u003C/summary>\n\u003Cdiv>\u003Cp>Přímo pod hlavním oltářem se nachází monumentální krypta svaté Eulálie, přístupná širokým otevřeným schodištěm klesajícím z&nbsp;centrální chrámové lodi. Svatá Eulálie, patronka města Barcelony, byla podle tradice třináctiletá dívka, která odmítla obětovat pohanským bohům a&nbsp;roku 303 nebo 304 podstoupila mučednickou smrt během pronásledování křesťanů za vlády císaře Diokleciána.\u003C/p>\n\u003Cp>Ústředním bodem krypty je mimořádný gotický sarkofág z&nbsp;bílého alabastru, vytvořený v&nbsp;letech 1327–1339 pisánským sochařem Lupem di Francesco pod vlivem toskánské sochařské školy Giovanniho Pisana.  Tělo sarkofágu spočívá na osmi štíhlých sloupech s&nbsp;korintskými hlavicemi a&nbsp;jeho stěny pokrývají figurální reliéfy zachycující jednotlivé výjevy z&nbsp;Euláliina soudu, krutého mučení, její smrti i&nbsp;následného zázračného nalezení ostatků.\u003C/p>\n\u003Cp>Ostatky světice byly do nově vybudované katedrální krypty slavnostně přeneseny v&nbsp;červenci 1339 z&nbsp;původního hrobu v&nbsp;bazilice Santa Maria del Mar za přítomnosti aragonského krále Petra&nbsp;IV. a&nbsp;všech předních představitelů království.\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"cloister-thirteen-geese\" data-section-kind=\"narrative\">\n\u003Csummary>Gotická křížová chodba a&nbsp;třináct bílých hus svaté Eulálie\u003C/summary>\n\u003Cdiv>\u003Cp>K&nbsp;jihozápadnímu boku katedrály přiléhá rozsáhlá gotická křížová chodba (katalánsky \u003Cem>claustre\u003C/em>), dokončená v&nbsp;roce 1448 mistrem stavitelem Andreuem Escuderem na základech položených již ve 14.&nbsp;století Bernatem Rocou. Čtvercový ambit s&nbsp;křížovými klenbami a&nbsp;bohatou kamenickou kružbou obepíná centrální rajský dvůr plný vzrostlých magnólií, palem a&nbsp;pomerančovníků.\u003C/p>\n\u003Cp>Nejznámějším symbolem klášterního dvora je stálé hejno třinácti bílých hus (katalánsky \u003Cem>tretze oques blanques\u003C/em>), které obývá zahradní rybníček u&nbsp;gotické kašny svatého Jiří. Tradice chovu třinácti hus připomíná věk svaté Eulálie v&nbsp;době její mučednické smrti (třináct let) i&nbsp;třináct krutých trestů, jimž byla podle legendy římskými soudci vystavena. Bílá barva peří symbolizuje čistotu a&nbsp;nevinnost mladé světice.\u003C/p>\n\u003Cp>Nádvoří je rovněž dějištěm jedné z&nbsp;nejstarších barcelonských slavností: během svátku Těla a&nbsp;Krve Páně (Corpus Christi) se na vodotrysku fontány vznáší prázdná skořápka vejce ozdobená květinami v&nbsp;oblíbeném rituálu zvaném \u003Cem>L'ou com balla\u003C/em> („tančící vejce“), doloženém v&nbsp;katedrálních análech již od roku 1637.\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"choir-golden-fleece\" data-section-kind=\"narrative\">\n\u003Csummary>Vyřezávaný chór a&nbsp;kapitula Řádu zlatého rouna z&nbsp;roku 1519\u003C/summary>\n\u003Cdiv>\u003Cp>Po španělském zvyku je chór katedrály (katalánsky \u003Cem>cor\u003C/em>) situován přímo doprostřed hlavní chrámové lodi, oddělen od presbytáře otevřeným prostorem pro procesí. Gotické dřevěné lavice (stally) z&nbsp;let 1390–1399 vytvořil proslulý řezbář Pere Sanglada z&nbsp;dubového dřeva dovezeného z&nbsp;Brugg.  Sangladovy vyřezávané misericordie a&nbsp;opěrky sedadel překypují realistickými, alegorickými i&nbsp;satirickými scénami ze středověkého života.\u003C/p>\n\u003Cp>Chór vstoupil do evropských dějin v&nbsp;březnu roku 1519, kdy mladý španělský král Karel&nbsp;I. (budoucí císař Svaté říše římské Karel&nbsp;V.) zvolil barcelonskou katedrálu za dějiště XIX.&nbsp;slavnostní kapituly prestižního rytířského Řádu zlatého rouna (\u003Cem>Toisón de Oro\u003C/em>). Bylo to poprvé a&nbsp;naposledy v&nbsp;historii, kdy se kapitula tohoto nejvýznamnějšího panovnického řádu sešla na Pyrenejském poloostrově.\u003C/p>\n\u003Cp>Německý renesanční malíř Joan de Borgonya tehdy namaloval na opěradla všech šestašedesáti chórových sedadel erby rytířů řádu a&nbsp;předních evropských panovníků – včetně samotného Karla&nbsp;V., anglického krále Jindřicha&nbsp;VIII., francouzského krále Františka&nbsp;I. či polského krále Zikmunda&nbsp;I. Tato kompletní heraldická galerie se dochovala v&nbsp;autentickém stavu dodnes. Vnější západní stěnu chóru uzavírá monumentální mramorový reliéf od sochaře Bartolomého Ordóñeze zachycující život svaté Eulálie.\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"facade-girona-neogothic\" data-section-kind=\"narrative\">\n\u003Csummary>Neogotické průčelí, mecenát Manuela Girony a&nbsp;věž cimbori\u003C/summary>\n\u003Cdiv>\u003Cp>Ačkoli bylo gotické tělo katedrály dokončeno v&nbsp;polovině 15.&nbsp;století, hlavní západní průčelí obrácené do náměstí Pla de la Seu zůstalo po více než čtyři sta let provizorní hladkou zdí z&nbsp;hrubého kamene. V&nbsp;katedrálním archivu se však uchoval vzácný původní pergamenový nákres fasády z&nbsp;roku 1408 od francouzského mistra Carla Galtése de Ruan.\u003C/p>\n\u003Cp>Dostavbu průčelí umožnil až na sklonku 19.&nbsp;století velkorysý mecenát předního katalánského bankéře, průmyslníka a&nbsp;starosty Barcelony Manuela Girony i&nbsp;Agrafela (1817–1905). Architekt Josep Oriol Mestres vypracoval projekt, který věrně rozvinul Galtésův středověký koncept v&nbsp;duchu vrcholného neogotického tvarosloví. Samotná fasáda se třemi bohatě profilovanými portály vyrostla v&nbsp;letech 1887–1890 u&nbsp;příležitosti barcelonské Světové výstavy. Monumentální sochařskou výzdobu portálů vytesali Agapit Vallmitjana a&nbsp;Eduard Alentorn.\u003C/p>\n\u003Cp>Završení celé kompozice přinesla v&nbsp;letech 1906–1913 stavba sedmdesátimetrové centrální věže (katalánsky \u003Cem>cimbori\u003C/em>) s&nbsp;prolamovanou kamennou jehlou, navržené architektem Augustem Fontem i&nbsp;Carrerasem. Dokončení věže po otcově smrti zafinancovaly Gironovy děti. Vrchol věže korunuje bronzová socha svaté Heleny se Svatým Křížem, patronky první katedrály, vytvořená sochařem Eduardem Alentornem.\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"visit-context-2026\" data-section-kind=\"narrative\">\n\u003Csummary>Návštěva a&nbsp;režim provozu v&nbsp;roce 2026\u003C/summary>\n\u003Cdiv>\u003Cp>Odpolední zastávka dne 29.&nbsp;září&nbsp;2026 v&nbsp;16.38 zachytila hlavní západní průčelí barcelonské katedrály z&nbsp;náměstí Pla de la Seu v&nbsp;hřejivém odpoledním slunci. Neogotická fasáda z&nbsp;přelomu 19.&nbsp;a&nbsp;20.&nbsp;století s&nbsp;osmibokou lucernou byla plně odkrytá bez lešení po dokončení předchozích rozsáhlých konzervačních etap tesaných kamenných prvků a&nbsp;sochařského portálu.\u003C/p>\n\u003Cp>Katedrála v&nbsp;roce 2026 uplatňovala přísně organizovaný dvoukolejný provoz: ranní a&nbsp;podvečerní hodiny patřily farním bohoslužbám a&nbsp;rozjímání, zatímco přes den fungoval turistický kulturní okruh se zpoplatněným vstupem. Návštěvníci mohli projít křížovou chodbou s&nbsp;třinácti bílými husami uctívajícími památku svaté Eulálie, prohlédnout si vyřezávané chórové lavice s&nbsp;erby Řádu zlatého rouna i&nbsp;vyjet výtahem na střešní terasy s&nbsp;výhledem na střechy gotické čtvrti Barri Gòtic.\u003C/p>\n\u003C/div>\n\u003C/details>",locationOfficialHtml:"\u003Ctable>\n\u003Cthead>\n\u003Ctr>\n\u003Cth align=\"left\">Parametr\u003C/th>\n\u003Cth align=\"left\">Údaj\u003C/th>\n\u003C/tr>\n\u003C/thead>\n\u003Ctbody>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Oficiální název\u003C/th>\n\u003Ctd align=\"left\">Catedral de la Santa Creu i&nbsp;Santa Eulàlia (bazilika minor, známá též jako La Seu) \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Zasvěcení\u003C/th>\n\u003Ctd align=\"left\">Svatý Kříž a&nbsp;svatá Eulálie z&nbsp;Barcelony (patronka města umučená r. 303/304)\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Hlavní gotičtí architekti\u003C/th>\n\u003Ctd align=\"left\">Jaume Fabre (od r. 1317), Bernat Roca (od r. 1358), Arnau Bargués (kolem r. 1400) \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Architekti neogotické fasády\u003C/th>\n\u003Ctd align=\"left\">Josep Oriol Mestres (průčelí 1887–1890); August Font i&nbsp;Carreras (centrální věž 1906–1913)\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Donátoři neogotické dostavby\u003C/th>\n\u003Ctd align=\"left\">Manuel Girona i&nbsp;Agrafel a&nbsp;jeho rodina\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Doba výstavby\u003C/th>\n\u003Ctd align=\"left\">1298–1448 (gotické trojlodí, krypta a&nbsp;křížová chodba); 1887–1913 (neogotické průčelí a&nbsp;centrální věž)\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Architektonický styl\u003C/th>\n\u003Ctd align=\"left\">katalánská gotika (interiér a&nbsp;křížová chodba); vrcholná neogotika (západní fasáda a&nbsp;cimbori)\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Rozměry chrámu\u003C/th>\n\u003Ctd align=\"left\">celková délka: 93&nbsp;m; šířka trojlodí: 40&nbsp;m; výška hlavní lodi: 28&nbsp;m; výška centrální věže: 70&nbsp;m \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Lokalita a&nbsp;adresa\u003C/th>\n\u003Ctd align=\"left\">Pla de la Seu s/n, 08002 Barcelona (Ciutat Vella / Barri Gòtic)\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Klíčová umělecká díla\u003C/th>\n\u003Ctd align=\"left\">alabastrový sarkofág sv.&nbsp;Eulálie (Lupo di Francesco, 1327–1339); vyřezávané stally chóru (Pere Sanglada, 1390–1399); erby Řádu zlatého rouna (Joan de Borgonya, 1519); hejno 13 bílých hus v&nbsp;ambitu\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Památková ochrana\u003C/th>\n\u003Ctd align=\"left\">národní kulturní památka Španělska a&nbsp;Katalánska (BCIN, kód 29-MH-EN, královský dekret 2.&nbsp;11.&nbsp;1929); Categoria&nbsp;A v&nbsp;městském katalogu (číslo 202) \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Oficiální správa\u003C/th>\n\u003Ctd align=\"left\">Cabildo Catedralicio de Barcelona (Arcidiecéze barcelonská)\u003C/td>\n\u003C/tr>\n\u003C/tbody>\n\u003C/table>\n",aliases:["Cathedral of Barcelona","Catedral de Barcelona","Catedral de la Santa Creu i Santa Eulàlia","La Seu","Cathedral Barcelona","Katedrála svatého Kříže a svaté Eulálie","Katedrála v Barceloně"],heroImage:{src:"/travel-guide/teasers/cathedral-of-barcelona/hero.jpg",alt:"Gotické a neogotické průčelí barcelonské katedrály na náměstí Pla de la Seu"},audio:[{section:"lead",label:"Úvod",identity:"78b2dfcad785e2ac742969fe308994a26dd8dea7d98c913c5cd91afb6ce1094b",src:"/travel-guide/audio/cathedral-of-barcelona/78b2dfcad785e2ac742969fe308994a26dd8dea7d98c913c5cd91afb6ce1094b.m4a"},{section:"history-gothic-construction",label:"Od románských kořenů ke gotické katedrále (1298–1448)",identity:"8bb31fb0e29139b5e89ae9a1cdc82aaa407f383f651bc0655c1a1470bc248cfc",src:"/travel-guide/audio/cathedral-of-barcelona/8bb31fb0e29139b5e89ae9a1cdc82aaa407f383f651bc0655c1a1470bc248cfc.m4a"},{section:"crypt-saint-eulalia",label:"Krypta svaté Eulálie a alabastrový sarkofág Lupa di Francesco",identity:"714ddb50f61fb6d0cb57413487e7b75f02b73116d3cab0e7fdb8f10584ec3f5d",src:"/travel-guide/audio/cathedral-of-barcelona/714ddb50f61fb6d0cb57413487e7b75f02b73116d3cab0e7fdb8f10584ec3f5d.m4a"},{section:"cloister-thirteen-geese",label:"Gotická křížová chodba a třináct bílých hus svaté Eulálie",identity:"9b2ecdf6157968af0c8a4b40169547c4e7ab4e3fde6458c854575f86fcb5c25e",src:"/travel-guide/audio/cathedral-of-barcelona/9b2ecdf6157968af0c8a4b40169547c4e7ab4e3fde6458c854575f86fcb5c25e.m4a"},{section:"choir-golden-fleece",label:"Vyřezávaný chór a kapitula Řádu zlatého rouna z roku 1519",identity:"cfa4e49b34c0021f6665b84692674afb527a8a68eb0137c294a9ecf43b763f0a",src:"/travel-guide/audio/cathedral-of-barcelona/cfa4e49b34c0021f6665b84692674afb527a8a68eb0137c294a9ecf43b763f0a.m4a"},{section:"facade-girona-neogothic",label:"Neogotické průčelí, mecenát Manuela Girony a věž cimbori",identity:"69d436adab270fdd2a72e3cb4dc521c56fe4f5544bfbbc662cad35ca34a39033",src:"/travel-guide/audio/cathedral-of-barcelona/69d436adab270fdd2a72e3cb4dc521c56fe4f5544bfbbc662cad35ca34a39033.m4a"},{section:"visit-context-2026",label:"Návštěva a režim provozu v roce 2026",identity:"a192788a519e4ad30ec1e93a5f2c9a12cc34332085813e687a180bf9941c4db8",src:"/travel-guide/audio/cathedral- :"Španělsko",countryCode:"ESP",state:"Katalánsko"},author:"Cebreus",authorSlug:"cebreus",location:"Sagrada Família",city:"Barcelona",googleMapsUrl:"https://www.google.com/maps/search/?api=1&query=41.404828,2.174506",date:"2026-09-29T18:38:36",sources:[{variant:"default",type:"image/webp",path:"/images/previews-webp/IMG_0768.webp",width:370},{variant:"default",type:"image/jpeg",path:"/images/previews/IMG_0768.jpeg",width:370},{variant:"default",type:"image/avif",path:"/images/previews-avif/IMG_0768.avif",width:370},{variant:"xl",type:"image/webp",path:"/images/previews-xl-webp/IMG_0768.webp",width:534},{variant:"xl",type:"image/jpeg",path:"/images/previews-xl/IMG_0768.jpeg",width:534},{variant:"xl",type:"image/avif",path:"/images/previews-xl-avif/IMG_0768.avif",width:534},{variant:"detail",type:"image/jpeg",path:"/images/details/IMG_0768.jpeg",width:1707,height:1280},{variant:"fallback",type:"image/jpeg",path:"/images/previews-xxs/IMG_0768.jpeg",width:190,height:127},{variant:"admin_thumb",type:"image/jpeg",path:"/images/previews-admin/IMG_0768.jpeg",width:534,height:400}],flags:["snapshot-author"],people:["person-67e7b790752ec4058cbdeefbcd229a848e2b4f981b789f39b6d982a02577b35c","person-8fcf0021a7ada1e7d3f84580ef3ca26a2e0e4ef99b9adf6b438fac8a9257157e"]}],id:"day-2026-09-29"},{date:"2026-09-30",cities:["Barcelona"],locations:["Pavelló Mies van der Rohe","Benátské sloupy","Plaça Espanya"],items:[{id:"loc-pavello-mies-van-der-rohe-main-2026-09-30t121941",type:"separator",location:"Pavelló Mies van der Rohe",city:"Barcelona",hasPhotos:true,startDate:"2026-09-30T12:19:41",endDate:"2026-09-30T23:59:59",storyTitle:"Pavilon Barcelona (Pavelló Mies van der Rohe)",story:"\u003Cp class=\"lead\" data-section-id=\"lead\">Německý pavilon v&nbsp;barcelonském parku na úpatí kopce Montjuïc představuje klíčový mezník moderní světové architektury dvacátého století. Stavbu navrhl architekt Ludwig Mies van der Rohe ve spolupráci s&nbsp;návrhářkou Lilly Reich jako oficiální reprezentační pavilon Výmarské republiky pro Mezinárodní výstavu v&nbsp;roce 1929. Budova radikálně proměnila vnímání prostoru spojením volného půdorysu, lehkého ocelového skeletu, velkorysého prosklení a&nbsp;ušlechtilých kamenných desek. Ačkoli byl původní dočasný pavilon po skončení výstavy rozebrán, město Barcelona jej v&nbsp;letech 1983–1986 nechalo věrně obnovit na původním místě.\u003C/p>\u003Cdetails data-section-id=\"history-reconstruction\" data-section-kind=\"narrative\">\n\u003Csummary>Vznik pavilonu a&nbsp;vědecká rekonstrukce\u003C/summary>\n\u003Cdiv>\u003Cp>Vláda Výmarské republiky pověřila architekta Ludwiga Miese van der Rohe návrhem národního pavilonu v&nbsp;roce 1928 s&nbsp;požadavkem prezentovat Německo jako moderní, demokratickou a&nbsp;kulturní zemi. Mies přizval návrhářku Lilly Reich, která převzala roli umělecké ředitelky německé expozice. Stavba nesloužila jako výstavní hala pro zboží; samotná čistá architektura tvořila hlavní exponát.\u003C/p>\n\u003Cp>Slavnostní otevření proběhlo 26.&nbsp;května&nbsp;1929 za účasti španělského krále Alfonsa XIII. a&nbsp;královny Viktorie Evženie. Po skončení výstavy v&nbsp;lednu 1930 ztratila dočasná budova funkci a&nbsp;v&nbsp;průběhu téhož roku byla rozebrána, přičemž kovové části a&nbsp;vzácné kameny byly rozprodány.\u003C/p>\n\u003Cp>Rostoucí celosvětový vliv stavby na dějiny architektury podnítil ředitele městského urbanismu Oriola Bohigase k&nbsp;zahájení příprav na její znovuzrození. Architekti Ignasi de Solà-Morales, Cristian Cirici a&nbsp;Fernando Ramos provedli důkladný archeologický výzkum nalezených základů a&nbsp;podle dobových fotografií zrekonstruovali přesnou geometrii. Obnovený pavilon slavnostně otevřel své brány 2.&nbsp;června&nbsp;1986 na přesném historickém místě.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"structure-materials\" data-section-kind=\"narrative\">\n\u003Csummary>Konstrukční řešení, sloupy a&nbsp;vzácné kameny\u003C/summary>\n\u003Cdiv>\u003Cp>Celý komplex spočívá na vyvýšeném podestu z&nbsp;římského travertinu o&nbsp;délce 56,63&nbsp;metru a&nbsp;šířce 18,48&nbsp;metru, který vyrovnává svažitý terén Montjuïcu. Plochou střechu hlavního sálu nese osm štíhlých ocelových sloupů s&nbsp;průřezem ve tvaru kříže složených ze čtyř úhelníků, které kryje vysoce leštěný pochromovaný mosazný plech. Zrcadlový lesk chromu opticky dematerializuje hmotu sloupů a&nbsp;vytváří dojem volně se vznášejícího stropu (\u003Cem>schwebendes Dach\u003C/em>).\u003C/p>\n\u003Cp>Díky bodovému nosnému systému nenesou stěny žádné zatížení, což Miesovi umožnilo vnitřní prostor volně členit samostatně stojícími příčkami a&nbsp;velkoformátovým sklem.\u003C/p>\n\u003Cp>Podlahu a&nbsp;terasu tvoří římský travertin z&nbsp;Tivoli, vnitřní stěny zelený alpský mramor \u003Cem>Verde Antico\u003C/em> a&nbsp;starověký mramor z&nbsp;řeckého ostrova Tinos. Dominantu interiéru tvoří samonosná stěna ze zlatavého onyxu (\u003Cem>onyx dorée\u003C/em>) vytěženého v&nbsp;pohoří Atlas. Mies nalezl blok v&nbsp;hamburském skladu a&nbsp;nechal jej rozříznout na dvě desky sesazené zrcadlově (\u003Cem>a&nbsp;libro aperto\u003C/em>); jeho výška 3,10&nbsp;metru přímo určila modulovou výšku celého pavilonu.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"free-plan-water-pools\" data-section-kind=\"narrative\">\n\u003Csummary>Volný půdorys, světelná stěna a&nbsp;vodní nádrže\u003C/summary>\n\u003Cdiv>\u003Cp>Pavilon představuje čisté ztělesnění Miesova konceptu plynoucího prostoru (\u003Cem>Freier Grundriss\u003C/em>) bez pevných dveří a&nbsp;uzavřených místností. Jednotlivé funkční zóny na sebe plynule navazují a&nbsp;stírají hranici mezi chráněným interiérem a&nbsp;otevřeným exteriérem. Architekt zkombinoval čiré tabule se šedě a&nbsp;zeleně tónovaným sklem, které propouštějí měkké rozptýlené světlo.\u003C/p>\n\u003Cp>V&nbsp;jižní části navrhl Mies monumentální světelnou stěnu (\u003Cem>Lichtwand\u003C/em>) tvořenou dvojitým pláštěm z&nbsp;mléčného leptaného skla s&nbsp;vnitřním osvětlením, která v&nbsp;noci září jako celistvý architektonický světelný zdroj a&nbsp;nahrazuje běžná stropní svítidla.\u003C/p>\n\u003Cp>Barevnost textilií navržených Lilly Reich decentně odkazovala na symboliku Výmarské republiky: zlatavý onyx doprovázel sytě červený sametový závěs a&nbsp;černý koberec. Kompozici dotvářejí dvě obdélníkové vodní nádrže s&nbsp;klidnou zrcadlící se hladinou — velký bazén na vnější travertinové terase a&nbsp;menší intimní nádrž v&nbsp;mramorovém atriu pokrytá tmavými valouny.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"barcelona-chair-sculpture\" data-section-kind=\"narrative\">\n\u003Csummary>Křeslo Barcelona a&nbsp;plastika Georga Kolbeho\u003C/summary>\n\u003Cdiv>\u003Cp>Pro oficiální uvítací ceremoniál španělského královského páru navrhli Ludwig Mies van der Rohe a&nbsp;Lilly Reich křeslo Barcelona, které se stalo jednou z&nbsp;nejznámějších ikon světového užitého designu. Konstrukci sedadla tvoří prohnutý ocelový pás ve tvaru písmene X nesoucí kožené polštáře s&nbsp;elegantním knoflíkovým prošíváním.\u003C/p>\n\u003Cp>V&nbsp;rohu menšího vnitřního atria stojí bronzová plastika \u003Cem>Der Morgen\u003C/em> (Úsvit) od německého sochaře Georga Kolbeho. Postava ženy zvedající paže k&nbsp;rannímu nebi vytváří dynamický organický protiklad k&nbsp;přísně pravoúhlým liniím stavby. Mies umístil sochu na sokl z&nbsp;černého mramoru těsně nad vodní hladinu v&nbsp;pozadí zelené stěny z&nbsp;ostrova Tinos.\u003C/p>\n\u003Cp>Plastika se vícenásobně zrcadlí v&nbsp;klidné vodní hladině, leštěném kameni i&nbsp;velkých skleněných tabulích. Za poledního slunce navíc hladina vnějšího bazénu vrhá jemné světelné odlesky na hladký podhled vznášející se střechy a&nbsp;dodává konstrukci dojem absolutní beztíže.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"visit-context-2026\" data-section-kind=\"narrative\">\n\u003Csummary>Polední návštěva a&nbsp;světelné reflexy v&nbsp;roce 2026\u003C/summary>\n\u003Cdiv>\u003Cp>Návštěva pavilonu dne 30.&nbsp;září&nbsp;2026 v&nbsp;čase od 12.19 proběhla za jasného poledního slunce, které vytvářelo ideální podmínky pro studium světelných reflexů a&nbsp;materiálových dialogů architektury. Paprsky dopadající na hladinu vnějšího travertinového bazénu promítaly jemné vlnící se kaustické sítě na podhled vznášející se střechy, což umocňovalo dojem beztíže celé konstrukce.\u003C/p>\n\u003Cp>Interiér nabídl detailní pohled na symetrickou kresbu zlatavé onyxové stěny i&nbsp;kompozici kožených křesel Barcelona na černém vlněném koberci. V&nbsp;uzavřeném atriu se bronzová socha Georga Kolbeho \u003Cem>Der Morgen\u003C/em> působivě zrcadlila v&nbsp;černé hladině jezírka i&nbsp;vyleštěném zeleném mramoru z&nbsp;ostrova Tinos, což návštěvníkům umožnilo prožít Miesův plynoucí prostor v&nbsp;jeho plné harmonii.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"facts\" data-section-kind=\"facts\">\n\u003Csummary>Základní údaje\u003C/summary>\n\u003Cdiv>\u003Ctable>\n\u003Cthead>\n\u003Ctr>\n\u003Cth align=\"left\">Parametr\u003C/th>\n\u003Cth align=\"left\">Údaj\u003C/th>\n\u003C/tr>\n\u003C/thead>\n\u003Ctbody>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Oficiální název\u003C/th>\n\u003Ctd align=\"left\">Německý pavilon v&nbsp;Barceloně (Pavelló alemany, Pavelló Mies van der Rohe)\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Hlavní architekt\u003C/th>\n\u003Ctd align=\"left\">Ludwig Mies van der Rohe (1886–1969)\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Klíčoví spolupracovníci\u003C/th>\n\u003Ctd align=\"left\">Lilly Reich (spoluautorka interiéru a&nbsp;nábytku), Georg Kolbe (socha \u003Cem>Der Morgen\u003C/em>), Oriol Bohigas (iniciátor obnovy), Ignasi de Solà-Morales, Cristian Cirici a&nbsp;Fernando Ramos (architekti rekonstrukce 1983–1986) \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Původní stavebník\u003C/th>\n\u003Ctd align=\"left\">vláda Výmarské republiky (říšský komisař Georg von Schnitzler)\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Doba výstavby\u003C/th>\n\u003Ctd align=\"left\">1928–1929 (otevření 26.&nbsp;května&nbsp;1929, demontáž 1930; rekonstrukce 1983–1986, otevření 2.&nbsp;června&nbsp;1986) \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Architektonický styl\u003C/th>\n\u003Ctd align=\"left\">funkcionalismus, mezinárodní styl, moderní purismus\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Lokalita a&nbsp;adresa\u003C/th>\n\u003Ctd align=\"left\">Avinguda de Francesc Ferrer i&nbsp;Guàrdia 7, 08038 Barcelona (čtvrť Montjuïc)\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Rozměry a&nbsp;plocha\u003C/th>\n\u003Ctd align=\"left\">délka travertinového soklu 56,63&nbsp;m, šířka 18,48&nbsp;m, světlá výška 3,10&nbsp;m; zastavěná plocha cca 1&nbsp;000&nbsp;m²\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Současné využití a&nbsp;vlastník\u003C/th>\n\u003Ctd align=\"left\">Fundació Mies van der Rohe a&nbsp;Ajuntament de Barcelona; veřejný památník a&nbsp;centrum architektury\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Památková ochrana\u003C/th>\n\u003Ctd align=\"left\">BCIN (kód 1978-MH, IPAC č.&nbsp;21762); BIC (kód RI-51-0010902)\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Oficiální web\u003C/th>\n\u003Ctd align=\"left\">\u003Ca href=\"https://miesbcn.com/\">miesbcn.com\u003C/a>\u003C/td>\n\u003C/tr>\n\u003C/tbody>\n\u003C/table>\n\u003C/div>\n\u003C/details>",locationId:"pavello-mies-van-der-rohe",locationLeadHtml:"\u003Cp class=\"lead\" data-section-id=\"lead\">Německý pavilon v&nbsp;barcelonském parku na úpatí kopce Montjuïc představuje klíčový mezník moderní světové architektury dvacátého století. Stavbu navrhl architekt Ludwig Mies van der Rohe ve spolupráci s&nbsp;návrhářkou Lilly Reich jako oficiální reprezentační pavilon Výmarské republiky pro Mezinárodní výstavu v&nbsp;roce 1929. Budova radikálně proměnila vnímání prostoru spojením volného půdorysu, lehkého ocelového skeletu, velkorysého prosklení a&nbsp;ušlechtilých kamenných desek. Ačkoli byl původní dočasný pavilon po skončení výstavy rozebrán, město Barcelona jej v&nbsp;letech 1983–1986 nechalo věrně obnovit na původním místě.\u003C/p>",locationHtml:"\u003Cdetails data-section-id=\"history-reconstruction\" data-section-kind=\"narrative\">\n\u003Csummary>Vznik pavilonu a&nbsp;vědecká rekonstrukce\u003C/summary>\n\u003Cdiv>\u003Cp>Vláda Výmarské republiky pověřila architekta Ludwiga Miese van der Rohe návrhem národního pavilonu v&nbsp;roce 1928 s&nbsp;požadavkem prezentovat Německo jako moderní, demokratickou a&nbsp;kulturní zemi. Mies přizval návrhářku Lilly Reich, která převzala roli umělecké ředitelky německé expozice. Stavba nesloužila jako výstavní hala pro zboží; samotná čistá architektura tvořila hlavní exponát.\u003C/p>\n\u003Cp>Slavnostní otevření proběhlo 26.&nbsp;května&nbsp;1929 za účasti španělského krále Alfonsa XIII. a&nbsp;královny Viktorie Evženie. Po skončení výstavy v&nbsp;lednu 1930 ztratila dočasná budova funkci a&nbsp;v&nbsp;průběhu téhož roku byla rozebrána, přičemž kovové části a&nbsp;vzácné kameny byly rozprodány.\u003C/p>\n\u003Cp>Rostoucí celosvětový vliv stavby na dějiny architektury podnítil ředitele městského urbanismu Oriola Bohigase k&nbsp;zahájení příprav na její znovuzrození. Architekti Ignasi de Solà-Morales, Cristian Cirici a&nbsp;Fernando Ramos provedli důkladný archeologický výzkum nalezených základů a&nbsp;podle dobových fotografií zrekonstruovali přesnou geometrii. Obnovený pavilon slavnostně otevřel své brány 2.&nbsp;června&nbsp;1986 na přesném historickém místě.\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"structure-materials\" data-section-kind=\"narrative\">\n\u003Csummary>Konstrukční řešení, sloupy a&nbsp;vzácné kameny\u003C/summary>\n\u003Cdiv>\u003Cp>Celý komplex spočívá na vyvýšeném podestu z&nbsp;římského travertinu o&nbsp;délce 56,63&nbsp;metru a&nbsp;šířce 18,48&nbsp;metru, který vyrovnává svažitý terén Montjuïcu. Plochou střechu hlavního sálu nese osm štíhlých ocelových sloupů s&nbsp;průřezem ve tvaru kříže složených ze čtyř úhelníků, které kryje vysoce leštěný pochromovaný mosazný plech. Zrcadlový lesk chromu opticky dematerializuje hmotu sloupů a&nbsp;vytváří dojem volně se vznášejícího stropu (\u003Cem>schwebendes Dach\u003C/em>).\u003C/p>\n\u003Cp>Díky bodovému nosnému systému nenesou stěny žádné zatížení, což Miesovi umožnilo vnitřní prostor volně členit samostatně stojícími příčkami a&nbsp;velkoformátovým sklem.\u003C/p>\n\u003Cp>Podlahu a&nbsp;terasu tvoří římský travertin z&nbsp;Tivoli, vnitřní stěny zelený alpský mramor \u003Cem>Verde Antico\u003C/em> a&nbsp;starověký mramor z&nbsp;řeckého ostrova Tinos. Dominantu interiéru tvoří samonosná stěna ze zlatavého onyxu (\u003Cem>onyx dorée\u003C/em>) vytěženého v&nbsp;pohoří Atlas. Mies nalezl blok v&nbsp;hamburském skladu a&nbsp;nechal jej rozříznout na dvě desky sesazené zrcadlově (\u003Cem>a&nbsp;libro aperto\u003C/em>); jeho výška 3,10&nbsp;metru přímo určila modulovou výšku celého pavilonu.\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"free-plan-water-pools\" data-section-kind=\"narrative\">\n\u003Csummary>Volný půdorys, světelná stěna a&nbsp;vodní nádrže\u003C/summary>\n\u003Cdiv>\u003Cp>Pavilon představuje čisté ztělesnění Miesova konceptu plynoucího prostoru (\u003Cem>Freier Grundriss\u003C/em>) bez pevných dveří a&nbsp;uzavřených místností. Jednotlivé funkční zóny na sebe plynule navazují a&nbsp;stírají hranici mezi chráněným interiérem a&nbsp;otevřeným exteriérem. Architekt zkombinoval čiré tabule se šedě a&nbsp;zeleně tónovaným sklem, které propouštějí měkké rozptýlené světlo.\u003C/p>\n\u003Cp>V&nbsp;jižní části navrhl Mies monumentální světelnou stěnu (\u003Cem>Lichtwand\u003C/em>) tvořenou dvojitým pláštěm z&nbsp;mléčného leptaného skla s&nbsp;vnitřním osvětlením, která v&nbsp;noci září jako celistvý architektonický světelný zdroj a&nbsp;nahrazuje běžná stropní svítidla.\u003C/p>\n\u003Cp>Barevnost textilií navržených Lilly Reich decentně odkazovala na symboliku Výmarské republiky: zlatavý onyx doprovázel sytě červený sametový závěs a&nbsp;černý koberec. Kompozici dotvářejí dvě obdélníkové vodní nádrže s&nbsp;klidnou zrcadlící se hladinou — velký bazén na vnější travertinové terase a&nbsp;menší intimní nádrž v&nbsp;mramorovém atriu pokrytá tmavými valouny.\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"barcelona-chair-sculpture\" data-section-kind=\"narrative\">\n\u003Csummary>Křeslo Barcelona a&nbsp;plastika Georga Kolbeho\u003C/summary>\n\u003Cdiv>\u003Cp>Pro oficiální uvítací ceremoniál španělského královského páru navrhli Ludwig Mies van der Rohe a&nbsp;Lilly Reich křeslo Barcelona, které se stalo jednou z&nbsp;nejznámějších ikon světového užitého designu. Konstrukci sedadla tvoří prohnutý ocelový pás ve tvaru písmene X nesoucí kožené polštáře s&nbsp;elegantním knoflíkovým prošíváním.\u003C/p>\n\u003Cp>V&nbsp;rohu menšího vnitřního atria stojí bronzová plastika \u003Cem>Der Morgen\u003C/em> (Úsvit) od německého sochaře Georga Kolbeho. Postava ženy zvedající paže k&nbsp;rannímu nebi vytváří dynamický organický protiklad k&nbsp;přísně pravoúhlým liniím stavby. Mies umístil sochu na sokl z&nbsp;černého mramoru těsně nad vodní hladinu v&nbsp;pozadí zelené stěny z&nbsp;ostrova Tinos.\u003C/p>\n\u003Cp>Plastika se vícenásobně zrcadlí v&nbsp;klidné vodní hladině, leštěném kameni i&nbsp;velkých skleněných tabulích. Za poledního slunce navíc hladina vnějšího bazénu vrhá jemné světelné odlesky na hladký podhled vznášející se střechy a&nbsp;dodává konstrukci dojem absolutní beztíže.\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"visit-context-2026\" data-section-kind=\"narrative\">\n\u003Csummary>Polední návštěva a&nbsp;světelné reflexy v&nbsp;roce 2026\u003C/summary>\n\u003Cdiv>\u003Cp>Návštěva pavilonu dne 30.&nbsp;září&nbsp;2026 v&nbsp;čase od 12.19 proběhla za jasného poledního slunce, které vytvářelo ideální podmínky pro studium světelných reflexů a&nbsp;materiálových dialogů architektury. Paprsky dopadající na hladinu vnějšího travertinového bazénu promítaly jemné vlnící se kaustické sítě na podhled vznášející se střechy, což umocňovalo dojem beztíže celé konstrukce.\u003C/p>\n\u003Cp>Interiér nabídl detailní pohled na symetrickou kresbu zlatavé onyxové stěny i&nbsp;kompozici kožených křesel Barcelona na černém vlněném koberci. V&nbsp;uzavřeném atriu se bronzová socha Georga Kolbeho \u003Cem>Der Morgen\u003C/em> působivě zrcadlila v&nbsp;černé hladině jezírka i&nbsp;vyleštěném zeleném mramoru z&nbsp;ostrova Tinos, což návštěvníkům umožnilo prožít Miesův plynoucí prostor v&nbsp;jeho plné harmonii.\u003C/p>\n\u003C/div>\n\u003C/details>",locationOfficialHtml:"\u003Ctable>\n\u003Cthead>\n\u003Ctr>\n\u003Cth align=\"left\">Parametr\u003C/th>\n\u003Cth align=\"left\">Údaj\u003C/th>\n\u003C/tr>\n\u003C/thead>\n\u003Ctbody>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Oficiální název\u003C/th>\n\u003Ctd align=\"left\">Německý pavilon v&nbsp;Barceloně (Pavelló alemany, Pavelló Mies van der Rohe)\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Hlavní architekt\u003C/th>\n\u003Ctd align=\"left\">Ludwig Mies van der Rohe (1886–1969)\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Klíčoví spolupracovníci\u003C/th>\n\u003Ctd align=\"left\">Lilly Reich (spoluautorka interiéru a&nbsp;nábytku), Georg Kolbe (socha \u003Cem>Der Morgen\u003C/em>), Oriol Bohigas (iniciátor obnovy), Ignasi de Solà-Morales, Cristian Cirici a&nbsp;Fernando Ramos (architekti rekonstrukce 1983–1986) \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Původní stavebník\u003C/th>\n\u003Ctd align=\"left\">vláda Výmars peg",width:1707,height:1280},{variant:"fallback",type:"image/jpeg",path:"/images/previews-xxs/IMG_0806.jpeg",width:190,height:127},{variant:"admin_thumb",type:"image/jpeg",path:"/images/previews-admin/IMG_0806.jpeg",width:534,height:401}],people:["person-8fcf0021a7ada1e7d3f84580ef3ca26a2e0e4ef99b9adf6b438fac8a9257157e"]},{id:"img0808",type:"image",src:"IMG_0808.JPEG",alt:"Říkali: Jeď metrem, ušetříš si chození., Plaça Espanya, Barcelona",title:"",caption:"Říkali: Jeď metrem, ušetříš si chození.",width:5384,height:3028,sizeMB:4.55,aspectRatio:"landscape-16-9",placeholder:"blurs/IMG_0808.png",placeholderColor:"rgb(56,40,40)",analysis:{aestheticScore:34.575644439458166,sharpness:0,qualityBucket:"poor",phash:""},exif:{date:"2026-09-30T13:24:25",releaseDate:"2026-09-30T13:24:25",author:"Cebreus",location:"Plaça Espanya",sublocation:"Plaça Espanya",city:"Barcelona",latitude:41.375247,longitude:2.148831,orientation:1,country:"Španělsko",countryCode:"ESP",state:"Katalánsko"},author:"Cebreus",authorSlug:"cebreus",location:"Plaça Espanya",city:"Barcelona",googleMapsUrl:"https://www.google.com/maps/search/?api=1&query=41.375247,2.148831",date:"2026-09-30T13:24:25",sources:[{variant:"default",type:"image/webp",path:"/images/previews-webp/IMG_0808.webp",width:370},{variant:"default",type:"image/jpeg",path:"/images/previews/IMG_0808.jpeg",width:370},{variant:"default",type:"image/avif",path:"/images/previews-avif/IMG_0808.avif",width:370},{variant:"xl",type:"image/webp",path:"/images/previews-xl-webp/IMG_0808.webp",width:534},{variant:"xl",type:"image/jpeg",path:"/images/previews-xl/IMG_0808.jpeg",width:534},{variant:"xl",type:"image/avif",path:"/images/previews-xl-avif/IMG_0808.avif",width:534},{variant:"detail",type:"image/jpeg",path:"/images/details/IMG_0808.jpeg",width:2276,height:1280},{variant:"fallback",type:"image/jpeg",path:"/images/previews-xxs/IMG_0808.jpeg",width:190,height:127},{variant:"admin_thumb",type:"image/jpeg",path:"/images/previews-admin/IMG_0808.jpeg",width:534,height:300}],rating:5,people:["person-67e7b790752ec4058cbdeefbcd229a848e2b4f981b789f39b6d982a02577b35c"]}],id:"day-2026-09-30"},{date:"2026-10-01",cities:["Barcelona"],locations:["Recinte Modernista de Sant Pau"],items:[{id:"loc-recinte-modernista-de-sant-pau-main-2026-10-01t102757",type:"separator",location:"Recinte Modernista de Sant Pau",city:"Barcelona",hasPhotos:true,startDate:"2026-10-01T10:27:57",endDate:"2026-10-01T23:59:59",storyTitle:"Nemocnice Sant Pau (Recinte Modernista de Sant Pau)",story:"\u003Cp class=\"lead\" data-section-id=\"lead\">Nemocniční areál Sant Pau (\u003Cem>Recinte Modernista de Sant Pau\u003C/em>) v&nbsp;barcelonské čtvrti El&nbsp;Guinardó představuje nejrozsáhlejší secesní komplex v&nbsp;Evropě a&nbsp;vrcholné dílo katalánského architekta Lluíse Domènecha i&nbsp;Montanera. Stavba vznikla v&nbsp;letech 1902–1930 na základě velkorysé závěti bankéře Paua Gila na financování moderního špitálu pro chudé. Architekt navrhl zahradní město tvořené samostatnými pavilony v&nbsp;zeleni, které propojil více než kilometrem podzemních chodeb pro bezhlučný a&nbsp;hygienický transport. Celý areál vyniká bohatou sochařskou a&nbsp;keramickou výzdobou a&nbsp;od roku 1997 je zapsán na Seznamu světového dědictví UNESCO.\u003C/p>\u003Cdetails data-section-id=\"history-origin\" data-section-kind=\"narrative\">\n\u003Csummary>Historie špitálu, odkaz Paua Gila a&nbsp;výstavba\u003C/summary>\n\u003Cdiv>\u003Cp>Původní špitál Santa Creu působil v&nbsp;hustě obydlené čtvrti El&nbsp;Raval nepřetržitě od roku 1401, kdy jej založil aragonský král Martin I.&nbsp;spojením středověkých městských útulků. Správu instituce vykonávala rada \u003Cem>Molt Il·lustre Administració\u003C/em> tvořená zástupci církve a&nbsp;městské rady Consell de Cent. Na sklonku 19.&nbsp;století však historický gotický areál přestal vyhovovat růstu města i&nbsp;moderním hygienickým standardům.\u003C/p>\n\u003Cp>Rozhodující obrat přinesla závěť katalánského bankéře Paua Gila z&nbsp;roku 1892, který odkázal téměř čtyři miliony peset na výstavbu nové nemocnice pro chudé pod patronací svatého Pavla. Vedením projektu pověřili architekta Lluíse Domènecha i&nbsp;Montanera a&nbsp;základní kámen položili 15.&nbsp;ledna&nbsp;1902. První fáze přinesla do roku 1913 deset modernistických pavilonů. Po architektově smrti v&nbsp;prosinci 1923 převzal vedení jeho syn Pere Domènech i&nbsp;Roura, který zbývající budovy dokončil ve střídmějším stylu noucentismu až do slavnostního otevření roku 1930.\u003C/p>\n\u003Cp>Za občanské války sloužily podzemní tunely jako protiletecký kryt a&nbsp;provizorní operační sály. Nemocnice sloužila pacientům až do roku 2009. Následná památková rehabilitace v&nbsp;letech 2009–2014 navrátila areálu původní secesní lesk a&nbsp;otevřela jej veřejnosti.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"urbanism-tunnels\" data-section-kind=\"narrative\">\n\u003Csummary>Urbanistický koncept, zahrady a&nbsp;podzemní chodby\u003C/summary>\n\u003Cdiv>\u003Cp>Domènech i&nbsp;Montaner před návrhem nemocnice prostudoval přibližně 240 špitálů v&nbsp;Evropě i&nbsp;Americe a&nbsp;zásadně odmítl stísněné monobloky s&nbsp;tmavými chodbami. Pro nový areál zvolil pozemek o&nbsp;rozloze 145&nbsp;000&nbsp;m² na mírném svahu Collseroly, který umožňoval přirozené větrání a&nbsp;spádové odvodnění.\u003C/p>\n\u003Cp>Architekt pootočil hlavní osu areálu přesně o&nbsp;45&nbsp;stupňů vůči pravoúhlé uliční síti Ildefonse Cerdày. Budovy tak směřují podél osy sever–jih, což zajišťuje maximální přístup slunečního svitu bez vystavení prudkým větrům. Pootočení areálu zároveň vytvořilo přímou pohledovou osu k&nbsp;chrámu Sagrada Família, kterou později propojila Avinguda de Gaudí. Rozestupy mezi pavilony architekt propočítal tak, aby si budovy během dne nikdy nestínily.\u003C/p>\n\u003Cp>Parkový prostor tvoří zimní zahrady s&nbsp;opadavými stromy a&nbsp;letní stinné háje doplněné aromatickými rostlinami jako levandule či vavřín. Všechny pavilony propojuje podzemní síť klenutých chodeb v&nbsp;délce přes 1&nbsp;000&nbsp;metrů. Tunely obložené bílými kachlemi se zaoblenými kouty umožňovaly diskrétní a&nbsp;bezhlučný převoz pacientů, léků i&nbsp;stravy bez rušení klidu v&nbsp;zahradách.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"pavilions-architecture\" data-section-kind=\"narrative\">\n\u003Csummary>Architektonické řešení pavilonů a&nbsp;lůžkové sály\u003C/summary>\n\u003Cdiv>\u003Cp>Původní velkorysý projekt počítal se 48 budovami, z&nbsp;nichž stavitelé realizovali 27 objektů včetně dvanácti vrcholných secesních pavilonů přímo od Domènecha i&nbsp;Montanera. Urbanistický řád striktně odděloval pacienty podle pohlaví i&nbsp;druhu diagnózy: východní strana hlavní aleje sloužila mužům pod ochranou světců, západní křídlo patřilo ženám pod patronací světic.\u003C/p>\n\u003Cp>Každý standardní lůžkový pavilon obsahoval prostorný sál pro 28 lůžek s&nbsp;klenutým stropem ve výšce osmi metrů, zdobeným jemnou přírodní keramikou. Průčelí budov tvoří půlkruhový prosklený rizalit sloužící jako denní místnost (\u003Cem>sala de dia\u003C/em>), kde se zotavující pacienti setkávali s&nbsp;rodinami a&nbsp;čerpali energii ze slunce. V&nbsp;zadním traktu se nacházely lékařské pracovny a&nbsp;izolační pokoje.\u003C/p>\n\u003Cp>Mezi klíčové objekty patří Pavelló de Sant Salvador s&nbsp;expozicí o&nbsp;díle architekta či Pavelló de Sant Rafael, který zůstává v&nbsp;autentickém stavu s&nbsp;dobovým nemocničním sálem. V&nbsp;samém těžišti areálu stojí Pavelló d&#39;Operacions s&nbsp;proskleným půlkruhovým sálem navrženým pro výuku chirurgie.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"administration-pavilion\" data-section-kind=\"narrative\">\n\u003Csummary>Administrativní pavilon a&nbsp;reprezentační sály\u003C/summary>\n\u003Cdiv>\u003Cp>Vstup do areálu ovládá monumentální Administrativní pavilon (\u003Cem>Pavelló de l&#39;Administració\u003C/em>), tvořený centrálním blokem a&nbsp;dvěma šikmými křídly evokujícími otevřenou náruč přijímající příchozí. Budově z&nbsp;červených cihel a&nbsp;růžového mramoru dominuje 62&nbsp;metrů vysoká hodinová věž (\u003Cem>Torre del Rellotge\u003C/em>) s&nbsp;prolamovanou keramickou korunou. Tato budova nikdy nesloužila k&nbsp;hospitalizaci a&nbsp;soustředila správu instituce.\u003C/p>\n\u003Cp>Návštěvníci vstupují přes velkolepý vestibul sklenutý devíti poli na sloupech z&nbsp;kamene a&nbsp;růžového mramoru. Keramické klenby v&nbsp;malvových a&nbsp;růžových tónech doplňují mozaikové lastury Maria Maragliana a&nbsp;řecká písmena Alfa a&nbsp;Omega, symbolizující roky výstavby 1905–1910. Z&nbsp;vestibulu stoupá reprezentační mramorové schodiště s&nbsp;vitrážemi a&nbsp;kamenným zábradlím lemovaným reliéfy ctností od Paua Gargalla.\u003C/p>\n\u003Cp>V&nbsp;prvním patře zaujme slavnostní sál Sala Cambó s&nbsp;mozarabským kazetovým stropem a&nbsp;především hlavní aula Sala Domènech i&nbsp;Montaner o&nbsp;výšce stropu osmnáct metrů. Sál prosvětlují rozměrná vitrážová okna s&nbsp;výhledem do zahrad, stěny zdobí mozaiková modlitba za donátory a&nbsp;socha svatého Jiří přemáhajícího draka jako symbol vítězství zdraví nad nemocí.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"materials-decoration\" data-section-kind=\"narrative\">\n\u003Csummary>Konstrukční řešení, mozaiky a&nbsp;sochařská výzdoba\u003C/summary>\n\u003Cdiv>\u003Cp>Konstrukční systém pavilonů kombinuje nosné režné cihelné zdivo, válcované ocelové profily a&nbsp;tradiční katalánské klenby z&nbsp;pálených pásků (\u003Cem>volta catalana\u003C/em>). Architekt ponechal červené lícové cihly přiznané a&nbsp;doplnil je tesaným pískovcem z&nbsp;lomů na hoře Montjuïc a&nbsp;nummulitovým vápencem z&nbsp;Girony. Většinu architektonické keramiky a&nbsp;glazovaných tvarovek dodala proslulá továrna Pujol i&nbsp;Bausis z&nbsp;Esplugues de Llobregat.\u003C/p>\n\u003Cp>Hladké keramické kachle a&nbsp;dlažby plnily přísnou hygienickou funkci, neboť bránily usazování nečistot a&nbsp;usnadňovaly pravidelnou dezinfekci. Střechy a&nbsp;kupole pavilonů kryjí barevné glazované tašky skládané do šupinových vzorů.\u003C/p>\n\u003Cp>Fasády oživuje bohatý sochařský program Eusebiho Arnaua a&nbsp;Paua Gargalla s&nbsp;nejrozsáhlejším souborem zvířecích plastik v&nbsp;Domènechově tvorbě — od sov a&nbsp;orlů až po chameleony a&nbsp;chrliče. Vnější plášť Administrativního pavilonu nese šestnáct monumentálních mozaikových panelů od Maria Maragliana a&nbsp;Lluíse Brua podle kreseb Franceska Labarty, které chronologicky zobrazují dějiny špitálu od středověku až po 20.&nbsp;století.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"visit-context-2026\" data-section-kind=\"narrative\">\n\u003Csummary>Návštěva a&nbsp;výstava Fontilles v&nbsp;roce 2026\u003C/summary>\n\u003Cdiv>\u003Cp>Celodenní návštěva areálu dne 1.&nbsp;října&nbsp;2026 proběhla v&nbsp;prostředí plně etablovaného památkového a&nbsp;znalostního kampusu. Prohlídka zahrnula průchod podzemními spojovacími tunely, expozici věnovanou Domènechovi v&nbsp;pavilonu Sant Salvador i&nbsp;autenticky zachovaný historický lůžkový sál v&nbsp;pavilonu Sant Rafael.\u003C/p>\n\u003Cp>V&nbsp;době návštěvy hostil areál rozsáhlou dočasnou výstavu \u003Cem>Fontilles — La ciutat amagada\u003C/em> (Skryté město), připravenou Valencijskou univerzitou a&nbsp;nadací Fundació Fontilles. Expozice mapovala dějiny sanatoria pro nemocné leprou ve valencijském údolí Vall de Laguar založeného roku 1902. Volba areálu Sant Pau symbolicky propojila dvě soběstačná zahradní města určená pro stigmatizované pacienty, neboť špitál Santa Creu historicky spravoval barcelonské leprosárium a&nbsp;jeho poslední chovance roku 1961 přijal právě Fontilles.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"facts\" data-section-kind=\"facts\">\n\u003Csummary>Základní údaje\u003C/summary>\n\u003Cdiv>\u003Ctable>\n\u003Cthead>\n\u003Ctr>\n\u003Cth align=\"left\">Parametr\u003C/th>\n\u003Cth align=\"left\">Údaj\u003C/th>\n\u003C/tr>\n\u003C/thead>\n\u003Ctbody>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Oficiální název\u003C/th>\n\u003Ctd align=\"left\">Hospital de la Santa Creu i&nbsp;Sant Pau (Recinte Modernista de Sant Pau)\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Hlavní architekt\u003C/th>\n\u003Ctd align=\"left\">Lluís Domènech i&nbsp;Montaner (1850–1923), dokončení vedl Pere Domènech i&nbsp;Roura (1881–1962)\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Klíčoví spolupracovníci\u003C/th>\n\u003Ctd align=\"left\">Eusebi Arnau a&nbsp;Pau Gargallo (sochy), Francesc Labarta (návrhy výzdoby), Mario Maragliano a&nbsp;Lluís Bru (mozaiky a&nbsp;keramika), továrna Pujol i&nbsp;Bausis (architektonická keramika) \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Původní stavebník\u003C/th>\n\u003Ctd align=\"left\">Pau Gil i&nbsp;Serra (odkaz z&nbsp;roku 1892) a&nbsp;Molt Il·lustre Administració (založená 1401)\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Doba výstavby\u003C/th>\n\u003Ctd align=\"left\">1902–1930 (základní kámen 15.&nbsp;ledna&nbsp;1902, otevření 16.&nbsp;ledna&nbsp;1930; rehabilitace 2009–2014) \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Architektonický styl\u003C/th>\n\u003Ctd align=\"left\">katalánský modernismus (\u003Cem>Modernisme\u003C/em>), secese, závěrečná etapa s&nbsp;prvky noucentismu\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Lokalita a&nbsp;adresa\u003C/th>\n\u003Ctd align=\"left\">Carrer de Sant Antoni Maria Claret 167, 08025 Barcelona (čtvrť El&nbsp;Guinardó)\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Rozměry a&nbsp;plocha\u003C/th>\n\u003Ctd align=\"left\">rozloha areálu cca 145&nbsp;000&nbsp;m²; výška hodinové věže 62&nbsp;metrů; přes 1&nbsp;000&nbsp;metrů podzemních chodeb; 27&nbsp;realizovaných pavilonů \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Současné využití a&nbsp;vlastník\u003C/th>\n\u003Ctd align=\"left\">Fundació Privada Hospital de la Santa Creu i&nbsp;Sant Pau; kulturní památka a&nbsp;mezinárodní instituce\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Památková ochrana\u003C/th>\n\u003Ctd align=\"left\">BCIN (IPAC č.&nbsp;63, BIC RI-51-0004278); Seznam světového dědictví UNESCO (ref. 804) \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Oficiální web\u003C/th>\n\u003Ctd align=\"left\">\u003Ca href=\"https://santpau.barcelona/\">santpau.barcelona\u003C/a>\u003C/td>\n\u003C/tr>\n\u003C/tbody>\n\u003C/table>\n\u003C/div>\n\u003C/details>",locationId:"recinte-modernista-de-sant-pau",locationLeadHtml:"\u003Cp class=\"lead\" data-section-id=\"lead\">Nemocniční areál Sant Pau (\u003Cem>Recinte Modernista de Sant Pau\u003C/em>) v&nbsp;barcelonské čtvrti El&nbsp;Guinardó představuje nejrozsáhlejší secesní komplex v&nbsp;Evropě a&nbsp;vrcholné dílo katalánského architekta Lluíse Domènecha i&nbsp;Montanera. Stavba vznikla v&nbsp;letech 1902–1930 na základě velkorysé závěti bankéře Paua Gila na financování moderního špitálu pro chudé. Architekt navrhl zahradní město tvořené samostatnými pavilony v&nbsp;zeleni, které propojil více než kilometrem podzemních chodeb pro bezhlučný a&nbsp;hygienický transport. Celý areál vyniká bohatou sochařskou a&nbsp;keramickou výzdobou a&nbsp;od roku 1997 je zapsán na Seznamu světového dědictví UNESCO.\u003C/p>",locationHtml:"\u003Cdetails data-section-id=\"history-origin\" data-section-kind=\"narrative\">\n\u003Csummary>Historie špitálu, odkaz Paua Gila a&nbsp;výstavba\u003C/summary>\n\u003Cdiv>\u003Cp>Původní špitál Santa Creu působil v&nbsp;hustě obydlené čtvrti El&nbsp;Raval nepřetržitě od roku 1401, kdy jej založil aragonský král Martin I.&nbsp;spojením středověkých městských útulků. Správu instituce vykonávala rada \u003Cem>Molt Il·lustre Administració\u003C/em> tvořená zástupci církve a&nbsp;městské rady Consell de Cent. Na sklonku 19.&nbsp;století však historický gotický areál přestal vyhovovat růstu města i&nbsp;moderním hygienickým standardům.\u003C/p>\n\u003Cp>Rozhodující obrat přinesla závěť katalánského bankéře Paua Gila z&nbsp;roku 1892, který odkázal téměř čtyři miliony peset na výstavbu nové nemocnice pro chudé pod patronací svatého Pavla. Vedením projektu pověřili architekta Lluíse Domènecha i&nbsp;Montanera a&nbsp;základní kámen položili 15.&nbsp;ledna&nbsp;1902. První fáze přinesla do roku 1913 deset modernistických pavilonů. Po architektově smrti v&nbsp;prosinci 1923 převzal vedení jeho syn Pere Domènech i&nbsp;Roura, který zbývající budovy dokončil ve střídmějším stylu noucentismu až do slavnostního otevření roku 1930.\u003C/p>\n\u003Cp>Za občanské války sloužily podzemní tunely jako protiletecký kryt a&nbsp;provizorní operační sály. Nemocnice sloužila pacientům až do roku 2009. Následná památková rehabilitace v&nbsp;letech 2009–2014 navrátila areálu původní secesní lesk a&nbsp;otevřela jej veřejnosti.\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"urbanism-tunnels\" data-section-kind=\"narrative\">\n\u003Csummary>Urbanistický koncept, zahrady a&nbsp;podzemní chodby\u003C/summary>\n\u003Cdiv>\u003Cp>Domènech i&nbsp;Montaner před návrhem nemocnice prostudoval přibližně 240 špitálů v&nbsp;Evropě i&nbsp;Americe a&nbsp;zásadně odmítl stísněné monobloky s&nbsp;tmavými chodbami. Pro nový areál zvolil pozemek o&nbsp;rozloze 145&nbsp;000&nbsp;m² na mírném svahu Collseroly, který umožňoval přirozené větrání a&nbsp;spádové odvodnění.\u003C/p>\n\u003Cp>Architekt pootočil hlavní osu areálu přesně o&nbsp;45&nbsp;stupňů vůči pravoúhlé uliční síti Ildefonse Cerdày. Budovy tak směřují podél osy sever–jih, což zajišťuje maximální přístup slunečního svitu bez vystavení prudkým větrům. Pootočení areálu zároveň vytvořilo přímou pohledovou osu k&nbsp;chrámu Sagrada Família, kterou později propojila Avinguda de Gaudí. Rozestupy mezi pavilony architekt propočítal tak, aby si budovy během dne nikdy nestínily.\u003C/p>\n\u003Cp>Parkový prostor tvoří zimní zahrady s&nbsp;opadavými stromy a&nbsp;letní stinné háje doplněné aromatickými rostlinami jako levandule či vavřín. Všechny pavilony propojuje podzemní síť klenutých chodeb v&nbsp;délce přes 1&nbsp;000&nbsp;metrů. Tunely obložené bílými kachlemi se zaoblenými kouty umožňovaly diskrétní a&nbsp;bezhlučný převoz pacientů, léků i&nbsp;stravy bez rušení klidu v&nbsp;zahradách.\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"pavilions-architecture\" data-section-kind=\"narrative\">\n\u003Csummary>Architektonické řešení pavilonů a&nbsp;lůžkové sály\u003C/summary>\n\u003Cdiv>\u003Cp>Původní velkorysý projekt počítal se 48 budovami, z&nbsp;nichž stavitelé realizovali 27 objektů včetně dvanácti vrcholných secesních pavilonů přímo od Domènecha i&nbsp;Montanera. Urbanistický řád striktně odděloval pacienty podle pohlaví i&nbsp;druhu diagnózy: východní strana hlavní aleje sloužila mužům pod ochranou světců, západní křídlo patřilo ženám pod patronací světic.\u003C/p>\n\u003Cp>Každý standardní lůžkový pavilon obsahoval prostorný sál pro 28 lůžek s&nbsp;klenutým stropem ve výšce osmi metrů, zdobeným jemnou přírodní keramikou. Průčelí budov tvoří půlkruhový prosklený rizalit sloužící jako denní místnost (\u003Cem>sala de dia\u003C/em>), kde se zotavující pacienti setkávali s&nbsp;rodinami a&nbsp;čerpali energii ze slunce. V&nbsp;zadním traktu se nacházely lékařské pracovny a&nbsp;izolační pokoje.\u003C/p>\n\u003Cp>Mezi klíčové objekty patří Pavelló de Sant Salvador s&nbsp;expozicí o&nbsp;díle architekta či Pavelló de Sant Rafael, který zůstává v&nbsp;autentickém stavu s&nbsp;dobovým nemocničním sálem. V&nbsp;samém těžišti areálu stojí Pavelló d'Operacions s&nbsp;proskleným půlkruhovým sálem navrženým pro výuku chirurgie.\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"administration-pavilion\" data-section-kind=\"narrative\">\n\u003Csummary>Administrativní pavilon a&nbsp;reprezentační sály\u003C/summary>\n\u003Cdiv>\u003Cp>Vstup do areálu ovládá monumentální Administrativní pavilon (\u003Cem>Pavelló de l'Administració\u003C/em>), tvořený centrálním blokem a&nbsp;dvěma šikmými křídly evokujícími otevřenou náruč přijímající příchozí. Budově z&nbsp;červených cihel a&nbsp;růžového mramoru dominuje 62&nbsp;metrů vysoká hodinová věž (\u003Cem>Torre del Rellotge\u003C/em>) s&nbsp;prolamovanou keramickou korunou. Tato budova nikdy nesloužila k&nbsp;hospitalizaci a&nbsp;soustředila správu instituce.\u003C/p>\n\u003Cp>Návštěvníci vstupují přes velkolepý vestibul sklenutý devíti poli na sloupech z&nbsp;kamene a&nbsp;růžového mramoru. Keramické klenby v&nbsp;malvových a&nbsp;růžových tónech doplňují mozaikové lastury Maria Maragliana a&nbsp;řecká písmena Alfa a&nbsp;Omega, symbolizující roky výstavby 1905–1910. Z&nbsp;vestibulu stoupá reprezentační mramorové schodiště s&nbsp;vitrážemi a&nbsp;kamenným zábradlím lemovaným reliéfy ctností od Paua Gargalla.\u003C/p>\n\u003Cp>V&nbsp;prvním patře zaujme slavnostní sál Sala Cambó s&nbsp;mozarabským kazetovým stropem a&nbsp;především hlavní aula Sala Domènech i&nbsp;Montaner o&nbsp;výšce stropu osmnáct metrů. Sál prosvětlují rozměrná vitrážová okna s&nbsp;výhledem do zahrad, stěny zdobí mozaiková modlitba za donátory a&nbsp;socha svatého Jiří přemáhajícího draka jako symbol vítězství zdraví nad nemocí.\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"materials-decoration\" data-section-kind=\"narrative\">\n\u003Csummary>Konstrukční řešení, mozaiky a&nbsp;sochařská výzdoba\u003C/summary>\n\u003Cdiv>\u003Cp>Konstrukční systém pavilonů kombinuje nosné režné cihelné zdivo, válcované ocelové profily a&nbsp;tradiční katalánské klenby z&nbsp;pálených pásků (\u003Cem>volta catalana\u003C/em>). Architekt ponechal červené lícové cihly přiznané a&nbsp;doplnil je tesaným pískovcem z&nbsp;lomů na hoře Montjuïc a&nbsp;nummulitovým vápencem z&nbsp;Girony. Většinu architektonické keramiky a&nbsp;glazovaných tvarovek dodala proslulá továrna Pujol i&nbsp;Bausis z&nbsp;Esplugues de Llobregat.\u003C/p>\n\u003Cp>Hladké keramické kachle a&nbsp;dlažby plnily přísnou hygienickou funkci, neboť bránily usazování nečistot a&nbsp;usnadňovaly pravidelnou dezinfekci. Střechy a&nbsp;kupole pavilonů kryjí barevné glazované tašky skládané do šupinových vzorů.\u003C/p>\n\u003Cp>Fasády oživuje bohatý sochařský program Eusebiho Arnaua a&nbsp;Paua Gargalla s&nbsp;nejrozsáhlejším souborem zvířecích plastik v&nbsp;Domènechově tvorbě — od sov a&nbsp;orlů až po chameleony a&nbsp;chrliče. Vnější plášť Administrativního pavilonu nese šestnáct monumentálních mozaikových panelů od Maria Maragliana a&nbsp;Lluíse Brua podle kreseb Franceska Labarty, které chronologicky zobrazují dějiny špitálu od středověku až po 20.&nbsp;století.\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"visit-context-2026\" data-section-kind=\"narrative\">\n\u003Csummary>Návštěva a&nbsp;výstava Fontilles v&nbsp;roce 2026\u003C/summary>\n\u003Cdiv>\u003Cp>Celodenní návštěva areálu dne 1.&nbsp;října&nbsp;2026 proběhla v&nbsp;prostředí plně etablovaného památkového a&nbsp;znalostního kampusu. Prohlídka zahrnula průchod podzemními spojovacími tunely, expozici věnovanou Domènechovi v&nbsp;pavilonu Sant Salvador i&nbsp;autenticky zachovaný historický lůžkový sál v&nbsp;pavilonu Sant Rafael.\u003C/p>\n\u003Cp>V&nbsp;době návštěvy hostil areál rozsáhlou dočasnou výstavu \u003Cem>Fontilles — La ciutat amagada\u003C/em> (Skryté město), připravenou Valencijskou univerzitou a&nbsp;nadací Fundació Fontilles. Expozice mapovala dějiny sanatoria pro nemocné leprou ve valencijském údolí Vall de Laguar založeného roku 1902. Volba areálu Sant Pau symbolicky propojila dvě soběstačná zahradní města určená pro stigmatizované pacienty, neboť špitál Santa Creu historicky spravoval barcelonské leprosárium a&nbsp;jeho poslední chovance roku 1961 přijal právě Fontilles.\u003C/p>\n\u003C/div>\n\u003C/details>",locationOfficialHtml:"\u003Ctable>\n\u003Cthead>\n\u003Ctr>\n\u003Cth align=\"left\">Parametr\u003C/th>\n\u003Cth align=\"left\">Údaj\u003C/th>\n\u003C/tr>\n\u003C/thead>\n\u003Ctbody>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Oficiální název\u003C/th>\n\u003Ctd align=\"left\">Hospital de la Santa Creu i&nbsp;Sant Pau (Recinte Modernista de Sant Pau)\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Hlavní architekt\u003C/th>\n\u003Ctd align=\"left\">Lluís Domènech i&nbsp;Montaner (1850–1923), dokončení vedl Pere Domènech i&nbsp;Roura (1881–1962)\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Klíčoví spolupracovníci\u003C/th>\n\u003Ctd align=\"left\">Eusebi Arnau a&nbsp;Pau Gargallo (sochy), Francesc Labarta (návrhy výzdoby), Mario Maragliano a&nbsp;Lluís Bru (mozaiky a&nbsp;keramika), továrna Pujol i&nbsp;Bausis (architektonická keramika) \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Původní stavebník\u003C/th>\n\u003Ctd align=\"left\">Pau Gil i&nbsp;Serra (odkaz z&nbsp;roku 1892) a&nbsp;Molt Il·lustre Administració (založená 1401)\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Doba výstavby\u003C/th>\n\u003Ctd align=\"left\">1902–1930 (základní kámen 15.&nbsp;ledna&nbsp;1902, otevření 16.&nbsp;ledna&nbsp;1930; rehabilitace 2009–2014) \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Architektonický styl\u003C/th>\n\u003Ctd align=\"left\">katalánský modernismus (\u003Cem>Modernisme\u003C/em>), secese, závěrečná etapa s&nbsp;prvky noucentismu\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Lokalita a&nbsp;adresa\u003C/th>\n\u003Ctd align=\"left\">Carrer de Sant Antoni Maria Claret 167, 08025 Barcelona (čtvrť El&nbsp;Guinardó)\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Rozměry a&nbsp;plocha\u003C/th>\n\u003Ctd align=\"left\">rozloha areálu cca 145&nbsp;000&nbsp;m²; výška hodinové věže 62&nbsp;metrů; přes 1&nbsp;000&nbsp;metrů podzemních chodeb; 27&nbsp;realizovaných pavilonů \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Současné využití a&nbsp;vlastník\u003C/th>\n\u003Ctd align=\"left\">Fundació Privada Hospital de la Santa Creu i&nbsp;Sant Pau; kulturní památka a&nbsp;mezinárodní instituce\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Památková ochrana\u003C/th>\n\u003Ctd align=\"left\">BCIN (IPAC č.&nbsp;63, BIC RI-51-0004278); Seznam světového dědictví UNESCO (ref. 804) \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Oficiální web\u003C/th>\n\u003Ctd align=\"left\">\u003Ca href=\"https://santpau.barcelona/\">santpau.barcelona\u003C/a>\u003C/td>\n\u003C/tr>\n\u003C/tbody>\n\u003C/table>\n",aliases:["Hospital de la Santa Creu i Sant Pau","Hospital de la Santa Cruz y San Pablo","Sant Pau Art Nouveau Site","Nemocnice svatého Kříže a svatého Pavla"],heroImage:{src:"/travel-guide/teasers/recinte-modernista-de-sant-pau/hero.jpg",alt:"Hlavní průčelí modernistického areálu Sant Pau"},audio:[{section:"lead",label:"Úvod",identity:"12dd52a6f52af184b2b2eabc2b331cdac2d175121da996118a54568481aec55a",src:"/travel-guide/audio/recinte-modernista-de-sant-pau/12dd52a6f52af184b2b2eabc2b331cdac2d175121da996118a54568481aec55a.m4a"},{section:"history-origin",label:"Historie špitálu, odkaz Paua Gila a výstavba",identity:"b8621ea9664fc9ead523bf10ad8d325f29748d3ca311e79f809105dffc9514a4",src:"/travel-guide/audio/recinte-modernista-de-sant-pau/b8621ea9664fc9ead523bf10ad8d325f29748d3ca311e79f809105dffc9514a4.m4a"},{section:"urbanism-tunnels",label:"Urbanistický koncept, zahrady a podzemní chodby",identity:"5a9ea252ef71a0438ddac27f9b63113e84358496c362317ac5ef0ff25ebb27d4",src:"/travel-guide/audio/recinte-modernista-de-sant-pau/5a9ea252ef71a0438ddac27f9b63113e84358496c362317ac5ef0ff25ebb27d4.m4a"},{section:"pavilions-architect
