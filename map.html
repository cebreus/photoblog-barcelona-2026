e:40.983174860884084,sharpness:71,qualityBucket:"poor",phash:"99f96672703c9d0e"},exif:{date:"2026-09-28T22:31:38",releaseDate:"2026-09-28T22:37:21",author:"Cebreus",location:"Casa Batlló",sublocation:"Casa Batlló",city:"Barcelona",latitude:41.391564,longitude:2.164814,orientation:1,country:"Španělsko",countryCode:"ESP",state:"Katalánsko"},author:"Cebreus",authorSlug:"cebreus",location:"Casa Batlló",city:"Barcelona",googleMapsUrl:"https://www.google.com/maps/search/?api=1&query=41.391564,2.164814",date:"2026-09-28T22:31:38",sources:[{variant:"default",type:"image/webp",path:"/images/previews-webp/IMG_0645.webp",width:370},{variant:"default",type:"image/jpeg",path:"/images/previews/IMG_0645.jpeg",width:370},{variant:"default",type:"image/avif",path:"/images/previews-avif/IMG_0645.avif",width:370},{variant:"xl",type:"image/webp",path:"/images/previews-xl-webp/IMG_0645.webp",width:534},{variant:"xl",type:"image/jpeg",path:"/images/previews-xl/IMG_0645.jpeg",width:534},{variant:"xl",type:"image/avif",path:"/images/previews-xl-avif/IMG_0645.avif",width:534},{variant:"detail",type:"image/jpeg",path:"/images/details/IMG_0645.jpeg",width:1707,height:1280},{variant:"fallback",type:"image/jpeg",path:"/images/previews-xxs/IMG_0645.jpeg",width:190,height:127},{variant:"admin_thumb",type:"image/jpeg",path:"/images/previews-admin/IMG_0645.jpeg",width:534,height:401}],people:[]},{id:"img0648",type:"image",src:"IMG_0648.JPEG",alt:"Casa Batlló, Barcelona",title:"",width:4032,height:3024,sizeMB:3.39,aspectRatio:"landscape-4-3",placeholder:"blurs/IMG_0648.png",placeholderColor:"rgb(8,8,8)",analysis:{aestheticScore:44.524599769666146,sharpness:100,qualityBucket:"poor",phash:"d0dccc8ccc993989"},exif:{date:"2026-09-28T22:37:48",releaseDate:"2026-09-28T22:37:48",author:"Cebreus",location:"Casa Batlló",sublocation:"Casa Batlló",city:"Barcelona",latitude:41.391783,longitude:2.165206,orientation:1,country:"Španělsko",countryCode:"ESP",state:"Katalánsko"},author:"Cebreus",authorSlug:"cebreus",location:"Casa Batlló",city:"Barcelona",googleMapsUrl:"https://www.google.com/maps/search/?api=1&query=41.391783,2.165206",date:"2026-09-28T22:37:48",sources:[{variant:"default",type:"image/webp",path:"/images/previews-webp/IMG_0648.webp",width:370},{variant:"default",type:"image/jpeg",path:"/images/previews/IMG_0648.jpeg",width:370},{variant:"default",type:"image/avif",path:"/images/previews-avif/IMG_0648.avif",width:370},{variant:"xl",type:"image/webp",path:"/images/previews-xl-webp/IMG_0648.webp",width:534},{variant:"xl",type:"image/jpeg",path:"/images/previews-xl/IMG_0648.jpeg",width:534},{variant:"xl",type:"image/avif",path:"/images/previews-xl-avif/IMG_0648.avif",width:534},{variant:"detail",type:"image/jpeg",path:"/images/details/IMG_0648.jpeg",width:1707,height:1280},{variant:"fallback",type:"image/jpeg",path:"/images/previews-xxs/IMG_0648.jpeg",width:190,height:127},{variant:"admin_thumb",type:"image/jpeg",path:"/images/previews-admin/IMG_0648.jpeg",width:534,height:401}],people:[]}],id:"day-2026-09-28"},{date:"2026-09-29",cities:["Barcelona"],locations:["Casa Vicens","Casa Batlló","Palau de la Música Catalana","Cathedral of Barcelona","Náměstí Katalánska","Diagonal, nástupiště 1","Sagrada Família"],items:[{id:"loc-casa-vicens-main-2026-09-29t113842",type:"separator",location:"Casa Vicens",city:"Barcelona",hasPhotos:true,startDate:"2026-09-29T11:38:42",endDate:"2026-09-29T11:44:00",storyTitle:"Casa Vicens",story:"\u003Cp class=\"lead\" data-section-id=\"lead\">Dům Casa Vicens v&nbsp;barcelonské čtvrti Gràcia představuje první významnou rezidenční realizaci architekta Antoniho Gaudího. Stavba vznikla v&nbsp;letech 1883–1885 jako letní sídlo makléře Manela Vicense i&nbsp;Montanera. Gaudí v&nbsp;návrhu propojil vlivy maurského stavitelství, neomudéjarského slohu a&nbsp;ornamentální florální prvky inspirované středomořskou přírodou. Výrazná kombinace lomového kamene, červených cihel, glazované keramiky s&nbsp;květy aksamitníků a&nbsp;litinových palmových mříží tvoří osobitou kompozici, která předznamenala celou architektovu pozdější tvorbu.\u003C/p>\u003Cdetails data-section-id=\"history-origin\" data-section-kind=\"narrative\">\n\u003Csummary>Vznik letního sídla a&nbsp;odkaz Manela Vicense\u003C/summary>\n\u003Cdiv>\u003Cp>Manel Vicens i&nbsp;Montaner působil jako makléř cenných papírů a&nbsp;směnek, který stavební parcelu v&nbsp;tehdy samostatné obci Vila de Gràcia zdědil po matce. Dlouhá léta panoval v&nbsp;literatuře omyl, že Vicens vlastnil cihelnu a&nbsp;dům sloužil jako vzorkovna keramických obkladů; archivní nález jeho závěti však potvrdil práci ve finančnictví a&nbsp;čistě umělecký původ keramického dekoru.\u003C/p>\n\u003Cp>V&nbsp;únoru 1883 podal Vicens žádost o&nbsp;stavební povolení doplněnou plány, které Gaudí signoval v&nbsp;lednu téhož roku. Architekt vycházel ze svých teoretických zásad o&nbsp;rodinném sídle formulovaných v&nbsp;rukopisu \u003Cem>La casa pairal\u003C/em> (1878–1883), kde kladl důraz na proslunění a&nbsp;hygienické větrání.\u003C/p>\n\u003Cp>Roku 1899 odkoupil dům dětský lékař Antoni Jover i&nbsp;Puig. V&nbsp;letech 1925–1927 provedl Gaudího žák Joan Baptista Serra de Martínez citlivé rozšíření budovy na celoroční rodinný dům, za což získal první cenu města Barcelony. Po rozsáhlé rehabilitaci z&nbsp;let 2014–2017 se dům otevřel veřejnosti jako moderní muzeum architektury.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"construction-facade\" data-section-kind=\"narrative\">\n\u003Csummary>Konstrukční řešení, keramika a&nbsp;litinová brána\u003C/summary>\n\u003Cdiv>\u003Cp>Nosný systém budovy kombinuje neomítnutý lomový kámen zpevněný vodorovnými pásy červených cihel a&nbsp;dřevěné trámové stropy. Vnější nároží Gaudí zkosil a&nbsp;vytvořil stupňovité výstupky z&nbsp;konzolovitě vyložených cihel, které odkazují na islámskou a&nbsp;mudéjarskou architekturu.\u003C/p>\n\u003Cp>Výrazným prvkem exteriéru jsou glazované keramické kachle o&nbsp;rozměrech 15&nbsp;×&nbsp;15&nbsp;centimetrů. Část dlaždic nese žluté květy aksamitníku rozkladitého (\u003Cem>clavells de moro\u003C/em> neboli afrikánů), které Gaudí objevil planě kvést na staveništi při vyměřování parcely. Keramické vlysy na verandě doplňují verše z&nbsp;tradičních katalánských dětských říkanek reagující na denní pohyb slunce, jako je „Sol, solet, vinam a&nbsp;veure“.\u003C/p>\n\u003Cp>Uliční oplocení a&nbsp;vstupní bránu tvoří litinové odlitky vějířovitých listů středomořské palmy žumary nízké (\u003Cem>Chamaerops humilis\u003C/em>), vsazené do nosného kovaného rámu. Sádrový model vytvořil sochař Llorenç Matamala a&nbsp;segmenty sériově odlil mistr Joan Oñós.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"dining-smoking-room\" data-section-kind=\"narrative\">\n\u003Csummary>Jídelna, krb a&nbsp;orientální kuřácký salon\u003C/summary>\n\u003Cdiv>\u003Cp>Vstup do domu vede přes zvýšený vestibul s&nbsp;polychromovaným trámovým stropem a&nbsp;orientální svítilnou z&nbsp;tepaného kovu. Podlahy v&nbsp;přízemí pokrývá klasická římská mozaika \u003Cem>opus tessellatum\u003C/em> s&nbsp;jemnými geometrickými vzory, která vytváří klidný řádový kontrast k&nbsp;bohatě zdobeným stěnám.\u003C/p>\n\u003Cp>Reprezentační jádro přízemí tvoří jídelna s&nbsp;krbem obloženým pravou pálenou keramikou. Dřevěné obložení z&nbsp;cejlonského citronovníku navrhl Gaudí na míru souboru 32&nbsp;olejomaleb malíře Franceska Torrescassany, předního katalánského realisty a&nbsp;blízkého přítele stavebníka. Strop mezi trámy zdobí věrně polychromované sádrové odlitky větví granátovníku s&nbsp;plody.\u003C/p>\n\u003Cp>Na jídelnu navazuje orientální kuřácký salon ve stylu mudéjar. Krápníkový strop mukarnas tvoří tvarovaná sádra, zatímco stěny kryjí unikátní reliéfní panely z&nbsp;lisovaného kašírovaného papíru (\u003Cem>cartró-pedra\u003C/em>) s&nbsp;motivy datlových palem, které pod hydraulickým lisem vyrobil průmyslník Hermenegildo Miralles a&nbsp;které dokonale imitují lesklý obklad.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"veranda-private-rooms\" data-section-kind=\"narrative\">\n\u003Csummary>Veranda, soukromé pokoje a&nbsp;nástěnná sgrafita\u003C/summary>\n\u003Cdiv>\u003Cp>Z&nbsp;jídelny se vychází na krytou verandu s&nbsp;dřevěnými stahovacími žaluziemi inspirovanými arabskými mřížemi mašrabíja. Uprostřed verandy fungovala mramorová kašna s&nbsp;kovovou sítí ve tvaru pavučiny; kapky vody dopadající na síť zvlhčovaly vzduch a&nbsp;lámaly ranní sluneční světlo do optického jevu miniaturní duhy.\u003C/p>\n\u003Cp>První patro sloužilo soukromému životu rodiny. Hlavní ložnici rozděluje dispozice na lůžkovou část a&nbsp;soukromý budoár s&nbsp;rozdílnými kazetovými stropy s&nbsp;motivy ostružiníků i&nbsp;mučenek. V&nbsp;budoáru uplatnil Gaudí iluzivní stropní malbu technikou \u003Cem>trompe-l&#39;œil\u003C/em>, která mezi větvemi otevírá průhled na modré nebe s&nbsp;letícími ptáky.\u003C/p>\n\u003Cp>Na stěnách architekt poprvé v&nbsp;katalánské rezidenční architektuře použil techniku proškrabávaného sgrafita v&nbsp;interiéru s&nbsp;motivy kapradin, rákosí a&nbsp;břečťanu. Podkroví pod dřevěným krovem, původně hospodářské zázemí, dnes hostí stálou expozici o&nbsp;vývoji domu.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"roof-garden-history\" data-section-kind=\"narrative\">\n\u003Csummary>Střešní vyhlídka, kaskáda a&nbsp;proměny areálu\u003C/summary>\n\u003Cdiv>\u003Cp>Pochozí střešní terasa domu Casa Vicens představuje vůbec první vyhlídkovou střechu v&nbsp;Gaudího celoživotní tvorbě. Kolem šikmých sedlových ploch vede úzký obslužný chodník dlážděný pálenými cihlami. Na západním nároží vystupuje malá vyhlídková věžička s&nbsp;kopulí, zatímco čtyři hranolové komíny chrání keramické kachle s&nbsp;aksamitníky před pronikáním deště do kouřovodů.\u003C/p>\n\u003Cp>Původní parcelu o&nbsp;výměře přes tisíc metrů čtverečních tvořila rozlehlá zahrada navržená pro příjemné mikroklima v&nbsp;letních měsících. Gaudí do ní zakomponoval monumentální cihlovou kaskádu s&nbsp;parabolickým obloukem, která tříští vody ochlazovala okolní vzduch. V&nbsp;roce 1925 doplnila areál kaple svaté Rity nad pramenem minerální vody \u003Cem>Agua de Santa Rita\u003C/em>, která sloužila poutníkům.\u003C/p>\n\u003Cp>V&nbsp;důsledku poválečného stavebního tlaku byla většina zahrady s&nbsp;kaskádou rozprodána a&nbsp;zbořena; část litinových mříží z&nbsp;palmových listů se však zachránila v&nbsp;Parku Güell.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"visit-context-2026\" data-section-kind=\"narrative\">\n\u003Csummary>Dopolední zastávka v&nbsp;Carrer de les Carolines v&nbsp;roce 2026\u003C/summary>\n\u003Cdiv>\u003Cp>Dopolední návštěva dne 29.&nbsp;září&nbsp;2026 v&nbsp;čase od 11.38 do 11.44 představovala soustředěnou fotografickou zastávku před uličním průčelím domu v&nbsp;úzké ulici Carrer de les Carolines v&nbsp;srdci historické čtvrti Gràcia. Exteriérový pohled nabídl možnost detailně studovat Gaudího ranou práci s&nbsp;neomítnutým lomovým kamenem, stupňovitými nárožními konzolami z&nbsp;červených cihel i&nbsp;rytmickým střídáním glazovaných kachlů se žlutými květy aksamitníků.\u003C/p>\n\u003Cp>Mimořádnou pozornost poutala dochovaná monumentální vstupní brána a&nbsp;uliční oplocení tvořené subtilními litinovými odlitky vějířovitých listů středomořské palmy žumary nízké vsazenými do kovaných nosných rámů. Ostré dopolední slunce pronikající mezi fasády protějších domů plasticky vykreslovalo reliéfní keramické římsy s&nbsp;dobovými katalánskými nápisy i&nbsp;siluetu vyhlídkové věžičky vystupující nad střešní římsu.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"facts\" data-section-kind=\"facts\">\n\u003Csummary>Základní údaje\u003C/summary>\n\u003Cdiv>\u003Ctable>\n\u003Cthead>\n\u003Ctr>\n\u003Cth align=\"left\">Parametr\u003C/th>\n\u003Cth align=\"left\">Údaj\u003C/th>\n\u003C/tr>\n\u003C/thead>\n\u003Ctbody>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Oficiální název\u003C/th>\n\u003Ctd align=\"left\">Casa Vicens\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Hlavní architekt\u003C/th>\n\u003Ctd align=\"left\">Antoni Gaudí i&nbsp;Cornet (1852–1926)\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Klíčoví spolupracovníci\u003C/th>\n\u003Ctd align=\"left\">Llorenç Matamala (sochařský model mříží), Joan Oñós (litinové mříže), Francesc Torrescassana (olejomalby v&nbsp;jídelně), Hermenegildo Miralles (panely cartró-pedra), Joan Baptista Serra de Martínez (rozšíření 1925–1927) \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Původní stavebník\u003C/th>\n\u003Ctd align=\"left\">Manel Vicens i&nbsp;Montaner\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Doba výstavby\u003C/th>\n\u003Ctd align=\"left\">1883–1885 (rozšíření 1925–1927, památková rehabilitace 2014–2017) \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Architektonický styl\u003C/th>\n\u003Ctd align=\"left\">katalánský modernismus (\u003Cem>Modernisme\u003C/em>), novomudéjarský a&nbsp;orientální styl\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Lokalita a&nbsp;adresa\u003C/th>\n\u003Ctd align=\"left\">Carrer de les Carolines 20–26, 08012 Barcelona (čtvrť Gràcia)\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Rozměry a&nbsp;plocha\u003C/th>\n\u003Ctd align=\"left\">původní parcela 1&nbsp;035&nbsp;m²; současná zastavěná plocha 1&nbsp;239&nbsp;m² \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Současné využití a&nbsp;vlastník\u003C/th>\n\u003Ctd align=\"left\">MoraBanc (od roku 2014); muzeum architektury otevřené veřejnosti od 16.&nbsp;listopadu&nbsp;2017\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Památková ochrana\u003C/th>\n\u003Ctd align=\"left\">BCIN (č.&nbsp;09-E001-3814); Seznam světového dědictví UNESCO (soubor Díla Antoniho Gaudího, ref. 320bis-001) \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Oficiální web\u003C/th>\n\u003Ctd align=\"left\">\u003Ca href=\"https://casavicens.org/\">casavicens.org\u003C/a>\u003C/td>\n\u003C/tr>\n\u003C/tbody>\n\u003C/table>\n\u003C/div>\n\u003C/details>",locationId:"casa-vicens",locationLeadHtml:"\u003Cp class=\"lead\" data-section-id=\"lead\">Dům Casa Vicens v&nbsp;barcelonské čtvrti Gràcia představuje první významnou rezidenční realizaci architekta Antoniho Gaudího. Stavba vznikla v&nbsp;letech 1883–1885 jako letní sídlo makléře Manela Vicense i&nbsp;Montanera. Gaudí v&nbsp;návrhu propojil vlivy maurského stavitelství, neomudéjarského slohu a&nbsp;ornamentální florální prvky inspirované středomořskou přírodou. Výrazná kombinace lomového kamene, červených cihel, glazované keramiky s&nbsp;květy aksamitníků a&nbsp;litinových palmových mříží tvoří osobitou kompozici, která předznamenala celou architektovu pozdější tvorbu.\u003C/p>",locationHtml:"\u003Cdetails data-section-id=\"history-origin\" data-section-kind=\"narrative\">\n\u003Csummary>Vznik letního sídla a&nbsp;odkaz Manela Vicense\u003C/summary>\n\u003Cdiv>\u003Cp>Manel Vicens i&nbsp;Montaner působil jako makléř cenných papírů a&nbsp;směnek, který stavební parcelu v&nbsp;tehdy samostatné obci Vila de Gràcia zdědil po matce. Dlouhá léta panoval v&nbsp;literatuře omyl, že Vicens vlastnil cihelnu a&nbsp;dům sloužil jako vzorkovna keramických obkladů; archivní nález jeho závěti však potvrdil práci ve finančnictví a&nbsp;čistě umělecký původ keramického dekoru.\u003C/p>\n\u003Cp>V&nbsp;únoru 1883 podal Vicens žádost o&nbsp;stavební povolení doplněnou plány, které Gaudí signoval v&nbsp;lednu téhož roku. Architekt vycházel ze svých teoretických zásad o&nbsp;rodinném sídle formulovaných v&nbsp;rukopisu \u003Cem>La casa pairal\u003C/em> (1878–1883), kde kladl důraz na proslunění a&nbsp;hygienické větrání.\u003C/p>\n\u003Cp>Roku 1899 odkoupil dům dětský lékař Antoni Jover i&nbsp;Puig. V&nbsp;letech 1925–1927 provedl Gaudího žák Joan Baptista Serra de Martínez citlivé rozšíření budovy na celoroční rodinný dům, za což získal první cenu města Barcelony. Po rozsáhlé rehabilitaci z&nbsp;let 2014–2017 se dům otevřel veřejnosti jako moderní muzeum architektury.\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"construction-facade\" data-section-kind=\"narrative\">\n\u003Csummary>Konstrukční řešení, keramika a&nbsp;litinová brána\u003C/summary>\n\u003Cdiv>\u003Cp>Nosný systém budovy kombinuje neomítnutý lomový kámen zpevněný vodorovnými pásy červených cihel a&nbsp;dřevěné trámové stropy. Vnější nároží Gaudí zkosil a&nbsp;vytvořil stupňovité výstupky z&nbsp;konzolovitě vyložených cihel, které odkazují na islámskou a&nbsp;mudéjarskou architekturu.\u003C/p>\n\u003Cp>Výrazným prvkem exteriéru jsou glazované keramické kachle o&nbsp;rozměrech 15&nbsp;×&nbsp;15&nbsp;centimetrů. Část dlaždic nese žluté květy aksamitníku rozkladitého (\u003Cem>clavells de moro\u003C/em> neboli afrikánů), které Gaudí objevil planě kvést na staveništi při vyměřování parcely. Keramické vlysy na verandě doplňují verše z&nbsp;tradičních katalánských dětských říkanek reagující na denní pohyb slunce, jako je „Sol, solet, vinam a&nbsp;veure“.\u003C/p>\n\u003Cp>Uliční oplocení a&nbsp;vstupní bránu tvoří litinové odlitky vějířovitých listů středomořské palmy žumary nízké (\u003Cem>Chamaerops humilis\u003C/em>), vsazené do nosného kovaného rámu. Sádrový model vytvořil sochař Llorenç Matamala a&nbsp;segmenty sériově odlil mistr Joan Oñós.\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"dining-smoking-room\" data-section-kind=\"narrative\">\n\u003Csummary>Jídelna, krb a&nbsp;orientální kuřácký salon\u003C/summary>\n\u003Cdiv>\u003Cp>Vstup do domu vede přes zvýšený vestibul s&nbsp;polychromovaným trámovým stropem a&nbsp;orientální svítilnou z&nbsp;tepaného kovu. Podlahy v&nbsp;přízemí pokrývá klasická římská mozaika \u003Cem>opus tessellatum\u003C/em> s&nbsp;jemnými geometrickými vzory, která vytváří klidný řádový kontrast k&nbsp;bohatě zdobeným stěnám.\u003C/p>\n\u003Cp>Reprezentační jádro přízemí tvoří jídelna s&nbsp;krbem obloženým pravou pálenou keramikou. Dřevěné obložení z&nbsp;cejlonského citronovníku navrhl Gaudí na míru souboru 32&nbsp;olejomaleb malíře Franceska Torrescassany, předního katalánského realisty a&nbsp;blízkého přítele stavebníka. Strop mezi trámy zdobí věrně polychromované sádrové odlitky větví granátovníku s&nbsp;plody.\u003C/p>\n\u003Cp>Na jídelnu navazuje orientální kuřácký salon ve stylu mudéjar. Krápníkový strop mukarnas tvoří tvarovaná sádra, zatímco stěny kryjí unikátní reliéfní panely z&nbsp;lisovaného kašírovaného papíru (\u003Cem>cartró-pedra\u003C/em>) s&nbsp;motivy datlových palem, které pod hydraulickým lisem vyrobil průmyslník Hermenegildo Miralles a&nbsp;které dokonale imitují lesklý obklad.\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"veranda-private-rooms\" data-section-kind=\"narrative\">\n\u003Csummary>Veranda, soukromé pokoje a&nbsp;nástěnná sgrafita\u003C/summary>\n\u003Cdiv>\u003Cp>Z&nbsp;jídelny se vychází na krytou verandu s&nbsp;dřevěnými stahovacími žaluziemi inspirovanými arabskými mřížemi mašrabíja. Uprostřed verandy fungovala mramorová kašna s&nbsp;kovovou sítí ve tvaru pavučiny; kapky vody dopadající na síť zvlhčovaly vzduch a&nbsp;lámaly ranní sluneční světlo do optického jevu miniaturní duhy.\u003C/p>\n\u003Cp>První patro sloužilo soukromému životu rodiny. Hlavní ložnici rozděluje dispozice na lůžkovou část a&nbsp;soukromý budoár s&nbsp;rozdílnými kazetovými stropy s&nbsp;motivy ostružiníků i&nbsp;mučenek. V&nbsp;budoáru uplatnil Gaudí iluzivní stropní malbu technikou \u003Cem>trompe-l'œil\u003C/em>, která mezi větvemi otevírá průhled na modré nebe s&nbsp;letícími ptáky.\u003C/p>\n\u003Cp>Na stěnách architekt poprvé v&nbsp;katalánské rezidenční architektuře použil techniku proškrabávaného sgrafita v&nbsp;interiéru s&nbsp;motivy kapradin, rákosí a&nbsp;břečťanu. Podkroví pod dřevěným krovem, původně hospodářské zázemí, dnes hostí stálou expozici o&nbsp;vývoji domu.\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"roof-garden-history\" data-section-kind=\"narrative\">\n\u003Csummary>Střešní vyhlídka, kaskáda a&nbsp;proměny areálu\u003C/summary>\n\u003Cdiv>\u003Cp>Pochozí střešní terasa domu Casa Vicens představuje vůbec první vyhlídkovou střechu v&nbsp;Gaudího celoživotní tvorbě. Kolem šikmých sedlových ploch vede úzký obslužný chodník dlážděný pálenými cihlami. Na západním nároží vystupuje malá vyhlídková věžička s&nbsp;kopulí, zatímco čtyři hranolové komíny chrání keramické kachle s&nbsp;aksamitníky před pronikáním deště do kouřovodů.\u003C/p>\n\u003Cp>Původní parcelu o&nbsp;výměře přes tisíc metrů čtverečních tvořila rozlehlá zahrada navržená pro příjemné mikroklima v&nbsp;letních měsících. Gaudí do ní zakomponoval monumentální cihlovou kaskádu s&nbsp;parabolickým obloukem, která tříští vody ochlazovala okolní vzduch. V&nbsp;roce 1925 doplnila areál kaple svaté Rity nad pramenem minerální vody \u003Cem>Agua de Santa Rita\u003C/em>, která sloužila poutníkům.\u003C/p>\n\u003Cp>V&nbsp;důsledku poválečného stavebního tlaku byla většina zahrady s&nbsp;kaskádou rozprodána a&nbsp;zbořena; část litinových mříží z&nbsp;palmových listů se však zachránila v&nbsp;Parku Güell.\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"visit-context-2026\" data-section-kind=\"narrative\">\n\u003Csummary>Dopolední zastávka v&nbsp;Carrer de les Carolines v&nbsp;roce 2026\u003C/summary>\n\u003Cdiv>\u003Cp>Dopolední návštěva dne 29.&nbsp;září&nbsp;2026 v&nbsp;čase od 11.38 do 11.44 představovala soustředěnou fotografickou zastávku před uličním průčelím domu v&nbsp;úzké ulici Carrer de les Carolines v&nbsp;srdci historické čtvrti Gràcia. Exteriérový pohled nabídl možnost detailně studovat Gaudího ranou práci s&nbsp;neomítnutým lomovým kamenem, stupňovitými nárožními konzolami z&nbsp;červených cihel i&nbsp;rytmickým střídáním glazovaných kachlů se žlutými květy aksamitníků.\u003C/p>\n\u003Cp>Mimořádnou pozornost poutala dochovaná monumentální vstupní brána a&nbsp;uliční oplocení tvořené subtilními litinovými odlitky vějířovitých listů středomořské palmy žumary nízké vsazenými do kovaných nosných rámů. Ostré dopolední slunce pronikající mezi fasády protějších domů plasticky vykreslovalo reliéfní keramické římsy s&nbsp;dobovými katalánskými nápisy i&nbsp;siluetu vyhlídkové věžičky vystupující nad střešní římsu.\u003C/p>\n\u003C/div>\n\u003C/details>",locationOfficialHtml:"\u003Ctable>\n\u003Cthead>\n\u003Ctr>\n\u003Cth align=\"left\">Parametr\u003C/th>\n\u003Cth align=\"left\">Údaj\u003C/th>\n\u003C/tr>\n\u003C/thead>\n\u003Ctbody>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Oficiální název\u003C/th>\n\u003Ctd align=\"left\">Casa Vicens\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Hlavní architekt\u003C/th>\n\u003Ctd align=\"left\">Antoni Gaudí i&nbsp;Cornet (1852–1926)\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Klíčoví spolupracovníci\u003C/th>\n\u003Ctd align=\"left\">Llorenç Matamala (sochařský model mříží), Joan Oñós (litinové mříže), Francesc Torrescassana (olejomalby v&nbsp;jídelně), Hermenegildo Miralles (panely cartró-pedra), Joan Baptista Serra de Martínez (rozšíření 1925–1927) \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Původní stavebník\u003C/th>\n\u003Ctd align=\"left\">Manel Vicens i&nbsp;Montaner\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Doba výstavby\u003C/th>\n\u003Ctd align=\"left\">1883–1885 (rozšíření 1925–1927, památková rehabilitace 2014–2017) \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Architektonický styl\u003C/th>\n\u003Ctd align=\"left\">katalánský modernismus (\u003Cem>Modernisme\u003C/em>), novomudéjarský a&nbsp;orientální styl\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Lokalita a&nbsp;adresa\u003C/th>\n\u003Ctd align=\"left\">Carrer de les Carolines 20–26, 08012 Barcelona (čtvrť Gràcia)\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Rozměry a&nbsp;plocha\u003C/th>\n\u003Ctd align=\"left\">původní parcela 1&nbsp;035&nbsp;m²; současná zastavěná plocha 1&nbsp;239&nbsp;m² \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Současné využití a&nbsp;vlastník\u003C/th>\n\u003Ctd align=\"left\">MoraBanc (od roku 2014); muzeum architektury otevřené veřejnosti od 16.&nbsp;listopadu&nbsp;2017\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Památková ochrana\u003C/th>\n\u003Ctd align=\"left\">BCIN (č.&nbsp;09-E001-3814); Seznam světového dědictví UNESCO (soubor Díla Antoniho Gaudího, ref. 320bis-001) \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Oficiální web\u003C/th>\n\u003Ctd align=\"left\">\u003Ca href=\"https://casavicens.org/\">casavicens.org\u003C/a>\u003C/td>\n\u003C/tr>\n\u003C/tbody>\n\u003C/table>\n",aliases:["Vicens House","Dům Vicensů"],heroImage:{src:"/travel-guide/teasers/casa-vicens/hero.jpg",alt:"Keramické a cihlové průčelí Casa Vicens"},audio:[{section:"lead",label:"Úvod",identity:"f4879b6450f76e9fcf39f4a2afc4dbb3c398cc458d9cfa1952b52b21214e1244",src:"/travel-guide/audio/casa-vicens/f4879b6450f76e9fcf39f4a2afc4dbb3c398cc458d9cfa1952b52b21214e1244.m4a"},{section:"history-origin",label:"Vznik letního sídla a odkaz Manela Vicense",identity:"4b7eeb35f37d7fb3ea4021863cd5b833f13dae3abfbc0789b2454db41fede195",src:"/travel-guide/audio/casa-vicens/4b7eeb35f37d7fb3ea4021863cd5b833f13dae3abfbc0789b2454db41fede195.m4a"},{section:"construction-facade",label:"Konstrukční řešení, keramika a litinová brána",identity:"116f6577bc59cb99328b3ce638cae6684f664ab2240f6a63ee5577cb581afe6c",src:"/travel-guide/audio/casa-vicens/116f6577bc59cb99328b3ce638cae6684f664ab2240f6a63ee5577cb581afe6c.m4a"},{section:" ages/previews-admin/IMG_0731.jpeg",width:401,height:534}],people:[]},{id:"img0732",type:"image",src:"IMG_0732.JPEG",alt:"Barcelona",title:"",width:6048,height:8064,sizeMB:11.04,aspectRatio:"portrait-3-4",placeholder:"blurs/IMG_0732.png",placeholderColor:"rgb(248,248,248)",analysis:{aestheticScore:38.475713282894475,sharpness:0,qualityBucket:"poor",phash:""},exif:{date:"2026-09-29T14:26:25",releaseDate:"2026-09-29T14:26:25",author:"Cebreus",city:"Barcelona",latitude:41.3914,longitude:2.165692,orientation:6},author:"Cebreus",authorSlug:"cebreus",city:"Barcelona",googleMapsUrl:"https://www.google.com/maps/search/?api=1&query=41.3914,2.165692",date:"2026-09-29T14:26:25",sources:[{variant:"default",type:"image/webp",path:"/images/previews-webp/IMG_0732.webp",width:370},{variant:"default",type:"image/jpeg",path:"/images/previews/IMG_0732.jpeg",width:370},{variant:"default",type:"image/avif",path:"/images/previews-avif/IMG_0732.avif",width:370},{variant:"xl",type:"image/webp",path:"/images/previews-xl-webp/IMG_0732.webp",width:534},{variant:"xl",type:"image/jpeg",path:"/images/previews-xl/IMG_0732.jpeg",width:534},{variant:"xl",type:"image/avif",path:"/images/previews-xl-avif/IMG_0732.avif",width:534},{variant:"detail",type:"image/jpeg",path:"/images/details/IMG_0732.jpeg",width:960,height:1280},{variant:"fallback",type:"image/jpeg",path:"/images/previews-xxs/IMG_0732.jpeg",width:190,height:127},{variant:"admin_thumb",type:"image/jpeg",path:"/images/previews-admin/IMG_0732.jpeg",width:401,height:534}],people:["person-67e7b790752ec4058cbdeefbcd229a848e2b4f981b789f39b6d982a02577b35c"]},{id:"loc-palau-de-la-musica-catalana-main-2026-09-29t151717",type:"separator",location:"Palau de la Música Catalana",city:"Barcelona",hasPhotos:true,startDate:"2026-09-29T15:17:17",endDate:"2026-09-29T16:23:26",storyTitle:"Palác katalánské hudby (Palau de la Música Catalana)",story:"\u003Cp class=\"lead\" data-section-id=\"lead\">Palác katalánské hudby (\u003Cem>Palau de la Música Catalana\u003C/em>) v&nbsp;barcelonské čtvrti Sant Pere představuje vrcholné dílo katalánského modernismu z&nbsp;dílny architekta Lluíse Domènecha i&nbsp;Montanera. Stavba vznikla v&nbsp;letech 1905–1908 jako reprezentativní koncertní síň pěveckého sboru Orfeó Català. Architekt propojil inovativní ocelový skelet s&nbsp;bohatou sochařskou, mozaikovou a&nbsp;vitrážovou výzdobou. Ústřední sál proslul monumentálním kapkovitým světlíkem z&nbsp;barevného skla, který do prostoru přivádí přirozené denní světlo a&nbsp;činí z&nbsp;paláce památku zapsanou na Seznamu světového dědictví UNESCO.\u003C/p>\u003Cdetails data-section-id=\"history-origin\" data-section-kind=\"narrative\">\n\u003Csummary>Vznik paláce a&nbsp;pěvecký spolek Orfeó Català\u003C/summary>\n\u003Cdiv>\u003Cp>Pěvecký spolek Orfeó Català založili v&nbsp;roce 1891 sbormistři Lluís Millet a&nbsp;Amadeu Vives. Sbor stál v&nbsp;čele katalánského národního obrození \u003Cem>Renaixença\u003C/em> a&nbsp;usiloval o&nbsp;vlastní reprezentativní budovu pro zkoušky i&nbsp;veřejné koncerty. V&nbsp;květnu 1904 zakoupil spolek parcelu bývalého kláštera Sant Francesc de Paula o&nbsp;rozloze 1&nbsp;350&nbsp;m².\u003C/p>\n\u003Cp>Architekt Lluís Domènech i&nbsp;Montaner vypracoval odvážný projekt přizpůsobený stísněné parcele ve spleti úzkých uliček. Základní kámen položili stavitelé na den svatého Jiří 23.&nbsp;dubna&nbsp;1905 a&nbsp;výstavba trvala méně než tři roky až do slavnostního otevření 9.&nbsp;února&nbsp;1908.\u003C/p>\n\u003Cp>Městská rada Barcelony ocenila stavbu v&nbsp;roce 1909 první cenou v&nbsp;výroční architektonické soutěži za nejlepší budovu města. V&nbsp;letech 1982–1989 a&nbsp;2000–2004 prošel areál citlivou rehabilitací a&nbsp;rozšířením pod vedením architektů Óscara Tusquetse a&nbsp;Carlese Díaze, které doplnilo podzemní sál Petit Palau a&nbsp;odkrylo modernistickou fasádu.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"construction-facade\" data-section-kind=\"narrative\">\n\u003Csummary>Ocelový skelet a&nbsp;kamenné průčelí\u003C/summary>\n\u003Cdiv>\u003Cp>Domènech i&nbsp;Montaner navrhl nosný systém budovy jako lehký prostorový ocelový skelet doplněný cihelným zdivem a&nbsp;katalánskými klenbami. Ocelový rám umožnil zbavit obvodové stěny nosné funkce a&nbsp;nahradit je rozsáhlými prosklenými stěnami, čímž stavba předběhla moderní princip zavěšené prosklené fasády.\u003C/p>\n\u003Cp>Vnější plášť kombinuje neomítnuté červené cihly, tesaný kámen, litinu a&nbsp;polychromovanou keramiku z&nbsp;dílen Pujol i&nbsp;Bausis v&nbsp;Esplugues de Llobregat. Nároží ulic zdobí monumentální kamenné sousoší \u003Cem>La cançó popular catalana\u003C/em> (Katalánská lidová píseň) z&nbsp;roku 1909 od sochaře Eusebiho Arnaua, kterému vévodí postava svatého Jiří na přídi lodi obklopená postavami ztělesňujícími katalánský lid.\u003C/p>\n\u003Cp>V&nbsp;prvním patře obíhá fasádu balkon s&nbsp;dvouřadou kolonádou čtrnácti sloupů, přičemž keramik Lluís Bru vytvořil pro každý dřík zcela odlišný květinový mozaikový dekor z&nbsp;drobných keramických střepů. Nad kolonádou vystupují z&nbsp;průčelí kamenné busty Palestriny, Bacha, Beethovena a&nbsp;Wagnera, zatímco štít korunuje mozaikový vlys o&nbsp;ploše 40&nbsp;m².\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"concert-hall-skylight\" data-section-kind=\"narrative\">\n\u003Csummary>Hlavní koncertní sál a&nbsp;vitrážový světlík\u003C/summary>\n\u003Cdiv>\u003Cp>Velký koncertní sál (\u003Cem>Sala de Concerts\u003C/em>) s&nbsp;kapacitou 2&nbsp;049&nbsp;míst představuje srdce celé budovy. Sál je po obou stranách prolomen vysokými stěnami z&nbsp;barevných vitráží, takže funguje jako velkolepá skleněná schránka zalitá přirozeným denním světlem. Bohatě členěný povrch stěn a&nbsp;keramické klenby přirozeně rozptylují zvukové vlny a&nbsp;poskytují vynikající akustiku.\u003C/p>\n\u003Cp>Stropu dominuje monumentální obrácená kapkovitá kupole z&nbsp;barevného vitrážového skla, kterou navrhl výtvarník Antoni Rigalt i&nbsp;Blanch. Středový vypouklý zvon v&nbsp;jantarových a&nbsp;zlatých tónech zpodobňuje slunce, zatímco okrajové plochy přecházejí do blankytného nebe lemovaného čtyřiceti ženskými tvářemi pěvkyň.\u003C/p>\n\u003Cp>Pro večerní koncerty Domènech i&nbsp;Montaner integroval elektrické žárovky přímo do keramických růžic stropu, které kolem skleněného slunce vytvářejí oslnivou světelnou korunu.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"stage-muses-organ\" data-section-kind=\"narrative\">\n\u003Csummary>Jeviště, skulptury múz a&nbsp;varhany\u003C/summary>\n\u003Cdiv>\u003Cp>Jeviště rámuje sochařsky pojednaný proscéniový oblouk oslavující sepětí lidové a&nbsp;klasické hudby. Na levé straně vytvořil Eusebi Arnau skupinu katalánské písně s&nbsp;bustou skladatele Josepa Anselma Clavého pod smuteční vrbou. Pravou stranu ovládá monumentální busta Ludwiga van Beethovena od Paua Gargalla, nad níž stoupají dvě okřídlené valkýry s&nbsp;kopími jako dramatické ztvárnění Jízdy valkýr z&nbsp;opery Richarda Wagnera.\u003C/p>\n\u003Cp>Půlkruhovou zadní stěnu pódia tvoří slavný soubor osmnácti hudebních múz vystupujících přímo ze zdi. Sochaři Arnau a&nbsp;Gargallo vymodelovali horní poloviny těl z&nbsp;pálené terakoty jako plně plastické reliéfy, zatímco splývavé šaty vyskládal keramik Lluís Bru z&nbsp;mozaiky \u003Cem>trencadís\u003C/em>. Každá múza drží odlišný tradiční hudební nástroj včetně dudáckého nástroje \u003Cem>sac de gemecs\u003C/em>.\u003C/p>\n\u003Cp>Nad pódiem se tyčí monumentální varhany německé firmy Walcker z&nbsp;roku 1908, které v&nbsp;roce 2003 kompletně zrestaurovala varhanářská dílna Gerharda Grenzinga.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"vestibule-spaces\" data-section-kind=\"narrative\">\n\u003Csummary>Vestibul, schodiště a&nbsp;společenské prostory\u003C/summary>\n\u003Cdiv>\u003Cp>Návštěvníci vstupují do budovy přes nízký vestibul s&nbsp;cihelnými klenbami zdobenými keramickými růžicemi. Z&nbsp;vestibulu stoupá monumentální dvouramenné mramorové schodiště lemované balustrádou s&nbsp;kuželkami z&nbsp;masivního žlutého a&nbsp;jantarového foukaného skla. Stěny pokrývají glazované obklady s&nbsp;florálními motivy a&nbsp;erby Katalánska.\u003C/p>\n\u003Cp>V&nbsp;prvním patře propojuje schodiště s&nbsp;koncertním sálem reprezentační salón Lluíse Milleta (\u003Cem>Sala Lluís Millet\u003C/em>). Tento dvoupatrový foyer prosvětlují vitráže s&nbsp;květinovými úponky od Antoniho Rigalta a&nbsp;visí zde původní lustry z&nbsp;tepaného železa. Ze salónu vedou skleněné dveře na venkovní balkon s&nbsp;kolonádou čtrnácti sloupů, z&nbsp;nichž každý nese unikátní mozaikový dekor od Lluíse Brua.\u003C/p>\n\u003Cp>Přízemní foyer pod koncertním sálem slouží jako kavárna, kde původní cihelné pilíře kontrastují s&nbsp;moderním zázemím z&nbsp;poslední rekonstrukce.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"musical-heritage\" data-section-kind=\"narrative\">\n\u003Csummary>Hudební historie a&nbsp;světové premiéry\u003C/summary>\n\u003Cdiv>\u003Cp>Palác od počátku sloužil jako hlavní centrum katalánského hudebního života i&nbsp;prestižní evropská scéna. V&nbsp;roce 1920 zde violoncellista a&nbsp;dirigent Pau Casals založil orchestr \u003Cem>Orquestra Pau Casals\u003C/em>, který v&nbsp;sále pravidelně vystupoval až do občanské války. Dne 18.&nbsp;července&nbsp;1936 zkoušel Casals v&nbsp;Palau Beethovenovu Devátou symfonii, když dorazila zpráva o&nbsp;vojenském povstání generála Franca; hudebníci dohráli Ódu na radost jako své rozloučení se svobodou.\u003C/p>\n\u003Cp>V&nbsp;sále zazněla řada světových premiér, včetně \u003Cem>Koncertu pro cembalo\u003C/em> Manuela de Fally s&nbsp;Wandou Landowskou v&nbsp;roce 1926 a&nbsp;posmrtné premiéry Bergova houslového koncertu v&nbsp;dubnu 1936.\u003C/p>\n\u003Cp>Dne 19.&nbsp;května&nbsp;1960 došlo v&nbsp;sále k&nbsp;proslulé události zvané \u003Cem>Fets del Palau\u003C/em>, kdy publikum navzdory zákazu frankistického režimu povstalo a&nbsp;vzdorovitě zazpívalo sborovou hymnu \u003Cem>El Cant de la Senyera\u003C/em>.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"visit-context-2026\" data-section-kind=\"narrative\">\n\u003Csummary>Návštěva a&nbsp;prohlídka v&nbsp;roce 2026\u003C/summary>\n\u003Cdiv>\u003Cp>Odpolední prohlídka paláce dne 29.&nbsp;září&nbsp;2026 v&nbsp;čase od 15.17 do 16.23 umožnila detailní prozkoumání interiérů za optimálního denního osvětlení. Sluneční paprsky procházející monumentálním vitrážovým světlíkem zalévaly hlavní sál teplým zlatavým světlem, které zvýrazňovalo plastické detaily múz i&nbsp;keramických růžic na klenbách.\u003C/p>\n\u003Cp>Trasa prohlídky vedla přes mramorové schodiště s&nbsp;jantarovými balustrádami do sálu Lluíse Milleta, kde byl přístupný venkovní balkon s&nbsp;kolonádou mozaikových sloupů. Návštěvníci mohli sledovat práci restaurátorů i&nbsp;jedinečné prostorové řešení předsálí před zahájením podvečerního koncertního programu.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"facts\" data-section-kind=\"facts\">\n\u003Csummary>Základní údaje\u003C/summary>\n\u003Cdiv>\u003Ctable>\n\u003Cthead>\n\u003Ctr>\n\u003Cth align=\"left\">Parametr\u003C/th>\n\u003Cth align=\"left\">Údaj\u003C/th>\n\u003C/tr>\n\u003C/thead>\n\u003Ctbody>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Oficiální název\u003C/th>\n\u003Ctd align=\"left\">Palau de la Música Catalana\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Hlavní architekt\u003C/th>\n\u003Ctd align=\"left\">Lluís Domènech i&nbsp;Montaner (1850–1923)\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Klíčoví spolupracovníci\u003C/th>\n\u003Ctd align=\"left\">Eusebi Arnau a&nbsp;Pau Gargallo (sochy), Lluís Bru (mozaiky), Antoni Rigalt (vitráže a&nbsp;světlík), Gerhard Grenzing (varhany 2003) \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Původní stavebník\u003C/th>\n\u003Ctd align=\"left\">pěvecký spolek Orfeó Català (Lluís Millet a&nbsp;Amadeu Vives)\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Doba výstavby\u003C/th>\n\u003Ctd align=\"left\">1905–1908 (otevření 9.&nbsp;února&nbsp;1908; úpravy 1982–1989 a&nbsp;2000–2004) \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Architektonický styl\u003C/th>\n\u003Ctd align=\"left\">katalánský modernismus (\u003Cem>Modernisme\u003C/em>), secese\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Lokalita a&nbsp;adresa\u003C/th>\n\u003Ctd align=\"left\">Carrer Palau de la Música 4–6, 08003 Barcelona (čtvrť Sant Pere), Španělsko\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Rozměry a&nbsp;plocha\u003C/th>\n\u003Ctd align=\"left\">užitná plocha cca 15&nbsp;000&nbsp;m²; kapacita hlavního sálu 2&nbsp;049&nbsp;míst, Petit Palau 538&nbsp;míst \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Současné využití a&nbsp;vlastník\u003C/th>\n\u003Ctd align=\"left\">Fundació Orfeó Català-Palau de la Música Catalana; koncertní síň a&nbsp;muzeum\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Památková ochrana\u003C/th>\n\u003Ctd align=\"left\">BCIN (kód 61-MH-EN, IPAC č.&nbsp;65); Seznam světového dědictví UNESCO (ref. 804) \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Oficiální web\u003C/th>\n\u003Ctd align=\"left\">\u003Ca href=\"https://www.palaumusica.cat/\">palaumusica.cat\u003C/a>\u003C/td>\n\u003C/tr>\n\u003C/tbody>\n\u003C/table>\n\u003C/div>\n\u003C/details>",locationId:"palau-de-la-musica-catalana",locationLeadHtml:"\u003Cp class=\"lead\" data-section-id=\"lead\">Palác katalánské hudby (\u003Cem>Palau de la Música Catalana\u003C/em>) v&nbsp;barcelonské čtvrti Sant Pere představuje vrcholné dílo katalánského modernismu z&nbsp;dílny architekta Lluíse Domènecha i&nbsp;Montanera. Stavba vznikla v&nbsp;letech 1905–1908 jako reprezentativní koncertní síň pěveckého sboru Orfeó Català. Architekt propojil inovativní ocelový skelet s&nbsp;bohatou sochařskou, mozaikovou a&nbsp;vitrážovou výzdobou. Ústřední sál proslul monumentálním kapkovitým světlíkem z&nbsp;barevného skla, který do prostoru přivádí přirozené denní světlo a&nbsp;činí z&nbsp;paláce památku zapsanou na Seznamu světového dědictví UNESCO.\u003C/p>",locationHtml:"\u003Cdetails data-section-id=\"history-origin\" data-section-kind=\"narrative\">\n\u003Csummary>Vznik paláce a&nbsp;pěvecký spolek Orfeó Català\u003C/summary>\n\u003Cdiv>\u003Cp>Pěvecký spolek Orfeó Català založili v&nbsp;roce 1891 sbormistři Lluís Millet a&nbsp;Amadeu Vives. Sbor stál v&nbsp;čele katalánského národního obrození \u003Cem>Renaixença\u003C/em> a&nbsp;usiloval o&nbsp;vlastní reprezentativní budovu pro zkoušky i&nbsp;veřejné koncerty. V&nbsp;květnu 1904 zakoupil spolek parcelu bývalého kláštera Sant Francesc de Paula o&nbsp;rozloze 1&nbsp;350&nbsp;m².\u003C/p>\n\u003Cp>Architekt Lluís Domènech i&nbsp;Montaner vypracoval odvážný projekt přizpůsobený stísněné parcele ve spleti úzkých uliček. Základní kámen položili stavitelé na den svatého Jiří 23.&nbsp;dubna&nbsp;1905 a&nbsp;výstavba trvala méně než tři roky až do slavnostního otevření 9.&nbsp;února&nbsp;1908.\u003C/p>\n\u003Cp>Městská rada Barcelony ocenila stavbu v&nbsp;roce 1909 první cenou v&nbsp;výroční architektonické soutěži za nejlepší budovu města. V&nbsp;letech 1982–1989 a&nbsp;2000–2004 prošel areál citlivou rehabilitací a&nbsp;rozšířením pod vedením architektů Óscara Tusquetse a&nbsp;Carlese Díaze, které doplnilo podzemní sál Petit Palau a&nbsp;odkrylo modernistickou fasádu.\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"construction-facade\" data-section-kind=\"narrative\">\n\u003Csummary>Ocelový skelet a&nbsp;kamenné průčelí\u003C/summary>\n\u003Cdiv>\u003Cp>Domènech i&nbsp;Montaner navrhl nosný systém budovy jako lehký prostorový ocelový skelet doplněný cihelným zdivem a&nbsp;katalánskými klenbami. Ocelový rám umožnil zbavit obvodové stěny nosné funkce a&nbsp;nahradit je rozsáhlými prosklenými stěnami, čímž stavba předběhla moderní princip zavěšené prosklené fasády.\u003C/p>\n\u003Cp>Vnější plášť kombinuje neomítnuté červené cihly, tesaný kámen, litinu a&nbsp;polychromovanou keramiku z&nbsp;dílen Pujol i&nbsp;Bausis v&nbsp;Esplugues de Llobregat. Nároží ulic zdobí monumentální kamenné sousoší \u003Cem>La cançó popular catalana\u003C/em> (Katalánská lidová píseň) z&nbsp;roku 1909 od sochaře Eusebiho Arnaua, kterému vévodí postava svatého Jiří na přídi lodi obklopená postavami ztělesňujícími katalánský lid.\u003C/p>\n\u003Cp>V&nbsp;prvním patře obíhá fasádu balkon s&nbsp;dvouřadou kolonádou čtrnácti sloupů, přičemž keramik Lluís Bru vytvořil pro každý dřík zcela odlišný květinový mozaikový dekor z&nbsp;drobných keramických střepů. Nad kolonádou vystupují z&nbsp;průčelí kamenné busty Palestriny, Bacha, Beethovena a&nbsp;Wagnera, zatímco štít korunuje mozaikový vlys o&nbsp;ploše 40&nbsp;m².\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"concert-hall-skylight\" data-section-kind=\"narrative\">\n\u003Csummary>Hlavní koncertní sál a&nbsp;vitrážový světlík\u003C/summary>\n\u003Cdiv>\u003Cp>Velký koncertní sál (\u003Cem>Sala de Concerts\u003C/em>) s&nbsp;kapacitou 2&nbsp;049&nbsp;míst představuje srdce celé budovy. Sál je po obou stranách prolomen vysokými stěnami z&nbsp;barevných vitráží, takže funguje jako velkolepá skleněná schránka zalitá přirozeným denním světlem. Bohatě členěný povrch stěn a&nbsp;keramické klenby přirozeně rozptylují zvukové vlny a&nbsp;poskytují vynikající akustiku.\u003C/p>\n\u003Cp>Stropu dominuje monumentální obrácená kapkovitá kupole z&nbsp;barevného vitrážového skla, kterou navrhl výtvarník Antoni Rigalt i&nbsp;Blanch. Středový vypouklý zvon v&nbsp;jantarových a&nbsp;zlatých tónech zpodobňuje slunce, zatímco okrajové plochy přecházejí do blankytného nebe lemovaného čtyřiceti ženskými tvářemi pěvkyň.\u003C/p>\n\u003Cp>Pro večerní koncerty Domènech i&nbsp;Montaner integroval elektrické žárovky přímo do keramických růžic stropu, které kolem skleněného slunce vytvářejí oslnivou světelnou korunu.\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"stage-muses-organ\" data-section-kind=\"narrative\">\n\u003Csummary>Jeviště, skulptury múz a&nbsp;varhany\u003C/summary>\n\u003Cdiv>\u003Cp>Jeviště rámuje sochařsky pojednaný proscéniový oblouk oslavující sepětí lidové a&nbsp;klasické hudby. Na levé straně vytvořil Eusebi Arnau skupinu katalánské písně s&nbsp;bustou skladatele Josepa Anselma Clavého pod smuteční vrbou. Pravou stranu ovládá monumentální busta Ludwiga van Beethovena od Paua Gargalla, nad níž stoupají dvě okřídlené valkýry s&nbsp;kopími jako dramatické ztvárnění Jízdy valkýr z&nbsp;opery Richarda Wagnera.\u003C/p>\n\u003Cp>Půlkruhovou zadní stěnu pódia tvoří slavný soubor osmnácti hudebních múz vystupujících přímo ze zdi. Sochaři Arnau a&nbsp;Gargallo vymodelovali horní poloviny těl z&nbsp;pálené terakoty jako plně plastické reliéfy, zatímco splývavé šaty vyskládal keramik Lluís Bru z&nbsp;mozaiky \u003Cem>trencadís\u003C/em>. Každá múza drží odlišný tradiční hudební nástroj včetně dudáckého nástroje \u003Cem>sac de gemecs\u003C/em>.\u003C/p>\n\u003Cp>Nad pódiem se tyčí monumentální varhany německé firmy Walcker z&nbsp;roku 1908, které v&nbsp;roce 2003 kompletně zrestaurovala varhanářská dílna Gerharda Grenzinga.\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"vestibule-spaces\" data-section-kind=\"narrative\">\n\u003Csummary>Vestibul, schodiště a&nbsp;společenské prostory\u003C/summary>\n\u003Cdiv>\u003Cp>Návštěvníci vstupují do budovy přes nízký vestibul s&nbsp;cihelnými klenbami zdobenými keramickými růžicemi. Z&nbsp;vestibulu stoupá monumentální dvouramenné mramorové schodiště lemované balustrádou s&nbsp;kuželkami z&nbsp;masivního žlutého a&nbsp;jantarového foukaného skla. Stěny pokrývají glazované obklady s&nbsp;florálními motivy a&nbsp;erby Katalánska.\u003C/p>\n\u003Cp>V&nbsp;prvním patře propojuje schodiště s&nbsp;koncertním sálem reprezentační salón Lluíse Milleta (\u003Cem>Sala Lluís Millet\u003C/em>). Tento dvoupatrový foyer prosvětlují vitráže s&nbsp;květinovými úponky od Antoniho Rigalta a&nbsp;visí zde původní lustry z&nbsp;tepaného železa. Ze salónu vedou skleněné dveře na venkovní balkon s&nbsp;kolonádou čtrnácti sloupů, z&nbsp;nichž každý nese unikátní mozaikový dekor od Lluíse Brua.\u003C/p>\n\u003Cp>Přízemní foyer pod koncertním sálem slouží jako kavárna, kde původní cihelné pilíře kontrastují s&nbsp;moderním zázemím z&nbsp;poslední rekonstrukce.\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"musical-heritage\" data-section-kind=\"narrative\">\n\u003Csummary>Hudební historie a&nbsp;světové premiéry\u003C/summary>\n\u003Cdiv>\u003Cp>Palác od počátku sloužil jako hlavní centrum katalánského hudebního života i&nbsp;prestižní evropská scéna. V&nbsp;roce 1920 zde violoncellista a&nbsp;dirigent Pau Casals založil orchestr \u003Cem>Orquestra Pau Casals\u003C/em>, který v&nbsp;sále pravidelně vystupoval až do občanské války. Dne 18.&nbsp;července&nbsp;1936 zkoušel Casals v&nbsp;Palau Beethovenovu Devátou symfonii, když dorazila zpráva o&nbsp;vojenském povstání generála Franca; hudebníci dohráli Ódu na radost jako své rozloučení se svobodou.\u003C/p>\n\u003Cp>V&nbsp;sále zazněla řada světových premiér, včetně \u003Cem>Koncertu pro cembalo\u003C/em> Manuela de Fally s&nbsp;Wandou Landowskou v&nbsp;roce 1926 a&nbsp;posmrtné premiéry Bergova houslového koncertu v&nbsp;dubnu 1936.\u003C/p>\n\u003Cp>Dne 19.&nbsp;května&nbsp;1960 došlo v&nbsp;sále k&nbsp;proslulé události zvané \u003Cem>Fets del Palau\u003C/em>, kdy publikum navzdory zákazu frankistického režimu povstalo a&nbsp;vzdorovitě zazpívalo sborovou hymnu \u003Cem>El Cant de la Senyera\u003C/em>.\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"visit-context-2026\" data-section-kind=\"narrative\">\n\u003Csummary>Návštěva a&nbsp;prohlídka v&nbsp;roce 2026\u003C/summary>\n\u003Cdiv>\u003Cp>Odpolední prohlídka paláce dne 29.&nbsp;září&nbsp;2026 v&nbsp;čase od 15.17 do 16.23 umožnila detailní prozkoumání interiérů za optimálního denního osvětlení. Sluneční paprsky procházející monumentálním vitrážovým světlíkem zalévaly hlavní sál teplým zlatavým světlem, které zvýrazňovalo plastické detaily múz i&nbsp;keramických růžic na klenbách.\u003C/p>\n\u003Cp>Trasa prohlídky vedla přes mramorové schodiště s&nbsp;jantarovými balustrádami do sálu Lluíse Milleta, kde byl přístupný venkovní balkon s&nbsp;kolonádou mozaikových sloupů. Návštěvníci mohli sledovat práci restaurátorů i&nbsp;jedinečné prostorové řešení předsálí před zahájením podvečerního koncertního programu.\u003C/p>\n\u003C/div>\n\u003C/details>",locationOfficialHtml:"\u003Ctable>\n\u003Cthead>\n\u003Ctr>\n\u003Cth align=\"left\">Parametr\u003C/th>\n\u003Cth align=\"left\">Údaj\u003C/th>\n\u003C/tr>\n\u003C/thead>\n\u003Ctbody>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Oficiální název\u003C/th>\n\u003Ctd align=\"left\">Palau de la Música Catalana\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Hlavní architekt\u003C/th>\n\u003Ctd align=\"left\">Lluís Domènech i&nbsp;Montaner (1850–1923)\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Klíčoví spolupracovníci\u003C/th>\n\u003Ctd align=\"left\">Eusebi Arnau a&nbsp;Pau Gargallo (sochy), Lluís Bru (mozaiky), Antoni Rigalt (vitráže a&nbsp;světlík), Gerhard Grenzing (varhany 2003) \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Původní stavebník\u003C/th>\n\u003Ctd align=\"left\">pěvecký spolek Orfeó Català (Lluís Millet a&nbsp;Amadeu Vives)\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Doba výstavby\u003C/th>\n\u003Ctd align=\"left\">1905–1908 (otevření 9.&nbsp;února&nbsp;1908; úpravy 1982–1989 a&nbsp;2000–2004) \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Architektonický styl\u003C/th>\n\u003Ctd align=\"left\">katalánský modernismus (\u003Cem>Modernisme\u003C/em>), secese\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Lokalita a&nbsp;adresa\u003C/th>\n\u003Ctd align=\"left\">Carrer Palau de la Música 4–6, 08003 Barcelona (čtvrť Sant Pere), Španělsko\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Rozměry a&nbsp;plocha\u003C/th>\n\u003Ctd align=\"left\">užitná plocha cca 15&nbsp;000&nbsp;m²; kapacita hlavního sálu 2&nbsp;049&nbsp;míst, Petit Palau 538&nbsp;míst \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Současné využití a&nbsp;vlastník\u003C/th>\n\u003Ctd align=\"left\">Fundació Orfeó Català-Palau de la Música Catalana; koncertní síň a&nbsp;muzeum\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Památková ochrana\u003C/th>\n\u003Ctd align=\"left\">BCIN (kód 61-MH-EN, IPAC č.&nbsp;65); Seznam světového dědictví UNESCO (ref. 804) \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Oficiální web\u003C/th>\n\u003Ctd align=\"left\">\u003Ca href=\"https://www.palaumusica.cat/\">palaumusica.cat\u003C/a>\u003C/td>\n\u003C/tr>\n\u003C/tbody>\n\u003C/table>\n",aliases:["Palau de la Música Catalana","Palacio de la Música Catalana","Palace of Catalan Music","Palác katalánské hudby"],heroImage:{src:"/travel-guide/teasers/palau-de-la-musica-catalana/hero.jpg",alt:"Vitrážový světlík a výzdoba koncertního sálu Palau de la Música Catalana"},audio:[{section:"lead",label:"Úvod",identity:"7c8b7719fc8f0611d674523c478cd080ad46b8fe2c0f12dbcad2b83e2023d3f2",src:"/travel-guide/audio/palau-de-la-musica-catalana/7c8b7719fc8f0611d674523c478cd080ad46b8fe2c0f12dbcad2b83e2023d3f2.m4a"},{section:"history-origin",label:"Vznik paláce a pěvecký spolek Orfeó Català",identity:"9037784d17e0069db2864a8885eb29a16a28447a0cd846364aed004bff647cd7",src:"/travel-guide/audio/palau-de-la-musica-catala
