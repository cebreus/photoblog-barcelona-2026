4-3",placeholder:"blurs/IMG_0506.png",placeholderColor:"",analysis:{aestheticScore:52.042337260808324,sharpness:100,qualityBucket:"good",phash:"39bdf1fcdde3723d"},exif:{date:"2026-09-25T14:18:31",releaseDate:"2026-09-25T15:04:25",location:"Sagrat Cor",sublocation:"Sagrat Cor",city:"Barcelona",latitude:41.422097,longitude:2.118872,orientation:1,country:"Španělsko",countryCode:"ESP",state:"Katalánsko"},location:"Sagrat Cor",city:"Barcelona",googleMapsUrl:"https://www.google.com/maps/search/?api=1&query=41.422097,2.118872",date:"2026-09-25T14:18:31",sources:[{variant:"default",type:"image/webp",path:"/images/previews-webp/IMG_0506.webp",width:370},{variant:"default",type:"image/jpeg",path:"/images/previews/IMG_0506.jpeg",width:370},{variant:"default",type:"image/avif",path:"/images/previews-avif/IMG_0506.avif",width:370},{variant:"xl",type:"image/webp",path:"/images/previews-xl-webp/IMG_0506.webp",width:534},{variant:"xl",type:"image/jpeg",path:"/images/previews-xl/IMG_0506.jpeg",width:534},{variant:"xl",type:"image/avif",path:"/images/previews-xl-avif/IMG_0506.avif",width:534},{variant:"detail",type:"image/jpeg",path:"/images/details/IMG_0506.jpeg",width:1707,height:1280},{variant:"fallback",type:"image/jpeg",path:"/images/previews-xxs/IMG_0506.jpeg",width:190,height:127},{variant:"admin_thumb",type:"image/jpeg",path:"/images/previews-admin/IMG_0506.jpeg",width:534,height:534}],flags:["snapshot-author"],people:["person-8fcf0021a7ada1e7d3f84580ef3ca26a2e0e4ef99b9adf6b438fac8a9257157e","person-67e7b790752ec4058cbdeefbcd229a848e2b4f981b789f39b6d982a02577b35c"]}],id:"day-2026-09-25"},{date:"2026-09-26",cities:["Barcelona"],locations:["Palau Güell","Park Güell"],items:[{id:"loc-palau-guell-main-2026-09-26t105419",type:"separator",location:"Palau Güell",city:"Barcelona",hasPhotos:true,startDate:"2026-09-26T10:54:19",endDate:"2026-09-26T12:38:05",storyTitle:"Palác Güell (Palau Güell)",story:"\u003Cp class=\"lead\" data-section-id=\"lead\">Městský palác Palau Güell v&nbsp;barcelonské čtvrti El Raval představuje první monumentální rezidenční dílo mladého Antoniho Gaudího pro průmyslníka Eusebiho Güella. Stavba z&nbsp;let 1886–1890 propojila rodinné bydlení s&nbsp;reprezentačními sály pro koncerty a&nbsp;společenská setkání barcelonské elity. Přísné kamenné uliční průčelí s&nbsp;dvojicí parabolických vjezdů skrývá převýšený centrální salón a&nbsp;střešní terasu s&nbsp;dvaceti polychromními sochařskými komíny, které zahájily Gaudího mistrovské využití mozaiky \u003Cem>trencadís\u003C/em>.\u003C/p>\u003Cdetails data-section-id=\"history-origin\" data-section-kind=\"narrative\">\n\u003Csummary>Vznik paláce a&nbsp;proměny městské rezidence\u003C/summary>\n\u003Cdiv>\u003Cp>Průmyslník Eusebi Güell zakoupil v&nbsp;roce 1885 úzké stavební parcely v&nbsp;tehdejší ulici Conde del Asalto (dnešní Carrer Nou de la Rambla), aby vybudoval reprezentativní sídlo navazující na rodinný dům na slavné třídě La Rambla. Antoni Gaudí vypracoval desítky variant dispozičního řešení, než v&nbsp;červnu 1886 předložil konečný projekt městské radě.\u003C/p>\n\u003Cp>Stavba postupovala rychle, takže palác mohl Güell slavnostně otevřít u&nbsp;příležitosti Světové výstavy v&nbsp;Barceloně roku 1888, přestože dokončovací kamenické a&nbsp;truhlářské práce v&nbsp;interiérech pokračovaly až do roku 1890. Rodina zde žila až do roku 1906, kdy přesídlila do nového sídla v&nbsp;Parku Güell. Během španělské občanské války sloužila budova jako policejní stanice, což vedlo k&nbsp;poškození části inventáře.\u003C/p>\n\u003Cp>Zásadní obrat nastal v&nbsp;roce 1945, kdy Güellova dcera Mercè darovala palác provinční radě Diputació de Barcelona pod podmínkou, že zůstane trvale vyhrazen kulturním a&nbsp;veřejným účelům. Roku 1984 zapsalo UNESCO stavbu na Seznam světového dědictví jako součást souboru Gaudího děl. Rozsáhlá památková obnova z&nbsp;let 2004–2011 vyřešila statické poruchy zdiva a&nbsp;navrátila prostorám původní barevnost i&nbsp;řemeslný detail.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"construction-facade\" data-section-kind=\"narrative\">\n\u003Csummary>Kamenné průčelí a&nbsp;kovářské řemeslo vjezdů\u003C/summary>\n\u003Cdiv>\u003Cp>Uliční průčelí působí na první pohled přísným až pevnostním dojmem. Gaudí jej nechal vyzdít z&nbsp;těžkých kvádrů šedého vápence, který nechal Güell těžit ve svých vlastních lomech v&nbsp;pohoří Garraf jižně od Barcelony. Vodorovné spáry a&nbsp;hladce opracované kamenné články kontrastují s&nbsp;bohatou výzdobou kovaných prvků.\u003C/p>\n\u003Cp>Přízemí dominují dva monumentální parabolické oblouky vysoké téměř pět metrů. Tyto rozměrné portály umožňovaly krytý vjezd kočárů přímo z&nbsp;ulice do budovy, takže panstvo i&nbsp;hosté vystupovali v&nbsp;naprostém bezpečí a&nbsp;suchu před nepřízní počasí. Portály uzavírají mohutné kované mříže z&nbsp;dílny uměleckého kováře Joana Oñóse. Jejich hustá struktura propouští světlo ven, ale zabraňuje kolemjdoucím nahlížet z&nbsp;ulice do soukromí vestibulu.\u003C/p>\n\u003Cp>V&nbsp;meziprostoru mezi oběma oblouky vztyčil Gaudí kovaný stožár zakončený katalánským znakem, rytířskou helmou a&nbsp;fénixem rozepínajícím křídla. Tato plastika symbolizuje národní a&nbsp;kulturní obrození Katalánska na konci 19.&nbsp;století. Zadní jižní průčelí obrácené do vnitrobloku má zcela jiný charakter: dřevěná žaluziová tribuna a&nbsp;keramické tvarovky zajišťují přirozené stínění a&nbsp;proudění vzduchu do obytných místností rodiny.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"basement-stables\" data-section-kind=\"narrative\">\n\u003Csummary>Suterénní stáje a&nbsp;cihlové klenby\u003C/summary>\n\u003Cdiv>\u003Cp>Suterén paláce patří k&nbsp;nejpůsobivějším inženýrským prostorám celé stavby. Do podzemí sestupuje široká spirálová rampa s&nbsp;mírným sklonem, po níž čeledíni sváděli koně a&nbsp;sváželi kočáry z&nbsp;uliční úrovně přímo ke stájím a&nbsp;vozovně. Stěny i&nbsp;strop rampy jsou vyzděny z&nbsp;režných pálených cihel bez omítky, což prostoru dodává syrovou tektonickou čistotu.\u003C/p>\n\u003Cp>Klenutý strop suterénu vynášejí robustní válcové pilíře z&nbsp;neomítnutých cihel, které se v&nbsp;horní části rozšiřují do širokých hřibovitých hlavic. Tyto sloupy musejí přenášet obrovskou hmotnost kamenných konstrukcí a&nbsp;převýšeného salónu z&nbsp;vyšších pater. Mezi pilíři vznikly oddělené boxy pro ustájení koní, doplněné kamennými žlaby, napajedly a&nbsp;litinovými uvazovacími kruhy ve tvaru psích hlavic.\u003C/p>\n\u003Cp>Gaudí v&nbsp;suterénu vyřešil také náročné odvětrávání a&nbsp;odvod stájových pachů. Systém nasávacích otvorů a&nbsp;svislých průduchů odváděl vzduch přímo do střešních komínových těles, takže zápach nepronikal do obytného mezaninu ani do reprezentačního patra. Dnes slouží podzemí jako úvodní část návštěvnického okruhu, kde lze studovat čistou konstrukční logiku raného modernismu.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"interior-central-hall\" data-section-kind=\"narrative\">\n\u003Csummary>Centrální salón a&nbsp;akustický prostor\u003C/summary>\n\u003Cdiv>\u003Cp>Srdcem reprezentačního podlaží je centrální salón, který se zvedá přes tři patra do výšky 17,5&nbsp;metru. Gaudí kolem tohoto sálu uspořádal všechny společenské a&nbsp;rodinné pokoje, které se do něj otevírají dřevěnými arkýři a&nbsp;okenními galeriemi. Prostor sloužil jako hudební sál, přijímací salón i&nbsp;místo rodinných bohoslužeb.\u003C/p>\n\u003Cp>Klenbu tvoří parabolická kupole, kterou architekt perforoval desítkami drobných kruhových otvorů krytých skleněnými terči. Do klenby proniká světlo z&nbsp;horní střešní lucerny, což v&nbsp;šeru sálu vytváří působivou iluzi hvězdného nebe. Za vyřezávanými skládacími dveřmi se v&nbsp;jedné ze stěn skrývá rodinná kaple, takže po jejich otevření mohl kněz sloužit mši pro hosty shromážděné přímo v&nbsp;salónu.\u003C/p>\n\u003Cp>Výška a&nbsp;tvar klenby dodávají prostoru mimořádnou akustiku. V&nbsp;horních patrech nechal Güell zabudovat monumentální varhany od varhanáře Aquilina Amezuy, jejichž píšťaly a&nbsp;vzdušnice prostupují stěnami do sálu. Zpěváci sboru i&nbsp;hudebníci vystupovali na vyvýšených tribunách, takže zvuk varhan a&nbsp;hlasů dopadal na posluchače shora jako nebeská hudba.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"roof-terrace-chimneys\" data-section-kind=\"narrative\">\n\u003Csummary>Střešní terasa a&nbsp;polychromní komíny\u003C/summary>\n\u003Cdiv>\u003Cp>Střecha paláce představuje zlomový moment v&nbsp;Gaudího tvorbě. Místo tradiční ploché střechy s&nbsp;užitkovými komíny vytvořil fantaskní sochařskou zahradu rozdělenou do několika výškových úrovní. Středu dominuje patnáctimetrová kuželovitá jehla, která zastřešuje lucernu centrálního salónu. Její vrchol nese kovaný sluneční kříž, korouhev s&nbsp;netopýrem a&nbsp;větrnou růžici.\u003C/p>\n\u003Cp>Kolem centrální věže stojí dvacet komínových těles a&nbsp;větracích šachet, z&nbsp;nichž každé pojal architekt jako samostatnou plastiku s&nbsp;odlišnou geometrickou hlavicí. Kónické, jehlanové i&nbsp;šroubovité tvary nevznikly jen pro potěchu oka; jejich profilování zabraňuje zpětnému tahu větru do krbů a&nbsp;chrání kouřovody před zatékáním deště.\u003C/p>\n\u003Cp>Právě zde Gaudí poprvé v&nbsp;monumentálním měřítku uplatnil techniku \u003Cem>trencadís\u003C/em>. Povrch komínů nechal pokrýt mozaikou z&nbsp;úlomků glazované keramiky, porcelánu, barevného skla a&nbsp;mramorových odřezků z&nbsp;kamenických dílen. Tato mozaiková technika nejen odolávala mořské vlhkosti a&nbsp;kouři, ale proměnila technické zázemí domu v&nbsp;pestrobarevný sochařský park s&nbsp;výhledem na starou Barcelonu.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"visit-context-2026\" data-section-kind=\"narrative\">\n\u003Csummary>Návštěva a&nbsp;režim provozu v&nbsp;roce 2026\u003C/summary>\n\u003Cdiv>\u003Cp>Během dopolední návštěvy 26.&nbsp;září&nbsp;2026 v&nbsp;čase od 10.54 do 12.38 prošla fotodokumentace kompletní trasu městského paláce od suterénu až po střešní terasu. V&nbsp;roce 2026 fungoval palác v&nbsp;režimu časových vstupenek se samoobslužným audioprůvodcem v&nbsp;několika jazycích, který podrobně vysvětloval restaurátorské zásahy dokončené v&nbsp;roce 2011.\u003C/p>\n\u003Cp>V&nbsp;centrálním hudebním sále měli návštěvníci možnost zažít prostor s&nbsp;plným horním nasvícením lucernou i&nbsp;krátkou ukázkou hry zrestaurovaných varhan, jejichž zvuk se přirozeně šíří celou vertikálou budovy. Střešní terasa byla plně přístupná za slunečného počasí, což umožnilo detailní studium struktur \u003Cem>trencadís\u003C/em> a&nbsp;původních keramických glazur na jednotlivých komínech z&nbsp;bezprostřední blízkosti.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"facts\" data-section-kind=\"facts\">\n\u003Csummary>Základní údaje\u003C/summary>\n\u003Cdiv>\u003Ctable>\n\u003Cthead>\n\u003Ctr>\n\u003Cth align=\"left\">Parametr\u003C/th>\n\u003Cth align=\"left\">Údaj\u003C/th>\n\u003C/tr>\n\u003C/thead>\n\u003Ctbody>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Oficiální název\u003C/th>\n\u003Ctd align=\"left\">Palau Güell\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Hlavní architekt\u003C/th>\n\u003Ctd align=\"left\">Antoni Gaudí i&nbsp;Cornet (1852–1926)\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Původní stavebník\u003C/th>\n\u003Ctd align=\"left\">Eusebi Güell i&nbsp;Bacigalupi (1846–1918)\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Doba výstavby\u003C/th>\n\u003Ctd align=\"left\">1886–1890 (slavnostní otevření 1888) \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Architektonický styl\u003C/th>\n\u003Ctd align=\"left\">katalánský modernismus (\u003Cem>Modernisme\u003C/em>)\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Lokalita a&nbsp;adresa\u003C/th>\n\u003Ctd align=\"left\">Carrer Nou de la Rambla 3–5, 08001 Barcelona, Španělsko\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Rozměry a&nbsp;plocha\u003C/th>\n\u003Ctd align=\"left\">zastavěná plocha cca 430&nbsp;m², užitná plocha cca 2&nbsp;850&nbsp;m², výška centrálního sálu 17,5&nbsp;metru \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Současné využití\u003C/th>\n\u003Ctd align=\"left\">veřejně přístupná kulturní památka ve správě Diputació de Barcelona\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Památková ochrana\u003C/th>\n\u003Ctd align=\"left\">BCIN (kód 40-MH-EN, IPAC IPA-45); Seznam světového dědictví UNESCO (ref. 320-002) \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Oficiální web\u003C/th>\n\u003Ctd align=\"left\">\u003Ca href=\"https://palauguell.cat/\">palauguell.cat\u003C/a>\u003C/td>\n\u003C/tr>\n\u003C/tbody>\n\u003C/table>\n\u003C/div>\n\u003C/details>",locationId:"palau-guell",locationLeadHtml:"\u003Cp class=\"lead\" data-section-id=\"lead\">Městský palác Palau Güell v&nbsp;barcelonské čtvrti El Raval představuje první monumentální rezidenční dílo mladého Antoniho Gaudího pro průmyslníka Eusebiho Güella. Stavba z&nbsp;let 1886–1890 propojila rodinné bydlení s&nbsp;reprezentačními sály pro koncerty a&nbsp;společenská setkání barcelonské elity. Přísné kamenné uliční průčelí s&nbsp;dvojicí parabolických vjezdů skrývá převýšený centrální salón a&nbsp;střešní terasu s&nbsp;dvaceti polychromními sochařskými komíny, které zahájily Gaudího mistrovské využití mozaiky \u003Cem>trencadís\u003C/em>.\u003C/p>",locationHtml:"\u003Cdetails data-section-id=\"history-origin\" data-section-kind=\"narrative\">\n\u003Csummary>Vznik paláce a&nbsp;proměny městské rezidence\u003C/summary>\n\u003Cdiv>\u003Cp>Průmyslník Eusebi Güell zakoupil v&nbsp;roce 1885 úzké stavební parcely v&nbsp;tehdejší ulici Conde del Asalto (dnešní Carrer Nou de la Rambla), aby vybudoval reprezentativní sídlo navazující na rodinný dům na slavné třídě La Rambla. Antoni Gaudí vypracoval desítky variant dispozičního řešení, než v&nbsp;červnu 1886 předložil konečný projekt městské radě.\u003C/p>\n\u003Cp>Stavba postupovala rychle, takže palác mohl Güell slavnostně otevřít u&nbsp;příležitosti Světové výstavy v&nbsp;Barceloně roku 1888, přestože dokončovací kamenické a&nbsp;truhlářské práce v&nbsp;interiérech pokračovaly až do roku 1890. Rodina zde žila až do roku 1906, kdy přesídlila do nového sídla v&nbsp;Parku Güell. Během španělské občanské války sloužila budova jako policejní stanice, což vedlo k&nbsp;poškození části inventáře.\u003C/p>\n\u003Cp>Zásadní obrat nastal v&nbsp;roce 1945, kdy Güellova dcera Mercè darovala palác provinční radě Diputació de Barcelona pod podmínkou, že zůstane trvale vyhrazen kulturním a&nbsp;veřejným účelům. Roku 1984 zapsalo UNESCO stavbu na Seznam světového dědictví jako součást souboru Gaudího děl. Rozsáhlá památková obnova z&nbsp;let 2004–2011 vyřešila statické poruchy zdiva a&nbsp;navrátila prostorám původní barevnost i&nbsp;řemeslný detail.\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"construction-facade\" data-section-kind=\"narrative\">\n\u003Csummary>Kamenné průčelí a&nbsp;kovářské řemeslo vjezdů\u003C/summary>\n\u003Cdiv>\u003Cp>Uliční průčelí působí na první pohled přísným až pevnostním dojmem. Gaudí jej nechal vyzdít z&nbsp;těžkých kvádrů šedého vápence, který nechal Güell těžit ve svých vlastních lomech v&nbsp;pohoří Garraf jižně od Barcelony. Vodorovné spáry a&nbsp;hladce opracované kamenné články kontrastují s&nbsp;bohatou výzdobou kovaných prvků.\u003C/p>\n\u003Cp>Přízemí dominují dva monumentální parabolické oblouky vysoké téměř pět metrů. Tyto rozměrné portály umožňovaly krytý vjezd kočárů přímo z&nbsp;ulice do budovy, takže panstvo i&nbsp;hosté vystupovali v&nbsp;naprostém bezpečí a&nbsp;suchu před nepřízní počasí. Portály uzavírají mohutné kované mříže z&nbsp;dílny uměleckého kováře Joana Oñóse. Jejich hustá struktura propouští světlo ven, ale zabraňuje kolemjdoucím nahlížet z&nbsp;ulice do soukromí vestibulu.\u003C/p>\n\u003Cp>V&nbsp;meziprostoru mezi oběma oblouky vztyčil Gaudí kovaný stožár zakončený katalánským znakem, rytířskou helmou a&nbsp;fénixem rozepínajícím křídla. Tato plastika symbolizuje národní a&nbsp;kulturní obrození Katalánska na konci 19.&nbsp;století. Zadní jižní průčelí obrácené do vnitrobloku má zcela jiný charakter: dřevěná žaluziová tribuna a&nbsp;keramické tvarovky zajišťují přirozené stínění a&nbsp;proudění vzduchu do obytných místností rodiny.\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"basement-stables\" data-section-kind=\"narrative\">\n\u003Csummary>Suterénní stáje a&nbsp;cihlové klenby\u003C/summary>\n\u003Cdiv>\u003Cp>Suterén paláce patří k&nbsp;nejpůsobivějším inženýrským prostorám celé stavby. Do podzemí sestupuje široká spirálová rampa s&nbsp;mírným sklonem, po níž čeledíni sváděli koně a&nbsp;sváželi kočáry z&nbsp;uliční úrovně přímo ke stájím a&nbsp;vozovně. Stěny i&nbsp;strop rampy jsou vyzděny z&nbsp;režných pálených cihel bez omítky, což prostoru dodává syrovou tektonickou čistotu.\u003C/p>\n\u003Cp>Klenutý strop suterénu vynášejí robustní válcové pilíře z&nbsp;neomítnutých cihel, které se v&nbsp;horní části rozšiřují do širokých hřibovitých hlavic. Tyto sloupy musejí přenášet obrovskou hmotnost kamenných konstrukcí a&nbsp;převýšeného salónu z&nbsp;vyšších pater. Mezi pilíři vznikly oddělené boxy pro ustájení koní, doplněné kamennými žlaby, napajedly a&nbsp;litinovými uvazovacími kruhy ve tvaru psích hlavic.\u003C/p>\n\u003Cp>Gaudí v&nbsp;suterénu vyřešil také náročné odvětrávání a&nbsp;odvod stájových pachů. Systém nasávacích otvorů a&nbsp;svislých průduchů odváděl vzduch přímo do střešních komínových těles, takže zápach nepronikal do obytného mezaninu ani do reprezentačního patra. Dnes slouží podzemí jako úvodní část návštěvnického okruhu, kde lze studovat čistou konstrukční logiku raného modernismu.\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"interior-central-hall\" data-section-kind=\"narrative\">\n\u003Csummary>Centrální salón a&nbsp;akustický prostor\u003C/summary>\n\u003Cdiv>\u003Cp>Srdcem reprezentačního podlaží je centrální salón, který se zvedá přes tři patra do výšky 17,5&nbsp;metru. Gaudí kolem tohoto sálu uspořádal všechny společenské a&nbsp;rodinné pokoje, které se do něj otevírají dřevěnými arkýři a&nbsp;okenními galeriemi. Prostor sloužil jako hudební sál, přijímací salón i&nbsp;místo rodinných bohoslužeb.\u003C/p>\n\u003Cp>Klenbu tvoří parabolická kupole, kterou architekt perforoval desítkami drobných kruhových otvorů krytých skleněnými terči. Do klenby proniká světlo z&nbsp;horní střešní lucerny, což v&nbsp;šeru sálu vytváří působivou iluzi hvězdného nebe. Za vyřezávanými skládacími dveřmi se v&nbsp;jedné ze stěn skrývá rodinná kaple, takže po jejich otevření mohl kněz sloužit mši pro hosty shromážděné přímo v&nbsp;salónu.\u003C/p>\n\u003Cp>Výška a&nbsp;tvar klenby dodávají prostoru mimořádnou akustiku. V&nbsp;horních patrech nechal Güell zabudovat monumentální varhany od varhanáře Aquilina Amezuy, jejichž píšťaly a&nbsp;vzdušnice prostupují stěnami do sálu. Zpěváci sboru i&nbsp;hudebníci vystupovali na vyvýšených tribunách, takže zvuk varhan a&nbsp;hlasů dopadal na posluchače shora jako nebeská hudba.\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"roof-terrace-chimneys\" data-section-kind=\"narrative\">\n\u003Csummary>Střešní terasa a&nbsp;polychromní komíny\u003C/summary>\n\u003Cdiv>\u003Cp>Střecha paláce představuje zlomový moment v&nbsp;Gaudího tvorbě. Místo tradiční ploché střechy s&nbsp;užitkovými komíny vytvořil fantaskní sochařskou zahradu rozdělenou do několika výškových úrovní. Středu dominuje patnáctimetrová kuželovitá jehla, která zastřešuje lucernu centrálního salónu. Její vrchol nese kovaný sluneční kříž, korouhev s&nbsp;netopýrem a&nbsp;větrnou růžici.\u003C/p>\n\u003Cp>Kolem centrální věže stojí dvacet komínových těles a&nbsp;větracích šachet, z&nbsp;nichž každé pojal architekt jako samostatnou plastiku s&nbsp;odlišnou geometrickou hlavicí. Kónické, jehlanové i&nbsp;šroubovité tvary nevznikly jen pro potěchu oka; jejich profilování zabraňuje zpětnému tahu větru do krbů a&nbsp;chrání kouřovody před zatékáním deště.\u003C/p>\n\u003Cp>Právě zde Gaudí poprvé v&nbsp;monumentálním měřítku uplatnil techniku \u003Cem>trencadís\u003C/em>. Povrch komínů nechal pokrýt mozaikou z&nbsp;úlomků glazované keramiky, porcelánu, barevného skla a&nbsp;mramorových odřezků z&nbsp;kamenických dílen. Tato mozaiková technika nejen odolávala mořské vlhkosti a&nbsp;kouři, ale proměnila technické zázemí domu v&nbsp;pestrobarevný sochařský park s&nbsp;výhledem na starou Barcelonu.\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"visit-context-2026\" data-section-kind=\"narrative\">\n\u003Csummary>Návštěva a&nbsp;režim provozu v&nbsp;roce 2026\u003C/summary>\n\u003Cdiv>\u003Cp>Během dopolední návštěvy 26.&nbsp;září&nbsp;2026 v&nbsp;čase od 10.54 do 12.38 prošla fotodokumentace kompletní trasu městského paláce od suterénu až po střešní terasu. V&nbsp;roce 2026 fungoval palác v&nbsp;režimu časových vstupenek se samoobslužným audioprůvodcem v&nbsp;několika jazycích, který podrobně vysvětloval restaurátorské zásahy dokončené v&nbsp;roce 2011.\u003C/p>\n\u003Cp>V&nbsp;centrálním hudebním sále měli návštěvníci možnost zažít prostor s&nbsp;plným horním nasvícením lucernou i&nbsp;krátkou ukázkou hry zrestaurovaných varhan, jejichž zvuk se přirozeně šíří celou vertikálou budovy. Střešní terasa byla plně přístupná za slunečného počasí, což umožnilo detailní studium struktur \u003Cem>trencadís\u003C/em> a&nbsp;původních keramických glazur na jednotlivých komínech z&nbsp;bezprostřední blízkosti.\u003C/p>\n\u003C/div>\n\u003C/details>",locationOfficialHtml:"\u003Ctable>\n\u003Cthead>\n\u003Ctr>\n\u003Cth align=\"left\">Parametr\u003C/th>\n\u003Cth align=\"left\">Údaj\u003C/th>\n\u003C/tr> n:"Palau Güell",sublocation:"Palau Güell",city:"Barcelona",latitude:41.378844,longitude:2.174336,orientation:1,country:"Španělsko",countryCode:"ESP",state:"Katalánsko"},author:"Cebreus",authorSlug:"cebreus",location:"Palau Güell",city:"Barcelona",googleMapsUrl:"https://www.google.com/maps/search/?api=1&query=41.378844,2.174336",date:"2026-09-26T12:31:05",sources:[{variant:"default",type:"image/webp",path:"/images/previews-webp/IMG_0549.webp",width:370},{variant:"default",type:"image/jpeg",path:"/images/previews/IMG_0549.jpeg",width:370},{variant:"default",type:"image/avif",path:"/images/previews-avif/IMG_0549.avif",width:370},{variant:"xl",type:"image/webp",path:"/images/previews-xl-webp/IMG_0549.webp",width:534},{variant:"xl",type:"image/jpeg",path:"/images/previews-xl/IMG_0549.jpeg",width:534},{variant:"xl",type:"image/avif",path:"/images/previews-xl-avif/IMG_0549.avif",width:534},{variant:"detail",type:"image/jpeg",path:"/images/details/IMG_0549.jpeg",width:1707,height:1280},{variant:"fallback",type:"image/jpeg",path:"/images/previews-xxs/IMG_0549.jpeg",width:190,height:127},{variant:"admin_thumb",type:"image/jpeg",path:"/images/previews-admin/IMG_0549.jpeg",width:534,height:534}],people:[]},{id:"loc-park-guell-main-2026-09-26t190212",type:"separator",location:"Park Güell",city:"Barcelona",hasPhotos:true,startDate:"2026-09-26T19:02:12",endDate:"2026-09-26T23:59:59",storyTitle:"Park Güell",story:"\u003Cp class=\"lead\" data-section-id=\"lead\">Park Güell na svazích hory Turó del Carmel představuje originální urbanistický a&nbsp;krajinářský počin architekta Antoniho Gaudího a&nbsp;průmyslníka Eusebiho Güella. Areál vznikal v&nbsp;letech 1900–1914 původně jako soukromé rezidenční zahradní město určené pro barcelonskou elitu. Gaudí organicky propojil architekturu s&nbsp;přirozeným terénem, středomořskou vegetací a&nbsp;rozsáhlým systémem pro zachycování i&nbsp;filtraci dešťové vody. Pestrobarevné mozaiky \u003Cem>trencadís\u003C/em>, dórské sloupy a&nbsp;vyhlídkové terasy nad městem tvoří harmonický celek, který od roku 1926 slouží veřejnosti jako městský park.\u003C/p>\u003Cdetails data-section-id=\"garden-city-origin\" data-section-kind=\"narrative\">\n\u003Csummary>Vznik rezidenčního zahradního města\u003C/summary>\n\u003Cdiv>\u003Cp>Průmyslník Eusebi Güell zakoupil v&nbsp;roce 1899 venkovskou usedlost Can Muntaner de Dalt na holém svahu hory Turó del Carmel, tehdy zvané Muntanya Pelada. Inspirován britským hnutím zahradních měst Ebenezera Howarda pověřil Antoniho Gaudího projektem luxusního rezidenčního areálu. Proto také pro park zvolil anglický pravopis slova \u003Cem>Park\u003C/em>.\u003C/p>\n\u003Cp>Urbanistický plán rozdělil devatenáctihektarový pozemek na šedesát trojúhelníkových parcel s&nbsp;přísnými regulativy. Zastavěná plocha každé vily nesměla překročit jednu šestinu rozlohy pozemku a&nbsp;výška budov byla omezena, aby domy nebránily sousedům v&nbsp;panoramatickém výhledu na moře.\u003C/p>\n\u003Cp>Komerční záměr však zcela selhal kvůli velké vzdálenosti od centra a&nbsp;chybějící dopravní infrastruktuře. Z&nbsp;plánovaných vil vyrostly pouze dvě: dům právníka Martího Triase (Casa Trias) od architekta Juliho Batllevella a&nbsp;vzorový dům Franceska Berenguera. Po Güellově smrti v&nbsp;roce 1918 nabídli dědici pozemky městu, které celý areál v&nbsp;květnu 1922 odkoupilo za 3&nbsp;200&nbsp;000&nbsp;peset a&nbsp;roku 1926 otevřelo jako veřejný městský park.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"gaudi-house-nature\" data-section-kind=\"narrative\">\n\u003Csummary>Gaudího dům a&nbsp;středomořská vegetace\u003C/summary>\n\u003Cdiv>\u003Cp>Jelikož Berenguerův vzorový dům z&nbsp;roku 1904 nenašel kupce, odkoupil jej v&nbsp;roce 1906 sám Antoni Gaudí ze svých úspor. Architekt zde žil se svým starým otcem Franceskem a&nbsp;nemocnou neteří Rosou až do roku 1925, kdy se definitivně přestěhoval do dílny v&nbsp;chrámu Sagrada Família. Během těchto let chodil na staveniště chrámu každé ráno pěšky přes celou Barcelonu. V&nbsp;domě dnes sídlí Casa Museu Gaudí, uchovávající jeho asketickou ložnici a&nbsp;autorský ergonomický nábytek navržený pro Casa Calvet a&nbsp;Casa Batlló.\u003C/p>\n\u003Cp>Gaudí přistupoval k&nbsp;úpravě areálu s&nbsp;mimořádným ekologickým cítěním. Původně holé kamenité návrší nechal ozelenit výhradně původní středomořskou vegetací nenáročnou na vláhu: vysadil tisíce borovic halepských, rohovníků, divokých olivovníků, cypřišů a&nbsp;aromatického rozmarýnu. Hluboké kořeny těchto dřevin zpevnily příkré svahy proti erozi během přívalových dešť a&nbsp;vytvořily udržitelný parkový organismus.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"entrance-dragons\" data-section-kind=\"narrative\">\n\u003Csummary>Vstupní pavilony a&nbsp;monumentální schodiště s&nbsp;drakem\u003C/summary>\n\u003Cdiv>\u003Cp>Hlavní vstup do parku z&nbsp;ulice Carrer d&#39;Olot rámují dva vrátenské pavilony navržené v&nbsp;letech 1901–1903. Oba objekty kryjí tradiční katalánské klenby z&nbsp;pálených cihel, bohatě obložené pestrobarevným keramickým střepem technikou \u003Cem>trencadís\u003C/em>. Pravý pavilon, známý jako Casa del Guarda, sloužil jako byt správce areálu a&nbsp;jeho věžička zakončená čtyřramenným křížem připomíná klobouk houby.\u003C/p>\n\u003Cp>Areál uzavírá kovaná brána s&nbsp;litinovými odlitky palmových listů, původně navrženými pro dům Casa Vicens. Přímo za branou stoupá monumentální schodiště rozdělené do tří ramen. V&nbsp;jeho ose jsou umístěny tři symbolické kašny: nejnižší s&nbsp;trojzubcem, prostřední s&nbsp;hlavou hada vystupující z&nbsp;katalánského znaku a&nbsp;horní se slavnou sochou pestrobarevného draka neboli mloka (katalánsky \u003Cem>el drac\u003C/em>).\u003C/p>\n\u003Cp>Skulptura draka netvoří jen výtvarnou dominantu, ale představuje funkční bezpečnostní přeliv podzemního rezervoáru vody. Kdykoli hladina vody v&nbsp;podzemní nádrži pod sloupovou síní dosáhne maxima, přebytečná voda vytéká tlamou ještěra do kašny.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"hypostyle-hall\" data-section-kind=\"narrative\">\n\u003Csummary>Sloupová síň a&nbsp;podzemní cisterna\u003C/summary>\n\u003Cdiv>\u003Cp>Schodiště ústí do kryté sloupové síně (katalánsky \u003Cem>Sala Hipòstila\u003C/em>), kterou Gaudí projektoval jako tržnici pro obyvatele zahradního města. Prostor nese osmdesát šest mohutných kanelovaných sloupů dórského řádu o&nbsp;průměru přes jeden metr. Obvodové sloupy jsou mírně nakloněny dovnitř, čímž vytvářejí statické vzpěry zachycující tlaky z&nbsp;horního náměstí.\u003C/p>\n\u003Cp>Strop síně tvoří soustava klenbiček z&nbsp;katalánských cihel s&nbsp;bílým mozaikovým povrchem. Klenby zdobí čtyři velké kruhové polychromované medailony o&nbsp;průměru téměř tří metrů představující roční období a&nbsp;čtrnáct menších terčů, které vytvořil Josep Maria Jujol metodou rané asambláže ze střepů porcelánových talířů, kávových šálků s&nbsp;oušky a&nbsp;lahví od likérů. \u003C/p>\n\u003Cp>Sloupy zároveň plní klíčovou technickou roli: několik vybraných sloupů je dutých a&nbsp;funguje jako svislý svod dešťové vody. Písek náměstí nad síní dešťovou vodu přirozeně filtruje a&nbsp;duté sloupy ji svádějí do obří podzemní cisterny o&nbsp;objemu 1&nbsp;200&nbsp;m³, odkud byla samospádem rozváděna k&nbsp;závlaze zahrad.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"nature-square-bench\" data-section-kind=\"narrative\">\n\u003Csummary>Přírodní náměstí a&nbsp;zvlněná lavice\u003C/summary>\n\u003Cdiv>\u003Cp>Přímo nad sloupovou síní se rozprostírá rozlehlé oválné Přírodní náměstí (katalánsky \u003Cem>Plaça de la Natura\u003C/em>), původně projektované jako řecké divadlo pod širým nebem. Plocha spočívá částečně na skalním masivu a&nbsp;částečně na sloupech tržnice. Povrch zůstal záměrně nezpevněný propustným pískem, aby umožňoval rychlé vsakování srážkové vody do podzemní cisterny.\u003C/p>\n\u003Cp>Okraj náměstí lemuje proslulá zvlněná lavice (\u003Cem>banc ondulat\u003C/em>) o&nbsp;délce 110&nbsp;metrů, která slouží jako pohodlné sezení i&nbsp;bezpečnostní balustráda nad srázem. Její ergonomické křivky navrhl Gaudí podle otisku sedícího dělníka v&nbsp;čerstvé sádře.\u003C/p>\n\u003Cp>Povrch lavice pokrývá pestrá koláž keramických úlomků, kterou v&nbsp;letech 1910–1914 zkomponoval malíř Josep Maria Jujol. Jujol sbíral vyřazené zmetkové kachle z&nbsp;továrny Pujol i&nbsp;Bausis v&nbsp;Esplugues de Llobregat a&nbsp;zkombinoval je se střepy porcelánu a&nbsp;lahví do revoluční asambláže, která předběhla abstraktní umění 20.&nbsp;století.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"viaducts-portico\" data-section-kind=\"narrative\">\n\u003Csummary>Kamenné viadukty a&nbsp;chodba pradleny\u003C/summary>\n\u003Cdiv>\u003Cp>Ke zvládnutí příkrých svahů návrší vybudoval Gaudí síť tří kilometrů cest a&nbsp;třípatrový systém kamenných viaduktů. Spodní, střední i&nbsp;horní viadukt překonávají terénní zářezy pomocí šikmých sloupů a&nbsp;parabolických oblouků. Konstrukce vznikly výhradně z&nbsp;hrubého lomového kamene vytěženého přímo na místě, takže stavby dokonale splývají se skalnatým terénem. Plášť pilířů připomíná kmeny borovic či ptačí hnízda, na jejichž horních římsách rostou sukulenty a&nbsp;keře.\u003C/p>\n\u003Cp>Z&nbsp;východní strany náměstí vybíhá Sloupová chodba pradleny (katalánsky \u003Cem>Pòrtic de la Bugadera\u003C/em>). Krytá galerie připomíná valící se mořskou vlnu z&nbsp;nakloněných kamenných pilířů se šroubovitým kroucením. Jeden ze sloupů nese vytesanou postavu pradleny s&nbsp;košem prádla na hlavě jako hold prosté práci.\u003C/p>\n\u003Cp>Nejvyšším bodem areálu je Vrch tří křížů (\u003Cem>Turó de les Tres Creus\u003C/em>) v&nbsp;nadmořské výšce 183&nbsp;metrů. Gaudí zde původně plánoval kapli, ale po nálezu prehistorických zbytků vztyčil kamennou Kalvárii se třemi kříži orientovanými ke světovým stranám.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"visit-context-2026\" data-section-kind=\"narrative\">\n\u003Csummary>Podvečerní návštěva a&nbsp;režim provozu v&nbsp;roce 2026\u003C/summary>\n\u003Cdiv>\u003Cp>Návštěva Parku Güell dne 26.&nbsp;září&nbsp;2026 proběhla v&nbsp;podvečerních a&nbsp;nočních hodinách mezi 19.02 a&nbsp;půlnocí. Tento časový úsek umožnil zachytit monumentální zónu v&nbsp;okamžiku přechodu ze západu slunce do večerního osvětlení. V&nbsp;roce 2026 podléhal vstup do jádra parku přísnému kapacitnímu stropu s&nbsp;rezervací na konkrétní půlhodinu, což zamezilo dřívějšímu přetížení památky.\u003C/p>\n\u003Cp>Z&nbsp;vyhlídkové terasy Plaça de la Natura sledovali návštěvníci večerní panorama Barcelony s&nbsp;osvětlenými věžemi chrámu Sagrada Família i&nbsp;středozemním pobřežím v&nbsp;pozadí. Večerní atmosféra bez denních davů nechala vyniknout tichý šum borovic a&nbsp;detailní nasvícení vstupních domků i&nbsp;dračí fontány.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"facts\" data-section-kind=\"facts\">\n\u003Csummary>Základní údaje\u003C/summary>\n\u003Cdiv>\u003Ctable>\n\u003Cthead>\n\u003Ctr>\n\u003Cth align=\"left\">Parametr\u003C/th>\n\u003Cth align=\"left\">Údaj\u003C/th>\n\u003C/tr>\n\u003C/thead>\n\u003Ctbody>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Oficiální název\u003C/th>\n\u003Ctd align=\"left\">Park Güell\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Hlavní architekt\u003C/th>\n\u003Ctd align=\"left\">Antoni Gaudí i&nbsp;Cornet (1852–1926)\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Klíčoví spolupracovníci\u003C/th>\n\u003Ctd align=\"left\">Josep Maria Jujol (zvlněná lavice, stropní terče), Juli Batllevell, Francesc Berenguer\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Původní stavebník\u003C/th>\n\u003Ctd align=\"left\">Eusebi Güell i&nbsp;Bacigalupi (1846–1918)\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Doba výstavby\u003C/th>\n\u003Ctd align=\"left\">1900–1914 (otevření pro veřejnost 1926) \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Architektonický styl\u003C/th>\n\u003Ctd align=\"left\">katalánský modernismus (\u003Cem>Modernisme\u003C/em>), organická architektura\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Lokalita a&nbsp;adresa\u003C/th>\n\u003Ctd align=\"left\">Carrer d&#39;Olot 5, 08024 Barcelona (čtvrť Gràcia), Španělsko\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Rozměry a&nbsp;plocha\u003C/th>\n\u003Ctd align=\"left\">rozloha 19&nbsp;hektarů (monumentální zóna 12&nbsp;ha); 86&nbsp;dórských sloupů, cisterna 1&nbsp;200&nbsp;m³, lavice cca 110&nbsp;m\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Současné využití a&nbsp;vlastník\u003C/th>\n\u003Ctd align=\"left\">Město Barcelona (odkup 1922 za 3&nbsp;200&nbsp;000&nbsp;peset); městský park a&nbsp;muzeum spravované společností B:SM \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Památková ochrana\u003C/th>\n\u003Ctd align=\"left\">BCIN (kód 62-MH-EN, IPAC IPA-47); Seznam světového dědictví UNESCO (ref. 320-001) \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Oficiální web\u003C/th>\n\u003Ctd align=\"left\">\u003Ca href=\"https://parkguell.barcelona/\">parkguell.barcelona\u003C/a>\u003C/td>\n\u003C/tr>\n\u003C/tbody>\n\u003C/table>\n\u003C/div>\n\u003C/details>",locationId:"park-guell",locationLeadHtml:"\u003Cp class=\"lead\" data-section-id=\"lead\">Park Güell na svazích hory Turó del Carmel představuje originální urbanistický a&nbsp;krajinářský počin architekta Antoniho Gaudího a&nbsp;průmyslníka Eusebiho Güella. Areál vznikal v&nbsp;letech 1900–1914 původně jako soukromé rezidenční zahradní město určené pro barcelonskou elitu. Gaudí organicky propojil architekturu s&nbsp;přirozeným terénem, středomořskou vegetací a&nbsp;rozsáhlým systémem pro zachycování i&nbsp;filtraci dešťové vody. Pestrobarevné mozaiky \u003Cem>trencadís\u003C/em>, dórské sloupy a&nbsp;vyhlídkové terasy nad městem tvoří harmonický celek, který od roku 1926 slouží veřejnosti jako městský park.\u003C/p>",locationHtml:"\u003Cdetails data-section-id=\"garden-city-origin\" data-section-kind=\"narrative\">\n\u003Csummary>Vznik rezidenčního zahradního města\u003C/summary>\n\u003Cdiv>\u003Cp>Průmyslník Eusebi Güell zakoupil v&nbsp;roce 1899 venkovskou usedlost Can Muntaner de Dalt na holém svahu hory Turó del Carmel, tehdy zvané Muntanya Pelada. Inspirován britským hnutím zahradních měst Ebenezera Howarda pověřil Antoniho Gaudího projektem luxusního rezidenčního areálu. Proto také pro park zvolil anglický pravopis slova \u003Cem>Park\u003C/em>.\u003C/p>\n\u003Cp>Urbanistický plán rozdělil devatenáctihektarový pozemek na šedesát trojúhelníkových parcel s&nbsp;přísnými regulativy. Zastavěná plocha každé vily nesměla překročit jednu šestinu rozlohy pozemku a&nbsp;výška budov byla omezena, aby domy nebránily sousedům v&nbsp;panoramatickém výhledu na moře.\u003C/p>\n\u003Cp>Komerční záměr však zcela selhal kvůli velké vzdálenosti od centra a&nbsp;chybějící dopravní infrastruktuře. Z&nbsp;plánovaných vil vyrostly pouze dvě: dům právníka Martího Triase (Casa Trias) od architekta Juliho Batllevella a&nbsp;vzorový dům Franceska Berenguera. Po Güellově smrti v&nbsp;roce 1918 nabídli dědici pozemky městu, které celý areál v&nbsp;květnu 1922 odkoupilo za 3&nbsp;200&nbsp;000&nbsp;peset a&nbsp;roku 1926 otevřelo jako veřejný městský park.\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"gaudi-house-nature\" data-section-kind=\"narrative\">\n\u003Csummary>Gaudího dům a&nbsp;středomořská vegetace\u003C/summary>\n\u003Cdiv>\u003Cp>Jelikož Berenguerův vzorový dům z&nbsp;roku 1904 nenašel kupce, odkoupil jej v&nbsp;roce 1906 sám Antoni Gaudí ze svých úspor. Architekt zde žil se svým starým otcem Franceskem a&nbsp;nemocnou neteří Rosou až do roku 1925, kdy se definitivně přestěhoval do dílny v&nbsp;chrámu Sagrada Família. Během těchto let chodil na staveniště chrámu každé ráno pěšky přes celou Barcelonu. V&nbsp;domě dnes sídlí Casa Museu Gaudí, uchovávající jeho asketickou ložnici a&nbsp;autorský ergonomický nábytek navržený pro Casa Calvet a&nbsp;Casa Batlló.\u003C/p>\n\u003Cp>Gaudí přistupoval k&nbsp;úpravě areálu s&nbsp;mimořádným ekologickým cítěním. Původně holé kamenité návrší nechal ozelenit výhradně původní středomořskou vegetací nenáročnou na vláhu: vysadil tisíce borovic halepských, rohovníků, divokých olivovníků, cypřišů a&nbsp;aromatického rozmarýnu. Hluboké kořeny těchto dřevin zpevnily příkré svahy proti erozi během přívalových dešť a&nbsp;vytvořily udržitelný parkový organismus.\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"entrance-dragons\" data-section-kind=\"narrative\">\n\u003Csummary>Vstupní pavilony a&nbsp;monumentální schodiště s&nbsp;drakem\u003C/summary>\n\u003Cdiv>\u003Cp>Hlavní vstup do parku z&nbsp;ulice Carrer d'Olot rámují dva vrátenské pavilony navržené v&nbsp;letech 1901–1903. Oba objekty kryjí tradiční katalánské klenby z&nbsp;pálených cihel, bohatě obložené pestrobarevným keramickým střepem technikou \u003Cem>trencadís\u003C/em>. Pravý pavilon, známý jako Casa del Guarda, sloužil jako byt správce areálu a&nbsp;jeho věžička zakončená čtyřramenným křížem připomíná klobouk houby.\u003C/p>\n\u003Cp>Areál uzavírá kovaná brána s&nbsp;litinovými odlitky palmových listů, původně navrženými pro dům Casa Vicens. Přímo za branou stoupá monumentální schodiště rozdělené do tří ramen. V&nbsp;jeho ose jsou umístěny tři symbolické kašny: nejnižší s&nbsp;trojzubcem, prostřední s&nbsp;hlavou hada vystupující z&nbsp;katalánského znaku a&nbsp;horní se slavnou sochou pestrobarevného draka neboli mloka (katalánsky \u003Cem>el drac\u003C/em>).\u003C/p>\n\u003Cp>Skulptura draka netvoří jen výtvarnou dominantu, ale představuje funkční bezpečnostní přeliv podzemního rezervoáru vody. Kdykoli hladina vody v&nbsp;podzemní nádrži pod sloupovou síní dosáhne maxima, přebytečná voda vytéká tlamou ještěra do kašny.\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"hypostyle-hall\" data-section-kind=\"narrative\">\n\u003Csummary>Sloupová síň a&nbsp;podzemní cisterna\u003C/summary>\n\u003Cdiv>\u003Cp>Schodiště ústí do kryté sloupové síně (katalánsky \u003Cem>Sala Hipòstila\u003C/em>), kterou Gaudí projektoval jako tržnici pro obyvatele zahradního města. Prostor nese osmdesát šest mohutných kanelovaných sloupů dórského řádu o&nbsp;průměru přes jeden metr. Obvodové sloupy jsou mírně nakloněny dovnitř, čímž vytvářejí statické vzpěry zachycující tlaky z&nbsp;horního náměstí.\u003C/p>\n\u003Cp>Strop síně tvoří soustava klenbiček z&nbsp;katalánských cihel s&nbsp;bílým mozaikovým povrchem. Klenby zdobí čtyři velké kruhové polychromované medailony o&nbsp;průměru téměř tří metrů představující roční období a&nbsp;čtrnáct menších terčů, které vytvořil Josep Maria Jujol metodou rané asambláže ze střepů porcelánových talířů, kávových šálků s&nbsp;oušky a&nbsp;lahví od likérů. \u003C/p>\n\u003Cp>Sloupy zároveň plní klíčovou technickou roli: několik vybraných sloupů je dutých a&nbsp;funguje jako svislý svod dešťové vody. Písek náměstí nad síní dešťovou vodu přirozeně filtruje a&nbsp;duté sloupy ji svádějí do obří podzemní cisterny o&nbsp;objemu 1&nbsp;200&nbsp;m³, odkud byla samospádem rozváděna k&nbsp;závlaze zahrad.\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"nature-square-bench\" data-section-kind=\"narrative\">\n\u003Csummary>Přírodní náměstí a&nbsp;zvlněná lavice\u003C/summary>\n\u003Cdiv>\u003Cp>Přímo nad sloupovou síní se rozprostírá rozlehlé oválné Přírodní náměstí (katalánsky \u003Cem>Plaça de la Natura\u003C/em>), původně projektované jako řecké divadlo pod širým nebem. Plocha spočívá částečně na skalním masivu a&nbsp;částečně na sloupech tržnice. Povrch zůstal záměrně nezpevněný propustným pískem, aby umožňoval rychlé vsakování srážkové vody do podzemní cisterny.\u003C/p>\n\u003Cp>Okraj náměstí lemuje proslulá zvlněná lavice (\u003Cem>banc ondulat\u003C/em>) o&nbsp;délce 110&nbsp;metrů, která slouží jako pohodlné sezení i&nbsp;bezpečnostní balustráda nad srázem. Její ergonomické křivky navrhl Gaudí podle otisku sedícího dělníka v&nbsp;čerstvé sádře.\u003C/p>\n\u003Cp>Povrch lavice pokrývá pestrá koláž keramických úlomků, kterou v&nbsp;letech 1910–1914 zkomponoval malíř Josep Maria Jujol. Jujol sbíral vyřazené zmetkové kachle z&nbsp;továrny Pujol i&nbsp;Bausis v&nbsp;Esplugues de Llobregat a&nbsp;zkombinoval je se střepy porcelánu a&nbsp;lahví do revoluční asambláže, která předběhla abstraktní umění 20.&nbsp;století.\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"viaducts-portico\" data-section-kind=\"narrative\">\n\u003Csummary>Kamenné viadukty a&nbsp;chodba pradleny\u003C/summary>\n\u003Cdiv>\u003Cp>Ke zvládnutí příkrých svahů návrší vybudoval Gaudí síť tří kilometrů cest a&nbsp;třípatrový systém kamenných viaduktů. Spodní, střední i&nbsp;horní viadukt překonávají terénní zářezy pomocí šikmých sloupů a&nbsp;parabolických oblouků. Konstrukce vznikly výhradně z&nbsp;hrubého lomového kamene vytěženého přímo na místě, takže stavby dokonale splývají se skalnatým terénem. Plášť pilířů připomíná kmeny borovic či ptačí hnízda, na jejichž horních římsách rostou sukulenty a&nbsp;keře.\u003C/p>\n\u003Cp>Z&nbsp;východní strany náměstí vybíhá Sloupová chodba pradleny (katalánsky \u003Cem>Pòrtic de la Bugadera\u003C/em>). Krytá galerie připomíná valící se mořskou vlnu z&nbsp;nakloněných kamenných pilířů se šroubovitým kroucením. Jeden ze sloupů nese vytesanou postavu pradleny s&nbsp;košem prádla na hlavě jako hold prosté práci.\u003C/p>\n\u003Cp>Nejvyšším bodem areálu je Vrch tří křížů (\u003Cem>Turó de les Tres Creus\u003C/em>) v&nbsp;nadmořské výšce 183&nbsp;metrů. Gaudí zde původně plánoval kapli, ale po nálezu prehistorických zbytků vztyčil kamennou Kalvárii se třemi kříži orientovanými ke světovým stranám.\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"visit-context-2026\" data-section-kind=\"narrative\">\n\u003Csummary>Podvečerní návštěva a&nbsp;režim provozu v&nbsp;roce 2026\u003C/summary>\n\u003Cdiv>\u003Cp>Návštěva Parku Güell dne 26.&nbsp;září&nbsp;2026 proběhla v&nbsp;podvečerních a&nbsp;nočních hodinách mezi 19.02 a&nbsp;půlnocí. Tento časový úsek umožnil zachytit monumentální zónu v&nbsp;okamžiku přechodu ze západu slunce do večerního osvětlení. V&nbsp;roce 2026 podléhal vstup do jádra parku přísnému kapacitnímu stropu s&nbsp;rezervací na konkrétní půlhodinu, což zamezilo dřívějšímu přetížení památky.\u003C/p>\n\u003Cp>Z&nbsp;vyhlídkové terasy Plaça de la Natura sledovali návštěvníci večerní panorama Barcelony s&nbsp;osvětlenými věžemi chrámu Sagrada Família i&nbsp;středozemním pobřežím v&nbsp;pozadí. Večerní atmosféra bez denních davů nechala vyniknout tichý šum borovic a&nbsp;detailní nasvícení vstupních domků i&nbsp;dračí fontány.\u003C/p>\n\u003C/div>\n\u003C/details>",locationOfficialHtml:"\u003Ctable>\n\u003Cthead>\n\u003Ctr>\n\u003Cth align=\"left\">Parametr\u003C/th>\n\u003Cth align=\"left\">Údaj\u003C/th>\n\u003C/tr>\n\u003C/thead>\n\u003Ctbody>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Oficiální název\u003C/th>\n\u003Ctd align=\"left\">Park Güell\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Hlavní architekt\u003C/th>\n\u003Ctd align=\"left\">Antoni Gaudí i&nbsp;Cornet (1852–1926)\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Klíčoví spolupracovníci\u003C/th>\n\u003Ctd align=\"left\">Josep Maria Jujol (zvlněná lavice, stropní terče), Juli Batllevell, Francesc Berenguer\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Původní stavebník\u003C/th>\n\u003Ctd align=\"left\">Eusebi Güell i&nbsp;Bacigalupi (1846–1918)\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Doba výstavby\u003C/th>\n\u003Ctd align=\"left\">1900–1914 (otevření pro veřejnost 1926) \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Architektonický styl\u003C/th>\n\u003Ctd align=\"left\">katalánský modernismus (\u003Cem>Modernisme\u003C/em>), organická architektura\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Lokalita a&nbsp;adresa\u003C/th>\n\u003Ctd align=\"left\">Carrer d'Olot 5, 08024 Barcelona (čtvrť Gràcia), Španělsko\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Rozměry a&nbsp;plocha\u003C/th>\n\u003Ctd align=\"left\">rozloha 19&nbsp;hektarů (monumentální zóna 12&nbsp;ha); 86&nbsp;dórských sloupů, cisterna 1&nbsp;200&nbsp;m³, lavice cca 110&nbsp;m\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Současné využití a&nbsp;vlastník\u003C/th>\n\u003Ctd align=\"left\">Město Barcelona (odkup 1922 za 3&nbsp;200&nbsp;000&nbsp;peset); městský park a&nbsp;muzeum spravované společností B:SM \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Památková ochrana\u003C/th>\n\u003Ctd align=\"left\">BCIN (kód 62-MH-EN, IPAC IPA-47); Seznam světového dědictví UNESCO (ref. 320-001) \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Oficiální web\u003C/th>\n\u003Ctd align=\"left\">\u003Ca href=\"https://parkguell.barcelona/\">parkguell.barcelona\u003C/a>\u003C/td>\n\u003C/tr>\n\u003C/tbody>\n\u003C/table>\n",aliases:["Parc Güell","Park Güell","Güell Park"],heroImage:{src:"/travel-guide/teasers/park-guell/hero.jpg",alt:"Mozaiková lavice v Parku Güell s výhledem na Barcelonu"},audio:[{section:"lead",label:"Úvod",identity:"de86e08533df3222eed48532131f54cf3e892f69430ce27f9d6e05413c745daf",src:"/travel-guide/audio/park-guell/de86e08533df3222eed48532131f54cf3e892f69430ce27f9d6e05413c745daf.m4a"},{section:"garden-city-origin",label:"Vznik rezidenčního zahradního města",identity:"972f85e1916d35c04d254749c172e70d61c4c383b29c68d94bfd38b90c145fe4",src:"/travel-guide/audio/park-guell/ 6a7e09c85daea89/poster.jpg",width:1280,height:720}],video:{path:"/videos/video-14e28a69c0bbe8f6091a7a16/720p-web-v3-7d07955f23b70db0cb0c4f1285ca47d0374be4a1c915801146a7e09c85daea89/video.mp4",type:"video/mp4",duration:123.903333,hasAudio:true,poster:"/videos/video-14e28a69c0bbe8f6091a7a16/720p-web-v3-7d07955f23b70db0cb0c4f1285ca47d0374be4a1c915801146a7e09c85daea89/poster.jpg",mediaFingerprint:"260b704b4c2fd6182a3c81d07fed56bc63fbc4a1626ee70c9d90e7331b0dacc3",quality:"720p",sizeMB:71.6},people:[]}],id:"day-2026-09-26"},{date:"2026-09-27",cities:["Kolonie Güell","Monistrol de Montserrat","Collbató"],locations:["Krypta v kolonii Güell","Montserrat"],items:[{id:"loc-krypta-v-kolonii-guell-main-2026-09-27t104250",type:"separator",location:"Krypta v kolonii Güell",city:"Kolonie Güell",hasPhotos:true,startDate:"2026-09-27T10:42:50",endDate:"2026-09-27T11:25:46",storyTitle:"Krypta v kolonii Güell (Cripta de la Colònia Güell)",story:"\u003Cp class=\"lead\" data-section-id=\"lead\">Krypta v&nbsp;kolonii Güell (katalánsky \u003Cem>Cripta de la Colònia Güell\u003C/em>) v&nbsp;obci Santa Coloma de Cervelló představuje unikátní nedokončený chrám navržený Antonim Gaudím. Stavba vznikala v&nbsp;letech 1908–1914 jako duchovní centrum průmyslové dělnické kolonie textilního magnáta Eusebiho Güella. Gaudí zde poprvé v&nbsp;praxi uplatnil své převratné statické inovace ověřené na zavěšeném řetězovkovém modelu. Výsledný prostor spojuje neopracovaný čedič, zvonivé cihly a&nbsp;recyklované materiály do monumentálního organického celku.\u003C/p>\u003Cdetails data-section-id=\"industrial-colony\" data-section-kind=\"narrative\">\n\u003Csummary>Průmyslová kolonie a&nbsp;sociální zázemí\u003C/summary>\n\u003Cdiv>\u003Cp>Roku 1890 založil průmyslník Eusebi Güell v&nbsp;katastru obce Santa Coloma de Cervelló novou textilní kolonii, kam přesunul přádelnu a&nbsp;tkalcovnu bavlny z&nbsp;barcelonské čtvrti Sants, aby unikl častým stávkám a&nbsp;sociálnímu napětí. Podnikatel pojal novou osadu jako samostatný soběstačný sídelní celek na principech průmyslového paternalismu: vybudoval rodinné domy pro dělníky, školu, lékařskou ordinaci, společenské divadlo Ateneu Unió i&nbsp;spotřební družstvo La Cooperativa.\u003C/p>\n\u003Cp>Na urbanistickém řešení a&nbsp;architektonické podobě budov se významně podíleli Gaudího blízcí spolupracovníci Francesc Berenguer i&nbsp;Mestres a&nbsp;Joan Rubió i&nbsp;Bellver. Rubió navrhl roku 1900 dům správce Ca l&#39;Espinal s&nbsp;nárožní věží a&nbsp;mudejarským cihlovým zdivem, zatímco Berenguer vyprojektoval dům Ca l&#39;Ordal napodobující tradiční venkovskou usedlost. Roku 1898 pověřil Güell Antoniho Gaudího návrhem velkolepého chrámu s&nbsp;naprostou tvůrčí svobodou.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"catenary-model\" data-section-kind=\"narrative\">\n\u003Csummary>Zavěšený řetězovkový model\u003C/summary>\n\u003Cdiv>\u003Cp>Před zahájením stavby strávil Gaudí deset let (1898–1908) přípravnými výpočty a&nbsp;statickými experimenty. V&nbsp;borovém háji u&nbsp;staveniště si zřídil dřevěný ateliér, kde sestrojil převratný zavěšený stereostatický model v&nbsp;měřítku 1:10. Zařízení tvořila síť provázků zavěšených ze stropu, na něž připevňoval plátěné sáčky s&nbsp;olověnými broky o&nbsp;hmotnosti odpovídající vypočtenému zatížení kleneb.\u003C/p>\n\u003Cp>Provázky se působením zemské tíže přirozeně vytvarovaly do plynulých řetězovkových křivek namáhaných výhradně tahem. Gaudí pochopil, že převrácením tohoto tvaru získá dokonalý tlačený oblouk bez ohybových momentů. Model fotografoval ze všech úhlů a&nbsp;po otočení snímků vzhůru nohama dokresloval profily sloupů a&nbsp;kamenných stěn bez nutnosti vnějších opěrných pilířů.\u003C/p>\n\u003Cp>Původní model shořel 19.&nbsp;července&nbsp;1936 při vyplenění ateliéru na počátku občanské války. Z&nbsp;dochovaných fotografií zkonstruoval tým badatelů pod vedením Jose Tomlowa a&nbsp;Rainera Gräfeho v&nbsp;roce 1982 funkční repliku, dnes vystavenou v&nbsp;muzeu chrámu Sagrada Família.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"construction-basalt\" data-section-kind=\"narrative\">\n\u003Csummary>Konstrukce, čedičové sloupy a&nbsp;cihlové klenby\u003C/summary>\n\u003Cdiv>\u003Cp>Základní kámen stavby byl položen 4.&nbsp;října&nbsp;1908. Původní Gaudího záměr počítal s&nbsp;dvoupodlažním chrámem s&nbsp;centrální kupolí a&nbsp;pěti věžemi vysokými až čtyřicet metrů, realizace se však dočkala pouze spodní část stavby. Půdorys tvoří nepravidelný ovál přizpůsobený přirozenému svahu zalesněného pahorku.\u003C/p>\n\u003Cp>Centrální prostor interiéru podpírají čtyři mohutné monolitické sloupy z&nbsp;neopracovaného vulkanického čediče vytěženého v&nbsp;lomech u&nbsp;Castellfollit de la Roca. Sloupy stojí v&nbsp;mírném náklonu, který přesně odpovídá vypočtenému směru působících tlakových sil. Mezi patku, dřík a&nbsp;hlavici každého sloupu vložil architekt olověné desky pro pružné rozložení tlaku bez rizika prasknutí kamene.\u003C/p>\n\u003Cp>Obvodové pilíře a&nbsp;klenuté stropy tvoří přepálené zvonivé cihly v&nbsp;kombinaci s&nbsp;hutnickou struskou z&nbsp;vysokých pecí. Klenby využívají geometrii hyperbolických paraboloidů vyzděných tradiční technikou tenké katalánské klenby.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"portal-mosaics\" data-section-kind=\"narrative\">\n\u003Csummary>Vstupní portikus, mozaiky a&nbsp;recyklované materiály\u003C/summary>\n\u003Cdiv>\u003Cp>Před vstupem do krypty vybudoval Gaudí prostorné portiko se šikmými sloupy nesoucími hyperbolické klenby, které mělo původně tvořit podnož venkovního schodiště do horního chrámu. Nad vstupními dveřmi upoutá pozornost keramický tympanon zdobený barevnou mozaikou technikou \u003Cem>trencadís\u003C/em> od Josepa Marii Jujola s&nbsp;křesťanskou symbolikou a&nbsp;monogramem Panny Marie.\u003C/p>\n\u003Cp>Okna krypty mají protáhlý organický tvar připomínající borové šišky. Výplně tvoří olověné vitráže navržené Jujolem, jejichž křídla se vyklápějí do stran podobně jako hmyzí krovky.\u003C/p>\n\u003Cp>Ochranné okenní mříže představují geniální ukázku rané průmyslové recyklace v&nbsp;architektuře: kováři je vyrobili ze starých vyřazených jehel a&nbsp;vřeten dopřádacích strojů z&nbsp;místní textilní továrny.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"interior-furnishings\" data-section-kind=\"narrative\">\n\u003Csummary>Vnitřní vybavení, oltáře a&nbsp;mušlové kropenky\u003C/summary>\n\u003Cdiv>\u003Cp>Vnitřní vybavení chrámu navrhoval Gaudí s&nbsp;maximálním důrazem na liturgickou funkci a&nbsp;ergonomii. V&nbsp;letech 1913–1914 navrhl soubor dvaceti dvoumístných kostelních lavic vyrobených místním truhlářem Tomàsem Bernatem z&nbsp;recyklovaného dubového dřeva přepravních beden a&nbsp;ocelových pásů z&nbsp;balíků bavlny.  Mírně prohnuté sedáky a&nbsp;opěrky nutily věřící sedět vzpřímeně bez únavy.\u003C/p>\n\u003Cp>Liturgické uspořádání zahrnuje trojici oltářů: hlavní oltář i&nbsp;levý boční oltář Svaté rodiny projektoval Josep Maria Jujol, zatímco pravý oltář Panny Marie Montserratské pochází od Isidreho Puiga i&nbsp;Boady. Kropenky na svěcenou vodu u&nbsp;vchodu tvoří obří lastury tropických mlžů zévy obrovské (\u003Cem>Tridacna gigas\u003C/em>), které z&nbsp;Filipín přivezly lodě rodiny Güellů, osazené na podstavcích z&nbsp;tepaného železa.\u003C/p>\n\u003Cp>Drsný povrch přepálených cihel a&nbsp;čediče přirozeně pohlcuje ozvěnu, takže mluvené slovo i&nbsp;zpěv znějí mimořádně zřetelně.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"abandonment-restoration\" data-section-kind=\"narrative\">\n\u003Csummary>Zastavení stavby, válečné škody a&nbsp;památková obnova\u003C/summary>\n\u003Cdiv>\u003Cp>Stavební práce ustaly v&nbsp;říjnu 1914, kdy Eusebi Güell vážně onemocněl a&nbsp;jeho synové odmítli další financování chrámu. Gaudí, zdrcený úmrtím své neteře Rosy i&nbsp;blízkého přítele Franceska Berenguera, se stáhl z&nbsp;mimobarcelonských staveb a&nbsp;soustředil se výhradně na Sagrada Família. Dokončenou kryptu vysvětil 3.&nbsp;listopadu&nbsp;1915 barcelonský biskup Enrique Reig y&nbsp;Casanova.\u003C/p>\n\u003Cp>Během španělské občanské války v&nbsp;červenci 1936 interiér vyhořel a&nbsp;sloužil jako vojenské skladiště obilí. První záchrannou obnovu vedl roku 1939 Gaudího žák Lluís Bonet i&nbsp;Garí.\u003C/p>\n\u003Cp>V&nbsp;letech 1999–2002 prošla památka rozsáhlou obnovou pod vedením architekta Antoniho Gonzáleze Morena-Navarra, která vyvolala mezinárodní polemiku kvůli vybudování pochozí terasy nad kryptou. Roku 2005 zapsala organizace UNESCO kryptu na Seznam světového kulturního dědictví jako součást souboru Gaudího děl.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"visit-context-2026\" data-section-kind=\"narrative\">\n\u003Csummary>Dopolední návštěva a&nbsp;režim provozu v&nbsp;roce 2026\u003C/summary>\n\u003Cdiv>\u003Cp>Návštěva krypty v&nbsp;kolonii Güell dne 27.&nbsp;září&nbsp;2026 proběhla v&nbsp;dopoledních hodinách mezi 10.42 a&nbsp;11.26. Slunečné dopoledne nabídlo vynikající světelné podmínky: paprsky nízkého slunce pronikaly skrze Jujolovy barevné vitráže v&nbsp;šiškovitých oknech a&nbsp;promítaly na drsné čedičové monolity i&nbsp;cihlové klenby teplé barevné tóny.\u003C/p>\n\u003Cp>V&nbsp;roce 2026 byl vstup do krypty organizován s&nbsp;audioprůvodcem v&nbsp;několika jazycích, který podrobně vysvětloval statické fungování nakloněných sloupů i&nbsp;historii dělnické osady. Návštěvníci si mohli zblízka vyzkoušet původní ergonomické dřevěné lavice a&nbsp;prohlédnout kropenky z&nbsp;obřích lastur zévy dovezených z&nbsp;Filipín.\u003C/p>\n\u003C/div>\n\u003C/details>\u003Cdetails data-section-id=\"facts\" data-section-kind=\"facts\">\n\u003Csummary>Základní údaje\u003C/summary>\n\u003Cdiv>\u003Ctable>\n\u003Cthead>\n\u003Ctr>\n\u003Cth align=\"left\">Parametr\u003C/th>\n\u003Cth align=\"left\">Údaj\u003C/th>\n\u003C/tr>\n\u003C/thead>\n\u003Ctbody>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Oficiální název\u003C/th>\n\u003Ctd align=\"left\">Cripta de la Colònia Güell (zamýšlený farní kostel)\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Hlavní architekt\u003C/th>\n\u003Ctd align=\"left\">Antoni Gaudí i&nbsp;Cornet (1852–1926)\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Klíčoví spolupracovníci\u003C/th>\n\u003Ctd align=\"left\">Francesc Berenguer i&nbsp;Mestres (kolonie), Josep Maria Jujol (mozaiky a&nbsp;oltáře), Joan Rubió (Ca l&#39;Espinal); Lluís Bonet i&nbsp;Garí (obnova 1939)\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Původní stavebník\u003C/th>\n\u003Ctd align=\"left\">Eusebi Güell i&nbsp;Bacigalupi (1846–1918)\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Doba výstavby\u003C/th>\n\u003Ctd align=\"left\">1908–1914 (příprava modelu 1898–1908, vysvěcení 3.&nbsp;listopadu&nbsp;1915) \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Architektonický styl\u003C/th>\n\u003Ctd align=\"left\">katalánský modernismus (\u003Cem>Modernisme\u003C/em>), organická architektura\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Lokalita a&nbsp;adresa\u003C/th>\n\u003Ctd align=\"left\">Carrer del Reixac s/n, 08690 Santa Coloma de Cervelló, Španělsko\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Rozměry a&nbsp;plocha\u003C/th>\n\u003Ctd align=\"left\">půdorys krypty cca 26 × 25&nbsp;m, plocha cca 580&nbsp;m², 4 centrální čedičové sloupy, zamýšlená výška chrámu 40&nbsp;m \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Současné využití a&nbsp;vlastník\u003C/th>\n\u003Ctd align=\"left\">Consorci del Parc de la Colònia Güell; farní kostel a&nbsp;muzeum přístupné veřejnosti\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Památková ochrana\u003C/th>\n\u003Ctd align=\"left\">BCIN (kód 184-MH-EN, IPAC IPA-199; soubor kolonie kód 1876-CH-EN); Seznam světového dědictví UNESCO (ref. 320-007bis) \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Oficiální web\u003C/th>\n\u003Ctd align=\"left\">\u003Ca href=\"https://lacoloniaguell.cat/\">lacoloniaguell.cat\u003C/a>\u003C/td>\n\u003C/tr>\n\u003C/tbody>\n\u003C/table>\n\u003C/div>\n\u003C/details>",locationId:"cripta-colonia-guell",locationLeadHtml:"\u003Cp class=\"lead\" data-section-id=\"lead\">Krypta v&nbsp;kolonii Güell (katalánsky \u003Cem>Cripta de la Colònia Güell\u003C/em>) v&nbsp;obci Santa Coloma de Cervelló představuje unikátní nedokončený chrám navržený Antonim Gaudím. Stavba vznikala v&nbsp;letech 1908–1914 jako duchovní centrum průmyslové dělnické kolonie textilního magnáta Eusebiho Güella. Gaudí zde poprvé v&nbsp;praxi uplatnil své převratné statické inovace ověřené na zavěšeném řetězovkovém modelu. Výsledný prostor spojuje neopracovaný čedič, zvonivé cihly a&nbsp;recyklované materiály do monumentálního organického celku.\u003C/p>",locationHtml:"\u003Cdetails data-section-id=\"industrial-colony\" data-section-kind=\"narrative\">\n\u003Csummary>Průmyslová kolonie a&nbsp;sociální zázemí\u003C/summary>\n\u003Cdiv>\u003Cp>Roku 1890 založil průmyslník Eusebi Güell v&nbsp;katastru obce Santa Coloma de Cervelló novou textilní kolonii, kam přesunul přádelnu a&nbsp;tkalcovnu bavlny z&nbsp;barcelonské čtvrti Sants, aby unikl častým stávkám a&nbsp;sociálnímu napětí. Podnikatel pojal novou osadu jako samostatný soběstačný sídelní celek na principech průmyslového paternalismu: vybudoval rodinné domy pro dělníky, školu, lékařskou ordinaci, společenské divadlo Ateneu Unió i&nbsp;spotřební družstvo La Cooperativa.\u003C/p>\n\u003Cp>Na urbanistickém řešení a&nbsp;architektonické podobě budov se významně podíleli Gaudího blízcí spolupracovníci Francesc Berenguer i&nbsp;Mestres a&nbsp;Joan Rubió i&nbsp;Bellver. Rubió navrhl roku 1900 dům správce Ca l'Espinal s&nbsp;nárožní věží a&nbsp;mudejarským cihlovým zdivem, zatímco Berenguer vyprojektoval dům Ca l'Ordal napodobující tradiční venkovskou usedlost. Roku 1898 pověřil Güell Antoniho Gaudího návrhem velkolepého chrámu s&nbsp;naprostou tvůrčí svobodou.\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"catenary-model\" data-section-kind=\"narrative\">\n\u003Csummary>Zavěšený řetězovkový model\u003C/summary>\n\u003Cdiv>\u003Cp>Před zahájením stavby strávil Gaudí deset let (1898–1908) přípravnými výpočty a&nbsp;statickými experimenty. V&nbsp;borovém háji u&nbsp;staveniště si zřídil dřevěný ateliér, kde sestrojil převratný zavěšený stereostatický model v&nbsp;měřítku 1:10. Zařízení tvořila síť provázků zavěšených ze stropu, na něž připevňoval plátěné sáčky s&nbsp;olověnými broky o&nbsp;hmotnosti odpovídající vypočtenému zatížení kleneb.\u003C/p>\n\u003Cp>Provázky se působením zemské tíže přirozeně vytvarovaly do plynulých řetězovkových křivek namáhaných výhradně tahem. Gaudí pochopil, že převrácením tohoto tvaru získá dokonalý tlačený oblouk bez ohybových momentů. Model fotografoval ze všech úhlů a&nbsp;po otočení snímků vzhůru nohama dokresloval profily sloupů a&nbsp;kamenných stěn bez nutnosti vnějších opěrných pilířů.\u003C/p>\n\u003Cp>Původní model shořel 19.&nbsp;července&nbsp;1936 při vyplenění ateliéru na počátku občanské války. Z&nbsp;dochovaných fotografií zkonstruoval tým badatelů pod vedením Jose Tomlowa a&nbsp;Rainera Gräfeho v&nbsp;roce 1982 funkční repliku, dnes vystavenou v&nbsp;muzeu chrámu Sagrada Família.\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"construction-basalt\" data-section-kind=\"narrative\">\n\u003Csummary>Konstrukce, čedičové sloupy a&nbsp;cihlové klenby\u003C/summary>\n\u003Cdiv>\u003Cp>Základní kámen stavby byl položen 4.&nbsp;října&nbsp;1908. Původní Gaudího záměr počítal s&nbsp;dvoupodlažním chrámem s&nbsp;centrální kupolí a&nbsp;pěti věžemi vysokými až čtyřicet metrů, realizace se však dočkala pouze spodní část stavby. Půdorys tvoří nepravidelný ovál přizpůsobený přirozenému svahu zalesněného pahorku.\u003C/p>\n\u003Cp>Centrální prostor interiéru podpírají čtyři mohutné monolitické sloupy z&nbsp;neopracovaného vulkanického čediče vytěženého v&nbsp;lomech u&nbsp;Castellfollit de la Roca. Sloupy stojí v&nbsp;mírném náklonu, který přesně odpovídá vypočtenému směru působících tlakových sil. Mezi patku, dřík a&nbsp;hlavici každého sloupu vložil architekt olověné desky pro pružné rozložení tlaku bez rizika prasknutí kamene.\u003C/p>\n\u003Cp>Obvodové pilíře a&nbsp;klenuté stropy tvoří přepálené zvonivé cihly v&nbsp;kombinaci s&nbsp;hutnickou struskou z&nbsp;vysokých pecí. Klenby využívají geometrii hyperbolických paraboloidů vyzděných tradiční technikou tenké katalánské klenby.\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"portal-mosaics\" data-section-kind=\"narrative\">\n\u003Csummary>Vstupní portikus, mozaiky a&nbsp;recyklované materiály\u003C/summary>\n\u003Cdiv>\u003Cp>Před vstupem do krypty vybudoval Gaudí prostorné portiko se šikmými sloupy nesoucími hyperbolické klenby, které mělo původně tvořit podnož venkovního schodiště do horního chrámu. Nad vstupními dveřmi upoutá pozornost keramický tympanon zdobený barevnou mozaikou technikou \u003Cem>trencadís\u003C/em> od Josepa Marii Jujola s&nbsp;křesťanskou symbolikou a&nbsp;monogramem Panny Marie.\u003C/p>\n\u003Cp>Okna krypty mají protáhlý organický tvar připomínající borové šišky. Výplně tvoří olověné vitráže navržené Jujolem, jejichž křídla se vyklápějí do stran podobně jako hmyzí krovky.\u003C/p>\n\u003Cp>Ochranné okenní mříže představují geniální ukázku rané průmyslové recyklace v&nbsp;architektuře: kováři je vyrobili ze starých vyřazených jehel a&nbsp;vřeten dopřádacích strojů z&nbsp;místní textilní továrny.\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"interior-furnishings\" data-section-kind=\"narrative\">\n\u003Csummary>Vnitřní vybavení, oltáře a&nbsp;mušlové kropenky\u003C/summary>\n\u003Cdiv>\u003Cp>Vnitřní vybavení chrámu navrhoval Gaudí s&nbsp;maximálním důrazem na liturgickou funkci a&nbsp;ergonomii. V&nbsp;letech 1913–1914 navrhl soubor dvaceti dvoumístných kostelních lavic vyrobených místním truhlářem Tomàsem Bernatem z&nbsp;recyklovaného dubového dřeva přepravních beden a&nbsp;ocelových pásů z&nbsp;balíků bavlny.  Mírně prohnuté sedáky a&nbsp;opěrky nutily věřící sedět vzpřímeně bez únavy.\u003C/p>\n\u003Cp>Liturgické uspořádání zahrnuje trojici oltářů: hlavní oltář i&nbsp;levý boční oltář Svaté rodiny projektoval Josep Maria Jujol, zatímco pravý oltář Panny Marie Montserratské pochází od Isidreho Puiga i&nbsp;Boady. Kropenky na svěcenou vodu u&nbsp;vchodu tvoří obří lastury tropických mlžů zévy obrovské (\u003Cem>Tridacna gigas\u003C/em>), které z&nbsp;Filipín přivezly lodě rodiny Güellů, osazené na podstavcích z&nbsp;tepaného železa.\u003C/p>\n\u003Cp>Drsný povrch přepálených cihel a&nbsp;čediče přirozeně pohlcuje ozvěnu, takže mluvené slovo i&nbsp;zpěv znějí mimořádně zřetelně.\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"abandonment-restoration\" data-section-kind=\"narrative\">\n\u003Csummary>Zastavení stavby, válečné škody a&nbsp;památková obnova\u003C/summary>\n\u003Cdiv>\u003Cp>Stavební práce ustaly v&nbsp;říjnu 1914, kdy Eusebi Güell vážně onemocněl a&nbsp;jeho synové odmítli další financování chrámu. Gaudí, zdrcený úmrtím své neteře Rosy i&nbsp;blízkého přítele Franceska Berenguera, se stáhl z&nbsp;mimobarcelonských staveb a&nbsp;soustředil se výhradně na Sagrada Família. Dokončenou kryptu vysvětil 3.&nbsp;listopadu&nbsp;1915 barcelonský biskup Enrique Reig y&nbsp;Casanova.\u003C/p>\n\u003Cp>Během španělské občanské války v&nbsp;červenci 1936 interiér vyhořel a&nbsp;sloužil jako vojenské skladiště obilí. První záchrannou obnovu vedl roku 1939 Gaudího žák Lluís Bonet i&nbsp;Garí.\u003C/p>\n\u003Cp>V&nbsp;letech 1999–2002 prošla památka rozsáhlou obnovou pod vedením architekta Antoniho Gonzáleze Morena-Navarra, která vyvolala mezinárodní polemiku kvůli vybudování pochozí terasy nad kryptou. Roku 2005 zapsala organizace UNESCO kryptu na Seznam světového kulturního dědictví jako součást souboru Gaudího děl.\u003C/p>\n\u003C/div>\n\u003C/details>\n\u003Cdetails data-section-id=\"visit-context-2026\" data-section-kind=\"narrative\">\n\u003Csummary>Dopolední návštěva a&nbsp;režim provozu v&nbsp;roce 2026\u003C/summary>\n\u003Cdiv>\u003Cp>Návštěva krypty v&nbsp;kolonii Güell dne 27.&nbsp;září&nbsp;2026 proběhla v&nbsp;dopoledních hodinách mezi 10.42 a&nbsp;11.26. Slunečné dopoledne nabídlo vynikající světelné podmínky: paprsky nízkého slunce pronikaly skrze Jujolovy barevné vitráže v&nbsp;šiškovitých oknech a&nbsp;promítaly na drsné čedičové monolity i&nbsp;cihlové klenby teplé barevné tóny.\u003C/p>\n\u003Cp>V&nbsp;roce 2026 byl vstup do krypty organizován s&nbsp;audioprůvodcem v&nbsp;několika jazycích, který podrobně vysvětloval statické fungování nakloněných sloupů i&nbsp;historii dělnické osady. Návštěvníci si mohli zblízka vyzkoušet původní ergonomické dřevěné lavice a&nbsp;prohlédnout kropenky z&nbsp;obřích lastur zévy dovezených z&nbsp;Filipín.\u003C/p>\n\u003C/div>\n\u003C/details>",locationOfficialHtml:"\u003Ctable>\n\u003Cthead>\n\u003Ctr>\n\u003Cth align=\"left\">Parametr\u003C/th>\n\u003Cth align=\"left\">Údaj\u003C/th>\n\u003C/tr>\n\u003C/thead>\n\u003Ctbody>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Oficiální název\u003C/th>\n\u003Ctd align=\"left\">Cripta de la Colònia Güell (zamýšlený farní kostel)\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Hlavní architekt\u003C/th>\n\u003Ctd align=\"left\">Antoni Gaudí i&nbsp;Cornet (1852–1926)\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Klíčoví spolupracovníci\u003C/th>\n\u003Ctd align=\"left\">Francesc Berenguer i&nbsp;Mestres (kolonie), Josep Maria Jujol (mozaiky a&nbsp;oltáře), Joan Rubió (Ca l'Espinal); Lluís Bonet i&nbsp;Garí (obnova 1939)\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Původní stavebník\u003C/th>\n\u003Ctd align=\"left\">Eusebi Güell i&nbsp;Bacigalupi (1846–1918)\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Doba výstavby\u003C/th>\n\u003Ctd align=\"left\">1908–1914 (příprava modelu 1898–1908, vysvěcení 3.&nbsp;listopadu&nbsp;1915) \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Architektonický styl\u003C/th>\n\u003Ctd align=\"left\">katalánský modernismus (\u003Cem>Modernisme\u003C/em>), organická architektura\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Lokalita a&nbsp;adresa\u003C/th>\n\u003Ctd align=\"left\">Carrer del Reixac s/n, 08690 Santa Coloma de Cervelló, Španělsko\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Rozměry a&nbsp;plocha\u003C/th>\n\u003Ctd align=\"left\">půdorys krypty cca 26 × 25&nbsp;m, plocha cca 580&nbsp;m², 4 centrální čedičové sloupy, zamýšlená výška chrámu 40&nbsp;m \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Současné využití a&nbsp;vlastník\u003C/th>\n\u003Ctd align=\"left\">Consorci del Parc de la Colònia Güell; farní kostel a&nbsp;muzeum přístupné veřejnosti\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Památková ochrana\u003C/th>\n\u003Ctd align=\"left\">BCIN (kód 184-MH-EN, IPAC IPA-199; soubor kolonie kód 1876-CH-EN); Seznam světového dědictví UNESCO (ref. 320-007bis) \u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Cth scope=\"row\" align=\"left\">Oficiální web\u003C/th>\n\u003Ctd align=\"left\">\u003Ca href=\"https://lacoloniaguell.cat/\">lacoloniaguell.cat\u003C/a>\u003C/td>\n\u003C/tr>\n\u003C/tbody>\n\u003C/table>\n",aliases:["Cripta de la Colònia Güell","Cripta Gaudí","Crypt of Colònia Güell","Kostel v kolonii Güell"],heroImage:{src:"/travel-guide/teasers/cripta-colonia-guell/hero.jpg",alt:"Cihlový portikus krypty v Colònii Güell se šikmými sloupy"},audio:[{section:"lead",label:"Úvod",identity
